[build-system]
# EXACT pin (86ak5rjh7, owner-accepted interim, 2026-10-24). Without this table pip builds the editable
# install with whatever setuptools is newest on PyPI at install time, in an isolated environment, so the
# one piece of code that runs at install time was the one thing not pinned. 84.1.0 is a PyPI release from
# 2026-10-19 (5 days old on 2026-10-24, so INSIDE the two-week window; taken on purpose because it is the fix
# for the advisory below), supports PEP 660 editable installs and Python 3.14 (checked 2026-10-24: `pip install -v
# -e .` on 3.14.5 builds with setuptools-84.1.0).
# Every installer that reads this file gets it: the CI `api` job, the Dockerfile and `make api-install`.
# It is NOT hash-locked and the transitive dependencies are still unlocked: that is ClickUp 17tnw2az0kw.
# ADVISORY FIXED BY THIS PIN (checked 2026-10-24, GitHub Advisory DB + OSV.dev): GHSA-xmj3-9gf7-h52w (LOW,
# CWE-22) affected setuptools 38.2.2 up to but not including 84.1.0: a path escape through a wheel's
# namespace_packages.txt on WINDOWS, in setuptools' legacy wheel install_as_egg path. It never applied to this
# file's editable PEP 517/660 build (macOS, Linux CI, Linux Docker; no egg install, no setup_requires), and
# 84.1.0 closes it: both databases list 0 advisories for 84.1.0. 84.1.0's release notes also name
# GHSA-grgh-hr87-3jpw (archive_util member paths on Windows); neither database has a record of it.
# Dependabot (pip, this directory) may propose a bump of this pin; take it as an ordinary reviewed PR.
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selahcue-api"
version = "0.1.0"
description = "Django and Strawberry Platform API for SelahCue licensing and account services"
# Django 6.1 requires >=3.12; CI and local both run 3.14, which 6.1 officially supports.
requires-python = ">=3.12"
dependencies = [
  # EXACT PINS, not ranges, for every direct AND directly-imported-but-undeclared
  # pip dep: this repo has no lockfile for implementation/api, so an open range at
  # any floor leaves the installed version invisible to Dependabot's security-update
  # job (`dependency_file_not_supported`). Full mechanism, CVE-derivation method,
  # and the complete review trail (19 iterations, four-reviewer gate) live in
  # ClickUp 17tnw2az07j and docs/delivery/goals/17tnw2az07j-cryptography-dependabot.md
  # — read those before touching this list, not just this comment.
  #
  # version — advisory ceiling that makes it safe (GitHub Advisory DB + OSV.dev,
  # cross-checked against both):
  #   Django==6.1.2                     0 advisories affect this version (checked 2026-10-24)
  #   strawberry-graphql-django==0.92.0 0 advisories exist for this package
  #   strawberry-graphql==0.336.2       highest ceiling <=0.315.6 (fixed 0.315.7)
  #   graphql-core==3.3.0              0 advisories exist for this package
  #   cross-web==0.7.0                  0 advisories exist for this package
  #   cryptography==50.0.2              highest ceiling <50.0.0 (fixed 50.0.0)
  #   celery[redis]==5.6.3              highest ceiling <5.2.2 (fixed 5.2.2)
  #
  # Django needs a third source. Its four 2026-10-06 CVEs (CVE-2026-77050, -84429, -87890, -87975), all fixed in
  # 6.1.2, are in the GitHub Advisory DB with NO version range and in OSV with git-commit ranges only, so a
  # version query wrongly reports 6.1.1 as clean. Check https://docs.djangoproject.com/en/dev/releases/security/
  # as well when bumping Django.
  #
  # strawberry-graphql, graphql-core, and cross-web are undeclared transitive
  # dependencies imported directly by this app's own code; pinned here for the
  # same Dependabot-visibility reason as the four declared deps above.
  "Django==6.1.2",
  # 0.87 declares `django>=5.2` with no upper bound, so it is compatible with 6.1.
  "strawberry-graphql-django==0.92.0",
  "strawberry-graphql==0.336.2",
  "graphql-core==3.3.0",
  "cross-web==0.7.0",
  # Ed25519 for the signed offline entitlement envelope (DEC-004). Django ships no
  # asymmetric primitives. 50.0.1 is PyPI's current latest — a wheel-only OpenSSL
  # rebuild on top of 50.0.0, where the advisory ceiling's fix actually lands.
  "cryptography==50.0.2",
  # Async task runtime: transactional email (worker) + revocation cascade and expiry
  # sweeps (beat). Redis is the broker; see CELERY_BROKER_URL in settings.
  "celery[redis]==5.6.3",
]

[project.optional-dependencies]
dev = [
  # EXACT PINS (17tnw2az07j), same Dependabot-visibility reason as the main
  # dependency list above. Full derivation: docs/delivery/goals/17tnw2az07j-
  # cryptography-dependabot.md.
  #   pytest==9.1.1        highest ceiling <9.0.3 (fixed 9.0.3, GHSA-6w46-j5rx-g56g)
  #   pytest-django==4.14.0 0 advisories exist for this package
  "pytest==9.1.1",
  "pytest-django==4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "selahcue_api.settings"
pythonpath = ["."]
testpaths = ["tests"]
