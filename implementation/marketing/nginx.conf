server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Tightened from "no-referrer-when-downgrade", which sends the FULL URL — query string
    # included — to any same-scheme cross-origin destination. /verify and /reset are
    # reached as `?token=<single-use credential>`, so under the old policy one click on
    # "Contact support" could hand that token to another origin in a Referer header.
    # "strict-origin-when-cross-origin" sends only the origin off-site. It is also the
    # modern browser default, so nothing else on the site changes behaviour.
    # Defence in depth: the views additionally scrub the token out of the URL on arrival
    # (`src/lib/auth/useLandingToken.ts`), so there is nothing left to leak either way.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy the API so the SPA is SAME-ORIGIN with it. See the long note in
    # `vite.config.ts` — briefly: the API emits no CORS headers today, its session cookie
    # is SameSite=Strict and so is never sent cross-site, and Django's CSRF origin check
    # wants a matching Origin. All three are satisfied by not being cross-origin at all.
    #
    # `api` is the compose service name (`implementation/docker-compose.yml`). It is
    # assigned to a variable on purpose: with a literal, nginx resolves the name at config
    # load and REFUSES TO START if the API is absent, which would take the whole marketing
    # site down with it. Via a variable, resolution is deferred to request time, so a
    # missing API degrades to a failing API call instead of a dead site.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /graphql/ {
        set $selahcue_api "http://api:8000";
        proxy_pass $selahcue_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never forward this page's own token-bearing URL to the API as a referrer.
        proxy_set_header Referer "";
    }

    # SPA Routing (Vue Router HTML5 History Mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
