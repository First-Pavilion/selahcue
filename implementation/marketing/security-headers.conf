    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Tightened from "no-referrer-when-downgrade", which sends the FULL URL — query string
    # included — to any same-scheme cross-origin destination. /verify and /reset are
    # reached as `?token=<single-use credential>`, so under the old policy one click on
    # "Contact support" could hand that token to another origin in a Referer header.
    # "strict-origin-when-cross-origin" sends only the origin off-site. It is also the
    # modern browser default, so nothing else on the site changes behaviour.
    # Defence in depth: the views additionally scrub the token out of the URL on arrival
    # (`src/lib/auth/useLandingToken.ts`), so there is nothing left to leak either way.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # External hosts are limited to the existing disclosed Google Fonts delivery.
    # Vue writes controlled element.style properties; inline style attributes and scripts
    # remain forbidden. Keep this include in locations with their own add_header: nginx
    # otherwise drops all inherited security headers (including for immutable assets).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'none'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
