services:
  marketing-site:
    build:
      context: ../marketing
      dockerfile: Dockerfile
    container_name: selahcue-marketing-site
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build: ./api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./api:/usr/src/app
    ports:
      - "8008:8000"
    env_file:
      - ./api/.env
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: selahcue_db
      POSTGRES_USER: pavilion
      POSTGRES_PASSWORD: pavilion
    volumes:
      - selahcue-pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavilion -d selahcue_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - selahcue-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build: ./api
    command: celery -A selahcue_api worker --loglevel=info --concurrency=2
    volumes:
      - ./api:/usr/src/app
    env_file:
      - ./api/.env
    depends_on:
      - api
      - redis
    restart: unless-stopped

  celery-beat:
    build: ./api
    command: celery -A selahcue_api beat --loglevel=info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./api:/usr/src/app
    env_file:
      - ./api/.env
    depends_on:
      - api
      - redis
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: selahcue_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  selahcue-pgdata:
  selahcue-redisdata:
