# Supply-chain policy (story 86ajpew0j): license allowlist + duplicate/source
# hygiene. Advisories are covered by the separate RustSec `cargo audit` CI job.

[graph]
all-features = true

[licenses]
# Our own unpublished (proprietary) crates are exempt from the allowlist.
private = { ignore = true }
# Permissive licenses only in the shipped tree. Copyleft (GPL/AGPL/LGPL) is
# NOT allowed — anything outside this list fails CI loudly.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0", # file-level copyleft only; carried by wgpu's DX shader stack
  "OFL-1.1", # font data
  "Ubuntu-font-1.0",
  # Independent JPEG Group license — permissive (no copyleft). Transitive via
  # grafton-ndi → jpeg-encoder (the NDI output feature). Its one obligation is an
  # acknowledgment ("based in part on the work of the Independent JPEG Group") in the
  # app's third-party licenses / about screen.
  "IJG",
  # Community Data License Agreement – Permissive 2.0 — permissive, no copyleft. Carried
  # by webpki-roots (Mozilla's bundled root-CA data set) via selahcue-cloud → reqwest →
  # hyper-rustls (the SelahCue cloud client's TLS trust roots).
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
