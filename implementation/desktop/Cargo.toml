[workspace]
resolver = "2"
members = ["crates/selahcue-core", "crates/selahcue-data", "crates/selahcue-lan", "crates/selahcue-engine", "crates/selahcue-present", "crates/selahcue-gpu", "crates/selahcue-desktop", "crates/selahcue-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["SelahCue"]

[workspace.lints.clippy]
# Keep the domain core clean and panic-free on untrusted input.
unwrap_used = "warn"
