[workspace]
resolver = "2"
members = ["crates/selahcue-core", "crates/selahcue-data", "crates/selahcue-lan", "crates/selahcue-engine", "crates/selahcue-present", "crates/selahcue-gpu", "crates/selahcue-desktop", "crates/selahcue-app", "crates/selahcue-scripture"]
# The Tauri operator shell is a GUI app (webview) that cannot be runtime-tested in the
# headless build env and pulls a heavy toolchain-dependent dependency tree. It is kept
# out of the default workspace so the core stays fast + green; it is its own package,
# compile-checked separately and run on a desktop with the Tauri toolchain.
#
# selahcue-stt is the on-device STT engine (ADR-0019 follow-up): its whisper.cpp + cpal
# backends are heavy, toolchain-dependent native deps behind Cargo features. Same
# rationale — excluded so the default core stays fast + green; the pure-Rust pipeline is
# tested standalone (`--manifest-path crates/selahcue-stt/Cargo.toml`).
exclude = ["crates/selahcue-operator", "crates/selahcue-stt"]

[workspace.package]
publish = false
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["SelahCue"]

[workspace.lints.clippy]
# Keep the domain core clean and panic-free on untrusted input.
unwrap_used = "warn"
