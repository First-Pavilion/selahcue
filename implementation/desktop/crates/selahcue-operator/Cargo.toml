[package]
name = "selahcue-operator"
publish = false
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["SelahCue"]
description = "SelahCue operator shell: a Tauri desktop UI (webview) that renders the service plan and drives the live output via the tested OperatorShell surface (ADR-0003). A GUI app — run on a desktop with the Tauri toolchain."

# Standalone workspace root: this crate is EXCLUDED from the desktop workspace (it is a
# GUI app that can't be runtime-verified headless and pulls a heavy toolchain-dependent
# tree). Keeping an empty [workspace] here makes it its own root so cargo won't fold it
# back into the parent.
[workspace]

[[bin]]
name = "selahcue-operator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Encrypted-by-default posture (FR-154; 86akgrz3b). See the `read-encrypted-transcripts`
# feature's own comment block below for the full story — this shell must be able to read the
# same SQLCipher-encrypted store `selahcue-desktop` now writes by default, or its already-shipped
# Transcripts viewer (86akcffvt) silently and permanently regresses to "unavailable" for every
# fresh install with a working OS keychain.
default = ["read-encrypted-transcripts"]
# Read-only access, via the SAME OS-keychain/Argon2id key `selahcue-desktop` acquires, to the
# at-rest-encrypted store selahcue-desktop now writes by default (86akgrz3b; FR-154). This shell
# never creates, writes, or migrates that store (`open_transcript_db_at` in main.rs) — it only
# needs to be ABLE TO READ one that is already encrypted, for the Transcripts viewer (86akcffvt).
#
# NAMED DIFFERENTLY FROM `selahcue-desktop`'s `encryption` feature ON PURPOSE, even though both
# ultimately just turn on `selahcue-data/encryption`: `scripts/check_launch_reachability.py`
# hard-fails if two registered crates declare the SAME feature name (its COLLISION GUARD — the
# dry-run `--features` union it scans cannot always attribute a token to a specific crate's build
# line, so two same-named features would let one crate's flag silently satisfy the other's
# requirement). Verified live while wiring this up: naming this feature `encryption` too made the
# real check fail with exactly that collision message; renaming it is the fix, not a workaround.
#
# Key acquisition is duplicated here (`src/keys.rs`, a byte-for-byte twin of
# `selahcue-desktop/src/keys.rs`) rather than shared through `selahcue-data`: ADR-0007 keeps key
# derivation out of the data layer on purpose ("the crate has no opinion on the KDF and never
# sees a passphrase" — see `selahcue-data/src/key.rs`'s own module doc), and this crate is a
# separate Cargo workspace root from `selahcue-desktop` (excluded from the `implementation/
# desktop` workspace on purpose — see this file's own header comment), so it cannot path-depend
# on `selahcue-desktop` without pulling in winit/wgpu/the native output window. Both copies read
# the identical OS-keychain service/user pair ("SelahCue"/"database-key") and the identical
# per-install `key.salt` file location (`transcript_data_dir()` mirrors `selahcue-desktop`'s own
# `data_dir()` byte-for-byte — see that function's doc comment), so whichever process runs first
# transparently "wins" first-run key generation and the other reads it back.
#
# LAUNCH_REACHABILITY: REQUIRED — 86akgrz3b (owner decision): must be reachable from a default
# `make launch`/`make operator` invocation, unconditionally, the same as the twin feature on
# `selahcue-desktop`. See scripts/check_launch_reachability.py for what each tag means.
# RELEASE: SAFE — the key comes from the OS secret store or an Argon2id-derived passphrase,
# never a developer `.env`/shell-exported credential; no release-boundary concern. Confirmed NOT
# a member of the Makefile's `RELEASE_UNSAFE_FEATURES` registry (86akgrz3b).
read-encrypted-transcripts = ["selahcue-data/encryption", "dep:keyring", "dep:argon2", "dep:getrandom", "dep:zeroize"]
# On-device speech-to-text as the live-transcript source. OFF by default so the operator's
# compile-check (CI) needs no native whisper toolchain or model; enable on a whisper-capable
# machine (`cargo run --features stt`) to drive real transcription from "Start listening".
#
# LAUNCH_REACHABILITY: AUTO — auto-enabled by `make launch`/`make operator`'s `STT ?= auto`
# whenever cmake is on PATH (see Makefile), quietly skipped otherwise. Not REQUIRED: nobody has
# made the owner call that this must be reachable on a machine that cannot build it — unlike
# `cloud-stt` below, `stt`'s absence-when-toolchain-missing is by design, not a bug. See
# scripts/check_launch_reachability.py for what each tag means and how it's enforced.
# RELEASE: SAFE — on-device Whisper reads no developer credential; ships in real release
# artefacts today (.github/workflows/windows-installer.yml hardcodes `--features stt`).
stt = ["dep:selahcue-stt"]
# Live SelahCue cloud path for Providers & Privacy: the real HTTP transport + OS-secret-store
# account token. OFF by default so the compile-check needs no reqwest/keyring native tree and
# the shell honestly reports the cloud provider as "not configured" (the live service does not
# exist yet). Enable to reach a real SelahCue endpoint (`SELAHCUE_CLOUD_URL` + stored token).
#
# LAUNCH_REACHABILITY: OPT-IN — no dev launch target auto-enables this; the live endpoint it
# talks to does not exist yet, so there is nothing for a default `make launch` to usefully
# reach. Enable explicitly (`OP_FEATURES=cloud-live`) once 86ajy04hz's cloud lands.
# RELEASE: SAFE — reads no developer-only credential (OS keychain token via `keyring`, not a
# repo-root `.env`); the real production path this repo's release-boundary rules protect against
# a dev-only alternative to, not an instance of one.
cloud-live = ["selahcue-cloud/http", "selahcue-cloud/keyring"]
# Developer AI provider keys read from the repo-root `.env` at startup (src/dev_env.rs). OFF by
# default, and it must stay that way: with the feature off, the file read is not compiled into the
# binary at all, so a release build cannot pick a credential up from a stray `.env` on the machine
# it happens to run on. This is temporary scaffolding for the developer-key phase — the shipping
# path is a server-minted Deepgram grant token and a proxied sermon-notes service — so nothing
# should come to depend on it. Enable for local AI work: `cargo run --features dev-keys`.
#
# LAUNCH_REACHABILITY: REQUIRED — 86akcmzrd (owner decision): must be reachable from a default
# `make launch`/`make operator` invocation. Enforced by scripts/check_launch_reachability.py.
# RELEASE: UNSAFE — must never reach a RELEASE=1/--release build; see the "AI-assisted sermon
# notes" comment in the Makefile and dev_env.rs. Enforced there by RELEASE_UNSAFE_FEATURES /
# release-ai-guard AND structurally in dev_env.rs's own `cfg!(debug_assertions)` check.
dev-keys = []
# Direct OpenAI GPT sermon-note generation with a DEVELOPER key (86akby7d8, Phase 1).
# OFF by default, so a stock build contains no direct-to-provider path at all and the
# Providers & Privacy panel honestly reports notes as unavailable. This is deliberately
# throwaway: the shipping path proxies notes through the SelahCue platform API, and this
# feature is deleted when that lands. Enable with a key in the repo-root `.env`
# (86akby6yy) or exported in the shell.
#
# LAUNCH_REACHABILITY: REQUIRED — 86akcmzrd (owner decision): must be reachable from a default
# `make launch`/`make operator` invocation. Enforced by scripts/check_launch_reachability.py.
# RELEASE: UNSAFE — must never reach a RELEASE=1/--release build; see `direct_key_permitted`
# (selahcue-cloud/src/openai.rs). Enforced by RELEASE_UNSAFE_FEATURES/release-ai-guard AND
# structurally by `direct_key_permitted` gating `OpenAiNoteProvider::from_env` itself.
openai-notes = ["selahcue-cloud/openai", "selahcue-cloud/http"]
# Cloud (Deepgram) live transcription (86akby7th), streaming real microphone audio through the
# already-tested `selahcue-stt-cloud` crate. Implies `stt`: mic capture (`CpalSource`) and
# resampling live in `selahcue-stt` regardless of which recognizer consumes the audio, so this
# feature only chooses which recognizer that is. OFF by default, so a stock build pulls in no
# async runtime or WebSocket stack (`selahcue-stt-cloud` itself is always a dependency — its
# default features are empty, so it costs nothing until `deepgram` is turned on here) and the
# Providers & Privacy panel honestly reports cloud transcription as not built. This is
# deliberately throwaway, like `openai-notes`: the shipping path is a server-minted Deepgram
# grant token (86akby3xu), and this developer-key path is deleted when that lands. Enable with
# `DEEPGRAM_API_KEY` in the repo-root `.env` (86akby6yy): `cargo run --features cloud-stt`.
#
# LAUNCH_REACHABILITY: REQUIRED — 86akd10dq (owner decision, same shape as 86akcmzrd): shipped,
# merged (86akby7th) and, exactly like dev-keys/openai-notes before it, invisible from the one
# command a developer actually runs — selecting Cloud in Settings reported `NotInBuild` forever
# because `make launch`/`make operator` never requested this feature. Reachability here does NOT
# mean cloud transcription always runs: it only removes the "not compiled in" failure mode: a
# build with this feature on but no `DEEPGRAM_API_KEY` still honestly reports `KeyMissing`, not
# `Ready`. Enforced by scripts/check_launch_reachability.py.
# RELEASE: UNSAFE — 86akd10dq remediation (Sana S-1 / Cody Finding A / Quinn High): must never
# reach a RELEASE=1/--release build today. Enforced by RELEASE_UNSAFE_FEATURES/release-ai-guard
# in the Makefile AND structurally by `developer_key_permitted` gating
# `developer_credential_from_env` itself (selahcue-stt-cloud/src/credential.rs) — the binary
# guard alone would make a release build with this feature functionally inert (always
# `KeyMissing`, never `Ready`); it is ALSO Make-stripped because Phase 2 (86akby3xu, the
# server-minted grant token this feature's credential path is replaced by) is unstarted
# (`planning/todo`) with the desktop-side integration not even ticketed yet, so a release build
# carrying this feature today ships real dependency surface for zero functional benefit. Revisit
# when 86akby3xu's desktop-side ticket exists and is scoped — see the Makefile's
# RELEASE_UNSAFE_FEATURES comment for the full argument.
cloud-stt = ["stt", "selahcue-stt-cloud/deepgram"]

[dependencies]
tauri = { version = "2", features = [] }
# Native OS file picker for the Add-Image flow (86ajq6j4p/86ajq6j49) — the official
# Tauri v2 dialog plugin (permissive-licensed, same org as tauri). Used ONLY host-side
# via a `pick_image` command; the chosen path becomes an Element::Image source.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
# Cross-platform free/total disk space for the Pre-service Check storage readiness (same crate +
# version the desktop host uses in guard.rs). Read-only volume query; no new native toolchain.
fs4 = "0.13"
# `server` feature gives the RemoteOperator (pinned-TLS control client) so the shell can
# drive the running output window; the shell falls back to an in-process demo otherwise.
selahcue-app = { path = "../selahcue-app", features = ["server"] }
selahcue-lan = { path = "../selahcue-lan", features = ["server"] }
selahcue-core = { path = "../selahcue-core" }
selahcue-scripture = { path = "../selahcue-scripture", features = ["download"] }
selahcue-present = { path = "../selahcue-present" }
# Persisted deck library (schema v16 `deck` table via `deck_repo`). The operator-local deck DB
# (`open_deck_db`, its own separate path — see that function's doc comment) stays unencrypted;
# only the shared transcript store this shell reads (never writes) gets the `encryption` feature.
selahcue-data = { path = "../selahcue-data" }
# `encryption` feature deps (FR-154; 86akgrz3b) — same crates/versions as
# `selahcue-desktop/Cargo.toml`'s twin declarations, for the duplicated `src/keys.rs` module.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
argon2 = { version = "0.5", optional = true }
getrandom = { version = "0.2", optional = true }
zeroize = { version = "1", optional = true }
# Providers & Privacy: the SelahCue-hosted cloud client (note-generation seam), consent-gated
# egress, graceful local fallback, and the account-token secret store (node 338:124). Default
# build compiles the offline half only (in-memory secret store, no HTTP); the `cloud-live`
# feature adds the real transport + OS keychain token.
selahcue-cloud = { path = "../selahcue-cloud" }
# Cloud (Deepgram) transcription readiness + the `TranscriptProvider` seam (86akby4yz).
# NOT optional: with the `deepgram` feature off (the default) this crate pulls in only
# `selahcue-core` + `serde_json` — no async runtime, no WebSocket stack — so keeping it
# unconditional lets `providers_view` report cloud-transcription readiness honestly (built vs.
# not, key present vs. not) in every operator build, not just one compiled with `cloud-stt`.
# The real streaming session (`selahcue_stt_cloud::transport`) stays behind `deepgram`,
# unified on via the operator's own `cloud-stt` feature above.
selahcue-stt-cloud = { path = "../selahcue-stt-cloud" }
# On-device STT engine (optional; behind the `stt` feature). Pulls the native whisper.cpp +
# cpal backends ONLY when `stt` is enabled — the default build never touches them.
selahcue-stt = { path = "../selahcue-stt", features = ["whisper", "capture", "download"], optional = true }

# macOS gets whisper.cpp Metal GPU acceleration (unioned onto the base `selahcue-stt` features
# above): the real-time-capable large model runs on the GPU instead of the CPU. Other targets
# stay CPU-only and `select_model` steps down to a small model for live latency. Only compiled
# when the `stt` feature enables the optional dep.
[target.'cfg(target_os = "macos")'.dependencies]
selahcue-stt = { path = "../selahcue-stt", features = ["metal"], optional = true }

# Test-only. `tauri`'s `test` feature adds `tauri::test::mock_app`/`MockRuntime` — a REAL
# `App`/`AppHandle` with no window, no webview, and no OS integration — used by
# `listening.rs`'s `run_cloud` composition test (86akby7th PR #22 remediation round 2) so that
# test can drive the actual production closures (not a re-implementation of them) with managed
# `AppState`, rather than being blocked on "no AppHandle without a real Tauri app". Cargo
# unifies dev-dependency features into the SAME `tauri` crate only for test/bench/example
# builds, so this adds nothing to a normal `cargo build`/release binary. `tokio-tungstenite` +
# `futures-util` mirror the exact versions and feature set `selahcue-stt-cloud`'s own
# `tests/test_transport.rs` already uses to run a local stub Deepgram-shaped WebSocket server —
# same proven pattern, reused rather than reinvented, to let the composition test drive a REAL
# `CloudSttSession` against a loopback stub and observe the socket close.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
] }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
# `open_transcript_db_at`'s tests (86akcffvt review, Sana F1 / Cody Blocker) need a real
# directory they own and can inspect afterward — the same crate + convention `selahcue-data`'s
# own tests already use for this.
tempfile = "3"

[lints.clippy]
unwrap_used = "warn"
