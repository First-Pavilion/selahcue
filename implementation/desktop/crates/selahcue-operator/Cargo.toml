[package]
name = "selahcue-operator"
publish = false
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["SelahCue"]
description = "SelahCue operator shell: a Tauri desktop UI (webview) that renders the service plan and drives the live output via the tested OperatorShell surface (ADR-0003). A GUI app — run on a desktop with the Tauri toolchain."

# Standalone workspace root: this crate is EXCLUDED from the desktop workspace (it is a
# GUI app that can't be runtime-verified headless and pulls a heavy toolchain-dependent
# tree). Keeping an empty [workspace] here makes it its own root so cargo won't fold it
# back into the parent.
[workspace]

[[bin]]
name = "selahcue-operator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# On-device speech-to-text as the live-transcript source. OFF by default so the operator's
# compile-check (CI) needs no native whisper toolchain or model; enable on a whisper-capable
# machine (`cargo run --features stt`) to drive real transcription from "Start listening".
stt = ["dep:selahcue-stt"]
# Live SelahCue cloud path for Providers & Privacy: the real HTTP transport + OS-secret-store
# account token. OFF by default so the compile-check needs no reqwest/keyring native tree and
# the shell honestly reports the cloud provider as "not configured" (the live service does not
# exist yet). Enable to reach a real SelahCue endpoint (`SELAHCUE_CLOUD_URL` + stored token).
cloud-live = ["selahcue-cloud/http", "selahcue-cloud/keyring"]
# Developer AI provider keys read from the repo-root `.env` at startup (src/dev_env.rs). OFF by
# default, and it must stay that way: with the feature off, the file read is not compiled into the
# binary at all, so a release build cannot pick a credential up from a stray `.env` on the machine
# it happens to run on. This is temporary scaffolding for the developer-key phase — the shipping
# path is a server-minted Deepgram grant token and a proxied sermon-notes service — so nothing
# should come to depend on it. Enable for local AI work: `cargo run --features dev-keys`.
dev-keys = []
# Direct OpenAI GPT sermon-note generation with a DEVELOPER key (86akby7d8, Phase 1).
# OFF by default, so a stock build contains no direct-to-provider path at all and the
# Providers & Privacy panel honestly reports notes as unavailable. This is deliberately
# throwaway: the shipping path proxies notes through the SelahCue platform API, and this
# feature is deleted when that lands. Enable with a key in the repo-root `.env`
# (86akby6yy) or exported in the shell.
openai-notes = ["selahcue-cloud/openai", "selahcue-cloud/http"]
# Cloud (Deepgram) live transcription (86akby7th), streaming real microphone audio through the
# already-tested `selahcue-stt-cloud` crate. Implies `stt`: mic capture (`CpalSource`) and
# resampling live in `selahcue-stt` regardless of which recognizer consumes the audio, so this
# feature only chooses which recognizer that is. OFF by default, so a stock build pulls in no
# async runtime or WebSocket stack (`selahcue-stt-cloud` itself is always a dependency — its
# default features are empty, so it costs nothing until `deepgram` is turned on here) and the
# Providers & Privacy panel honestly reports cloud transcription as not built. This is
# deliberately throwaway, like `openai-notes`: the shipping path is a server-minted Deepgram
# grant token (86akby3xu), and this developer-key path is deleted when that lands. Enable with
# `DEEPGRAM_API_KEY` in the repo-root `.env` (86akby6yy): `cargo run --features cloud-stt`.
cloud-stt = ["stt", "selahcue-stt-cloud/deepgram"]

[dependencies]
tauri = { version = "2", features = [] }
# Native OS file picker for the Add-Image flow (86ajq6j4p/86ajq6j49) — the official
# Tauri v2 dialog plugin (permissive-licensed, same org as tauri). Used ONLY host-side
# via a `pick_image` command; the chosen path becomes an Element::Image source.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
# Cross-platform free/total disk space for the Pre-service Check storage readiness (same crate +
# version the desktop host uses in guard.rs). Read-only volume query; no new native toolchain.
fs4 = "0.13"
# `server` feature gives the RemoteOperator (pinned-TLS control client) so the shell can
# drive the running output window; the shell falls back to an in-process demo otherwise.
selahcue-app = { path = "../selahcue-app", features = ["server"] }
selahcue-lan = { path = "../selahcue-lan", features = ["server"] }
selahcue-core = { path = "../selahcue-core" }
selahcue-scripture = { path = "../selahcue-scripture", features = ["download"] }
selahcue-present = { path = "../selahcue-present" }
# Persisted deck library (schema v16 `deck` table via `deck_repo`). Default build is unencrypted
# (`Database::open`); at-rest encryption for the shared DB is a documented follow-up.
selahcue-data = { path = "../selahcue-data" }
# Providers & Privacy: the SelahCue-hosted cloud client (note-generation seam), consent-gated
# egress, graceful local fallback, and the account-token secret store (node 338:124). Default
# build compiles the offline half only (in-memory secret store, no HTTP); the `cloud-live`
# feature adds the real transport + OS keychain token.
selahcue-cloud = { path = "../selahcue-cloud" }
# Cloud (Deepgram) transcription readiness + the `TranscriptProvider` seam (86akby4yz).
# NOT optional: with the `deepgram` feature off (the default) this crate pulls in only
# `selahcue-core` + `serde_json` — no async runtime, no WebSocket stack — so keeping it
# unconditional lets `providers_view` report cloud-transcription readiness honestly (built vs.
# not, key present vs. not) in every operator build, not just one compiled with `cloud-stt`.
# The real streaming session (`selahcue_stt_cloud::transport`) stays behind `deepgram`,
# unified on via the operator's own `cloud-stt` feature above.
selahcue-stt-cloud = { path = "../selahcue-stt-cloud" }
# On-device STT engine (optional; behind the `stt` feature). Pulls the native whisper.cpp +
# cpal backends ONLY when `stt` is enabled — the default build never touches them.
selahcue-stt = { path = "../selahcue-stt", features = ["whisper", "capture", "download"], optional = true }

# macOS gets whisper.cpp Metal GPU acceleration (unioned onto the base `selahcue-stt` features
# above): the real-time-capable large model runs on the GPU instead of the CPU. Other targets
# stay CPU-only and `select_model` steps down to a small model for live latency. Only compiled
# when the `stt` feature enables the optional dep.
[target.'cfg(target_os = "macos")'.dependencies]
selahcue-stt = { path = "../selahcue-stt", features = ["metal"], optional = true }

[lints.clippy]
unwrap_used = "warn"
