<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SelahCue Operator</title>
    <style>
      /* Canonical design tokens (UX-CANONICAL §4) + Figma design-system surfaces.
         Pinned by selahcue-present/tests/test_tokens.rs — change both together.
         Fills carry white text; inks are text/glyphs on the dark surfaces. */
      :root {
        --bg: #0e1116; --panel: #171b22; --line: #2b323d;
        --text: #eef1f6; --muted: #9aa4b2; --accent: #5b6bd6;
        --preview: #0f7b6c; --live: #a3283a; --warn: #9a5b00;
        --preview-ink: #2bb673; --live-ink: #ef4444; --warn-ink: #f2b53c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system,
        BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex;
        flex-direction: column;
      }
      /* --- Top bar (Figma console: name + LIVE chip + clock) --- */
      header {
        padding: 10px 16px; border-bottom: 1px solid var(--line);
        display: flex; align-items: center; gap: 12px;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .sub { color: var(--muted); font-size: 12px; }
      #live-chip {
        margin-left: auto; background: var(--live); color: #fff; font-size: 11px;
        font-weight: 800; letter-spacing: .06em; border-radius: 4px; padding: 3px 8px;
        visibility: hidden;
      }
      #live-chip.on { visibility: visible; }
      #clock { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
      /* --- Console body: plan | preview/live | timer --- */
      main {
        flex: 1; display: grid;
        grid-template-columns: minmax(220px, 300px) minmax(0, 1fr) minmax(180px, 250px);
        gap: 12px; min-height: 0; padding: 12px; min-width: 0;
      }
      main > * { min-width: 0; }
      body { min-width: 720px; overflow-x: auto; }
      #plan-wrap {
        display: flex; flex-direction: column; min-height: 0;
        border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
      }
      #plan-wrap h2 {
        margin: 0; padding: 10px 12px 6px; font-size: 11px; letter-spacing: .06em;
        color: var(--muted); text-transform: uppercase;
      }
      #plan { flex: 1; overflow-y: auto; padding: 6px 8px; }
      .item {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px;
        border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px;
        cursor: pointer; background: var(--bg);
      }
      .item:hover { border-color: #35404f; background: #1d2430; }
      .item .kind {
        font-size: 9px; text-transform: uppercase; letter-spacing: .04em;
        color: var(--muted); border: 1px solid var(--line); border-radius: 4px;
        padding: 2px 5px; min-width: 64px; text-align: center;
      }
      .item .title { flex: 1; font-weight: 500; font-size: 13px; }
      /* Non-colour redundancy (WCAG 1.4.1): live/preview are label + border,
         never colour alone. */
      .badge { font-size: 9px; font-weight: 700; padding: 3px 6px; border-radius: 4px; letter-spacing: .04em; color: #fff; }
      .badge.live { background: var(--live); }
      .badge.preview { background: var(--preview); }
      .item.is-live { border-color: var(--live-ink); }
      .item.is-staged { border-color: var(--preview-ink); }
      .add-row { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
      .add-row select, .add-row input {
        font: inherit; font-size: 12px; color: var(--text); background: var(--bg);
        border: 1px solid var(--line); border-radius: 8px; padding: 7px;
      }
      .add-row input { flex: 1; min-width: 0; }
      /* --- Center: PREVIEW · STAGED and LIVE · ON AIR panels (Figma) --- */
      #stagearea { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
      .outpanel {
        flex: 1; display: flex; flex-direction: column; min-height: 0;
        border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
      }
      .outpanel .head {
        color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .06em;
        padding: 6px 12px;
      }
      #preview-panel { border-color: var(--preview-ink); }
      #preview-panel .head { background: var(--preview); }
      #live-panel { border-color: var(--live-ink); }
      #live-panel .head { background: var(--live); }
      .outpanel .surface {
        flex: 1; background: #000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 8px; padding: 16px;
        text-align: center;
      }
      .outpanel .surface .big { font-size: 24px; font-weight: 700; }
      .outpanel .surface .cap { color: var(--muted); font-size: 11px; }
      .outpanel .surface.idle .big { color: var(--muted); font-weight: 500; font-size: 15px; }
      #live-black {
        display: none; color: #fff; font-size: 12px; font-weight: 800;
        letter-spacing: .08em; border: 1px solid var(--live-ink);
        border-radius: 4px; padding: 3px 8px;
      }
      #live-panel.blackout #live-black { display: inline-block; }
      #live-panel.blackout .surface .big, #live-panel.blackout .surface .cap { opacity: 0.25; }
      .golive-row { display: flex; gap: 8px; align-items: stretch; }
      .golive-row button { flex: 1; padding: 10px; }
      button {
        font: inherit; font-weight: 600; color: var(--text); background: var(--panel);
        border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button .key {
        font-size: 10px; font-weight: 600; color: var(--muted);
        border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-left: 6px;
      }
      button.golive { background: var(--preview); border-color: var(--preview-ink); color: #fff; flex: 2; }
      /* Key hints on token-filled buttons: white for AA (muted grey is 2-3:1 there). */
      button.golive .key, #blackout.on .key, #clear-all.armed .key {
        color: #fff; border-color: rgba(255, 255, 255, 0.55);
      }
      /* --- Right: SERVICE TIMER panel (Figma) --- */
      aside {
        display: flex; flex-direction: column; gap: 10px; min-height: 0;
        border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
        padding: 12px;
      }
      aside h2 {
        margin: 0; font-size: 11px; letter-spacing: .06em; color: var(--muted);
        text-transform: uppercase;
      }
      #timer-big {
        font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums;
        text-align: center; color: var(--muted); padding: 8px 0;
      }
      #timer-big.up {
        background: var(--live); color: #fff; border-radius: 8px; font-size: 30px;
      }
      .timer-row { display: flex; gap: 8px; }
      .timer-row button { flex: 1; padding: 9px; font-size: 13px; }
      .timer-note { color: var(--muted); font-size: 11px; text-align: center; }
      /* Always-on emergency chrome (UX-CANONICAL §3): never occluded, never
         removed, operable in every state — including while a row is being edited. */
      #emergency {
        display: flex; align-items: center; gap: 10px; padding: 10px 16px;
        border-top: 1px solid var(--line); background: var(--panel);
      }
      #emergency .note { color: var(--muted); font-size: 11px; }
      #emergency .hints { margin-left: auto; color: var(--muted); font-size: 11px; }
      #blackout { border-color: var(--line); }
      #blackout.on { background: var(--live); border-color: var(--live-ink); color: #fff; }
      #blackout-state { margin-left: 6px; font-size: 10px; font-weight: 800; }
      #clear-all { border-color: var(--live-ink); color: var(--live-ink); }
      #clear-all.armed { background: var(--live); color: #fff; }
      /* Reduced motion: honour the OS setting — no transitions or animations. */
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="plan-name">SelahCue Operator</h1>
      <span class="sub" id="plan-sub"></span>
      <span id="live-chip">● LIVE</span>
      <span id="clock"></span>
    </header>
    <main>
      <section id="plan-wrap" aria-label="Service plan">
        <h2>Service plan</h2>
        <div id="plan"></div>
        <div class="add-row">
          <select id="add-kind">
            <option value="song">Song</option>
            <option value="scripture">Scripture</option>
            <option value="announcement">Announcement</option>
            <option value="section">Section</option>
          </select>
          <input id="add-title" placeholder="New item title" />
          <button id="add-item">+ Add</button>
        </div>
      </section>
      <section id="stagearea" aria-label="Preview and live output">
        <div class="outpanel" id="preview-panel">
          <div class="head">PREVIEW · STAGED</div>
          <div class="surface idle">
            <span class="big" id="preview-title">Nothing staged</span>
            <span class="cap" id="preview-cap"></span>
          </div>
        </div>
        <div class="golive-row">
          <button id="prev" aria-label="Previous — stage the previous plan item">◀<span class="key">←</span></button>
          <button id="golive" class="golive">GO LIVE<span class="key">⏎ Enter</span></button>
          <button id="next" aria-label="Next — stage the next plan item">▶<span class="key">Space</span></button>
        </div>
        <div class="outpanel" id="live-panel">
          <div class="head">● LIVE · ON AIR</div>
          <div class="surface idle" aria-live="polite">
            <span id="live-black">BLACKOUT — OUTPUT DARK</span>
            <span class="big" id="live-title">Output idle</span>
            <span class="cap" id="live-cap"></span>
          </div>
        </div>
      </section>
      <aside aria-label="Service timer">
        <h2>Service timer</h2>
        <div id="timer-big">–:––</div>
        <div class="timer-row">
          <button id="timer-5">⏱ 5:00</button>
          <button id="timer-10">⏱ 10:00</button>
        </div>
        <div class="timer-row">
          <button id="timer-stop">Stop</button>
        </div>
        <span class="timer-note">Shown on the stage output only</span>
      </aside>
    </main>
    <footer id="emergency" role="toolbar" aria-label="Emergency controls">
      <button id="blackout" aria-pressed="false" aria-label="Blackout the audience output">■ BLACKOUT<span id="blackout-state"></span><span class="key">B</span></button>
      <button id="clear-all" aria-label="Clear all live layers">✕ CLEAR ALL<span class="key">Esc Esc</span></button>
      <span class="note">Always reachable · pierces any dialog</span>
      <span class="hints">Space Next · ⏎ Go Live · ← Prev</span>
    </footer>
    <script>
      const invoke = window.__TAURI__.core.invoke;
      let editing = null;       // item id with an open inline editor
      let confirmDelete = null; // item id in the two-click delete confirm state
      let lastRendered = "";    // skip DOM rebuilds when nothing changed

      function render(view) {
        // Chrome (emergency footer, LIVE chip, timer, blackout) syncs on EVERY
        // view — the blackout toggle must read true state even while an editor
        // is open.
        syncChrome(view);
        // Never clobber an open editor or a pending delete-confirm, and skip
        // identical re-renders (the 1s poll must not eat in-flight clicks).
        const key = JSON.stringify(view);
        if (editing !== null || confirmDelete !== null) return;
        if (key === lastRendered) return;
        lastRendered = key;
        document.getElementById("plan-name").textContent = view.plan_name;
        document.getElementById("plan-sub").textContent = view.items.length + " items";

        const plan = document.getElementById("plan");
        plan.innerHTML = "";
        view.items.forEach((it, i) => {
          const row = document.createElement("div");
          row.className =
            "item" + (it.is_live ? " is-live" : "") + (it.is_staged ? " is-staged" : "");
          row.onclick = () => act(() => invoke("select", { itemId: it.id }));

          const kind = document.createElement("span");
          kind.className = "kind";
          kind.textContent = it.kind;

          const title = document.createElement("span");
          title.className = "title";
          title.textContent = it.title;

          // In-page editing only: WKWebView implements neither prompt() nor
          // confirm(), so native dialogs are silently dead in the shell.
          const ren = miniBtn("✏", (e) => {
            e.stopPropagation();
            editing = it.id;
            const input = document.createElement("input");
            input.value = it.title;
            input.style.cssText = "flex:1;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--accent);border-radius:4px;padding:4px 6px";
            input.onclick = (ev) => ev.stopPropagation();
            input.onkeydown = (ev) => {
              if (ev.key === "Enter") {
                const t = input.value.trim();
                editing = null;
                if (t && t !== it.title) act(() => invoke("rename_item", { itemId: it.id, title: t }));
                else act(() => invoke("view"));
              } else if (ev.key === "Escape") {
                editing = null;
                act(() => invoke("view"));
              }
            };
            input.onblur = () => { if (editing === it.id) { editing = null; act(() => invoke("view")); } };
            title.replaceWith(input);
            input.focus();
            input.select();
          });
          const up = miniBtn("↑", (e) => {
            e.stopPropagation();
            if (i > 0) act(() => invoke("move_item", { itemId: it.id, to: i - 1 }));
          });
          const down = miniBtn("↓", (e) => {
            e.stopPropagation();
            act(() => invoke("move_item", { itemId: it.id, to: i + 1 }));
          });
          const del = miniBtn("✕", (e) => {
            e.stopPropagation();
            if (confirmDelete === it.id) {
              confirmDelete = null;
              act(() => invoke("remove_item", { itemId: it.id }));
            } else {
              confirmDelete = it.id;
              del.textContent = "sure?";
              del.style.color = "var(--live-ink)";
              setTimeout(() => { if (confirmDelete === it.id) { confirmDelete = null; act(() => invoke("view")); } }, 3000);
            }
          });

          row.appendChild(kind);
          row.appendChild(title);
          row.appendChild(ren);
          row.appendChild(up);
          row.appendChild(down);
          row.appendChild(del);
          if (it.is_live) row.appendChild(badge("live", "LIVE"));
          else if (it.is_staged) row.appendChild(badge("preview", "PREVIEW"));
          plan.appendChild(row);
        });

      }

      function setPanel(which, item, capText, idleText) {
        const surface = document.querySelector("#" + which + "-panel .surface");
        const title = document.getElementById(which + "-title");
        const cap = document.getElementById(which + "-cap");
        if (item) {
          surface.classList.remove("idle");
          title.textContent = item.title;
          cap.textContent = item.kind + " · " + capText;
        } else {
          surface.classList.add("idle");
          title.textContent = idleText;
          cap.textContent = "";
        }
      }

      function syncChrome(view) {
        // Top-bar LIVE chip: on air only when something is actually live.
        document.getElementById("live-chip").classList.toggle("on", view.live_index != null);

        // Preview / Live panels (Figma console): the on-air truth must never go
        // stale — an emergency clear/Go-Live can land while an inline editor or
        // delete-confirm is open, so the panels sync on EVERY view (they touch
        // only static DOM, never the guarded plan rows).
        const itemAt = (i) => (i == null ? null : view.items[i] || null);
        setPanel("preview", itemAt(view.staged_index), "staged", "Nothing staged");
        setPanel("live", itemAt(view.live_index), "main output", "Output idle");

        const t = view.timer;
        const big = document.getElementById("timer-big");
        if (!t) {
          big.textContent = "–:––";
          big.classList.remove("up");
          big.style.color = "";
        } else if (t.time_up) {
          big.textContent = "TIME UP";
          big.classList.add("up");
          big.style.color = "";
        } else {
          const secs = t.remaining_secs != null ? t.remaining_secs : t.elapsed_secs;
          big.textContent = fmtClock(secs);
          big.classList.remove("up");
          big.style.color = t.warn ? "var(--warn-ink)" : "var(--preview-ink)";
        }

        // Non-colour blackout state: label + aria-pressed + the live-panel
        // overlay, not just the red fill.
        const b = document.getElementById("blackout");
        b.classList.toggle("on", view.blackout);
        b.dataset.on = view.blackout ? "1" : "0";
        b.setAttribute("aria-pressed", view.blackout ? "true" : "false");
        document.getElementById("blackout-state").textContent = view.blackout ? "ON" : "";
        document.getElementById("live-panel").classList.toggle("blackout", view.blackout);
      }

      function miniBtn(label, onclick) {
        const b = document.createElement("button");
        b.textContent = label;
        b.style.cssText = "padding:2px 8px;margin-left:4px;font-size:11px";
        b.onclick = onclick;
        return b;
      }

      function badge(cls, text) {
        const el = document.createElement("span");
        el.className = "badge " + cls;
        el.textContent = text;
        return el;
      }

      function fmtClock(secs) {
        return Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0");
      }

      async function act(fn) {
        try {
          // Any explicit action invalidates the render cache (e.g. a cancelled
          // inline edit must restore the normal row even if the view is unchanged).
          lastRendered = "";
          render(await fn());
        } catch (e) {
          console.error(e);
        }
      }

      const toggleBlackout = () => {
        const on = document.getElementById("blackout").dataset.on !== "1";
        act(() => invoke("blackout", { on }));
      };
      const clearAll = () => act(() => invoke("clear"));

      document.getElementById("prev").onclick = () => act(() => invoke("previous"));
      document.getElementById("next").onclick = () => act(() => invoke("next"));
      document.getElementById("golive").onclick = () => act(() => invoke("go_live"));
      document.getElementById("blackout").onclick = toggleBlackout;
      document.getElementById("clear-all").onclick = clearAll;
      document.getElementById("timer-5").onclick = () =>
        act(() => invoke("start_timer", { seconds: 300 }));
      document.getElementById("timer-10").onclick = () =>
        act(() => invoke("start_timer", { seconds: 600 }));
      document.getElementById("timer-stop").onclick = () => act(() => invoke("stop_timer"));
      document.getElementById("add-item").onclick = () => {
        const title = document.getElementById("add-title").value.trim();
        const kind = document.getElementById("add-kind").value;
        if (title) {
          act(() => invoke("add_item", { kind, title }));
          document.getElementById("add-title").value = "";
        }
      };

      // Top-bar clock (Figma console) — local time, ticks independently.
      const tickClock = () => {
        const d = new Date();
        document.getElementById("clock").textContent =
          String(d.getHours()).padStart(2, "0") + ":" +
          String(d.getMinutes()).padStart(2, "0") + ":" +
          String(d.getSeconds()).padStart(2, "0");
      };
      tickClock();
      setInterval(tickClock, 1000);

      // Mouse-clicked buttons blur so Enter/Space stay global afterwards.
      // Keyboard activation keeps focus (a keyboard-synthesized click has
      // e.detail === 0), so Tab users are not thrown back to the top.
      document.addEventListener("click", (e) => {
        const btn = e.target && e.target.closest && e.target.closest("button");
        if (btn && e.detail > 0) btn.blur();
      });

      // Canonical keybindings (UX-CANONICAL §1) — the JS mirror of
      // selahcue_app::keymap (contract-tested in Rust; hexes/keys pinned here).
      // Double-Esc window matches keymap::DOUBLE_ESC_WINDOW (1000ms).
      let lastEsc = 0;
      let armTimer = null;
      const armClearHint = (armed) => {
        document.getElementById("clear-all").classList.toggle("armed", armed);
        if (armTimer) {
          clearTimeout(armTimer);
          armTimer = null;
        }
        if (armed) {
          // The armed state expires with the double-tap window — never stale.
          armTimer = setTimeout(() => {
            lastEsc = 0;
            armClearHint(false);
          }, 1000);
        }
      };
      const disarm = () => {
        lastEsc = 0;
        armClearHint(false);
      };
      window.addEventListener("keydown", (e) => {
        // OS auto-repeat is never a deliberate action: a held Esc must not
        // complete the double-tap, a held B must not strobe the blackout.
        if (e.repeat) return;
        const mod = e.ctrlKey || e.metaKey;
        // Emergency chords pierce everything, including text fields (§3):
        // Ctrl/Cmd+Shift+B = blackout, Ctrl/Cmd+Shift+. = clear all. Matched by
        // PHYSICAL key (e.code) — with Shift held, e.key is "B" but also ">"
        // for Period on most layouts, so e.key would make the chord dead.
        if (mod && e.shiftKey && e.code === "KeyB") {
          e.preventDefault();
          disarm();
          toggleBlackout();
          return;
        }
        if (mod && e.shiftKey && e.code === "Period") {
          e.preventDefault();
          disarm();
          clearAll();
          return;
        }
        // ANY intervening key disarms the double-tap — including keys typed in
        // a field and host chords (mirrors keymap.rs: Esc-then-anything-then-Esc
        // is never a clear).
        if (e.key !== "Escape") disarm();
        // Presentation-focus keys are inactive while typing in a field (the
        // inline editor owns Enter/Escape there) and on a focused button
        // (Enter/Space must activate THAT control, not fire Go Live/Next).
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
        if (tag === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
        switch (e.key) {
          case " ":
          case "ArrowRight":
            e.preventDefault();
            act(() => invoke("next"));
            break;
          case "ArrowLeft":
            e.preventDefault();
            act(() => invoke("previous"));
            break;
          case "Enter":
            e.preventDefault();
            act(() => invoke("go_live"));
            break;
          case "b":
          case "B":
            e.preventDefault();
            toggleBlackout();
            break;
          case "Backspace":
            // Clear current layer (§1). The live output is single-layer until
            // per-layer clearing (86ajp0awx) — today this equals Clear-all.
            e.preventDefault();
            clearAll();
            break;
          case "Escape": {
            e.preventDefault();
            const now = Date.now();
            if (now - lastEsc <= 1000) {
              disarm();
              clearAll();
            } else {
              lastEsc = now;
              armClearHint(true);
            }
            break;
          }
        }
      });

      act(() => invoke("view"));
      // Poll so a running countdown ticks in the UI (the host advances it each frame).
      setInterval(async () => {
        try {
          render(await invoke("view"));
        } catch (e) {
          /* transient */
        }
      }, 1000);
    </script>
  </body>
</html>
