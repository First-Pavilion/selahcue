<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SelahCue Operator</title>
    <style>
      :root {
        --bg: #0e1116; --panel: #171b22; --line: #262c36; --text: #e6e9ef;
        --muted: #8b93a1; --live: #e5484d; --preview: #f5a524; --accent: #3b82f6;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system,
        BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px; border-bottom: 1px solid var(--line);
        display: flex; align-items: baseline; gap: 12px;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .sub { color: var(--muted); font-size: 12px; }
      main { flex: 1; display: flex; min-height: 0; }
      #plan { flex: 1; overflow-y: auto; padding: 8px; }
      .item {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px;
        border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px;
        cursor: pointer; background: var(--panel);
      }
      .item:hover { border-color: #35404f; background: #1d2430; }
      .item .kind {
        font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
        color: var(--muted); border: 1px solid var(--line); border-radius: 4px;
        padding: 2px 6px; min-width: 74px; text-align: center;
      }
      .item .title { flex: 1; font-weight: 500; }
      .badge { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 4px; letter-spacing: .04em; }
      .badge.live { background: var(--live); color: #fff; }
      .badge.preview { background: var(--preview); color: #1a1300; }
      .item.is-live { border-color: var(--live); }
      .item.is-staged { border-color: var(--preview); }
      aside {
        width: 240px; border-left: 1px solid var(--line); padding: 16px;
        display: flex; flex-direction: column; gap: 10px;
      }
      button {
        font: inherit; font-weight: 600; color: var(--text); background: var(--panel);
        border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.golive { background: #10331b; border-color: #1f7a3a; color: #7ee39b; }
      button.blackout.on { background: #3a0d0f; border-color: var(--live); color: #ff9ea1; }
      .timer-row { display: flex; gap: 8px; }
      .timer-row button { flex: 1; padding: 10px; }
      .timer-row select, .timer-row input {
        font: inherit; color: var(--text); background: var(--panel);
        border: 1px solid var(--line); border-radius: 8px; padding: 8px;
      }
      .timer-row input { flex: 1; min-width: 0; }
      .status { margin-top: auto; color: var(--muted); font-size: 12px; }
      .status b { color: var(--text); }
    </style>
  </head>
  <body>
    <header>
      <h1 id="plan-name">SelahCue Operator</h1>
      <span class="sub" id="plan-sub"></span>
    </header>
    <main>
      <section id="plan" aria-label="Service plan"></section>
      <aside>
        <button id="prev">◀ Previous</button>
        <button id="next">Next ▶</button>
        <button id="golive" class="golive">GO LIVE</button>
        <button id="blackout" class="blackout">Blackout</button>
        <button id="clear">Clear</button>
        <div class="timer-row">
          <select id="add-kind">
            <option value="song">Song</option>
            <option value="scripture">Scripture</option>
            <option value="announcement">Announcement</option>
            <option value="section">Section</option>
          </select>
          <input id="add-title" placeholder="New item title" />
          <button id="add-item">+ Add</button>
        </div>
        <div class="timer-row">
          <button id="timer-start">⏱ 5:00</button>
          <button id="timer-stop">Stop</button>
        </div>
        <div class="status">
          Live: <b id="s-live">—</b><br />
          Preview: <b id="s-preview">—</b><br />
          Blackout: <b id="s-black">off</b><br />
          Timer: <b id="s-timer">—</b>
        </div>
      </aside>
    </main>
    <script>
      const invoke = window.__TAURI__.core.invoke;
      let editing = null;       // item id with an open inline editor
      let confirmDelete = null; // item id in the two-click delete confirm state
      let lastRendered = "";    // skip DOM rebuilds when nothing changed

      function render(view) {
        // Never clobber an open editor or a pending delete-confirm, and skip
        // identical re-renders (the 1s poll must not eat in-flight clicks).
        const key = JSON.stringify(view);
        if (editing !== null || confirmDelete !== null) return;
        if (key === lastRendered) return;
        lastRendered = key;
        document.getElementById("plan-name").textContent = view.plan_name;
        document.getElementById("plan-sub").textContent = view.items.length + " items";

        const plan = document.getElementById("plan");
        plan.innerHTML = "";
        view.items.forEach((it, i) => {
          const row = document.createElement("div");
          row.className =
            "item" + (it.is_live ? " is-live" : "") + (it.is_staged ? " is-staged" : "");
          row.onclick = () => act(() => invoke("select", { itemId: it.id }));

          const kind = document.createElement("span");
          kind.className = "kind";
          kind.textContent = it.kind;

          const title = document.createElement("span");
          title.className = "title";
          title.textContent = it.title;

          // In-page editing only: WKWebView implements neither prompt() nor
          // confirm(), so native dialogs are silently dead in the shell.
          const ren = miniBtn("✏", (e) => {
            e.stopPropagation();
            editing = it.id;
            const input = document.createElement("input");
            input.value = it.title;
            input.style.cssText = "flex:1;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--accent);border-radius:4px;padding:4px 6px";
            input.onclick = (ev) => ev.stopPropagation();
            input.onkeydown = (ev) => {
              if (ev.key === "Enter") {
                const t = input.value.trim();
                editing = null;
                if (t && t !== it.title) act(() => invoke("rename_item", { itemId: it.id, title: t }));
                else act(() => invoke("view"));
              } else if (ev.key === "Escape") {
                editing = null;
                act(() => invoke("view"));
              }
            };
            input.onblur = () => { if (editing === it.id) { editing = null; act(() => invoke("view")); } };
            title.replaceWith(input);
            input.focus();
            input.select();
          });
          const up = miniBtn("↑", (e) => {
            e.stopPropagation();
            if (i > 0) act(() => invoke("move_item", { itemId: it.id, to: i - 1 }));
          });
          const down = miniBtn("↓", (e) => {
            e.stopPropagation();
            act(() => invoke("move_item", { itemId: it.id, to: i + 1 }));
          });
          const del = miniBtn("✕", (e) => {
            e.stopPropagation();
            if (confirmDelete === it.id) {
              confirmDelete = null;
              act(() => invoke("remove_item", { itemId: it.id }));
            } else {
              confirmDelete = it.id;
              del.textContent = "sure?";
              del.style.color = "var(--live)";
              setTimeout(() => { if (confirmDelete === it.id) { confirmDelete = null; act(() => invoke("view")); } }, 3000);
            }
          });

          row.appendChild(kind);
          row.appendChild(title);
          row.appendChild(ren);
          row.appendChild(up);
          row.appendChild(down);
          row.appendChild(del);
          if (it.is_live) row.appendChild(badge("live", "LIVE"));
          else if (it.is_staged) row.appendChild(badge("preview", "PREVIEW"));
          plan.appendChild(row);
        });

        const nameAt = (i) => (i == null ? "—" : view.items[i] ? view.items[i].title : "—");
        document.getElementById("s-live").textContent = nameAt(view.live_index);
        document.getElementById("s-preview").textContent = nameAt(view.staged_index);
        document.getElementById("s-black").textContent = view.blackout ? "ON" : "off";

        const t = view.timer;
        const tEl = document.getElementById("s-timer");
        if (!t) {
          tEl.textContent = "—";
          tEl.style.color = "";
        } else {
          const secs = t.remaining_secs != null ? t.remaining_secs : t.elapsed_secs;
          tEl.textContent = t.time_up ? "TIME UP" : fmtClock(secs);
          tEl.style.color = t.time_up ? "var(--live)" : t.warn ? "var(--preview)" : "#7ee39b";
        }

        const b = document.getElementById("blackout");
        b.classList.toggle("on", view.blackout);
        b.textContent = view.blackout ? "Un-blackout" : "Blackout";
        b.dataset.on = view.blackout ? "1" : "0";
      }

      function miniBtn(label, onclick) {
        const b = document.createElement("button");
        b.textContent = label;
        b.style.cssText = "padding:2px 8px;margin-left:4px;font-size:11px";
        b.onclick = onclick;
        return b;
      }

      function badge(cls, text) {
        const el = document.createElement("span");
        el.className = "badge " + cls;
        el.textContent = text;
        return el;
      }

      function fmtClock(secs) {
        return Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0");
      }

      async function act(fn) {
        try {
          // Any explicit action invalidates the render cache (e.g. a cancelled
          // inline edit must restore the normal row even if the view is unchanged).
          lastRendered = "";
          render(await fn());
        } catch (e) {
          console.error(e);
        }
      }

      document.getElementById("prev").onclick = () => act(() => invoke("previous"));
      document.getElementById("next").onclick = () => act(() => invoke("next"));
      document.getElementById("golive").onclick = () => act(() => invoke("go_live"));
      document.getElementById("clear").onclick = () => act(() => invoke("clear"));
      document.getElementById("blackout").onclick = () => {
        const on = document.getElementById("blackout").dataset.on !== "1";
        act(() => invoke("blackout", { on }));
      };
      document.getElementById("timer-start").onclick = () =>
        act(() => invoke("start_timer", { seconds: 300 }));
      document.getElementById("timer-stop").onclick = () => act(() => invoke("stop_timer"));
      document.getElementById("add-item").onclick = () => {
        const title = document.getElementById("add-title").value.trim();
        const kind = document.getElementById("add-kind").value;
        if (title) {
          act(() => invoke("add_item", { kind, title }));
          document.getElementById("add-title").value = "";
        }
      };

      act(() => invoke("view"));
      // Poll so a running countdown ticks in the UI (the host advances it each frame).
      setInterval(async () => {
        try {
          render(await invoke("view"));
        } catch (e) {
          /* transient */
        }
      }, 1000);
    </script>
  </body>
</html>
