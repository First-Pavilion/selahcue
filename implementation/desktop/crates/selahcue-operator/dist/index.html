<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SelahCue Operator</title>
    <style>
      :root {
        --bg: #0e1116; --panel: #171b22; --line: #262c36; --text: #e6e9ef;
        --muted: #8b93a1; --live: #e5484d; --preview: #f5a524; --accent: #3b82f6;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system,
        BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px; border-bottom: 1px solid var(--line);
        display: flex; align-items: baseline; gap: 12px;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .sub { color: var(--muted); font-size: 12px; }
      main { flex: 1; display: flex; min-height: 0; }
      #plan { flex: 1; overflow-y: auto; padding: 8px; }
      .item {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px;
        border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px;
        cursor: pointer; background: var(--panel);
      }
      .item:hover { border-color: #35404f; background: #1d2430; }
      .item .kind {
        font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
        color: var(--muted); border: 1px solid var(--line); border-radius: 4px;
        padding: 2px 6px; min-width: 74px; text-align: center;
      }
      .item .title { flex: 1; font-weight: 500; }
      .badge { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 4px; letter-spacing: .04em; }
      .badge.live { background: var(--live); color: #fff; }
      .badge.preview { background: var(--preview); color: #1a1300; }
      .item.is-live { border-color: var(--live); }
      .item.is-staged { border-color: var(--preview); }
      aside {
        width: 240px; border-left: 1px solid var(--line); padding: 16px;
        display: flex; flex-direction: column; gap: 10px;
      }
      button {
        font: inherit; font-weight: 600; color: var(--text); background: var(--panel);
        border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.golive { background: #10331b; border-color: #1f7a3a; color: #7ee39b; }
      button.blackout.on { background: #3a0d0f; border-color: var(--live); color: #ff9ea1; }
      .status { margin-top: auto; color: var(--muted); font-size: 12px; }
      .status b { color: var(--text); }
    </style>
  </head>
  <body>
    <header>
      <h1 id="plan-name">SelahCue Operator</h1>
      <span class="sub" id="plan-sub"></span>
    </header>
    <main>
      <section id="plan" aria-label="Service plan"></section>
      <aside>
        <button id="prev">◀ Previous</button>
        <button id="next">Next ▶</button>
        <button id="golive" class="golive">GO LIVE</button>
        <button id="blackout" class="blackout">Blackout</button>
        <button id="clear">Clear</button>
        <div class="status">
          Live: <b id="s-live">—</b><br />
          Preview: <b id="s-preview">—</b><br />
          Blackout: <b id="s-black">off</b>
        </div>
      </aside>
    </main>
    <script>
      const invoke = window.__TAURI__.core.invoke;

      function render(view) {
        document.getElementById("plan-name").textContent = view.plan_name;
        document.getElementById("plan-sub").textContent = view.items.length + " items";

        const plan = document.getElementById("plan");
        plan.innerHTML = "";
        view.items.forEach((it) => {
          const row = document.createElement("div");
          row.className =
            "item" + (it.is_live ? " is-live" : "") + (it.is_staged ? " is-staged" : "");
          row.onclick = () => act(() => invoke("select", { itemId: it.id }));

          const kind = document.createElement("span");
          kind.className = "kind";
          kind.textContent = it.kind;

          const title = document.createElement("span");
          title.className = "title";
          title.textContent = it.title;

          row.appendChild(kind);
          row.appendChild(title);
          if (it.is_live) row.appendChild(badge("live", "LIVE"));
          else if (it.is_staged) row.appendChild(badge("preview", "PREVIEW"));
          plan.appendChild(row);
        });

        const nameAt = (i) => (i == null ? "—" : view.items[i] ? view.items[i].title : "—");
        document.getElementById("s-live").textContent = nameAt(view.live_index);
        document.getElementById("s-preview").textContent = nameAt(view.staged_index);
        document.getElementById("s-black").textContent = view.blackout ? "ON" : "off";

        const b = document.getElementById("blackout");
        b.classList.toggle("on", view.blackout);
        b.textContent = view.blackout ? "Un-blackout" : "Blackout";
        b.dataset.on = view.blackout ? "1" : "0";
      }

      function badge(cls, text) {
        const el = document.createElement("span");
        el.className = "badge " + cls;
        el.textContent = text;
        return el;
      }

      async function act(fn) {
        try {
          render(await fn());
        } catch (e) {
          console.error(e);
        }
      }

      document.getElementById("prev").onclick = () => act(() => invoke("previous"));
      document.getElementById("next").onclick = () => act(() => invoke("next"));
      document.getElementById("golive").onclick = () => act(() => invoke("go_live"));
      document.getElementById("clear").onclick = () => act(() => invoke("clear"));
      document.getElementById("blackout").onclick = () => {
        const on = document.getElementById("blackout").dataset.on !== "1";
        act(() => invoke("blackout", { on }));
      };

      act(() => invoke("view"));
    </script>
  </body>
</html>
