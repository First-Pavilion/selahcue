[package]
name = "selahcue-desktop"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SelahCue desktop walking skeleton: a native borderless output window (winit + wgpu) presenting the live output, driven by a LAN control server so a remote controller changes what's on screen. The Tauri operator shell is a subsequent batch."

[[bin]]
name = "selahcue-output"
path = "src/main.rs"

[features]
# Encrypted-by-default posture (FR-154; CON-5 NDPA 2023/GDPR; risk acceptance recorded on
# 86akcfftu, 2026-09-11; implemented by 86akgrz3b, the product owner's decision to ship option
# (a) — encrypted by default, not the FDE-verification fallback and not a hybrid). Transcripts
# persist verbatim congregation speech, so every build — dev, CI, and the shipped installer
# alike — gets the `encryption` feature on unless someone explicitly passes
# `--no-default-features`, which nothing in this repo's build paths (`make`, CI, the Windows
# installer workflow) does.
default = ["encryption"]
# At-rest encryption (FR-154 + story 86ajp5vp6): SQLCipher via selahcue-data, with the key
# acquired from the OS secret store (or an Argon2id-derived passphrase key). Default-on as of
# 86akgrz3b — see the `default` array above. Windows CI now carries the perl+nasm toolchain the
# vendored-OpenSSL build needs (`.github/workflows/ci.yml`'s `rust`/`operator`/`operator-native`
# jobs and `.github/workflows/windows-installer.yml`), so this is no longer a platform-coverage
# gap the way it was when this feature was opt-in.
#
# LAUNCH_REACHABILITY: REQUIRED — a product/owner decision (86akgrz3b) that this feature must be
# in `make launch`/`make operator`'s DEFAULT resolved feature set, unconditionally (there is no
# opt-out toggle, unlike STT/AI, because unlike those this needs no optional heavy toolchain a
# developer might lack — perl is ubiquitous, and CI now carries nasm too). Threaded explicitly
# through the Makefile's `DESKTOP_FEATURES` (in addition to being a genuine Cargo default) so
# `scripts/check_launch_reachability.py`'s dry-run text scan — which can only see explicit
# `--features` tokens, never an implicit Cargo default — actually observes it; see that script's
# module docstring for what each tag means.
# RELEASE: SAFE — the key comes from the OS secret store or an Argon2id-derived passphrase,
# never a developer `.env`/shell-exported credential; no release-boundary concern. Confirmed
# NOT a member of the Makefile's `RELEASE_UNSAFE_FEATURES` registry (86akgrz3b).
encryption = ["selahcue-data/encryption", "dep:keyring", "dep:argon2", "dep:getrandom", "dep:zeroize"]
# NDI OUTPUT delivery (Screens page): broadcast a composed audience feed as an NDI source via
# grafton-ndi (Apache-2.0; NDI SDK 6). OFF by default — the default build links no native NDI
# runtime, so `make ci` stays native-free (mirrors selahcue-stt's whisper/capture gating). The
# NDI *setup* (name/enable, persisted + surfaced) works in every build; only transmission needs
# this feature + the NDI SDK/runtime installed. Build to broadcast: `cargo build -p
# selahcue-desktop --features ndi`.
#
# LAUNCH_REACHABILITY: AUTO — auto-enabled by `make launch`'s `NDI ?= auto` whenever the SDK is
# vendored (scripts/fetch_ndi_sdk.sh), quietly skipped otherwise. Not REQUIRED: no owner decision
# has made this unconditional the way 86akcmzrd/86akd10dq did for the AI/STT features.
# RELEASE: SAFE — broadcasts to the local network via a vendored SDK; reads no developer-only
# credential. Ships in real release artefacts (the Windows installer bundles NDI per
# `implementation/desktop/vendor/ndi/README.md`).
ndi = ["dep:grafton-ndi"]

[dependencies]
fs4 = "0.13"
mdns-sd = "0.13"
# Local wall clock for the confidence monitor's Timer-only chrome (date + 12-hour time).
# `clock` pulls the OS timezone; `std` for Display formatting. Default features off to skip
# the unused `oldtime`/serde surface.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }
argon2 = { version = "0.5", optional = true }
getrandom = { version = "0.2", optional = true }
zeroize = { version = "1", optional = true }
grafton-ndi = { version = "1", optional = true }
selahcue-core = { path = "../selahcue-core" }
selahcue-data = { path = "../selahcue-data" }
selahcue-engine = { path = "../selahcue-engine" }
selahcue-present = { path = "../selahcue-present" }
# `warm()` the fuzzy quote-match index at startup (start_remote_control, src/main.rs) so the
# first real IngestTranscript command doesn't pay the lazy OnceLock build cost inline inside
# ControlClient::COMMAND_TIMEOUT. See that call site's comment; 17tnw2b1258.
selahcue-scripture = { path = "../selahcue-scripture" }
# The controller + pinned-TLS control server (so a remote controller drives the window).
selahcue-app = { path = "../selahcue-app", features = ["server"] }
selahcue-lan = { path = "../selahcue-lan", features = ["server"] }
wgpu = "22"
winit = "0.30"
pollster = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }

[lints]
workspace = true
