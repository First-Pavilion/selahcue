[package]
name = "selahcue-engine"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SelahCue render-engine test seam (ADR-0015): scene model, GPU-free deterministic rasterizer + pixel readback, fault injection for output-failure isolation, seizure-safe flash analysis (FR-175), latency proxy (NFR-004), and the render↔control IPC contract. The wgpu backend implements the same scene later."

[dependencies]
serde = { version = "1", features = ["derive"] }
# Real text shaping + rasterization (ADR-0014, FR-017): cosmic-text drives
# rustybuzz (a pure-Rust HarfBuzz port over ttf-parser) for shaping + mark
# positioning and swash for CPU glyph rasterization, over a single BUNDLED OFL
# font (system fonts disabled) so output text shapes IDENTICALLY on every OS
# (NFR-014) with a memory-safe parser (FR-173). std-only, no C FFI.
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
