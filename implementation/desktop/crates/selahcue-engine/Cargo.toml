[package]
name = "selahcue-engine"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SelahCue render-engine test seam (ADR-0015): scene model, GPU-free deterministic rasterizer + pixel readback, fault injection for output-failure isolation, seizure-safe flash analysis (FR-175), latency proxy (NFR-004), and the render↔control IPC contract. The wgpu backend implements the same scene later."

[dependencies]
serde = { version = "1", features = ["derive"] }
# Bundled public-domain 8×8 bitmap font — self-contained, deterministic glyph data
# for the CPU text rasterizer (no runtime font files). GPU-native glyphs are later.
font8x8 = "0.3"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
