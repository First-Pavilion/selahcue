[package]
name = "selahcue-engine"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SelahCue render-engine test seam (ADR-0015): scene model, GPU-free deterministic rasterizer + pixel readback, fault injection for output-failure isolation, seizure-safe flash analysis (FR-175), latency proxy (NFR-004), and the render↔control IPC contract. The wgpu backend implements the same scene later."

[dependencies]
serde = { version = "1", features = ["derive"] }
# A fixed-capacity, Copy, stack-allocated string for the per-theme font-family name
# (86ajq6fxt) — keeps `scene::Layer::Text` and `Theme` fixed-size Copy PODs (no heap
# String) with a bounded name. Already in the tree (transitive via cosmic-text).
arrayvec = { version = "0.7", features = ["serde"] }
# Real text shaping + rasterization (ADR-0014, FR-017): cosmic-text drives
# rustybuzz (a pure-Rust HarfBuzz port over ttf-parser) for shaping + mark
# positioning and swash for CPU glyph rasterization, over a single BUNDLED OFL
# font (system fonts disabled) so output text shapes IDENTICALLY on every OS
# (NFR-014) with a memory-safe parser (FR-173). std-only, no C FFI.
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }
# Bounded, pure-Rust, deterministic still-image decode (PNG) for `Layer::Image` — the
# S8-6 image foundation. A memory-safe pure-Rust parser (FR-173); PNG is lossless so the
# decoded RGBA8 is byte-identical on every OS (NFR-014), unlike a platform/HW decoder.
# Decode runs IN-PROCESS with hard size/dimension limits (decompression-bomb-safe); the
# out-of-process sandbox (ADR-0016) is the deferred end-state (ADR-0018). Formats outside the
# signature allowlist degrade to the missing-media placeholder (FR-070).
png = "0.17"
# JPEG still-image decode (ADR-0025) — real .pptx decks overwhelmingly embed JPEG, so
# presentation import needs it for "text + images" to be true on a real deck.
#
# EXACTLY pinned, and it must stay that way. The JPEG spec defines the bitstream, not an exact
# inverse DCT, so byte-identical output is a property of THIS version, not of the format
# (ADR-0025 decision 3). A bump is a golden-test-affecting change gated on re-running
# tests/test_jpeg.rs, exactly like the wgpu pin — never a routine dependency update.
#
# `default-features = false` drops `rayon` (no worker threads on a path we deliberately bound);
# `platform_independent` compiles out the SSSE3/NEON kernels AND their runtime
# `is_x86_feature_detected!` dispatch, so ONE scalar code path runs on every CPU. Without it the
# same binary yields different pixels on an AVX2-capable machine than without — a cross-CPU
# divergence that reproduces on only some CI runners. It also promotes the crate's
# `deny(unsafe_code)` to `forbid`, satisfying the threat model's JPEG-crate constraint (pure
# Rust, no libjpeg FFI under any feature or transitive path, unsafe/SIMD disabled).
jpeg-decoder = { version = "=0.3.2", default-features = false, features = [
  "platform_independent",
] }

[dev-dependencies]
serde_json = "1"
# Tests generate known PNG fixtures with the encoder to exercise `decode_png` +
# `Layer::Image` (already a normal dependency; listed here so the integration-test
# crate can build fixtures directly).
png = "0.17"

[lints]
workspace = true
