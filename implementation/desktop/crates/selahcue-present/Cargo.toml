[package]
name = "selahcue-present"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SelahCue presentation rendering: compose slides into engine frames and drive the Preview→Live loop (FR-009/012/013/036/046). Built on the selahcue-engine test seam, so preview/live isolation and slide-trigger latency are verifiable headlessly."

[dependencies]
selahcue-core = { path = "../selahcue-core" }
selahcue-engine = { path = "../selahcue-engine" }
serde = { version = "1", features = ["derive"] }
# QR encoding for the pairing invite shown on an output (pure Rust, no image deps).
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
