[package]
name = "selahcue-scripture"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bundled public-domain scripture text with lookup and keyword search, plus a registry of installed translations"

[features]
default = []
# Runtime loader for translations the user has already installed (SHA-256-verified, validated,
# stored in the app data directory), plus the embedded catalogue, the installer and the
# bounded-memory registry. NO network crate in its dependency tree: the output host enables only
# this one, so the render closure never links an HTTP client or a TLS stack (scripts/import_guards.sh
# fails the build if that stops being true). `serde_json` reads the catalogue and the install
# receipt; `sha2` checks every file against the digest recorded when it was installed.
installed = ["dep:sha2", "dep:serde_json"]
# Download-on-demand of a catalogued translation (ureq + rustls). Implies `installed`: a download
# ends by validating and installing into the registry. OFF by default, so the crate stays pure
# (bundled text only, no I/O) unless this is enabled AND explicitly invoked.
download = ["installed", "dep:ureq"]

[dependencies]
selahcue-core = { path = "../selahcue-core" }
flate2 = "1"
# Streaming SHA-256 for translation-asset integrity verification (feature `installed`).
# MIT/Apache-2.0; already in the workspace lock (selahcue-lan).
sha2 = { version = "0.11", optional = true }
# Reads `assets/catalog.json` and the `installed.json` receipt (feature `installed`). Already in the
# workspace lock and used by several workspace crates, so no new crate enters the graph; it is a
# new dependency EDGE for this crate only. Not a network crate.
serde_json = { version = "1", optional = true }
# Blocking HTTP(S) client (rustls) for translation download-on-demand (feature `download`).
ureq = { version = "3", optional = true }

# `build.rs` reads the same embedded gzipped assets as the runtime decoder and writes the
# compile-time verse-run table behind `passage_exists_in` (86ak84fbd). Same crate/version as the
# normal dependency above, so the lockfile gains nothing.
[build-dependencies]
flate2 = "1"

[lints]
workspace = true
