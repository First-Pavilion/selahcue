[package]
name = "selahcue-app"
publish.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SelahCue application wiring: a LiveController that maps LAN control commands (RBAC-checked by the server) onto the presenter/service-plan, so a remote controller drives the live output. The `server` feature adds the ControlServer handler + end-to-end tests."

[features]
default = []
# Wire the controller into the pinned-TLS control server (end-to-end).
server = ["selahcue-lan/server"]

[dependencies]
selahcue-core = { path = "../selahcue-core" }
selahcue-scripture = { path = "../selahcue-scripture" }
selahcue-present = { path = "../selahcue-present" }
selahcue-lan = { path = "../selahcue-lan" }
# Serializes the operator view-model for the UI (Tauri commands return it as JSON).
serde = { version = "1", features = ["derive"] }
# Deserializes a custom theme (Theme Designer) from its wire JSON (S8-3c).
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
# Dev-only: proves the real end-to-end sermon-note-persistence wiring (86akgqdv0) against a
# REAL SQLite store, the way `selahcue-desktop` wires `SermonNoteStore`/`TranscriptSink` in
# production — mirrors `selahcue-lan`'s own dev-dependency on this crate for its `demo`
# example. `selahcue-app`'s own [dependencies] gain no dependency on `selahcue-data` (the
# crate graph runs the other way; see `sermon_note_store`'s module docs) — this is test-only.
selahcue-data = { path = "../selahcue-data" }
# For `test_sermon_note_remote.rs`'s real on-disk SQLite file (a genuine tempdir path, the
# same shape as the desktop's real `data_dir()/selahcue.db3`).
tempfile = "3"

[lints]
workspace = true
