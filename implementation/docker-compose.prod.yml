# Production stack for SelahCue, deployed by Coolify's "Docker Compose" build pack:
# Platform API (Gunicorn), Celery worker and beat, a one-off migration, the website (nginx),
# PostgreSQL 16 and Redis 7. The development stack is docker-compose.yml; the two files share
# only the Dockerfiles.
#
# Coolify setup (deploy/README.md has the full runbook):
#   Build pack: Docker Compose. Base directory: /implementation.
#   Docker Compose location: /docker-compose.prod.yml.
#   Environment variables: paste deploy/production.env.example and fill in every value.
#   Domains: leave EVERY service's domain field empty. The Traefik labels below do the routing,
#   and a domain set in the UI would add a second, unguarded router in front of the same service.
#
# Routing (Traefik, Coolify's proxy). Every request reaches Django through exactly ONE proxy hop,
# on both domains: the website domain's /graphql/* goes straight from Traefik to `api`, not
# through the website's nginx. That is what makes SELAHCUE_TRUSTED_PROXY_COUNT=1 correct for
# browser AND native traffic at once. The routers also:
#   - strip the inbound X-SelahCue-* identity headers (docs/ops/DEPLOYMENT.md section 6b);
#   - send /graphql/admin to a path Django does not route (404): production staff auth does not
#     exist yet;
#   - redirect HTTP to HTTPS.
# Traefik replaces a client's X-Forwarded-For/-Proto unless the entrypoint trusts that client
# (forwardedHeaders.trustedIPs). If production Coolify sits behind Cloudflare or a load balancer,
# re-derive SELAHCUE_TRUSTED_PROXY_COUNT and SELAHCUE_TRUST_FORWARDED_PROTO first
# (docs/ops/DEPLOYMENT.md sections 6b and 6c).

x-api-image: &api-image
  image: ${API_IMAGE:-selahcue-api}:${RELEASE_TAG:-latest}
  build:
    context: ./api

# Every variable the API-image processes read. Coolify lists each ${VAR} in its Environment
# Variables page; `:?` marks the required ones (an empty value stops the deploy). Defaults after
# `:-` are the production choice for this stack. Reference: ../deployments.md section 1.
x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-prod}
  DEBUG: "0"
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${API_DOMAIN:?set API_DOMAIN} ${WEBSITE_DOMAIN:?set WEBSITE_DOMAIN}
  FRONTEND_BASE_URL: https://${WEBSITE_DOMAIN:?set WEBSITE_DOMAIN}
  # Used by the api healthcheck only (an allowed Host header).
  API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
  # The single Traefik hop; see the header comment before changing either.
  SELAHCUE_TRUSTED_PROXY_COUNT: "1"
  SELAHCUE_TRUST_FORWARDED_PROTO: "1"
  # HSTS ramp-up (DEPLOYMENT.md section 6c): start short, raise once HTTPS is verified everywhere.
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-300}
  SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-0}
  SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-0}
  SELAHCUE_ENTITLEMENT_SIGNING_KEY: ${SELAHCUE_ENTITLEMENT_SIGNING_KEY:?set SELAHCUE_ENTITLEMENT_SIGNING_KEY}
  SQL_ENGINE: django.db.backends.postgresql
  SQL_HOST: db
  SQL_PORT: "5432"
  SQL_DATABASE: ${SQL_DATABASE:-selahcue}
  SQL_USER: ${SQL_USER:-selahcue}
  SQL_PASSWORD: ${SQL_PASSWORD:?set SQL_PASSWORD}
  CACHE_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/1
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/2
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/2
  MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?set DEFAULT_FROM_EMAIL}
  DEFAULT_EMAIL: ${DEFAULT_EMAIL:-info@firstpavitech.com}
  SELAHCUE_PILOT_REGISTRATION_ENABLED: "0"
  SELAHCUE_PILOT_GRANT_ENABLED: "0"

# Shared by every process that runs the API image: web, worker, beat, migrate.
x-api-common: &api-common
  <<: *api-image
  environment: *api-env
  # Least privilege: an unprivileged uid, a read-only root filesystem, writable /tmp only
  # (gunicorn heartbeat files, celery beat schedule and pidfile).
  user: "65534:65534"
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SQL_DATABASE:-selahcue}
      POSTGRES_USER: ${SQL_USER:-selahcue}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:?set SQL_PASSWORD}
    volumes:
      - selahcue-pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # AOF on: queued mail jobs survive a restart. No port is published.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - selahcue-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # One-off: applies migrations, then exits 0. web/worker/beat wait for it to succeed, so every
  # Coolify deploy migrates before the new release starts. Coolify shows it as exited; that is
  # expected. For a release that DROPS A COLUMN, stop the resource in Coolify before deploying
  # (docs/ops/DEPLOYMENT.md section 6d).
  migrate:
    <<: *api-common
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *api-env
      PGOPTIONS: "-c lock_timeout=5000"
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *api-common
    # Default image command: gunicorn --config gunicorn.conf.py selahcue_api.wsgi:application
    expose: ["8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # gunicorn.conf.py's graceful_timeout is 30 s; give it room before SIGKILL.
    stop_grace_period: 40s
    healthcheck:
      # The documented liveness route, with an allowed Host (Django 400s any other).
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/graphql/csrf', headers={'Host': os.environ['API_DOMAIN']}), timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.services.selahcue-api.loadbalancer.server.port=8000
      # Shared middlewares (defined once, here).
      - traefik.http.middlewares.selahcue-strip-identity.headers.customrequestheaders.X-SelahCue-Actor-Id=
      - traefik.http.middlewares.selahcue-strip-identity.headers.customrequestheaders.X-SelahCue-Actor-Kind=
      - traefik.http.middlewares.selahcue-strip-identity.headers.customrequestheaders.X-SelahCue-Org-Id=
      - traefik.http.middlewares.selahcue-strip-identity.headers.customrequestheaders.X-SelahCue-Staff-Permissions=
      - traefik.http.middlewares.selahcue-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.selahcue-to-https.redirectscheme.permanent=true
      - traefik.http.middlewares.selahcue-block-staff.replacepath.path=/__staff_graph_disabled__
      # API domain: everything to Django.
      - traefik.http.routers.selahcue-api.rule=Host(`${API_DOMAIN:?set API_DOMAIN}`)
      - traefik.http.routers.selahcue-api.entrypoints=https
      - traefik.http.routers.selahcue-api.tls=true
      - traefik.http.routers.selahcue-api.tls.certresolver=letsencrypt
      - traefik.http.routers.selahcue-api.middlewares=selahcue-strip-identity
      - traefik.http.routers.selahcue-api.service=selahcue-api
      # Website domain: /graphql/* to Django directly (same origin, one hop).
      - traefik.http.routers.selahcue-web-graphql.rule=Host(`${WEBSITE_DOMAIN:?set WEBSITE_DOMAIN}`) && PathPrefix(`/graphql/`)
      - traefik.http.routers.selahcue-web-graphql.entrypoints=https
      - traefik.http.routers.selahcue-web-graphql.tls=true
      - traefik.http.routers.selahcue-web-graphql.tls.certresolver=letsencrypt
      - traefik.http.routers.selahcue-web-graphql.middlewares=selahcue-strip-identity
      - traefik.http.routers.selahcue-web-graphql.service=selahcue-api
      # Staff graph on either domain: rewritten to an unrouted path, so Django answers 404.
      - traefik.http.routers.selahcue-staff.rule=(Host(`${API_DOMAIN:?set API_DOMAIN}`) || Host(`${WEBSITE_DOMAIN:?set WEBSITE_DOMAIN}`)) && PathPrefix(`/graphql/admin`)
      - traefik.http.routers.selahcue-staff.priority=1000
      - traefik.http.routers.selahcue-staff.entrypoints=https
      - traefik.http.routers.selahcue-staff.tls=true
      - traefik.http.routers.selahcue-staff.tls.certresolver=letsencrypt
      - traefik.http.routers.selahcue-staff.middlewares=selahcue-block-staff
      - traefik.http.routers.selahcue-staff.service=selahcue-api
      # Plain HTTP on either domain: redirect.
      - traefik.http.routers.selahcue-http.rule=Host(`${API_DOMAIN:?set API_DOMAIN}`) || Host(`${WEBSITE_DOMAIN:?set WEBSITE_DOMAIN}`)
      - traefik.http.routers.selahcue-http.entrypoints=http
      - traefik.http.routers.selahcue-http.middlewares=selahcue-to-https
      - traefik.http.routers.selahcue-http.service=selahcue-api

  worker:
    <<: *api-common
    command: ["celery", "-A", "selahcue_api", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD-SHELL", "celery -A selahcue_api inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  beat:
    <<: *api-common
    # Exactly one beat instance, ever: two would double-schedule the maintenance tasks.
    command: ["celery", "-A", "selahcue_api", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  website:
    image: ${WEBSITE_IMAGE:-selahcue-website}:${RELEASE_TAG:-latest}
    build:
      context: ..
      dockerfile: implementation/marketing/Dockerfile
    expose: ["80"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging
    labels:
      - traefik.enable=true
      - traefik.http.services.selahcue-website.loadbalancer.server.port=80
      - traefik.http.routers.selahcue-website.rule=Host(`${WEBSITE_DOMAIN:?set WEBSITE_DOMAIN}`)
      - traefik.http.routers.selahcue-website.entrypoints=https
      - traefik.http.routers.selahcue-website.tls=true
      - traefik.http.routers.selahcue-website.tls.certresolver=letsencrypt
      - traefik.http.routers.selahcue-website.middlewares=selahcue-strip-identity
      - traefik.http.routers.selahcue-website.service=selahcue-website

volumes:
  selahcue-pgdata:
  selahcue-redisdata:
