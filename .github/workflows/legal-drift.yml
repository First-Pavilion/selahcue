# Keeps the marketing site's Privacy Policy and Terms pages in step with the legal drafts.
#
# WHY A WORKFLOW OF ITS OWN. The legal pages are GENERATED from docs/legal/*.md
# (implementation/marketing/scripts/sync_legal.ts) and the generated files are committed.
# Drift happens exactly when someone edits a draft, say to fill in a placeholder, and
# forgets to regenerate. ci.yml cannot see that edit: it ignores `docs/**` and `**.md`
# at the top level, and its marketing path filter does not list docs/legal, so a
# docs/legal-only change runs NO marketing job. This workflow is triggered by those
# paths on purpose. It is deliberately separate from the `marketing` job in ci.yml so it
# does not collide with edits to that job.
#
# The same check runs locally: `npm run check:legal` (in implementation/marketing).
name: legal-drift

on:
  # THE PATH LIST HAS TWO PARTS. The first block is what generates and renders the legal
  # pages (the drafts, the generated content, the components, their tests). The second
  # block, from the two views down, is SHARED code that can move where those pages land or
  # how they look without touching any legal file: the router and its scroll behaviour, the
  # global styles (a page-wide scroll-padding changes anchor offsets), the navbar whose
  # height the anchors clear, the app shell, and the build/dependency/tsconfig inputs. A
  # change there that breaks a legal page would otherwise go unnoticed until some legal
  # file next changed. It is written out twice because Actions has no shared path list.
  pull_request:
    paths:
      - "docs/legal/**"
      - "implementation/marketing/src/lib/legal/**"
      - "implementation/marketing/src/components/legal/**"
      - "implementation/marketing/scripts/*legal*"
      - "implementation/marketing/tests/*legal*"
      - "implementation/marketing/tests/*Legal*"
      - "implementation/marketing/tests/fixtures/fakeHead.ts"
      - "implementation/marketing/src/views/PrivacyView.vue"
      - "implementation/marketing/src/views/TermsView.vue"
      - "implementation/marketing/src/router/**"
      - "implementation/marketing/src/assets/**"
      - "implementation/marketing/src/components/Navbar.vue"
      - "implementation/marketing/src/components/Footer.vue"
      - "implementation/marketing/src/components/UiBadge.vue"
      - "implementation/marketing/src/App.vue"
      - "implementation/marketing/src/main.ts"
      - "implementation/marketing/index.html"
      - "implementation/marketing/vite.config.ts"
      - "implementation/marketing/package.json"
      - "implementation/marketing/package-lock.json"
      - "implementation/marketing/tsconfig*.json"
      - ".github/workflows/legal-drift.yml"
  push:
    branches: [main]
    paths:
      - "docs/legal/**"
      - "implementation/marketing/src/lib/legal/**"
      - "implementation/marketing/src/components/legal/**"
      - "implementation/marketing/scripts/*legal*"
      - "implementation/marketing/tests/*legal*"
      - "implementation/marketing/tests/*Legal*"
      - "implementation/marketing/tests/fixtures/fakeHead.ts"
      - "implementation/marketing/src/views/PrivacyView.vue"
      - "implementation/marketing/src/views/TermsView.vue"
      - "implementation/marketing/src/router/**"
      - "implementation/marketing/src/assets/**"
      - "implementation/marketing/src/components/Navbar.vue"
      - "implementation/marketing/src/components/Footer.vue"
      - "implementation/marketing/src/components/UiBadge.vue"
      - "implementation/marketing/src/App.vue"
      - "implementation/marketing/src/main.ts"
      - "implementation/marketing/index.html"
      - "implementation/marketing/vite.config.ts"
      - "implementation/marketing/package.json"
      - "implementation/marketing/package-lock.json"
      - "implementation/marketing/tsconfig*.json"
      - ".github/workflows/legal-drift.yml"

# Least privilege: this job only reads the repository. No secrets are used.
permissions:
  contents: read

concurrency:
  group: legal-drift-${{ github.ref }}
  # Cancel superseded PR runs, but never a main run: every main commit keeps a real
  # pass/fail verdict (same rule and same expression as ci.yml).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  legal-drift:
    name: legal pages (drafts in sync)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation/marketing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: implementation/marketing/package-lock.json
      - name: Install
        run: npm ci
      # Regenerates both pages' content from docs/legal and fails if the committed
      # files differ. Exit 1 = stale (run `npm run sync:legal` and commit), 2 = cannot run.
      - name: Generated content matches docs/legal
        run: npm run check:legal
      # CI=true (set by Actions) makes a MISSING draft a hard failure in these tests
      # rather than a skip, so renaming a draft cannot turn the drift guard into a no-op.
      - name: Legal content, page and CLI tests
        run: node --test --test-reporter=spec tests/legal.test.ts tests/legalPage.test.ts tests/syncLegalCli.test.ts tests/legalWorkflow.test.ts
      # Drives the real built bundle in headless Chrome at 320/375/768/1024/1440px: banner,
      # placeholder chips, noindex (kept across /privacy -> /terms, removed on leaving),
      # Contents and scroll-spy, deep links below the sticky navbar, tables, console clean.
      # SELAHCUE_HEADLESS_REQUIRE=1 makes a missing Playwright or browser a hard FAILURE;
      # without it the script skips, which on a runner would report success checking nothing.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Pinned to the same version as ci.yml's WebKit smoke, so the browser engine under test is
      # reproducible (bump deliberately, in both places); an unpinned install makes this gate's
      # behaviour depend on whatever PyPI serves that morning. setup-python's interpreter is not
      # an externally-managed system Python, so no `--break-system-packages` is needed here.
      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install --quiet playwright==1.60.0
          python3 -m playwright install --with-deps chromium
      - name: Legal pages in a real browser
        env:
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: npm run test:legal-pages
