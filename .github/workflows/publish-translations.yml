# Publishes the downloadable Bible translations (the mirror built by scripts/build_translation_catalog.py)
# to the DigitalOcean Space `bible-translations`, and proves from the public CDN URL that the bytes a user's
# app will download are the bytes this run built. Runbook: docs/ops/TRANSLATIONS-PUBLISH.md (17tnw2b2jqd, A7).
#
# MANUAL ONLY. `workflow_dispatch` is the only trigger: never a push, a pull request or a fork. Run it from
# the Actions tab (or `gh workflow run publish-translations.yml`).
#
# DRY RUN BY DEFAULT. With `dry_run` ticked (the default) only the `build` job runs: it needs no environment, no
# secret and no approval, and uploads nothing. It is how you rehearse from any branch. Un-ticking `dry_run` adds the
# `publish` job, which
#   * runs in the protected environment `translations-publish` (a named approver, restricted to `main`),
#   * is the ONLY place the Space's access key exists, and only inside the two upload steps,
#   * never overwrites an object: keys carry their own SHA-256, so a published key can never change (the app pins
#     the digest, and a CDN may cache the URL for as long as it likes),
#   * uploads every asset, reads each back, then uploads the catalogue LAST and reads that back, so no catalogue
#     ever names a file that is missing.
#
# The reads go to the public URL exactly as the app makes them (`Accept-Encoding: identity`, no redirect followed)
# and fail on any difference, including a `Content-Encoding` the CDN may add. The CDN URL is the app's base URL.
#
# SETTINGS (non-secret variables). The `publish` job reads them from the ENVIRONMENT `translations-publish`, which only an
# administrator can change (an environment variable overrides a repository variable of the same name for a job that uses
# the environment). The `build` job has no environment, so it reads the REPOSITORY-level copies of the two it needs, which a
# write-access account can change: if those differ from the environment's, the publish job refuses at "Re-check the
# release" (the catalogue records its base_url), so a repository-level change cannot redirect a publish.
#   TRANSLATIONS_BASE_URL    https://bible-translations.sfo3.cdn.digitaloceanspaces.com   (what the app downloads from;
#                                                  recorded in catalog.json; BOTH levels, and they must be equal)
#   TRANSLATIONS_ORIGIN_URL  https://bible-translations.sfo3.digitaloceanspaces.com       (optional: also read back here; both levels)
#   TRANSLATIONS_BUCKET      bible-translations                                           (environment only)
#   TRANSLATIONS_ENDPOINT    https://sfo3.digitaloceanspaces.com                          (the S3 API; environment only)
# The script also refuses a bucket, region and base URL that disagree about which Space this is.
# SECRETS (environment `translations-publish` only; set by the owner, never through chat or an agent, NEVER as
# repository secrets):
#   SPACES_ACCESS_KEY_ID, SPACES_SECRET_ACCESS_KEY   a key limited to the `bible-translations` Space and nothing else.
#
# ACTIONS ARE PINNED BY FULL COMMIT SHA, with the release tag in a trailing comment. This is the one workflow in the
# repository that holds a secret, and the checkout and download steps run in the same workspace as the steps that hold the
# key: an action swapped under a movable tag could edit the script that receives it. Every other workflow pins tags (they
# hold no secret). Dependabot keeps SHA pins current; `.github/scripts/check_workflows.py` refuses an unpinned or
# non-`actions/` step here.
name: publish-translations

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Codes to publish, separated by spaces. Only translations the allowlist marks cleared are accepted (today: BSB)."
        required: true
        default: "BSB"
        type: string
      dry_run:
        description: "Dry run: build and check everything, upload nothing. Un-tick to publish for real (needs approval)."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: build and check (no secrets, nothing uploaded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Inputs and settings reach the shell only through the environment, never spliced into a script.
      ONLY: ${{ inputs.only }}
      TRANSLATIONS_BASE_URL: ${{ vars.TRANSLATIONS_BASE_URL }}
      TRANSLATIONS_ORIGIN_URL: ${{ vars.TRANSLATIONS_ORIGIN_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Say what this run will do
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "### Dry run: nothing will be uploaded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Real publish requested: the publish job waits for the environment's approval" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Branch: \`$GITHUB_REF_NAME\`, translations: \`$ONLY\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the inputs and settings
        run: |
          python3 scripts/publish_translations.py check-inputs \
            --only-text="$ONLY" \
            --base-url="$TRANSLATIONS_BASE_URL" \
            ${TRANSLATIONS_ORIGIN_URL:+--origin-url="$TRANSLATIONS_ORIGIN_URL"}
      # A converter or publisher regression stops a publish before anything is built.
      - name: Converter self-test
        run: python3 scripts/build_translation_catalog.py --self-test
      - name: Publish script self-test
        run: python3 scripts/publish_translations.py --self-test
      # The positive control: the converter must still reproduce the five bundled Bibles from eBible's current USFM
      # (the WEB and WEBBE differences are pinned in the converter). If eBible re-releases one of them this fails
      # for a reason that is not the publish: see the runbook before editing the pinned differences.
      - name: Positive control (converter against the five bundled Bibles)
        run: |
          python3 scripts/publish_translations.py fetch-bundled --work-dir "$RUNNER_TEMP/bundled"
          python3 scripts/build_translation_catalog.py --work-dir "$RUNNER_TEMP/bundled" --verify-bundled
      # `--require-cleared` refetches eBible's catalogue and the selected zips, refuses any translation still pending
      # legal review, and `--only` limits the build to the codes asked for. The second build reads the same cached
      # zips and must be byte-identical (a determinism check on THIS runner). The converter takes the codes as separate
      # arguments, so they come from `publish_translations.py codes`, which has validated them: nothing option-shaped
      # and no line break can get through.
      - name: Build, rebuild offline and compare
        run: |
          set -euo pipefail
          CODES_TEXT=$(python3 scripts/publish_translations.py codes --only-text="$ONLY")
          read -r -a CODES <<< "$CODES_TEXT"
          python3 scripts/build_translation_catalog.py --work-dir "$RUNNER_TEMP/work" \
            --out-dir "$RUNNER_TEMP/publish/out" --only "${CODES[@]}" --require-cleared --base-url "$TRANSLATIONS_BASE_URL"
          python3 scripts/build_translation_catalog.py --work-dir "$RUNNER_TEMP/work" \
            --out-dir "$RUNNER_TEMP/rebuild/out" --only "${CODES[@]}" --require-cleared --offline --base-url "$TRANSLATIONS_BASE_URL"
          diff -r "$RUNNER_TEMP/publish/out" "$RUNNER_TEMP/rebuild/out"
          echo "two builds are byte-identical"
      - name: Check the build against its catalogue and print the entries
        run: |
          python3 scripts/publish_translations.py plan --out-dir "$RUNNER_TEMP/publish/out" --only-text="$ONLY" \
            --base-url="$TRANSLATIONS_BASE_URL" --report-dir="$RUNNER_TEMP/publish/report"
      # What A2 embeds in the app is built from THIS artifact (catalog.json, and report/catalog.app.json, the
      # same data with non-ASCII escaped for the repo's ASCII scan).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: translations-release-${{ github.run_id }}
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish to the translations Space
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The protected environment: required reviewer, `main` only. The access key lives here and nowhere else.
    environment: translations-publish
    # Two publishes never run at once (a second waits; it is never cancelled mid-upload).
    concurrency:
      group: publish-translations
      cancel-in-progress: false
    env:
      ONLY: ${{ inputs.only }}
      # Environment-level variables (administrator-controlled) win over the repository-level ones of the same name here.
      TRANSLATIONS_BASE_URL: ${{ vars.TRANSLATIONS_BASE_URL }}
      TRANSLATIONS_ORIGIN_URL: ${{ vars.TRANSLATIONS_ORIGIN_URL }}
      TRANSLATIONS_BUCKET: ${{ vars.TRANSLATIONS_BUCKET }}
      TRANSLATIONS_ENDPOINT: ${{ vars.TRANSLATIONS_ENDPOINT }}
    steps:
      - name: Publish from main only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A real publish runs from main only (this is $GITHUB_REF). Rehearse with dry_run ticked." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: translations-release-${{ github.run_id }}
          path: ${{ runner.temp }}/publish
      - name: Check the inputs and settings
        run: |
          python3 scripts/publish_translations.py check-inputs \
            --only-text="$ONLY" \
            --base-url="$TRANSLATIONS_BASE_URL" \
            --bucket="$TRANSLATIONS_BUCKET" \
            --endpoint="$TRANSLATIONS_ENDPOINT" \
            ${TRANSLATIONS_ORIGIN_URL:+--origin-url="$TRANSLATIONS_ORIGIN_URL"}
      # Re-checks every downloaded file against catalog.json (digest, size, cleared, nothing extra): this job does
      # not trust the build job's word for it.
      # It also refuses when the catalogue's base_url differs from this job's (environment-level) TRANSLATIONS_BASE_URL.
      - name: Re-check the release
        run: |
          python3 scripts/publish_translations.py plan --out-dir "$RUNNER_TEMP/publish/out" --only-text="$ONLY" \
            --base-url="$TRANSLATIONS_BASE_URL" --report-dir="$RUNNER_TEMP/recheck"
      - name: Upload the assets (an existing key is never overwritten)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/publish_translations.py upload --stage assets --out-dir "$RUNNER_TEMP/publish/out" \
            --only-text="$ONLY" --base-url="$TRANSLATIONS_BASE_URL" \
            --bucket="$TRANSLATIONS_BUCKET" --endpoint="$TRANSLATIONS_ENDPOINT"
      - name: Read the assets back from the public URLs
        run: |
          python3 scripts/publish_translations.py verify --stage assets --out-dir "$RUNNER_TEMP/publish/out" \
            --only-text="$ONLY" --base-url="$TRANSLATIONS_BASE_URL" \
            ${TRANSLATIONS_ORIGIN_URL:+--origin-url="$TRANSLATIONS_ORIGIN_URL"}
      - name: Upload the catalogue (last, so it never names a missing file)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/publish_translations.py upload --stage catalogue --out-dir "$RUNNER_TEMP/publish/out" \
            --only-text="$ONLY" --base-url="$TRANSLATIONS_BASE_URL" \
            --bucket="$TRANSLATIONS_BUCKET" --endpoint="$TRANSLATIONS_ENDPOINT"
      - name: Read the catalogue back from the public URLs
        run: |
          python3 scripts/publish_translations.py verify --stage catalogue --out-dir "$RUNNER_TEMP/publish/out" \
            --only-text="$ONLY" --base-url="$TRANSLATIONS_BASE_URL" \
            ${TRANSLATIONS_ORIGIN_URL:+--origin-url="$TRANSLATIONS_ORIGIN_URL"}
