name: wave3 Transcripts data-free failure alert RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: AXPP3 real failed and refused IPC browser RED
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full unchanged-production sibling suite and hostile IPC controls
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          result = subprocess.run([sys.executable,str(root/'scripts/operator_headless.py')],
                                  env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1'},
                                  text=True,capture_output=True,timeout=240)
          print('UNCHANGED_PRODUCTION_AXPP3_RED','EXIT',result.returncode,flush=True)
          print(result.stdout,flush=True)
          print(result.stderr,file=sys.stderr,flush=True)
          for operation in ['generate','save','confirm','discard']:
              modes = ['reject','refused','unknown'] if operation == 'generate' else ['reject','refused']
              for mode in modes:
                  suffix = operation+'/'+mode
                  assert 'FAIL: AXPP3 privacy DOM/'+suffix in result.stdout, suffix
                  assert 'FAIL: AXPP3 privacy channels/'+suffix in result.stdout, suffix
                  assert 'PASS: AXPP3 pending/'+suffix in result.stdout, suffix
                  assert 'PASS: AXPP3 accepted-data control/'+suffix in result.stdout, suffix
                  assert 'PASS: AXPP3 success control/'+suffix in result.stdout, suffix
          assert 'PASS: TR REGEN-4: the refusal reason renders INLINE' in result.stdout
          assert 'PASS: F30: the real PP-GEN predicate rejects brightness delivered through var()' in result.stdout
          assert 'PASS: WKG danger composed/media_danger' in result.stdout
          assert result.returncode != 0, 'actual assertion RED is required'
          sys.exit(result.returncode)
          PY
