name: wave3 background cascade sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: WKH last-rule priority longhand mutants and identical restoration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full siblings actual-site sensitivity and restored proof
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = 'e1bccce3cb43c5efbd96bc1cf472156d064accb7'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines() == ['.github/workflows/ci.yml']
          script = root/'scripts/operator_headless.py'
          original = script.read_bytes()
          dist = root/'implementation/desktop/crates/selahcue-operator/dist'
          def hashes():
              files = sorted(p for p in dist.iterdir() if p.is_file())+[script]
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          initial = hashes()
          print('WKH_CURRENT_SOURCE_COMPONENT_PROOF',source,json.dumps(initial),flush=True)
          selectors = ['.pm-btn-primary:hover','.td-save-cta:hover','.ps-start:hover','.ps-start:disabled, .ps-start[aria-disabled="true"]','.ps-start','.dl-btn-primary:hover','.tb-golive:hover','.timer-start:hover','.pp-generate:hover','.pp-generate[disabled], .pp-generate[aria-busy="true"]','.pp-generate']
          sites = [('dupBg','dupRule'),('mqBg','mqRule'),('wHb','wHoverRule'),('wTdHb','wTdHoverRule'),('wPsHb','wPsHoverRule'),('wPsDisabledBg','wPsDisabledRule'),('wPsBaseBg','wPsBaseRule'),('wDlHb','wDlHoverRule'),('wTbGlHb','wTbGlHoverRule'),('wTsHb','wTsHoverRule'),('wPpGenHb','wPpGenHoverRule'),('wPpGenDisabledBg','wPpGenDisabledRule'),('wPpGenBaseBg','wPpGenBaseRule')]
          def run(label, chosen, expected=()):
              result = subprocess.run([sys.executable,str(script)],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1','SELAHCUE_OPERATOR_DIST':str(chosen)},text=True,capture_output=True,timeout=240)
              print('WKH_MUTATION_CASE',label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              failures = re.findall(r'^FAIL: (.*)$',result.stdout,re.M)
              behavior = [x for x in failures if not re.match(r'\d+ checks ran;',x)]
              if not expected:
                  assert result.returncode == 0 and not failures and '=== 2612 checks, 0 FAIL ===' in result.stdout,(label,failures)
              else:
                  assert result.returncode in (1,4) and behavior,(label,result.returncode,failures)
                  for prefix in expected:
                      assert any(x.startswith(prefix) for x in behavior),(label,prefix,behavior)
                  if label == 'original_last_rule_consumers_actual11':
                      assert len(behavior) == 11 and '=== 2593 checks, 11 FAIL ===' in result.stdout,behavior
                      assert len(re.findall(r'^PASS: WKH ',result.stdout,re.M)) == 47
                  else:
                      assert all(x.startswith(('WKH ','PME-005','TD-012','PSC-005','DLM-001','GO-LIVE-HOVER','TIMER-START-HOVER','PP-GEN')) for x in behavior),behavior
              assert len(re.findall(r'^PASS: WKH browser premise/',result.stdout,re.M)) == 15,label
              for control in ['WKH absent control:','WKH missing control:','AYZVG cached UI replay:','AYETD viewport control:','F30: the real PP-GEN predicate rejects brightness delivered through var()','WKG danger composed/media_danger']:
                  assert 'PASS: '+control in result.stdout,(label,control)
              print('WKH_VERIFIED',label,json.dumps({'summary':re.findall(r'=== \d+ checks, \d+ FAIL ===',result.stdout),'behavioralFailures':behavior,'exit':result.returncode}),flush=True)
          def mutate(before,after):
              text = original.decode()
              assert text.count(before) == 1,(before,text.count(before))
              script.write_text(text.replace(before,after,1))

          try:
              run('baseline',dist)
              with tempfile.TemporaryDirectory(prefix='wkh-sensitive-sites-') as temp:
                  copied = Path(temp)/'dist'
                  shutil.copytree(dist,copied)
                  css = copied/'app.css'
                  css.write_text(css.read_text()+'\n'+'\n'.join(sel+'{--__wkh_unrelated:1;}' for sel in selectors))
                  assert all(hashlib.sha256((copied/p.name).read_bytes()).hexdigest()==initial[str(p.relative_to(root))] for p in dist.iterdir() if p.is_file() and p.name!='app.css')
                  text = original.decode()
                  for var,rule in sites:
                      text,n = re.subn(r'(var '+var+r' = )__cssEffective\([^\n]+, "background"\);',lambda m:m.group(1)+'__cssBg('+rule+');',text)
                      assert n == 1,(var,n)
                  script.write_text(text)
                  run('original_last_rule_consumers_actual11',copied,['PME-005 (premise): the hover rule declares a background','TD-012 (premise): the hover rule declares a background','PSC-005 (premise): the hover rule declares a background','DLM-001 (premise): the hover rule declares a background','GO-LIVE-HOVER (premise): the hover rule declares a background','TIMER-START-HOVER (premise): the hover rule declares a background','PP-GEN (premise): the hover rule declares a background'])
              script.write_bytes(original)
              assert hashes() == initial
              mutate('return rule.style.cssText;',r'return rule.style.cssText.replace(/!\s*important\b/gi, "");')
              run('background_priority_dropped',dist,['WKH background cascade/important-longhand:','WKH background cascade/important-shorthand:','WKH background cascade/priority-longhand-chain:'])
              script.write_bytes(original)
              assert hashes() == initial
              mutate('return _cssEffectiveBackground(rules);','return _cssEffectiveBackground(rules.filter(function(rule) { return !!rule.style.getPropertyValue("background"); }));')
              run('longhand_participation_dropped',dist,['WKH background cascade/earlier-longhand:','WKH background cascade/later-longhand-unsafe:','WKH background cascade/gradient-later-color:','WKH background cascade/later-image-reset:'])
          finally:
              script.write_bytes(original)
              assert hashes() == initial
              print('WKH_IDENTICAL_RESTORATION_PROOF',json.dumps(hashes()),flush=True)
          run('restored',dist)
          print('WKH_BASELINE_THREE_MUTANTS_RESTORED_VERIFIED',flush=True)
          PY
