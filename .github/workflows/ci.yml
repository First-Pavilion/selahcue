name: wave3 ADV Cody case-insensitive nginx variable RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: api (django)
    runs-on: ubuntu-latest
    # Run 41038300286 attempts 1/2 passed 2147 tests in 14:14/14:17, but service,
    # install/check and post-job work exhausted the 15-minute job cap. Keep a bounded
    # 20-minute cap so the unchanged full suite and cleanup can report their result.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation/api
    # Real Postgres + Redis so the suite runs against the engines production uses.
    # tests/test_concurrency_postgres.py SKIPS on SQLite by design (select_for_update
    # is a no-op there), so without these containers the DEC-004 instance-limit race
    # would never actually be exercised anywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selahcue_test
          POSTGRES_USER: selahcue
          POSTGRES_PASSWORD: selahcue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selahcue"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the local dev interpreter. Django 6.1 supports 3.12-3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: implementation/api/pyproject.toml
      - name: Real nginx syntax for shipped, six bypass and quoted or unrelated-set control fixtures
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          export FIXTURE_DIR="$fixture_dir"
          python - <<'PYFIXTURE'
          import ast, os
          from pathlib import Path
          tree = ast.parse(Path("tests/test_nginx_forwarded_proto.py").read_text())
          selected = []
          notes = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id in {"MAP_VARIABLE", "HEADER_LINE", "BYPASS_CASES"} for t in node.targets):
                  selected.append(node)
              if isinstance(node, ast.FunctionDef) and node.name == "_bypass_config":
                  selected.append(node)
              if isinstance(node, ast.FunctionDef) and node.name == "test_guard_accepts_benign_quoted_values_and_real_header":
                  notes = ast.literal_eval(node.decorator_list[0].args[1])
          ns = {}
          exec(compile(ast.Module(body=selected, type_ignores=[]), "fixture-construction-only", "exec"), ns)
          original = Path("../marketing/nginx.conf").read_text()
          fixtures = {"shipped": original}
          fixtures.update({name: ns["_bypass_config"](original, name) for name in ns["BYPASS_CASES"]})
          fixtures.update({f"quoted-positive-{i}": original.replace("server {", f"server {{\n    {note}", 1) for i, note in enumerate(notes)})
          target = Path(os.environ["FIXTURE_DIR"])
          for name, config in fixtures.items():
              (target / (name + ".conf")).write_text(config)
          (target / "override.conf").write_text("set $selahcue_client_proto $http_x_forwarded_proto;\n")
          (target / "names.txt").write_text("\n".join(fixtures) + "\n")
          assert len(fixtures) == 11
          PYFIXTURE
          # Same nginx:alpine input as marketing/Dockerfile; record resolved version/digest.
          docker pull nginx:alpine
          docker image inspect nginx:alpine --format '{{json .RepoDigests}}'
          while IFS= read -r fixture; do
            printf 'events {} http { include /etc/nginx/diagnostic/%s.conf; }\n' "$fixture" > "$fixture_dir/nginx.conf"
            echo "NGINX_SYNTAX fixture=$fixture"
            docker run --rm --add-host api:127.0.0.1 -v "$fixture_dir:/etc/nginx/diagnostic:ro" nginx:alpine nginx -t -c /etc/nginx/diagnostic/nginx.conf
          done < "$fixture_dir/names.txt"
      # The dev extra includes the same PostgreSQL driver for mandatory local deployed-mode
      # startup controls. Retain the existing explicit bound and hosted service setup here.
      - name: Install
        run: pip install -e ".[dev]" "psycopg[binary]>=3.2,<4"
      - name: Django system checks
        run: python manage.py check
      # Migrations here are hand-committed, so a model shipped without one is an easy
      # miss. `--check` has implied `--dry-run` since Django 4.2, so that flag is noise;
      # `--noinput` is load-bearing — without it a field RENAME selects the interactive
      # questioner, which calls input() and dies on a TTY-less runner with an EOFError
      # traceback instead of a readable "migration missing" failure.
      - name: Migrations are committed
        run: python manage.py makemigrations --check --noinput
      - name: Tests
        env:
          SQL_ENGINE: django.db.backends.postgresql
          SQL_DATABASE: selahcue_test
          SQL_USER: selahcue
          SQL_PASSWORD: selahcue
          SQL_HOST: localhost
          SQL_PORT: "5432"
          CACHE_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/2
        run: python -m pytest tests/test_nginx_forwarded_proto.py -q
