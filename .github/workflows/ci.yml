name: wave3 IP privacy raw-key mutation and restoration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: api (django)
    runs-on: ubuntu-latest
    # Run 41038300286 attempts 1/2 passed 2147 tests in 14:14/14:17, but service,
    # install/check and post-job work exhausted the 15-minute job cap. Keep a bounded
    # 20-minute cap so the unchanged full suite and cleanup can report their result.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation/api
    # Real Postgres + Redis so the suite runs against the engines production uses.
    # tests/test_concurrency_postgres.py SKIPS on SQLite by design (select_for_update
    # is a no-op there), so without these containers the DEC-004 instance-limit race
    # would never actually be exercised anywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selahcue_test
          POSTGRES_USER: selahcue
          POSTGRES_PASSWORD: selahcue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selahcue"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the local dev interpreter. Django 6.1 supports 3.12-3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: implementation/api/pyproject.toml
      # The dev extra includes the same PostgreSQL driver for mandatory local deployed-mode
      # startup controls. Retain the existing explicit bound and hosted service setup here.
      - name: Install
        run: pip install -e ".[dev]" "psycopg[binary]>=3.2,<4"
      - name: Django system checks
        run: python manage.py check
      # Migrations here are hand-committed, so a model shipped without one is an easy
      # miss. `--check` has implied `--dry-run` since Django 4.2, so that flag is noise;
      # `--noinput` is load-bearing — without it a field RENAME selects the interactive
      # questioner, which calls input() and dies on a TTY-less runner with an EOFError
      # traceback instead of a readable "migration missing" failure.
      - name: Migrations are committed
        run: python manage.py makemigrations --check --noinput
      - name: Tests
        env:
          SQL_ENGINE: django.db.backends.postgresql
          SQL_DATABASE: selahcue_test
          SQL_USER: selahcue
          SQL_PASSWORD: selahcue
          SQL_HOST: localhost
          SQL_PORT: "5432"
          CACHE_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/2
        run: |
          python - <<'PYCASE'
          import hashlib, json, re, subprocess
          from pathlib import Path
          p = Path("selahcue_api/apps/throttling/services.py")
          original = p.read_bytes()
          expected_original = '1d47b6ad9136f15c4b2ad613a8db5eeb558f532106454ddb17ef644ad6ab36e2'
          expected_mutant = 'bbdd22243184b39b3d76d8808594d56b0172b030126000118419c528b02354e3'
          assert hashlib.sha256(original).hexdigest() == expected_original
          anchor = '    digest = salted_hmac(_IP_BUCKET_KEY_PURPOSE, bucket, algorithm="sha256").hexdigest()\n    return f"ip:v1:{digest}"'
          text = original.decode()
          assert text.count(anchor) == 1
          mutant = text.replace(anchor, '    return bucket  # hosted diagnostic raw-key mutant only').encode()
          assert hashlib.sha256(mutant).hexdigest() == expected_mutant
          full = ["tests/test_throttling.py", "tests/test_throttling_guards.py", "tests/test_throttle_response_headers.py", "tests/test_customer_auth_slice.py::test_while_the_limiter_store_is_down_a_process_local_ceiling_bounds_the_rows"]
          focused = ["tests/test_throttling.py", "-k", "ip_cache_keys_hide_addresses_at_every_real_consumer or ip_cache_identity_is_stable_but_changes_with_source_and_secret or private_ip_keys"]
          def run(phase, selectors):
              print("X1P_MUTATION_PHASE " + phase, flush=True)
              result = subprocess.run(["python", "-m", "pytest", *selectors, "-q"], capture_output=True, text=True)
              print(result.stdout, end="", flush=True)
              print(result.stderr, end="", flush=True)
              print("X1P_MUTATION_EXIT " + phase + "=" + str(result.returncode), flush=True)
              return result
          baseline = run("candidate-green", full)
          assert baseline.returncode == 0, "candidate focused siblings must pass before mutation"
          try:
              p.write_bytes(mutant)
              result = run("raw-key-mutant", focused)
              assert result.returncode == 1
              assert re.search(r"22 failed, 4 passed", result.stdout)
              failures = re.findall(r"^FAILED (.+)$", result.stdout, re.M)
              assert len(failures) == 22
              assert sum("test_ip_cache_keys_hide_addresses_at_every_real_consumer" in x for x in failures) == 20
              assert sum("test_ip_cache_identity_is_stable_but_changes_with_source_and_secret" in x for x in failures) == 2
          finally:
              p.write_bytes(original)
              restored_hash = hashlib.sha256(p.read_bytes()).hexdigest()
              assert restored_hash == expected_original
              print("X1P_RESTORED_SHA256 " + restored_hash, flush=True)
          restored = run("restored-green", full)
          assert restored.returncode == 0
          print("X1P_MUTATION_RECEIPT " + json.dumps({"source": "f1ca57ab27dd0a2b4b35e7dd153ec3cd5c332ba2", "originalSha256": expected_original, "mutantSha256": expected_mutant, "restoredSha256": restored_hash, "mutantFailures": 22, "mutantPositiveControls": 4, "candidateGreen": baseline.returncode == 0, "restoredGreen": restored.returncode == 0}), flush=True)
          PYCASE
