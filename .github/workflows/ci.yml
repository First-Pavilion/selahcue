name: wave3 CSSOM cleanup and viewport RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: AYETD original unsafe cleanup and unpinned caller RED
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Actual caller argument and full real browser siblings
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          caller = subprocess.run([sys.executable,'scripts/test_pipe_safe_launchers.py','OperatorViewport'],text=True,capture_output=True,timeout=60)
          print('AYETD_UNPINNED_CALLER_RED',caller.returncode,flush=True)
          print(caller.stdout,flush=True)
          print(caller.stderr,flush=True)
          assert caller.returncode == 1 and 'FAILED (failures=1)' in caller.stderr and 'AssertionError' in caller.stderr
          browser = subprocess.run([sys.executable,'scripts/operator_headless.py'],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1'},text=True,capture_output=True,timeout=240)
          print('AYETD_ORIGINAL_UNSAFE_RESTORATION_RED',browser.returncode,flush=True)
          print(browser.stdout,flush=True)
          print(browser.stderr,file=sys.stderr,flush=True)
          for name in ['CSSOM-PARSE-03','CSSOM-PARSE-05 first swap','CSSOM-PARSE-05 second swap']:
              assert 'FAIL: AYETD exception cleanup: '+name in browser.stdout,name
              assert 'PASS: AYETD exception premise: '+name in browser.stdout,name
          assert 'PASS: AYETD isolation control:' in browser.stdout
          for control in ['CSSOM-PARSE-03:','CSSOM-PARSE-05:','CSSOM-PARSE-05 (false-red guard):','F30: the real PP-GEN predicate rejects brightness delivered through var()','WKG danger composed/media_danger','AYZVG cached UI replay:']:
              assert 'PASS: '+control in browser.stdout,control
          failures = re.findall(r'^FAIL: (.*)$',browser.stdout,re.M)
          behavior = [item for item in failures if not re.match(r'\d+ checks ran;',item)]
          print('AYETD_ACTUAL_BEHAVIOR_FAILURES',behavior,flush=True)
          assert all(item.startswith('AYETD ') for item in behavior), behavior
          assert browser.returncode != 0
          sys.exit(1)
          PY
