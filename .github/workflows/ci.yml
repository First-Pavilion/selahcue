name: wave3 F31 S2 stronger actual previous-safety tests first
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    name: F31 S2 current versus previous raw helper opening-prefix RED
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Existing pinned browser automation
        run: python3 -m pip install --quiet playwright==1.60.0
      - name: Committed regression block actual CSSOM raw and composed helpers
        run: |
          python3 -u - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          source = '48426ce089d959036729c132edccc334e41abcfb'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines() == ['.github/workflows/ci.yml']
          script = Path('scripts/operator_headless.py')
          original = script.read_bytes()
          module = ast.parse(original)
          nodes = {n.targets[0].id:n.value for n in module.body if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name)}
          driver = ast.literal_eval(nodes['DRIVER'])
          block = driver.split('// F31-RECOVERY-BEGIN',1)[1].split('// F31-RECOVERY-END',1)[0]
          current = eval(compile(ast.Expression(nodes['CSS_SRC']),str(script),'eval'),{'json':json,'os':os,'DIST':'implementation/desktop/crates/selahcue-operator/dist'})
          baseline = ast.parse(subprocess.check_output(['git','show','3f378248046a77fc790ebf998e3569e167a20286:scripts/operator_headless.py'],text=True))
          baseline_css = next(n.value for n in baseline.body if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name) and n.targets[0].id=='CSS_SRC')
          assert ast.dump(nodes['CSS_SRC']) == ast.dump(baseline_css)
          previous = subprocess.check_output(['git','show','71d2cbc9d4638fd58c27e46303e13addabad5f31:scripts/operator_headless.py'],text=True)
          start = '  window.__cssRawBlocks = function(sel, src) {'
          end = '  window.__cssRawHasFilter = function(sel, src) {'
          old_raw = previous[previous.index(start):previous.index(end,previous.index(start))]
          a = current.index(start); b = current.index(end,a)
          old_control = current[:a]+old_raw+current[b:]
          print('F31_REVIEW_SOURCE_PROOF',json.dumps({'source':source,'guardCSS_SRCEqualFrozen3f':True,'previousRawSource':'71d2cbc9d4638fd58c27e46303e13addabad5f31','onlyControlDifference':'actual previous raw-block function inside same actual helper closure','harnessSHA256':hashlib.sha256(original).hexdigest(),'committedBlockSHA256':hashlib.sha256(block.encode()).hexdigest(),'previousRawSHA256':hashlib.sha256(old_raw.encode()).hexdigest()}),flush=True)
          results = {}
          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox'])
              page = browser.new_page(viewport={'width':800,'height':600})
              for label,helpers in [('current',current),('actual_previous_raw',old_control)]:
                  page.set_content('<html><head></head><body>'+helpers+'</body></html>')
                  records = page.evaluate('(block)=>{window.f31reviewRecords=[];window.ok=(pass,name)=>f31reviewRecords.push({pass:!!pass,name});eval(block);return f31reviewRecords}',block)
                  for item in records:
                      print('F31_REVIEW_RECORD',label,'PASS' if item['pass'] else 'FAIL',item['name'],flush=True)
                  assert len(records) == 77,(label,records)
                  assert all(r['pass'] for r in records if r['name'].startswith(('F31 recovery premise/','F31 recovery clean/'))),(label,records)
                  assert all(r['pass'] for r in records if '/balanced_value/' in r['name'] or r['name'].startswith('F31 recovery clean/balanced_value:')),(label,records)
                  results[label] = records
              browser.close()
          current_failures = [r['name'] for r in results['current'] if not r['pass']]
          assert len(current_failures) == 20 and all(r['pass'] for r in results['actual_previous_raw']),results
          assert all(any('/'+prefix+'/' in x for prefix in ['open_paren','open_bracket','open_paren_late_close','open_bracket_late_close','open_quote']) for x in current_failures),current_failures
          for prefix in ['open_paren','open_bracket','open_paren_late_close','open_bracket_late_close','open_quote']:
              for hazard in ['dropped','inactive']:
                  assert any(x.startswith('F31 recovery raw/'+prefix+'/'+hazard+':') for x in current_failures),(prefix,hazard,current_failures)
                  assert any(x.startswith('F31 recovery composed/'+prefix+'/'+hazard+':') for x in current_failures),(prefix,hazard,current_failures)
          assert script.read_bytes() == original
          print('F31_S2_CURRENT_FAILS_PREVIOUS_PASSES_VERIFIED',json.dumps({'source':source,'currentFailures':current_failures,'currentPass':sum(r['pass'] for r in results['current']),'previousPass':sum(r['pass'] for r in results['actual_previous_raw']),'harnessUnchanged':True}),flush=True)
          sys.exit(1)
          PY
