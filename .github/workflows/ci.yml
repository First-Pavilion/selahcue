name: wave3 filter literal pins current evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    name: AYETE pins benign syntax PSC hazard mutants and restoration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Actual checker full browser PSC refusals sensitive mutants restored
        run: |
          python3 - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          root = Path.cwd()
          source = '475158986ec8b44eba5df8edbe02990b31fd552d'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines() == ['.github/workflows/ci.yml']
          script = root/'scripts/operator_headless.py'
          original = script.read_bytes()
          dist = root/'implementation/desktop/crates/selahcue-operator/dist'
          def hashes():
              files = sorted(p for p in dist.iterdir() if p.is_file())+[script]
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          initial = hashes()
          print('AYETE_CURRENT_SOURCE_COMPONENT_PROOF',source,json.dumps(initial),flush=True)
          def guard_namespace(text=None):
              if text is None:
                  text = script.read_text()
              names = {'FILTER_GUARD_SITES','FILTER_GUARD_CALL_RE','_JS_ASSIGN_RE','_extract_driver_js','_strip_js_comments','filter_guard_selector_problems','_filter_guard_negative_controls','check_filter_guard_call_sites_share_one_selector'}
              nodes = [n for n in ast.parse(text).body if (isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name) and n.targets[0].id in names) or (isinstance(n,ast.FunctionDef) and n.name in names)]
              ns = {'re':re,'os':os,'__file__':str(script)}
              exec(compile(ast.Module(body=nodes,type_ignores=[]),str(script),'exec'),ns)
              return text,ns
          def fixture_equivalence():
              old_text = subprocess.check_output(['git','show','53932a47dd2cc5ae42300b3d86d30f5960432965:scripts/operator_headless.py'],text=True)
              _,old = guard_namespace(old_text)
              text,new = guard_namespace()
              driver = new['_extract_driver_js'](text)
              _,accepted = old['_filter_guard_negative_controls'](driver)
              timings = {'old':0.0,'new':0.0}
              for name,case in [('canonical',driver)]+accepted:
                  started = time.monotonic()
                  expected = old['_filter_guard_negative_controls'](case)
                  timings['old'] += time.monotonic()-started
                  started = time.monotonic()
                  actual = new['_filter_guard_negative_controls'](case)
                  timings['new'] += time.monotonic()-started
                  assert actual == expected,name
                  assert len(actual[0]) == 27 and len(actual[1]) == 16
                  print('AYETE_FIXTURE_BYTE_EQUIVALENCE',name,'27invalid16benign',flush=True)
              print('AYETE_FIXTURE_CONSTRUCTION_FINITE_SECONDS',json.dumps(timings),flush=True)
          def matrix(label, unpinned=False):
              text,ns = guard_namespace()
              driver = ns['_extract_driver_js'](text)
              check = ns['filter_guard_selector_problems']
              assert check(driver) == []
              negative,benign = ns['_filter_guard_negative_controls'](driver)
              survivors = [name for name,case in negative if not check(case)]
              assert len(negative) == 27 and len(benign) == 16
              assert all(check(case) for name,case in negative[:12])
              assert all(check(case) for name,case in negative if name.startswith('AYETE alias binding:'))
              assert all(not check(case) for name,case in benign)
              if unpinned:
                  assert len(survivors) == 10 and all(x.startswith(('AYETE existing clean selector:','AYETE stale selector:')) for x in survivors),survivors
              else:
                  assert not survivors and ns['check_filter_guard_call_sites_share_one_selector'](text)
                  for name,case in benign:
                      built = ns['_filter_guard_negative_controls'](case)
                      assert len(built[0]) == 27 and len(built[1]) == 16,name
              print('AYETE_CURRENT_CHECKER_MATRIX',label,json.dumps({'invalid27':len(negative),'benign16Accepted':True,'old12Alias5Refused':True,'survivors':survivors,'benignConstructionVerified':not unpinned}),flush=True)
          def run(label, chosen=dist, mode='green'):
              result = subprocess.run([sys.executable,str(script)],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1','SELAHCUE_OPERATOR_DIST':str(chosen)},text=True,capture_output=True,timeout=240)
              print('AYETE_CURRENT_CASE',label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              failures = re.findall(r'^FAIL: (.*)$',result.stdout,re.M)
              if mode == 'green':
                  assert result.returncode == 0 and not failures and '=== 2612 checks, 0 FAIL ===' in result.stdout,(label,failures)
                  assert 'all 27 deliberately broken driver texts were refused and the 16 harmless one(s) accepted' in result.stdout
              elif mode == 'hazard':
                  assert result.returncode == 1 and len(failures) == 1 and failures[0].startswith('PSC-005: the hover rule carries no `filter` (found none)'),failures
                  assert '=== 2612 checks, 1 FAIL ===' in result.stdout
              else:
                  assert result.returncode == 1 and '=== 2612 checks' not in result.stdout
                  if mode == 'redirect':
                      assert "wPsHoverSel selector literal is '.ps-start', expected '.ps-start:hover'" in result.stdout
                  elif mode == 'unpinned':
                      assert 'ACCEPTED 10 deliberately broken source(s)' in result.stdout
                  elif mode == 'registry':
                      assert "wPsHoverSel selector literal is '.ps-start:hover', expected '.ps-start'" in result.stdout
                  elif mode == 'benign':
                      assert 'FAIL: filter-guard-selector benign control construction' in result.stdout
                      assert 'AYETE single quotes: wTdHoverSel' in result.stdout
                  else:
                      raise AssertionError(mode)
              if mode in ('green','hazard'):
                  for control in ['WKH background cascade/important-longhand:','WKH background cascade/local-var-shorthand:','AYETD viewport control:','AYZVG cached UI replay:','F30: the real PP-GEN predicate rejects brightness delivered through var()','WKG danger composed/media_danger']:
                      assert 'PASS: '+control in result.stdout,(label,control)
              print('AYETE_CURRENT_VERIFIED',label,json.dumps({'mode':mode,'exit':result.returncode,'summaries':re.findall(r'=== \d+ checks, \d+ FAIL ===',result.stdout),'failures':failures}),flush=True)
          def mutate(before,after):
              text = original.decode()
              assert text.count(before) == 1,(before,text.count(before))
              script.write_text(text.replace(before,after,1))

          try:
              fixture_equivalence()
              matrix('baseline')
              run('baseline')
              with tempfile.TemporaryDirectory(prefix='ayete-current-psc-') as temp:
                  copied = Path(temp)/'dist'
                  shutil.copytree(dist,copied)
                  css = copied/'app.css'
                  css.write_text(css.read_text()+'\n.ps-start:hover{filter:brightness(1.06) not-a-real-css-function();}\n')
                  assert all(hashlib.sha256((copied/p.name).read_bytes()).hexdigest()==initial[str(p.relative_to(root))] for p in dist.iterdir() if p.is_file() and p.name!='app.css')
                  run('actual_PSC_hazard',copied,'hazard')
                  mutate('var wPsHoverSel = ".ps-start:hover";','var wPsHoverSel = ".ps-start";')
                  run('redirect_existing_clean_with_same_hazard',copied,'redirect')
              script.write_bytes(original)
              assert hashes() == initial
              mutate('elif bindings[0][1] != selector:','elif False:')
              matrix('literal_validation_removed',True)
              run('literal_validation_removed',mode='unpinned')
              script.write_bytes(original)
              assert hashes() == initial
              mutate('"wPsHoverSel": ("__cssFilterGuardOk", ".ps-start:hover"),','"wPsHoverSel": ("__cssFilterGuardOk", ".ps-start"),')
              run('registry_literal_corrupted',mode='registry')
              script.write_bytes(original)
              assert hashes() == initial
              mutate('matches = list(pattern.finditer(text))', """matches = list(re.finditer(re.escape('var ' + var + ' = "' + selector + '";'), text))""")
              run('exact_quote_fixture_regression',mode='benign')
          finally:
              script.write_bytes(original)
              assert hashes() == initial
              print('AYETE_IDENTICAL_RESTORATION_PROOF',json.dumps(hashes()),flush=True)
          matrix('restored')
          run('restored')
          print('AYETE_BASELINE_PSC_REFUSALS_THREE_MUTANTS_RESTORED_VERIFIED',flush=True)
          PY
