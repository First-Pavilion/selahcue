name: wave3 F31 same source pointer premise observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real_hover:
    name: F31 actual pointer hover five sites and eight forms
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Existing pinned browser automation package
        run: python3 -m pip install --quiet playwright==1.60.0
      - name: Real pointer hover actual shared helpers and clean controls
        run: |
          python3 -u - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          source = '71d2cbc9d4638fd58c27e46303e13addabad5f31'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines() == ['.github/workflows/ci.yml']
          script = Path('scripts/operator_headless.py')
          original = script.read_bytes()
          module = ast.parse(original)
          assignments = {n.targets[0].id:n.value for n in module.body if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name)}
          css_src = eval(compile(ast.Expression(assignments['CSS_SRC']),str(script),'eval'),{'json':json,'os':os,'DIST':'implementation/desktop/crates/selahcue-operator/dist'})
          driver = ast.literal_eval(assignments['DRIVER'])
          forms = json.loads(re.search(r'var f31Forms = (\[[\s\S]*?\]);',driver).group(1))
          sites = ast.literal_eval(assignments['FILTER_GUARD_SITES'])
          assert len(forms) == 8 and len(sites) == 5
          failures = []
          records = []
          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox'])
              page = browser.new_page(viewport={'width':800,'height':600})
              for variable,(function,target) in list(sites.items())[:1]:
                  base = target.removesuffix(':hover')
                  for name,template in forms[:1]:
                      css = target+'{background:#111;}'+template.replace('@B@',base).replace('@T@',target).replace('@D@','filter:brightness(1.06);')
                      page.set_content('<html><head><style>*{transition:none!important;animation:none!important}</style></head><body><div class="__f31_parent__" style="padding:30px"><button id="f31-probe" class="'+base[1:]+'" style="display:block;position:relative;width:160px;height:60px">probe</button></div>'+css_src+'</body></html>')
                      page.evaluate('(css)=>{window.f31fx=__cssFixture(css)}',css)
                      page.evaluate('''()=>{window.f31events=[];for(const type of ['pointerover','pointerout','pointermove','mouseover','mouseout']) document.addEventListener(type,e=>f31events.push({type,target:e.target.id,trusted:e.isTrusted,x:e.clientX,y:e.clientY}),true)}''')
                      page.mouse.move(0,0)
                      print('F31_TRACE_BEFORE',json.dumps(page.evaluate('''()=>({hover:document.getElementById('f31-probe').matches(':hover'),computed:getComputedStyle(document.getElementById('f31-probe')).filter,rect:document.getElementById('f31-probe').getBoundingClientRect().toJSON(),events:f31events})''')),flush=True)
                      page.hover('#f31-probe')
                      value = page.evaluate('([target,functionName])=>({hover:document.getElementById("f31-probe").matches(":hover"),ancestorHover:document.querySelector(".__f31_parent__").matches(":hover"),computed:getComputedStyle(document.getElementById("f31-probe")).filter,cssom:__cssEffectiveFilter(target,f31fx),raw:__cssRawHasFilter(target,f31fx),guard:window[functionName](target,f31fx)})',[target,function])
                      print('F31_TRACE_ORIGINAL_SNAPSHOT',json.dumps(value),flush=True)
                      print('F31_TRACE_AFTER_STYLE',json.dumps(page.evaluate('''()=>({computed:getComputedStyle(document.getElementById('f31-probe')).filter,hover:document.getElementById('f31-probe').matches(':hover'),hovered:Array.from(document.querySelectorAll(':hover')).map(e=>e.id||e.className),events:f31events})''')),flush=True)
                      print('F31_TRACE_AFTER_FRAME',json.dumps(page.evaluate('''async()=>{await new Promise(requestAnimationFrame);return {computed:getComputedStyle(document.getElementById('f31-probe')).filter,hover:document.getElementById('f31-probe').matches(':hover'),events:f31events}}''')),flush=True)
                      page.mouse.move(0,0)
                      print('F31_TRACE_AFTER_AWAY',json.dumps(page.evaluate('''async()=>{await new Promise(requestAnimationFrame);return {computed:getComputedStyle(document.getElementById('f31-probe')).filter,hover:document.getElementById('f31-probe').matches(':hover'),events:f31events}}''')),flush=True)
                      assert value['computed']=='brightness(1.06)',(variable,name,value)
                      print('F31_REAL_HOVER_PREMISE_PASS',variable,name,json.dumps(value),flush=True)
                      records.append((variable,name,value))
                      if value['guard']:
                          failures.append((variable,name))
                          print('FAIL: F31 actual hover guard',variable,name,flush=True)
                      else:
                          print('PASS: F31 actual hover guard',variable,name,flush=True)
                      page.evaluate('f31fx.dispose()')
                  page.evaluate('(css)=>{window.f31fx=__cssFixture(css)}',target+'{background:#111;filter:none;}')
                  clean = page.evaluate('([target,functionName])=>window[functionName](target,f31fx)',[target,function])
                  assert clean,(variable,'clean control')
                  print('F31_REAL_CLEAN_PASS',variable,flush=True)
                  page.evaluate('f31fx.dispose()')
              browser.close()
          assert len(records) == 1
          assert script.read_bytes() == original
          print('F31_REAL_HOVER_ACTUAL_SUMMARY',json.dumps({'actualHoverPremises':len(records),'cleanControls':5,'guardFailures':failures,'harnessSHA256':hashlib.sha256(original).hexdigest()}),flush=True)
          print('F31_OBSERVATION_ONLY_COMPLETE_NO_GUARD_ACCEPTANCE_CLAIM',flush=True)
          PY
