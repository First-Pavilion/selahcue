name: wave3 F31 single CSSOM observable bounded restoration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    name: F31 ${{ matrix.mutant }} mutant and restored full siblings
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mutant: [cssom_exact]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Real mutant then identical source restoration and complete clean driver
        env:
          MUTANT: ${{ matrix.mutant }}
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: |
          python3 -u - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          source = 'b7c3d8156986d482a3a229884f8afb45f484c3a3'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines() == ['.github/workflows/ci.yml']
          script = Path('scripts/operator_headless.py')
          dist = Path('implementation/desktop/crates/selahcue-operator/dist')
          original = script.read_bytes()
          mutant = os.environ['MUTANT']
          def hashes():
              files = sorted(p for p in dist.iterdir() if p.is_file())+[script]
              return {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          initial = hashes()
          assert len(initial) == 17
          for path,digest in initial.items():
              assert hashlib.sha256(subprocess.check_output(['git','show',source+':'+path])).hexdigest() == digest,path
          print('F31_MUTATION_SOURCE_PROOF',source,mutant,json.dumps(initial),flush=True)
          print('F31_LINKED_ACTUAL_BASELINE',json.dumps({'source':source,'run':41186150220,'fullDriver':'2733/0 all121new+2612prior','realPointer':'40trusted geometry/transitions and40guardrefusals,5clean','currentGitBlobsVerified':True}),flush=True)
          def replace_once(text,before,after):
              assert text.count(before) == 1,(before,text.count(before))
              return text.replace(before,after,1)
          def phase_capture(label):
              started = time.monotonic()
              phases = {}
              timed_out = False
              markers = {
                  'startup_d5':'PASS: D5 (ADR-0026)',
                  'selector_check_started':'PASS: filter-guard-selector (17tnw2ayetm)',
                  'selector_controls_complete':'PASS: filter-guard-selector negative controls (17tnw2ayetm)',
                  'launcher_contract_complete':'PASS: headless-launch contract (17tnw2b1f32)',
                  'browser_output_received':'PASS: #7-fix render_console',
                  'complete_browser_summary':'=== 2733 checks,'
              }
              with tempfile.TemporaryDirectory(prefix='f31-phase-output-') as temp:
                  stdout_path = Path(temp)/'stdout.log'
                  stderr_path = Path(temp)/'stderr.log'
                  with stdout_path.open('w') as out, stderr_path.open('w') as err:
                      process = subprocess.Popen([sys.executable,'-u',str(script)],stdout=out,stderr=err)
                      while True:
                          elapsed = time.monotonic()-started
                          current = stdout_path.read_text()
                          for name,marker in markers.items():
                              if name not in phases and marker in current:
                                  phases[name] = elapsed
                                  print('F31_CSSOM_PHASE_OBSERVED',label,name,elapsed,flush=True)
                          if process.poll() is not None:
                              break
                          remaining = 240-elapsed
                          if remaining <= 0:
                              timed_out = True
                              process.kill()
                              process.wait(timeout=10)
                              break
                          try:
                              process.wait(timeout=min(1,remaining))
                          except subprocess.TimeoutExpired:
                              pass
                  result = subprocess.CompletedProcess([sys.executable,'-u',str(script)],process.returncode,stdout_path.read_text(),stderr_path.read_text())
              print('F31_CSSOM_OBSERVED_PHASE_SUMMARY',label,json.dumps({'elapsedSeconds':time.monotonic()-started,'timedOut240':timed_out,'observedMarkers':phases,'stdoutBytes':len(result.stdout.encode()),'stderrBytes':len(result.stderr.encode()),'source':source,'singleProcessOnly':True}),flush=True)
              if timed_out:
                  print('F31_CSSOM_PARTIAL_STDOUT_BEFORE_TIMEOUT',label,flush=True)
                  print(result.stdout,flush=True)
                  print('F31_CSSOM_PARTIAL_STDERR_BEFORE_TIMEOUT',label,flush=True)
                  print(result.stderr,file=sys.stderr,flush=True)
                  raise AssertionError('same240s outer limit reached; partial phase evidence retained, no mutation/restored receipt')
              return result
          def run_case(label,restored=False):
              result = phase_capture(label)
              print('F31_MUTATION_CASE',label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              summaries = re.findall(r'^=== (\d+) checks, (\d+) FAIL ===$',result.stdout,re.M)
              failures = re.findall(r'^FAIL: (.*)$',result.stdout,re.M)
              passes = re.findall(r'^PASS: (.*)$',result.stdout,re.M)
              assert len(summaries) == 1 and summaries[0][0] == '2733',(label,summaries)
              assert sum(x.startswith(('F31 CSSOM premise/','F31 escaped premise/','F31 dropped premise/','F31 condition premise/')) for x in passes) == 32,label
              assert sum(x.startswith('F31 clean/') for x in passes) == 16,label
              assert any(x.startswith('F31 clean boundary:') for x in passes),label
              for old in ['WKH background cascade/important-longhand:','WKH background cascade/local-var-shorthand:','AYETD viewport control:','AYZVG cached UI replay:','F30: the real PP-GEN predicate rejects brightness delivered through var()','WKG danger composed/media_danger']:
                  assert any(x.startswith(old) for x in passes),(label,old)
              if restored:
                  assert result.returncode == 0 and summaries == [('2733','0')] and failures == [],(label,failures)
                  assert sum(x.startswith('F31 ') for x in passes) == 121
              else:
                  assert result.returncode == 1 and failures and all(x.startswith('F31 ') for x in failures),(label,result.returncode,failures)
                  required = {
                      'cssom_exact':['F31 CSSOM candidate/list_first:','F31 escaped CSSOM/list_first:','F31 escaped composed/list_first:','F31 escaped composed/is:','F31 escaped composed/nested:'],
                      'raw_previous':['F31 raw candidate/list_first:','F31 dropped raw/list_first:','F31 dropped composed/list_first:','F31 condition composed/is:','F31 dropped composed/nested:'],
                      'nested_context_removed':['F31 CSSOM candidate/nested:','F31 raw candidate/nested:','F31 composed/nested:','F31 escaped composed/nested_twice:','F31 condition composed/nested_twice:']
                  }[mutant]
                  for prefix in required:
                      assert any(x.startswith(prefix) for x in failures),(label,prefix,failures)
                  independent = {
                      'cssom_exact':['F31 dropped composed/list_first:','F31 condition composed/list_first:'],
                      'raw_previous':['F31 escaped composed/list_first:','F31 CSSOM candidate/is:'],
                      'nested_context_removed':['F31 composed/is:','F31 composed/list_first:']
                  }[mutant]
                  for prefix in independent:
                      assert any(x.startswith(prefix) for x in passes),(label,prefix)
              print('F31_MUTATION_VERIFIED',label,json.dumps({'source':source,'mutant':mutant,'summary':summaries,'exit':result.returncode,'failures':failures,'premises32':True,'clean16AndBoundary':True,'oldSiblingControls':True}),flush=True)

          text = original.decode()
          if mutant == 'cssom_exact':
              changed = replace_once(text,'return _cssFilterCandidate(_cssFilterSelector(rule), sel);','return _cssNormSel(rule.selectorText) === _cssNormSel(sel);')
          elif mutant == 'raw_previous':
              previous = subprocess.check_output(['git','show','71d2cbc9d4638fd58c27e46303e13addabad5f31:scripts/operator_headless.py'],text=True)
              start_marker = '  window.__cssRawBlocks = function(sel, src) {'
              end_marker = '  window.__cssRawHasFilter = function(sel, src) {'
              a = text.index(start_marker); b = text.index(end_marker,a)
              pa = previous.index(start_marker); pb = previous.index(end_marker,pa)
              changed = text[:a]+previous[pa:pb]+text[b:]
          elif mutant == 'nested_context_removed':
              changed = replace_once(text,'function _cssResolveFilterSelector(selector, parent) {\n    if (!parent) return selector;','function _cssResolveFilterSelector(selector, parent) {\n    return selector;')
          else:
              raise AssertionError(mutant)
          ast.parse(changed)
          try:
              script.write_text(changed)
              run_case(mutant)
          finally:
              script.write_bytes(original)
              assert hashes() == initial
              print('F31_IDENTICAL_RESTORATION_BEFORE_FULL',mutant,json.dumps(hashes()),flush=True)
          run_case('restored_'+mutant,True)
          assert hashes() == initial
          print('F31_IDENTICAL_RESTORATION_AFTER_FULL',mutant,json.dumps(hashes()),flush=True)
          print('F31_CURRENT_MUTANT_RESTORED_FULL_SIBLINGS_VERIFIED',mutant,flush=True)
          PY
