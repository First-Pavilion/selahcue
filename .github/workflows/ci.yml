name: wave2 refresh sign-out race focused diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  marketing:
    name: refresh sign-out real store regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: implementation/marketing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: implementation/marketing/package-lock.json
      - run: npm ci
      - run: node --test tests/refreshSignOut.test.ts
