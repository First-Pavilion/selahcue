name: wave3 13Y0 frozen host contract sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator:
    name: operator shell (ubuntu-latest)
    # Cap the job (like launch-smoke) so a wedged Playwright/apt install step fails in minutes,
    # not GitHub's 6h default (audit #11 review).
    #
    # Lowered from 25 to 15 (86akcmzyq CI-timeout remediation, 2026-09-05) when the RELEASE and
    # stt,cloud-stt feature-gate pairs moved out to `operator-native` below -- see that job's
    # own timeout comment for why it moved, not just where. What is LEFT in this job is
    # Format/Check/Clippy/Test plus three cheap feature-flag pairs and the two Linux webview
    # smokes, none of them native-toolchain- or release-codegen-heavy -- true when this was
    # written, no longer true on Windows.
    #
    # RAISED 15 -> 30 (86akgrz3b, Vera's performance review of PR #125). `encryption`/
    # `read-encrypted-transcripts` becoming Cargo default features means `Check`/`Clippy`/`Test`
    # in THIS job now also compile the vendored-OpenSSL build every run, on every OS -- and on
    # Windows that build is `nmake`, one file at a time, genuinely slow. This job ACTUALLY TIMED
    # OUT at 15 minutes on a real run of PR #125 (run 36727646787, attempt 2, job 109935685146:
    # "The job has exceeded the maximum execution time of 15m0s"), with `Check` alone taking
    # 11m3s against a pre-encryption 2m19s baseline on the same job. Vera measured the
    # OpenSSL-build portion of that gap directly (`nmake build_libs`) and projected ~19-20
    # minutes for a fully cold run (no warm `Swatinem/rust-cache` hit) -- which is routine here:
    # this repo's total Actions cache was already at 10.12 GB against GitHub's 10 GB limit during
    # that same PR's run, evicting this very job's Windows caches. 30 minutes keeps real headroom
    # over the cold-run projection without resurrecting the original 25-minute failure mode this
    # job was split to fix -- see `operator-native` below, whose own timeout got the same
    # treatment for the same reason.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/desktop/crates/selahcue-operator
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      # Refuse to gate on a compiler nobody pinned. Same script `make ci` runs, so a
      # divergence between this pipeline and the local gate fails loudly here instead
      # of silently producing a green that means nothing (86ak5rc9c).
      - name: Verify the pinned toolchain is what is running
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sh scripts/check_toolchain.sh
      # `encryption` (86akgrz3b) is now default-on for selahcue-operator too, so Check/Clippy/
      # Test below compile the vendored-OpenSSL build here as well — see the `rust` job's
      # identical pair of steps for the full reasoning; not repeated per-job.
      - name: NASM for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Verify Perl is on PATH for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $p) {
            throw "perl not found on PATH -- see the 'rust' job's identical step for the full " + `
              "reasoning."
          }
          perl -v
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop/crates/selahcue-operator
          # Main saves, pull requests only restore -- see the `rust` job (17tnw2b1f24).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system deps (Tauri v2 webview + ALSA for cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev libxkbcommon-dev \
            libasound2-dev
      - name: Stage Tauri sidecar/resource placeholders (compile-check only)
        # tauri-build validates that the externalBin sidecar (`selahcue-output`) and the NDI
        # resource dll exist at build time. This job COMPILE-checks the operator (it does not
        # bundle the app), so empty placeholders satisfy the existence check — the real sidecar is
        # built in the packaging/release flow. Without this the build script fails on CI
        # ("resource path `binaries/selahcue-output-<triple>` doesn't exist").
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          # CREATE-ONLY. `: > file` truncates, and these names include the
          # owner-supplied NDI dll. That is harmless on an ephemeral runner, but this
          # is the snippet people copy to reproduce CI locally, where truncating a real
          # dll is silent and git-unrecoverable (binaries/ is gitignored). Never make
          # this unconditional. 86ak5rjh7.
          stage() { [ -e "$1" ] || : > "$1"; }
          if [[ "$triple" == *windows* ]]; then
            stage "binaries/selahcue-output-${triple}.exe"
          else
            stage "binaries/selahcue-output-${triple}"
          fi
          stage "binaries/Processing.NDI.Lib.x64.dll"
          echo "staged Tauri placeholders for ${triple}"
      # Three steps, not one `run:` block. As a single block under `bash -e`, a clippy
      # failure aborted before `cargo test` ever ran -- so this job still had exactly
      # the masking the rest of this change removes, while appearing to be covered.
      # From the first GATE step onward, `!cancelled()`, and NO setup step after it.
      # Staging used to sit between Format and Check as a `success()` step, so a
      # formatting failure skipped it and Check/Clippy/Test then ran WITHOUT the
      # placeholders — turning one formatting error into four red steps, three failing
      # for a reason unrelated to the code. In a change about signals that lie, that was
      # one. Setup steps above keep `success()`: if checkout, the toolchain install or
      # the pin assertion fails, every downstream result is meaningless.
      - name: Frozen real-host Rust contract and seven meaningful mutants
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess
          root=pathlib.Path.cwd().parents[3]
          plan=json.loads('[{"name": "reference-field-name", "path": "implementation/desktop/crates/selahcue-operator/src/main.rs", "old": "    chapter: u16,\\n    reference: String,\\n    translation: String,", "new": "    chapter: u16,\\n    #[serde(rename = \\"reference_drift\\")]\\n    reference: String,\\n    translation: String,", "original_sha256": "8f221e7eeb97f3a7418fbf54348018bc5431e7396860181d549f0ddee124de2e", "mutant_sha256": "ebf1ec34469c8b3548373109fe0ad50673f2753b6ad75d6816fcceadf13f7c42"}, {"name": "verse-start", "path": "implementation/desktop/crates/selahcue-operator/src/main.rs", "old": "        verse_start: parsed.verses.map(|r| r.start),", "new": "        verse_start: None,", "original_sha256": "8f221e7eeb97f3a7418fbf54348018bc5431e7396860181d549f0ddee124de2e", "mutant_sha256": "fca05df0011273a99669a293d15495353118527e60983f25fc4315725016f114"}, {"name": "verse-end", "path": "implementation/desktop/crates/selahcue-operator/src/main.rs", "old": "        verse_end: parsed.verses.map(|r| r.end),", "new": "        verse_end: None,", "original_sha256": "8f221e7eeb97f3a7418fbf54348018bc5431e7396860181d549f0ddee124de2e", "mutant_sha256": "8ca0cd241aa7471afd6fc931ad191fcf6733be85472c5c55bd3370cde82d1e2d"}, {"name": "whole-verses", "path": "implementation/desktop/crates/selahcue-operator/src/main.rs", "old": "        verses: ch.verses,", "new": "        verses: Vec::new(),", "original_sha256": "8f221e7eeb97f3a7418fbf54348018bc5431e7396860181d549f0ddee124de2e", "mutant_sha256": "fa3665e1aa6baeeeda9beb0ce435034ee8ec015c95cfed0127f572f1f5673f56"}, {"name": "previous-chapter", "path": "implementation/desktop/crates/selahcue-operator/src/main.rs", "old": "        prev: selahcue_scripture::adjacent_chapter_in(t, &parsed, false),", "new": "        prev: None,", "original_sha256": "8f221e7eeb97f3a7418fbf54348018bc5431e7396860181d549f0ddee124de2e", "mutant_sha256": "be41b00672f19c07e048ae416cfb88107cd23a4e06df3464db49fda100dff100"}, {"name": "next-chapter", "path": "implementation/desktop/crates/selahcue-operator/src/main.rs", "old": "        next: selahcue_scripture::adjacent_chapter_in(t, &parsed, true),", "new": "        next: None,", "original_sha256": "8f221e7eeb97f3a7418fbf54348018bc5431e7396860181d549f0ddee124de2e", "mutant_sha256": "5f7c848b322cff9cee9a54252364962c361663b45f79df459b90be65963d4568"}, {"name": "actual-error-wording", "path": "implementation/desktop/crates/selahcue-operator/src/main.rs", "old": "        .ok_or_else(|| format!(\\"no such chapter: {reference}\\"))?;", "new": "        .ok_or_else(|| format!(\\"chapter unavailable: {reference}\\"))?;", "original_sha256": "8f221e7eeb97f3a7418fbf54348018bc5431e7396860181d549f0ddee124de2e", "mutant_sha256": "20268889af487adcffdf59931e8824c8fb6392a659584246424183db9e14038f"}]')
          stable=json.loads('{"implementation/desktop/crates/selahcue-operator/fixtures/get_chapter/host-replies.json": "779143e1a1bddc1d186b5f105df97ffd430fba7adf6035bc55a6d3f272fe9e2d", "implementation/desktop/crates/selahcue-operator/src/chapter_reply_contract_tests.rs": "67ebcc5df01a35746cb48d4243143a0d3ac7742458059713cc74807a8a3025f8"}')
          command=['cargo','test','--locked','chapter','--','--nocapture']
          def verify_stable():
              for name,digest in stable.items():
                  assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          
          def run(label, mutant=False):
              verify_stable()
              result=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              print(result.stdout,flush=True)
              summaries=re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;',result.stdout)
              assert summaries, f'{label}: no actual executed summary; compile/setup is not sensitivity'
              passed,failed,ignored=map(int,summaries[-1])
              if mutant:
                  assert result.returncode!=0 and failed>0, f'{label}: mutant survived'
                  assert 'chapter_reply_contract_tests::y0_command_serialization_matches_recorded_fixtures ... FAILED' in result.stdout, f'{label}: frozen new contract did not detect drift'
              else:
                  assert result.returncode==0 and failed==0, f'{label}: genuine baseline/restoration failure'
              print(f'Y0_BACKEND_RESULT label={label} passed={passed} failed={failed} ignored={ignored}',flush=True)
          run('candidate-baseline')
          for mutation in plan:
              path=root/mutation['path'];original=path.read_bytes()
              assert hashlib.sha256(original).hexdigest()==mutation['original_sha256']
              text=original.decode();assert text.count(mutation['old'])==1
              changed=text.replace(mutation['old'],mutation['new']).encode()
              assert hashlib.sha256(changed).hexdigest()==mutation['mutant_sha256']
              try:
                  path.write_bytes(changed)
                  print('Y0_BACKEND_MUTANT '+mutation['name']+' SHA256='+mutation['mutant_sha256'],flush=True)
                  run(mutation['name'],True)
              finally:
                  path.write_bytes(original)
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==mutation['original_sha256']
                  verify_stable()
                  print('Y0_BACKEND_RESTORED '+mutation['name']+' SHA256='+mutation['original_sha256'],flush=True)
          run('exact-restoration')
          PY
