name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wave3-cpm-profiles-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pairing-profiles:
    name: CPM actual profiles five mutants and restoration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7180632cf540a0f8b65637285b9d6f1ada565f5c
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: clippy,rustfmt
      - name: Verify pinned toolchain
        run: sh scripts/check_toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop
          save-if: false
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers libdbus-1-dev
      - name: Real debug release host captures five mutants exact restore
        shell: bash
        run: |
          python3 - <<'PYRUN'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess
          
          root = pathlib.Path.cwd()
          source = '7180632cf540a0f8b65637285b9d6f1ada565f5c'
          expected = {'implementation/desktop/crates/selahcue-desktop/src/main.rs': '5e911d42471788819acb01e6b2896c12e71d2bb8f57f9d076c4b002a4133b1ee', 'implementation/desktop/crates/selahcue-desktop/src/pairing_output_tests.rs': '27dfbdcd5b1f0ee856b4643a37019987fffeefb446b87f396cba1f8ca4138b03', 'implementation/desktop/crates/selahcue-desktop/Cargo.toml': 'ab36fbb0603fb5b1aac3ef0fc8b48277cdee65cd5f67b775a99cb9833c6663e8', 'implementation/desktop/Cargo.toml': '08d549e5c3604fc410eb47b885ce7432f0b7b2c54f8e58b4f992c6e3f7fbdbe3', 'implementation/desktop/Cargo.lock': '316431e3b829a384d7cd725b9c8f1c0d4c78110c2f9906ee81c9d2f16d6f3194', 'rust-toolchain.toml': 'e77adf550cc0c3d981779b72639180f105506ebbe5aba0db0d928be731d45f4c', 'implementation/desktop/crates/selahcue-lan/tests/test_protocol.rs': '2d8a069735c9e360276775c8ba09d59fe5c7dd8f3620998a973169220d2697f7', 'implementation/mobile/selahcue_controller/test/models/protocol_test.dart': '0eb2171cc7b53fd173da52dea4b634c0b5e1def04d7b8e1fe48c566e580b796f', 'docs/delivery/goals/17tnw2b9cpm-pairing-release-output.md': 'cd4a73143856e50b44182e0fe28fbdfacb4e3bdc5c9db4b715595b75f6044790'}
          mutants = [{'name': 'unconditional-release-disclosure', 'profile': 'release', 'needle': '    if !cfg!(debug_assertions) {\n        println!(\n            "  PAIRING MODE (2 minutes) — scan the QR on the stage/confidence window; \\\n             press P again to cancel."\n        );\n        return;\n    }\n', 'replacement': '', 'failure': 'release stdout exposed the real pairing code', 'trace': 'debug=false codes_stdout=2 invites_stdout=2 codes_stderr=0 invites_stderr=0', 'sha256': 'bd71c283f56082a113f57917fd3de898ac3cdd40d352dac3f4dece458b73ccbf'}, {'name': 'release-code-on-stderr', 'profile': 'release', 'needle': '    if !cfg!(debug_assertions) {\n        println!(\n            "  PAIRING MODE (2 minutes) — scan the QR on the stage/confidence window; \\\n             press P again to cancel."\n        );\n        return;\n    }\n', 'replacement': '    if !cfg!(debug_assertions) {\n        eprintln!("{code}");\n        println!(\n            "  PAIRING MODE (2 minutes) — scan the QR on the stage/confidence window; \\\n             press P again to cancel."\n        );\n        return;\n    }\n', 'failure': 'pairing code reached stderr', 'trace': 'debug=false codes_stdout=0 invites_stdout=0 codes_stderr=2 invites_stderr=0', 'sha256': '133025cf06627a2e2a28447a93eda66726f228c7411c51cca8a86c098f3d5371'}, {'name': 'release-redacted-invite-link', 'profile': 'release', 'needle': '    if !cfg!(debug_assertions) {\n        println!(\n            "  PAIRING MODE (2 minutes) — scan the QR on the stage/confidence window; \\\n             press P again to cancel."\n        );\n        return;\n    }\n', 'replacement': '    if !cfg!(debug_assertions) {\n        println!("{}", uri.replace(code, "[redacted]"));\n        println!(\n            "  PAIRING MODE (2 minutes) — scan the QR on the stage/confidence window; \\\n             press P again to cancel."\n        );\n        return;\n    }\n', 'failure': 'release stdout exposed an invite link', 'trace': 'debug=false codes_stdout=0 invites_stdout=0 codes_stderr=0 invites_stderr=0', 'sha256': '5250b2aa008b96dab5a45a30e4b0d5489133f88462207bcc3a57cd8d80b8d75c'}, {'name': 'debug-developer-print-suppressed', 'profile': 'debug', 'needle': '    if !cfg!(debug_assertions) {\n        println!(\n            "  PAIRING MODE (2 minutes) — scan the QR on the stage/confidence window; \\\n             press P again to cancel."\n        );\n        return;\n    }\n', 'replacement': '    if true {\n        println!(\n            "  PAIRING MODE (2 minutes) — scan the QR on the stage/confidence window; \\\n             press P again to cancel."\n        );\n        return;\n    }\n', 'failure': 'debug lost the real developer code', 'trace': 'debug=true codes_stdout=0 invites_stdout=0 codes_stderr=0 invites_stderr=0', 'sha256': '3bf7e87a78015c1d1b65b642ebda9ace22264d210d73241c83829e115d47cf79'}, {'name': 'release-pairing-notice-suppressed', 'profile': 'release', 'needle': '    if !cfg!(debug_assertions) {\n        println!(\n            "  PAIRING MODE (2 minutes) — scan the QR on the stage/confidence window; \\\n             press P again to cancel."\n        );\n        return;\n    }\n', 'replacement': '    if !cfg!(debug_assertions) {\n        return;\n    }\n', 'failure': 'release lost pairing-on confirmation', 'trace': 'debug=false codes_stdout=0 invites_stdout=0 codes_stderr=0 invites_stderr=0', 'sha256': 'c429182d61fc1154aa9a0482607bec31a634f747c7414c779944623f3fd0510f'}]
          main_path = root/'implementation/desktop/crates/selahcue-desktop/src/main.rs'
          original = main_path.read_bytes()
          results = []
          
          def hashes():
              return {p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in expected}
          
          def audit(label):
              actual = hashes()
              print('CPM_COMPONENT_AUDIT',label,json.dumps(actual,sort_keys=True),flush=True)
              assert actual == expected,label
          
          def run(label, profile, failure=None, trace=None, full=False):
              command = ['cargo','test','--locked','-p','selahcue-desktop','--bin','selahcue-output']
              if profile == 'release': command.append('--release')
              if not full: command.append('pairing_output_tests')
              command += ['--','--nocapture']
              result = subprocess.run(command,cwd=root/'implementation/desktop',stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1050)
              text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',result.stdout)
              print('CPM_ACTUAL_PHASE_START',label,flush=True)
              print(result.stdout,flush=True)
              if failure is None:
                  assert result.returncode == 0,label
                  assert 'CPM_PROFILE_CAPTURE_OK debug='+str(profile=='debug').lower() in text,label
                  required = 'debug=true codes_stdout=2 invites_stdout=2 codes_stderr=0 invites_stderr=0' if profile=='debug' else 'debug=false codes_stdout=0 invites_stdout=0 codes_stderr=0 invites_stderr=0'
                  assert required in text,label
                  assert 'test result: ok.' in text,label
              else:
                  assert result.returncode == 101,label
                  assert failure in text,label
                  assert 'pairing_output_tests::real_host_pairing_output_respects_actual_build_profile ... FAILED' in text,label
                  assert re.search(r'test result: FAILED\. 0 passed; 1 failed; 1 ignored;',text),label
                  assert trace in text,label
                  assert 'error[E' not in text,label
              record = {'label':label,'profile':profile,'exit':result.returncode,'expectedFailure':failure,'summaries':re.findall(r'test result: (?:ok|FAILED)\. [^\n]+',text)}
              results.append(record)
              print('CPM_ACTUAL_VERIFIED',json.dumps(record,sort_keys=True),flush=True)
          
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == source
          audit('initial')
          try:
              run('baseline-debug-full','debug',full=True)
              run('baseline-release-full','release',full=True)
              for mutant in mutants:
                  audit('before-'+mutant['name'])
                  text = original.decode()
                  assert text.count(mutant['needle']) == 1
                  changed = text.replace(mutant['needle'],mutant['replacement'],1).encode()
                  assert hashlib.sha256(changed).hexdigest() == mutant['sha256']
                  main_path.write_bytes(changed)
                  print('CPM_MUTANT_SOURCE',mutant['name'],mutant['sha256'],flush=True)
                  try:
                      run(mutant['name'],mutant['profile'],mutant['failure'],mutant['trace'])
                  finally:
                      main_path.write_bytes(original)
                      audit('restored-'+mutant['name'])
              run('restored-debug-full','debug',full=True)
              run('restored-release-full','release',full=True)
          finally:
              main_path.write_bytes(original)
              audit('final')
          print('CPM_COMPLETE_ACTUAL_RESULTS',json.dumps(results,sort_keys=True),flush=True)
          PYRUN
