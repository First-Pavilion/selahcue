name: wave2 raw filter property value and condition sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: WKG full baseline harmless old disabled condition restored
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full siblings with raw primitive mutants and byte-identical restoration
        run: |
          python3 - <<'PY'
          import ast
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root/'implementation/desktop/crates/selahcue-operator/dist'
          driver = root/'scripts/operator_headless.py'
          original = driver.read_text()
          expected = [n.value.value for n in ast.parse(original).body
                      if isinstance(n,ast.Assign) and isinstance(n.value,ast.Constant)
                      and any(isinstance(t,ast.Name) and t.id == 'EXPECTED_MIN_CHECKS' for t in n.targets)][-1]
          assert expected == 2464
          sites = ['TD-012: the hover rule carries no `filter`',
                   'PSC-005: the hover rule carries no `filter`',
                   'GO-LIVE-HOVER: the hover rule carries no `filter`',
                   'TIMER-START-HOVER: the hover rule carries no `filter`',
                   'PP-GEN: .pp-generate:hover does NOT use filter:brightness()']
          selectors = ['.td-save-cta:hover','.ps-start:hover','.tb-golive:hover','.timer-start:hover','.pp-generate:hover']
          env = {**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1','PYTHONPATH':str(root/'scripts')}

          def run(label,harness=driver,dist=source):
              result = subprocess.run([sys.executable,str(harness)],
                                      env={**env,'SELAHCUE_OPERATOR_DIST':str(dist)},
                                      text=True,capture_output=True,timeout=180)
              print(label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              return result

          def clean(result):
              assert result.returncode == 0 and f'=== {expected} checks, 0 FAIL ===' in result.stdout

          def shared(result):
              assert 'PASS: F30: the real PP-GEN predicate rejects brightness delivered through var()' in result.stdout
              assert 'PASS: WKG premise backdrop: the browser applies the distinct backdrop property' in result.stdout
              assert 'PASS: WKG premise danger/media_danger' in result.stdout
              assert 'PASS: WKG premise danger/supports_danger' in result.stdout

          clean(run('BASELINE'))
          with tempfile.TemporaryDirectory(prefix='selahcue-wkg-mutants-') as temp:
              copied = Path(temp)/'dist'
              shutil.copytree(source,copied)
              harness = Path(temp)/'operator_headless.py'
              repo_anchor = '_REPO = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))'
              assert original.count(repo_anchor) == 1
              prepared = original.replace(repo_anchor,'_REPO = '+repr(str(root)),1)
              start = prepared.index('  window.__cssRawHasFilter = function(sel, src) {')
              end = prepared.index('  // The filter the browser',start)
              fixed = prepared[start:end]
              assert prepared.count(fixed) == 1
              old = r'''  window.__cssRawHasFilter = function(sel, src) {
              return window.__cssRawBlocks(sel, src).some(function(body) { return /filter\s*:/i.test(body); });
            };
          '''
              harness.write_text(prepared.replace(fixed,old,1))
              regression = run('EXACT_OLD_PRIMITIVE_MUTANT',harness,copied)
              shared(regression)
              assert regression.returncode == 1 and f'=== {expected} checks, 18 FAIL ===' in regression.stdout
              for shape in ['none','priority','vendor_none','backdrop','vendor_backdrop','custom','earlier_none','media_none','supports_none']:
                  assert 'PASS: WKG premise clean/'+shape in regression.stdout
                  assert 'FAIL: WKG clean raw/'+shape in regression.stdout
                  assert 'FAIL: WKG clean composed/'+shape in regression.stdout
              assert 'PASS: WKG danger composed/media_danger' in regression.stdout
              assert 'PASS: WKG danger composed/adjacent_after_none' in regression.stdout
              disabled = '  window.__cssRawHasFilter = function(sel, src) { return false; };\n'
              harness.write_text(prepared.replace(fixed,disabled,1))
              missing = run('RAW_DISABLED_MUTANT',harness,copied)
              shared(missing)
              assert missing.returncode == 1 and re.search(rf'=== {expected} checks, [1-9][0-9]* FAIL ===',missing.stdout)
              for shape in ['dropped','vendor_dropped','other_vendor','media_danger','supports_danger','adjacent_after_none','adjacent_before_none','compound_none','empty','middle_dropped']:
                  assert 'FAIL: WKG danger raw/'+shape in missing.stdout
                  assert 'FAIL: WKG danger composed/'+shape in missing.stdout
              assert 'PASS: WKG clean composed/none' in missing.stdout
              assert 'PASS: WKG clean composed/backdrop' in missing.stdout
              assert 'FAIL: CSSOM-PARSE-06: __cssFilterGuardOk' in missing.stdout
              harness.write_text(prepared)
              css = copied/'app.css'
              original_css = css.read_bytes()
              source_css = original_css.decode()
              harmless_rules = []
              for selector in selectors:
                  matches = list(re.finditer(re.escape(selector)+r'\s*\{([^}]*)\}',source_css,re.I))
                  assert len(matches) == 1
                  body = matches[0].group(1)
                  assert re.search(r'\bbackground\s*:',body)
                  harmless_rules.append(selector+'{'+body+';filter:none;backdrop-filter:brightness(1.06);}')
              css.write_bytes(original_css+b'\n'+'\n'.join(harmless_rules).encode()+b'\n')
              harmless = run('FIVE_ACTUAL_SITES_HARMLESS_CSS_GREEN',harness,copied)
              clean(harmless)
              for site in sites:
                  assert 'PASS: '+site in harmless.stdout
              css.write_bytes(original_css+b'\n@media(max-width:1px){'+''.join(s+'{filter:brightness(1.06) not-a-real-css-function();}' for s in selectors).encode()+b'}\n')
              condition = run('FIVE_ACTUAL_SITES_NONMATCHING_DANGER_CSS',harness,copied)
              shared(condition)
              assert condition.returncode == 1 and f'=== {expected} checks, 5 FAIL ===' in condition.stdout
              for site in sites:
                  assert 'FAIL: '+site in condition.stdout
              for prefix in ['TD-012 (premise)','PSC-005 (premise)','GO-LIVE-HOVER (premise)','TIMER-START-HOVER (premise)','PP-GEN (premise)']:
                  assert 'PASS: '+prefix+': the hover rule declares a background' in condition.stdout
              assert 'PASS: WKG clean composed/media_none' in condition.stdout
              assert 'PASS: WKG danger composed/media_danger' in condition.stdout
              css.write_bytes(original_css)
              source_files = {str(p.relative_to(source)):hashlib.sha256(p.read_bytes()).hexdigest()
                              for p in source.rglob('*') if p.is_file()}
              restored_files = {str(p.relative_to(copied)):hashlib.sha256(p.read_bytes()).hexdigest()
                                for p in copied.rglob('*') if p.is_file()}
              assert source_files == restored_files and len(source_files) == 16
              assert harness.read_text() == prepared
              assert prepared.replace('_REPO = '+repr(str(root)),repo_anchor,1) == original
              print('RESTORED_DIST_IDENTICAL',len(source_files),'files',source_files,flush=True)
              print('RESTORED_HARNESS_IDENTICAL_EXCEPT_EXPLICIT_REPO_PATH',hashlib.sha256(original.encode()).hexdigest(),flush=True)
              clean(run('RESTORED',harness,copied))
          assert driver.read_text() == original
          print('MUTATION_VERIFIED: full baseline and harmless sites GREEN; old primitive/raw-disabled/real condition RED; complete restoration GREEN',flush=True)
          PY
