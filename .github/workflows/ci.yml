name: wave3 DNV standalone TLS GREEN and policy sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stt-redirects:
    name: standalone STT download gates and sensitivity (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation/desktop/crates/selahcue-stt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: clippy, rustfmt
      - name: Verify pinned compiler
        working-directory: ${{ github.workspace }}
        run: sh scripts/check_toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop/crates/selahcue-stt
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Standalone formatting
        run: cargo fmt --check
      - name: Full standalone default tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast
      - name: Strict standalone default clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Full standalone download tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --features download --no-fail-fast
      - name: Strict standalone download clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets --features download -- -D warnings
      - name: Genuine policy mutants and exact full restored suites
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYDNV'
          import hashlib, json, re, subprocess
          from pathlib import Path
          variants = {'https-only-removed': {'anchor': '.https_only(true)', 'replacement': '.https_only(false)', 'filter': 'model_fetch::', 'failures': ['model_fetch::redirect_tests::dnv_https_301_to_http_is_never_requested', 'model_fetch::redirect_tests::dnv_https_302_to_http_is_never_requested', 'model_fetch::redirect_tests::dnv_https_303_to_http_is_never_requested', 'model_fetch::redirect_tests::dnv_https_307_to_http_is_never_requested', 'model_fetch::redirect_tests::dnv_https_308_to_http_is_never_requested', 'model_fetch::redirect_tests::dnv_later_tls_hop_cannot_downgrade_to_http', 'model_fetch::redirect_tests::dnv_plain_http_first_request_is_refused_before_send'], 'positive': 19, 'mutantSha256': '8621ad51ba6ec1834cb3a0d0a9487bccff37f2e725d93ae39ea82459c752b6b3'}, 'broader-hop-bound': {'anchor': 'const DL_MAX_REDIRECTS: u32 = 5;', 'replacement': 'const DL_MAX_REDIRECTS: u32 = 10;', 'filter': 'model_fetch::', 'failures': ['model_fetch::redirect_tests::dnv_tls_redirect_loop_stops_at_five_hops'], 'positive': 25, 'mutantSha256': '1aabc742298555cc15319bcae5ab6d543c3b9989cf8d37fbb0b388a4cc2f30d7'}, 'legitimate-redirects-disabled': {'anchor': 'const DL_MAX_REDIRECTS: u32 = 5;', 'replacement': 'const DL_MAX_REDIRECTS: u32 = 0;', 'filter': 'model_fetch::redirect_tests::dnv_exactly_five_legitimate_tls_redirects_install_verified_bytes', 'failures': ['model_fetch::redirect_tests::dnv_exactly_five_legitimate_tls_redirects_install_verified_bytes'], 'positive': 0, 'mutantSha256': '0cc123b51ef419d281ebc04d736bae7f385ebea3e68b5897e7fd886fa8c5f3b4'}}
          expected = 'c875da16be9e0c0e4b1918c7be4acd8f1c2c7c1ed55c93823d493a971b09d834'
          
          path = Path("src/model_fetch.rs")
          original = path.read_bytes()
          assert hashlib.sha256(original).hexdigest() == expected
          fixed_tests = [Path("src/model_fetch/redirect_tests.rs"), Path("src/engine.rs"), Path("Cargo.lock")]
          fixed_tests += sorted(Path("tests").rglob("*.rs"))
          hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in fixed_tests}
          test_anchor = "#[cfg(test)]\nmod tests {"
          old_test_tail = original.decode().split(test_anchor, 1)[1]
          def unchanged():
              assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest() == digest for p, digest in hashes.items())
              assert path.read_text().split(test_anchor, 1)[1] == old_test_tail
          
          def run(label, command, failures=None, positive=None):
              print("DNV_PHASE " + label, flush=True)
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, end="", flush=True)
              print(result.stderr, end="", flush=True)
              print("DNV_EXIT " + label + "=" + str(result.returncode), flush=True)
              failed = set(re.findall(r"^test (\S+) \.\.\. FAILED$", result.stdout, flags=re.M))
              summaries = re.findall(r"test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored", result.stdout)
              assert summaries, "No executed tests: setup/compile failure is not behavioral evidence"
              if failures is None:
                  assert result.returncode == 0 and not failed and all(int(row[1]) == 0 for row in summaries), (label, failed)
              else:
                  assert result.returncode == 101 and failed == set(failures), (label, failed, failures)
                  assert len(summaries) == 1 and tuple(map(int, summaries[0])) == (positive, len(failures), 0), (label, summaries)
              unchanged()
              return {"phase": label, "exit": result.returncode, "summaries": summaries, "failed": sorted(failed)}
          selected = ["cargo", "test", "--locked", "--features", "download", "--lib", "model_fetch::", "--", "--nocapture"]
          receipt = {"baseline": run("selected-baseline", selected), "mutants": [], "restored": []}
          for name, v in variants.items():
              try:
                  assert path.read_bytes() == original
                  text = original.decode()
                  assert text.count(v["anchor"]) == 1
                  mutant = text.replace(v["anchor"], v["replacement"]).encode()
                  assert hashlib.sha256(mutant).hexdigest() == v["mutantSha256"]
                  path.write_bytes(mutant)
                  command = ["cargo", "test", "--locked", "--features", "download", "--lib", v["filter"], "--", "--nocapture"]
                  outcome = run(name, command, v["failures"], v["positive"])
                  receipt["mutants"].append({**outcome, "mutantSha256": v["mutantSha256"]})
              finally:
                  path.write_bytes(original)
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
                  unchanged()
                  print("DNV_EXACT_RESTORATION " + name + " " + expected, flush=True)
          for name, command in [
              ("restored-default", ["cargo", "test", "--locked", "--no-fail-fast"]),
              ("restored-download", ["cargo", "test", "--locked", "--features", "download", "--no-fail-fast"]),
          ]: receipt["restored"].append(run(name, command))
          assert path.read_bytes() == original
          subprocess.run(["git", "diff", "--exit-code"], check=True)
          print("DNV_MUTATION_RECEIPT " + json.dumps(receipt, sort_keys=True), flush=True)
          PYDNV
