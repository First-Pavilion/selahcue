# SelahCue CI — per-OS matrix + GPU parity + Flutter + dependency audit.
#
# Hosting: GitHub (user decision, 2026-07-24) — the free tier runs the full
# Linux/macOS/Windows matrix this project's acceptance requires (GitLab Free has
# no macOS runners; a .gitlab-ci.yml variant lives in git history if ever needed).
#
# Local parity: `make ci` runs the same gates on a developer machine.
#
# GPU matrix note: the ADR-0015 parity tests (CPU rasterizer vs wgpu compositor,
# SSIM >= 0.99) run wherever a GPU adapter exists and SKIP gracefully otherwise:
#   - macOS runners: Metal
#   - Ubuntu runners: Mesa software Vulkan (lavapipe, installed below)
#   - Windows runners: DX12/WARP where available
name: ci

# Docs-only changes skip the matrix (saves runner minutes; docs carry no code to
# verify). A `changes` job (below) further gates the desktop vs mobile jobs by
# path, so a single-side commit doesn't pay for the other side (macOS bills 10x).
# NOTE: this gates DOWNSTREAM jobs with `if:`, so a skipped required check would
# DEADLOCK a PR. It is safe only because this repo pushes to main with no branch
# protection. Before enabling required status checks, add a single aggregator
# job (`needs:` all jobs; passes if each result is success OR skipped) and
# require THAT, not the individual matrix jobs (task 86ajq0569).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "TODO"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "TODO"

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never a main run — every main commit keeps a
  # real pass/fail verdict (revert/bisect/audit trails need it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which side of the repo changed. Most commits touch only the desktop OR only
  # the mobile side, so the other side's jobs are pure waste — and macOS runners
  # bill at 10x minutes, Windows at 2x. Each filter also matches this workflow so
  # a CI change re-runs everything. (Docs-only changes are already skipped at the
  # trigger's paths-ignore.) This is the cheap fan-out gate for the costly jobs.
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
      android: ${{ steps.filter.outputs.android }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'implementation/desktop/**'
              # Shared build/NFR tooling the desktop jobs invoke (make nfr, the
              # NFR proxy script) — a change here must re-run the desktop matrix.
              - 'Makefile'
              - 'scripts/**'
              # Catch-all for any OTHER top-level code area (e.g. implementation/web)
              # so a change there is never silently unverified. Add a dedicated
              # filter + job if such an area grows its own build.
              - 'implementation/web/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'implementation/mobile/**'
              - '.github/workflows/ci.yml'
            android:
              - 'implementation/mobile/selahcue_controller/android/**'
              - 'implementation/mobile/selahcue_controller/lib/controllers/discovery_controller.dart'
              - 'implementation/mobile/selahcue_controller/lib/models/multicast_lock.dart'
              # A Flutter/plugin dep bump can change the Android build too.
              - 'implementation/mobile/selahcue_controller/pubspec.yaml'
              - 'implementation/mobile/selahcue_controller/pubspec.lock'
              - '.github/workflows/ci.yml'
            # The Django Platform API. Before this filter existed, implementation/api
            # matched NO filter at all — neither desktop nor mobile — so an API-only
            # push triggered the workflow and then ran nothing.
            api:
              - 'implementation/api/**'
              - '.github/workflows/ci.yml'

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementation/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop
      - name: Linux system deps (winit/wgpu + software Vulkan for GPU parity)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libvulkan1 mesa-vulkan-drivers libdbus-1-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (server features)
        run: |
          cargo clippy -p selahcue-lan --features server --all-targets -- -D warnings
          cargo clippy -p selahcue-app --features server --all-targets -- -D warnings
          cargo clippy -p selahcue-scripture --features download --all-targets -- -D warnings
      - name: Test (workspace, incl. GPU parity where an adapter exists)
        run: cargo test --workspace
      - name: Test (LAN server + app server features — E2E over real TLS)
        run: |
          cargo test -p selahcue-lan --features server
          cargo test -p selahcue-app --features server
      - name: Test (scripture download — feature-gated, loopback only)
        run: cargo test -p selahcue-scripture --features download
      - name: Test (at-rest encryption — SQLCipher + vendored OpenSSL)
        # The vendored OpenSSL build needs perl+nasm on Windows; covered on the
        # other two OSes (the feature is platform-independent Rust).
        if: runner.os != 'Windows'
        run: |
          cargo test -p selahcue-data --features encryption
          cargo test -p selahcue-desktop --features encryption

  # Proves the app actually LAUNCHES (windows created, first frame presented, exit
  # 0) on every OS — not just build+test — and records a per-OS cold-start figure
  # (story 86ajpevzp). `--smoke` self-exits 0 on the first present, or non-zero via
  # a 30s watchdog on a genuine launch failure. Linux runs headless under Xvfb.
  launch-smoke:
    name: launch-smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # Hard CI backstop: the in-app 30s watchdog can't catch a hang INSIDE
    # window/adapter creation (before the event loop's first about_to_wait), so
    # bound the whole job — a wedged launch fails in minutes, not GitHub's 6h.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally excluded: the app launches + presents fine on
        # the windows-latest runner (recorded 522 ms in run 30141199818), but the
        # HEADLESS runner intermittently never presents a windowed frame (a
        # DXGI/desktop-session flake, not an app defect — macOS + Linux present
        # reliably). Documented runner limitation per 86ajpevzp; the rust +
        # operator matrices still cover Windows build+test.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementation/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop
      - name: Linux system deps (winit/wgpu + software Vulkan + Xvfb)
        if: runner.os == 'Linux'
        # libxkbcommon-x11: winit dlopens libxkbcommon-x11.so to create a real X11
        # window (the offscreen test job doesn't need it, but the launch smoke does).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan1 mesa-vulkan-drivers libdbus-1-dev xvfb
      - name: Build release
        run: cargo build --release -p selahcue-desktop
      - name: GUI-launch smoke (Linux, headless under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./target/release/selahcue-output --smoke
      - name: GUI-launch smoke (macOS, runner display)
        if: runner.os != 'Linux'
        run: cargo run --release -p selahcue-desktop -- --smoke
      # Idle-memory + cold-start NFR budgets (POSIX script; ≤300MB / ≤3s), GATED
      # on Linux — a real memory regression must fail CI (no-unbounded-growth
      # rule). macOS baseline already recorded; Windows is a POSIX-script limit.
      - name: NFR budgets (Linux under Xvfb)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" make nfr

  operator:
    name: operator shell (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # Cap the job (like launch-smoke) so a wedged Playwright/apt install step fails in minutes,
    # not GitHub's 6h default (audit #11 review).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementation/desktop/crates/selahcue-operator
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop/crates/selahcue-operator
      - name: Linux system deps (Tauri v2 webview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev libxkbcommon-dev
      - name: Format
        run: cargo fmt --check
      - name: Stage Tauri sidecar/resource placeholders (compile-check only)
        # tauri-build validates that the externalBin sidecar (`selahcue-output`) and the NDI
        # resource dll exist at build time. This job COMPILE-checks the operator (it does not
        # bundle the app), so empty placeholders satisfy the existence check — the real sidecar is
        # built in the packaging/release flow. Without this the build script fails on CI
        # ("resource path `binaries/selahcue-output-<triple>` doesn't exist").
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          if [[ "$triple" == *windows* ]]; then
            : > "binaries/selahcue-output-${triple}.exe"
          else
            : > "binaries/selahcue-output-${triple}"
          fi
          : > "binaries/Processing.NDI.Lib.x64.dll"
          echo "staged Tauri placeholders for ${triple}"
      - name: Check + Clippy + Test
        run: |
          cargo check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # Behavioural gate for the webview JS (audit #9): runs the real dist/ under
      # headless Chrome (pre-installed on ubuntu-latest) and asserts the console
      # render / plan-dedup / transcript-cap / designer wiring. Linux only (browser-
      # portable DOM behaviour; Chrome path/availability varies on macOS/Windows
      # runners). REQUIRE=1 turns a missing Chrome into a hard fail so the gate can
      # never silently no-op.
      # Chrome version (audit #11): this uses the runner's pre-installed google-chrome-stable
      # (currently 120+; the harness needs `--headless=new`, i.e. Chrome ≥ 112). The gate fails
      # CLOSED on a Chrome change (spurious RED, never a false green); if a bump ever breaks it,
      # pin a version here or switch the boot-render wait from a fixed sleep to a poll (#11).
      - name: Webview behavioural check (Linux, headless Chrome)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        env:
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: python3 scripts/operator_headless.py
      # Engine-fidelity smoke (audit #10): the Blink gate above covers browser-portable DOM/JS
      # logic; this boot-smokes the SAME dist/ on WebKit (Playwright's WebKit = the JavaScript
      # Core/WebCore core Tauri ships on — WebKitGTK/WKWebView), catching an engine-specific JS
      # break Blink can't. Playwright bundles its own WebKit (self-contained; no GTK-version
      # coupling). REQUIRE=1 makes a missing engine a hard fail, never a silent no-op.
      - name: Install Playwright WebKit (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        # Pinned so the WebKit engine under test is reproducible (bump deliberately); the
        # runner ships whatever WebKit that release bundles. `--break-system-packages` keeps the
        # `--user` install working on a PEP 668 externally-managed runner image (Ubuntu 24.04+),
        # where a plain `pip install --user` would otherwise refuse (audit #11 review).
        run: |
          python3 -m pip install --user --break-system-packages playwright==1.60.0
          python3 -m playwright install --with-deps webkit
      - name: Webview WebKit-engine smoke (Linux, Playwright WebKit)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        env:
          SELAHCUE_WEBKIT_REQUIRE: "1"
        run: python3 scripts/operator_webkit_smoke.py

  flutter:
    name: flutter controller
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/mobile/selahcue_controller
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Compile-verify the Android host (Kotlin MulticastLock channel, 86ajp0b0t)
      # — the ubuntu runner ships the Android SDK; a debug build exercises the
      # Kotlin without needing a device. JDK 17 for the Android Gradle plugin.
      # Only when the Android/Kotlin (or its Dart callers) actually changed —
      # the Gradle/SDK build is the heaviest mobile step, wasted on pure-Dart edits.
      - uses: actions/setup-java@v4
        if: needs.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Android host compile-check (apk --debug)
        if: needs.changes.outputs.android == 'true'
        run: flutter build apk --debug

  # The Django Platform API (implementation/api). Until this job existed the API had
  # NO automated verification at all — it matched no path filter, so an API-only push
  # ran the change-detection job and nothing else.
  api:
    name: api (django)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation/api
    # Real Postgres + Redis so the suite runs against the engines production uses.
    # tests/test_concurrency_postgres.py SKIPS on SQLite by design (select_for_update
    # is a no-op there), so without these containers the DEC-004 instance-limit race
    # would never actually be exercised anywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selahcue_test
          POSTGRES_USER: selahcue
          POSTGRES_PASSWORD: selahcue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selahcue"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the local dev interpreter. Django 6.1 supports 3.12-3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: implementation/api/pyproject.toml
      # psycopg is not a project dependency — local dev and a bare `pytest` stay on
      # SQLite. It is installed only here, where the Postgres service container is.
      - name: Install
        run: pip install -e ".[dev]" "psycopg[binary]>=3.2,<4"
      - name: Django system checks
        run: python manage.py check
      # Migrations here are hand-committed, so a model shipped without one is an easy
      # miss. `--check` has implied `--dry-run` since Django 4.2, so that flag is noise;
      # `--noinput` is load-bearing — without it a field RENAME selects the interactive
      # questioner, which calls input() and dies on a TTY-less runner with an EOFError
      # traceback instead of a readable "migration missing" failure.
      - name: Migrations are committed
        run: python manage.py makemigrations --check --noinput
      - name: Tests
        env:
          SQL_ENGINE: django.db.backends.postgresql
          SQL_DATABASE: selahcue_test
          SQL_USER: selahcue
          SQL_PASSWORD: selahcue
          SQL_HOST: localhost
          SQL_PORT: "5432"
          CACHE_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/2
        run: python -m pytest tests -q

  audit:
    name: dependency audit (RustSec)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit desktop workspace
        working-directory: implementation/desktop
        run: cargo audit
      - name: Audit operator shell
        working-directory: implementation/desktop/crates/selahcue-operator
        run: cargo audit

  supply-chain:
    # Story 86ajpew0j: license allowlist (no copyleft in the shipped tree,
    # deny.toml) + a CycloneDX SBOM artifact per build. Advisories live in the
    # RustSec job above.
    name: supply chain (licenses + SBOM)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-cyclonedx
      - name: License / source / bans policy (desktop workspace)
        working-directory: implementation/desktop
        run: cargo deny check licenses sources bans
      - name: License / source / bans policy (operator shell)
        working-directory: implementation/desktop/crates/selahcue-operator
        run: cargo deny check licenses sources bans
      - name: Generate CycloneDX SBOM (desktop workspace)
        working-directory: implementation/desktop
        run: cargo cyclonedx --format json
      - name: Generate CycloneDX SBOM (operator shell)
        working-directory: implementation/desktop/crates/selahcue-operator
        run: cargo cyclonedx --format json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: implementation/desktop/**/*.cdx.json
          if-no-files-found: error
