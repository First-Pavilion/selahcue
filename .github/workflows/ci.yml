name: wave2 refresh sign-out candidate diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    name: refresh sign-out focused node and static gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: implementation/marketing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: implementation/marketing/package-lock.json
      - run: npm ci
      - run: node --test tests/refreshSignOut.test.ts
      - run: npm run type-check
      - run: npm run lint
  browser:
    name: refresh sign-out real browser states
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: implementation/marketing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: implementation/marketing/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: npm ci
      - name: Real browser auth scenarios
        env:
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: npm run test:states
