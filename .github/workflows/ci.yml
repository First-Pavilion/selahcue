# SelahCue CI — per-OS matrix + GPU parity + Flutter + dependency audit.
#
# Hosting: GitHub (user decision, 2026-07-24) — the free tier runs the full
# Linux/macOS/Windows matrix this project's acceptance requires (GitLab Free has
# no macOS runners; a .gitlab-ci.yml variant lives in git history if ever needed).
#
# Local parity: `make ci` runs the same gates on a developer machine.
#
# GPU matrix note: the ADR-0015 parity tests (CPU rasterizer vs wgpu compositor,
# SSIM >= 0.99) run wherever a GPU adapter exists and SKIP gracefully otherwise:
#   - macOS runners: Metal
#   - Ubuntu runners: Mesa software Vulkan (lavapipe, installed below)
#   - Windows runners: DX12/WARP where available
name: ci
#
# TOOLCHAIN: every Rust job below installs the EXACT version pinned in
# rust-toolchain.toml (read once by the `changes` job, passed down as
# `needs.changes.outputs.rust`), and then runs scripts/check_toolchain.sh to prove
# that is what is actually running. `make ci` runs the same script, so the local
# gate and this pipeline compile with the same compiler by construction.
#
# `dtolnay/rust-toolchain@stable` still appears below: `@stable` there is the
# ACTION's own git ref (the branch the action lives on), NOT the Rust channel. The
# Rust version comes solely from the `toolchain:` input. Do not "simplify" it back
# to a bare `@stable` with no input -- that is precisely the floating-toolchain bug
# that left `main` without a green run for nine days (ClickUp 86ak5rc9c).

# Docs-only changes skip the matrix (saves runner minutes; docs carry no code to
# verify). A `changes` job (below) further gates the desktop vs mobile jobs by
# path, so a single-side commit doesn't pay for the other side (macOS bills 10x).
# NOTE: this gates DOWNSTREAM jobs with `if:`, so a skipped required check would
# DEADLOCK a PR. It is safe only because this repo pushes to main with no branch
# protection. Before enabling required status checks, add a single aggregator
# job (`needs:` all jobs; passes if each result is success OR skipped) and
# require THAT, not the individual matrix jobs (task 86ajq0569).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "TODO"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "TODO"
  # Lets the alarm (and the whole matrix) be driven on demand against `main`. Without
  # this the alarm's first ever execution would be in production on an already-broken
  # `main`, which is precisely when you do not want to find a typo in it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never a main run — every main commit keeps a
  # real pass/fail verdict (revert/bisect/audit trails need it).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which side of the repo changed. Most commits touch only the desktop OR only
  # the mobile side, so the other side's jobs are pure waste — and macOS runners
  # bill at 10x minutes, Windows at 2x. Each filter also matches this workflow so
  # a CI change re-runs everything. (Docs-only changes are already skipped at the
  # trigger's paths-ignore.) This is the cheap fan-out gate for the costly jobs.
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    # `dorny/paths-filter` compares against the merge base using git on a push, but on a
    # PULL_REQUEST it calls the GitHub API (`listFiles`) instead, which needs
    # `pull-requests: read`. The repository default grants only contents+packages, so the
    # job failed with "Resource not accessible by integration" and every downstream job
    # was skipped -- a whole pipeline reporting nothing.
    #
    # This was latent for months rather than new: the only previous PR run in this repo
    # (run 30718327254, 2026-08-01) died the same way in 17s. It went unnoticed because
    # work is pushed straight to `main`, where the git path is used and no API call
    # happens, so nothing exercised the PR path. `contents: read` is listed explicitly
    # because naming any scope sets the rest to `none` -- checkout needs it.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
      android: ${{ steps.filter.outputs.android }}
      api: ${{ steps.filter.outputs.api }}
      marketing: ${{ steps.filter.outputs.marketing }}
      # The one Rust version every Rust job below installs. Read from
      # rust-toolchain.toml so the file is the single source of truth and CI cannot
      # drift from `make ci` (86ak5rc9c).
      rust: ${{ steps.toolchain.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'implementation/desktop/**'
              # Shared build/NFR tooling the desktop jobs invoke (make nfr, the
              # NFR proxy script) — a change here must re-run the desktop matrix.
              - 'Makefile'
              - 'scripts/**'
              # Catch-all for any OTHER top-level code area (e.g. implementation/web)
              # so a change there is never silently unverified. Add a dedicated
              # filter + job if such an area grows its own build — which is what
              # `marketing:` below is, and why it is no longer caught here.
              - 'implementation/web/**'
              - '.github/workflows/ci.yml'
              # A toolchain bump changes which compiler every desktop gate runs, so
              # it must re-run the whole desktop matrix.
              - 'rust-toolchain.toml'
            mobile:
              - 'implementation/mobile/**'
              - '.github/workflows/ci.yml'
            android:
              - 'implementation/mobile/selahcue_controller/android/**'
              - 'implementation/mobile/selahcue_controller/lib/controllers/discovery_controller.dart'
              - 'implementation/mobile/selahcue_controller/lib/models/multicast_lock.dart'
              # A Flutter/plugin dep bump can change the Android build too.
              - 'implementation/mobile/selahcue_controller/pubspec.yaml'
              - 'implementation/mobile/selahcue_controller/pubspec.lock'
              - '.github/workflows/ci.yml'
            # The Django Platform API. Before this filter existed, implementation/api
            # matched NO filter at all — neither desktop nor mobile — so an API-only
            # push triggered the workflow and then ran nothing.
            api:
              - 'implementation/api/**'
              - '.github/workflows/ci.yml'
            # The marketing site + customer web portal (Vue SPA). This filter is the
            # SAME omission the api one above documents, recurring: implementation/marketing
            # matched no filter at all, so a marketing-only push triggered the workflow
            # and ran nothing. The /verify and /reset auth pages landed under exactly
            # that gap. If a fourth code area appears, it needs a filter here too — the
            # desktop catch-all is not a substitute.
            marketing:
              - 'implementation/marketing/**'
              - '.github/workflows/ci.yml'
      # Single source of truth for the compiler. Every Rust job installs exactly this
      # version, and scripts/check_toolchain.sh then asserts the running toolchain
      # matches it -- the same script `make ci` runs, which is what makes the local
      # gate a real mirror of this one rather than a hopeful claim.
      - id: toolchain
        name: Read the pinned Rust toolchain
        # Delegates to the same script the gates use, rather than re-implementing the
        # parse. The re-implementation this replaces only checked the value was
        # non-empty, so it would happily have passed a floating "stable" down to three
        # jobs that then reject it. One parser, one set of rules.
        run: |
          channel="$(sh scripts/check_toolchain.sh --print-channel)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "pinned Rust toolchain: $channel"

  # Static analysis for the workflows themselves. Added because this file grew real
  # logic (the alarm, the toolchain plumbing) and a workflow is the one thing here
  # that nothing else compiles, type-checks or tests -- its first execution is
  # production. actionlint catches undefined `needs` job references, unknown context
  # properties, bad `if:` expressions, and shellcheck issues inside `run:` blocks.
  #
  # Scope note, so nobody over-trusts it: it does NOT catch every expression mistake.
  # It accepts both `needs.launch-smoke.result` and `needs['launch-smoke'].result`
  # (both are valid; hyphens are legal in context property names). It is a real gate
  # against real classes of error, not a proof of correctness.
  #
  # Ungated on purpose: it costs seconds on the cheapest runner, and gating a
  # workflow linter behind a path filter is how a broken workflow slips through.
  lint-workflows:
    name: workflows (actionlint + permissions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      # Two invariants actionlint does not model, both of which shipped as real
      # defects in this branch and were caught by human review rather than any gate:
      #   - a job declaring `permissions` loses every scope it does not list, so an
      #     `issues: write`-only job cannot check out a private repo and dies at step 1;
      #   - a `success()` setup step stranded after the first `!cancelled()` gate gets
      #     skipped by an earlier failure, and the gates after it then fail for the
      #     wrong reason.
      # Verified: actionlint exits 0 on both. This does not. The name is deliberately
      # narrow -- it checks checkout-vs-`contents` and step ordering, NOT that every
      # job's scopes match everything it does (a job declaring `contents: read` and
      # then running `gh issue create` dies the same way and is not detected).
      - name: Checkout scopes + setup/gate ordering
        run: |
          # Pinned, matching the playwright pin below: an unpinned install makes this
          # gate's behaviour depend on whatever PyPI serves that morning.
          python3 -m pip install --quiet --break-system-packages 'pyyaml==6.0.3'
          python3 .github/scripts/check_workflows.py --self-test
          python3 .github/scripts/check_workflows.py

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementation/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.changes.outputs.rust }}
          components: clippy, rustfmt
      # Refuse to gate on a compiler nobody pinned. Same script `make ci` runs, so a
      # divergence between this pipeline and the local gate fails loudly here instead
      # of silently producing a green that means nothing (86ak5rc9c).
      - name: Verify the pinned toolchain is what is running
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sh scripts/check_toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop
      - name: Linux system deps (winit/wgpu + software Vulkan for GPU parity)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libvulkan1 mesa-vulkan-drivers libdbus-1-dev
      # A real serif face, so the typography tests can do real work (86ak643rc).
      #
      # `themes_differing_only_in_typography_never_share_a_measurement` (selahcue-present)
      # needs one INSTALLED face that shapes differently from the BUNDLED Noto Sans, or its
      # serif comparisons cannot tell a font-blind cache key from a correct one. On Linux an
      # unresolved family name falls back to that same bundled face — see
      # `a_missing_font_falls_back_readably_and_deterministically` in selahcue-engine — so
      # with no real serif installed the test cannot pass. That is why it went red on this
      # runner and only this runner.
      #
      # WHAT THIS BUYS, PRECISELY -- it matters if anyone weighs dropping the pinned package.
      # It RESTORES a layer of checking; it is NOT what holds the font/weight cache-key
      # contract up. That contract is carried by `every_shaping_attribute_is_part_of_the_cache_key`,
      # which compares KEYS rather than frames and deliberately uses an uninstalled family, so
      # it needs no font at all. Measured on a bare ubuntu:24.04 with zero fonts installed:
      # that test PASSES unmutated, and still goes RED when `font` is dropped from
      # `measure::Key` (7 passed/1 failed unmutated; 6 passed/2 failed mutated). So a runner
      # without a serif still guards the contract -- what it loses is the LAYOUT-level check,
      # and it loses it LOUDLY: the typography test fails naming every face it looked for.
      #
      # WHY THE PACKAGE IS DECLARED HERE AT ALL. fonts-liberation is already on the
      # ubuntu-latest image, but only as an undocumented transitive dependency (of Chrome) --
      # the published ubuntu-24.04 software manifest lists just fonts-noto-color-emoji under
      # fonts. Resting a gate on a package nobody declared is the fragile inheritance this
      # step removes. Declaring it is the point.
      #
      # WHY THE VERSION IS *NOT* PINNED -- this was pinned to =1:2.1.5-3 and the pin was wrong.
      # Measured in containers:
      #   ubuntu:24.04  candidate 1:2.1.5-3       LiberationSerif-Regular.ttf sha256 705903ae...
      #   ubuntu:26.04  candidate 1:2.1.5-3build1 LiberationSerif-Regular.ttf sha256 350f4ffd...
      # `ubuntu-26.04` is already a preview runner label and GitHub migrates `-latest` gradually
      # over 1-2 months, so during that window the SAME commit can land on either image and the
      # 26.04 half dies with "E: Version '1:2.1.5-3' for 'fonts-liberation' was not found".
      # That reads as a flake on `main` and blocks everyone, not just this branch -- a bigger
      # failure than the drift the pin was meant to prevent. Note also the two packages ship
      # DIFFERENT BYTES, so the version string was never pinning the face the test measures; it
      # pinned a packaging label that merely correlates with one.
      #
      # WHAT IS PINNED INSTEAD: the property, asserted at the point of use. The `test -f` below
      # is the real contract -- a serif face present at a path fontdb scans -- and the test
      # itself independently proves that face RESOLVES and DIFFERS from the bundled Noto Sans,
      # failing with a diagnostic that names every candidate if it does not. An assertion about
      # the thing we need beats a version string that stands in for it.
      #
      # Rejected alternatives: pinning the .ttf's sha256 (tighter than the version pin and
      # dated the same way -- it would fail on a face that works perfectly); vendoring the .ttf
      # (the path under test is specifically "a font the OS provides", and it would still need
      # a copy-into-/usr/share/fonts step here, plus a binary asset and a licence file).
      # Pinning the runner image to `ubuntu-24.04` in the matrix would ALSO fix this and is
      # arguably better -- but it is a matrix-wide reproducibility decision affecting every job
      # and OS, with its own EOL/security-update cost, so it belongs in its own change and not
      # smuggled in under a font fix.
      - name: Linux fonts (a real serif face for the typography tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-liberation
          # Assert the file LANDED -- fail here, not 20 minutes later inside a test. This is
          # one layer of the contract, not all of it: it proves a serif face exists at a path
          # fontdb scans, NOT that fontdb resolves it or that it measures differently from the
          # bundled face. Those two are asserted at runtime by `verdict()` in installed_serif.
          test -f /usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf
      # From the first GATE step onward, `!cancelled()`. Setup steps above deliberately
      # keep the default `success()`: if checkout, the toolchain install or the pin
      # assertion fails, every downstream result is meaningless or measured on the wrong
      # compiler, so running them would produce noise rather than information.
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --check
      - name: Clippy (default features)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `!cancelled()` from here down. A failing Clippy step used to suppress every
      # step after it (default `if: success()`), which is exactly how the E0063 in
      # selahcue-present stayed invisible in this job for two runs while the standing
      # clippy failure held the door shut. One broken gate should cost you one gate's
      # worth of information, not the whole job's. 86ak5rc9c.
      - name: Clippy (server features)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p selahcue-lan --features server --all-targets -- -D warnings
          cargo clippy -p selahcue-app --features server --all-targets -- -D warnings
          cargo clippy -p selahcue-scripture --features download --all-targets -- -D warnings
      - name: Test (workspace, incl. GPU parity where an adapter exists)
        if: ${{ !cancelled() }}
        # --no-fail-fast: without it cargo stops at the first failing test BINARY, so a
        # failure in an early crate hides every later crate's results.
        #
        # Measured on the real ubuntu run 32896017248: 124 binaries execute and 138 suites
        # report, and 51 of them sit at or after the failing binary -- so without this flag
        # 51 suites' results simply never appear. Exactly ONE binary FAILS on that run; do
        # not go looking for a second. (An earlier version of this comment quoted "1 without,
        # 2 with", which was a SYNTHETIC measurement taken by injecting deliberate failures
        # into two independent crates to prove the flag changed behaviour before adopting it.
        # Stated without that qualifier it sent a reader hunting a failure that does not
        # exist -- in a comment justifying a flag whose purpose is to stop results going
        # missing.)
        run: cargo test --workspace --no-fail-fast
      # Structural merge gates for the presentation importer (threat model B2 + the design's
      # no-I/O rule + the ADR-0025 decoder pin). These are one-line checks only because the
      # importer is its own crate; inside the operator, whose graph legitimately contains a TLS
      # stack, the no-network property would not even be stateable.
      # THE release-profile gate for the licensing crate. Debug builds deliberately trust a
      # development entitlement key whose seed is COMMITTED (dev-signing-key.NOT-A-SECRET),
      # so anyone can mint a manifest against a debug build. Release builds must not trust
      # it, and `#[cfg(debug_assertions)]` is what stops them.
      #
      # WHAT THIS STEP DOES CLOSE: removal of the `#[cfg(debug_assertions)]` gates, and a
      # second ungated insertion in `bundled()` (E0425 in release). The workspace test above
      # is debug-only and the other --release steps build crates that do not link licensing,
      # so without this those routes shipped the public-seed key with an all-green CI.
      #
      # WHAT IT DOES NOT CLOSE, stated plainly because an overclaim here is worse than a
      # gap: the test is `if cfg!(debug_assertions) { present } else { absent }`, which asks
      # the profile a question and checks the answer against itself. `[profile.release]
      # debug-assertions = true` -- or RUSTFLAGS -- makes that cfg TRUE under --release, so
      # this step passes green in BOTH profiles while the key ships, with no source edit at
      # all. The manifest and cargo-config routes are closed by scripts/import_guards.sh;
      # the environment route cannot be closed from inside the repository.
      #
      # WHAT ONLY THIS STEP CLOSES -- do not delete it as redundant. An earlier revision
      # called the byte scan below "THE COMPLETE CONTROL", which it is not. The scan looks
      # for the LITERAL key bytes in the release rlib, so a runtime loader that derives the
      # key rather than embedding it is invisible to it, while this test still catches it:
      # the key would be in `TrustedKeys::bundled()` in a release build and the assertion of
      # absence would fail. The two controls are complementary --
      #
      #   route                                        | byte scan | this iff test
      #   ---------------------------------------------+-----------+---------------
      #   profile table / cargo config / RUSTFLAGS     | KILL      | miss
      #   runtime loader, non-literal key              | miss      | KILL
      #   ...the same loader behind a runtime trigger  | miss      | miss
      #
      # -- and the bottom row is closed by neither. That is deliberate: "no config loader in
      # this crate" is a review-enforced rule, not a gate. See scripts/dev_key_not_in_release.sh.
      #
      # The byte scan runs below -- see "Dev key absent from the release artefact". It was
      # previously deferred here on the belief that it "needs something to link the crate
      # first". That was wrong: `cargo build -p selahcue-licensing --release` emits an rlib
      # today and the scan takes seconds.
      - name: Test (licensing crate in RELEASE — the dev-key exclusion only holds here)
        if: ${{ !cancelled() }}
        run: cargo test -p selahcue-licensing --release --no-fail-fast
      # `-D warnings` in release too. Without it this job passed while warning on every run:
      # `bundled()`'s `let mut store` is only mutated inside the debug-only cfg block, so
      # release warned `unused_mut` -- the compiler correctly observing that nothing mutates
      # it, which is exactly the property release is supposed to have.
      - name: Clippy (licensing crate in RELEASE)
        if: ${{ !cancelled() }}
        run: cargo clippy -p selahcue-licensing --release --all-targets -- -D warnings
      # The effect-level gate on the development entitlement key. Everything above asks a
      # question ABOUT the source or the configuration and can be defeated by a spelling
      # nobody enumerated; this asks whether the key bytes are in the artefact, which closes
      # every CONFIGURATION route at once -- profile tables (including the inline
      # `[profile] release = { .. }` form), the legacy `.cargo/config` filename, a valueless
      # `-C debug-assertions`, a config in a parent directory or $CARGO_HOME, and RUSTFLAGS in
      # the environment.
      #
      # It does NOT close a runtime loader: it searches for the literal key bytes, so a loader
      # that derives them leaves nothing to find. The release test above is what catches that,
      # which is why both steps exist and neither is redundant. Route table in the script.
      - name: Dev key absent from the release artefact (effect-level gate)
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: sh scripts/dev_key_not_in_release.sh
      - name: Import structural guards (no network, no filesystem, pinned decoder)
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: sh scripts/import_guards.sh
      - name: Test (LAN server + app server features — E2E over real TLS)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p selahcue-lan --features server --no-fail-fast
          cargo test -p selahcue-app --features server --no-fail-fast
      - name: Test (scripture download — feature-gated, loopback only)
        if: ${{ !cancelled() }}
        run: cargo test -p selahcue-scripture --features download --no-fail-fast
      - name: Test (at-rest encryption — SQLCipher + vendored OpenSSL)
        # The vendored OpenSSL build needs perl+nasm on Windows; covered on the
        # other two OSes (the feature is platform-independent Rust).
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          cargo test -p selahcue-data --features encryption --no-fail-fast
          cargo test -p selahcue-desktop --features encryption --no-fail-fast

  # Proves the app actually LAUNCHES (windows created, first frame presented, exit
  # 0) on every OS — not just build+test — and records a per-OS cold-start figure
  # (story 86ajpevzp). `--smoke` self-exits 0 on the first present, or non-zero via
  # a 30s watchdog on a genuine launch failure. Linux runs headless under Xvfb.
  launch-smoke:
    name: launch-smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # Hard CI backstop: the in-app 30s watchdog can't catch a hang INSIDE
    # window/adapter creation (before the event loop's first about_to_wait), so
    # bound the whole job — a wedged launch fails in minutes, not GitHub's 6h.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally excluded: the app launches + presents fine on
        # the windows-latest runner (recorded 522 ms in run 30141199818), but the
        # HEADLESS runner intermittently never presents a windowed frame (a
        # DXGI/desktop-session flake, not an app defect — macOS + Linux present
        # reliably). Documented runner limitation per 86ajpevzp; the rust +
        # operator matrices still cover Windows build+test.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementation/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.changes.outputs.rust }}
      # Refuse to gate on a compiler nobody pinned. Same script `make ci` runs, so a
      # divergence between this pipeline and the local gate fails loudly here instead
      # of silently producing a green that means nothing (86ak5rc9c).
      - name: Verify the pinned toolchain is what is running
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sh scripts/check_toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop
      - name: Linux system deps (winit/wgpu + software Vulkan + Xvfb)
        if: runner.os == 'Linux'
        # libxkbcommon-x11: winit dlopens libxkbcommon-x11.so to create a real X11
        # window (the offscreen test job doesn't need it, but the launch smoke does).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan1 mesa-vulkan-drivers libdbus-1-dev xvfb
      - name: Build release
        run: cargo build --release -p selahcue-desktop
      - name: GUI-launch smoke (Linux, headless under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./target/release/selahcue-output --smoke
      - name: GUI-launch smoke (macOS, runner display)
        if: runner.os != 'Linux'
        run: cargo run --release -p selahcue-desktop -- --smoke
      # Idle-memory + cold-start NFR budgets (POSIX script; ≤300MB / ≤3s), GATED
      # on Linux — a real memory regression must fail CI (no-unbounded-growth
      # rule). macOS baseline already recorded; Windows is a POSIX-script limit.
      - name: NFR budgets (Linux under Xvfb)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" make nfr

  operator:
    name: operator shell (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # Cap the job (like launch-smoke) so a wedged Playwright/apt install step fails in minutes,
    # not GitHub's 6h default (audit #11 review).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementation/desktop/crates/selahcue-operator
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.changes.outputs.rust }}
          components: clippy, rustfmt
      # Refuse to gate on a compiler nobody pinned. Same script `make ci` runs, so a
      # divergence between this pipeline and the local gate fails loudly here instead
      # of silently producing a green that means nothing (86ak5rc9c).
      - name: Verify the pinned toolchain is what is running
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sh scripts/check_toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop/crates/selahcue-operator
      - name: Linux system deps (Tauri v2 webview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev libxkbcommon-dev
      - name: Stage Tauri sidecar/resource placeholders (compile-check only)
        # tauri-build validates that the externalBin sidecar (`selahcue-output`) and the NDI
        # resource dll exist at build time. This job COMPILE-checks the operator (it does not
        # bundle the app), so empty placeholders satisfy the existence check — the real sidecar is
        # built in the packaging/release flow. Without this the build script fails on CI
        # ("resource path `binaries/selahcue-output-<triple>` doesn't exist").
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          # CREATE-ONLY. `: > file` truncates, and these names include the
          # owner-supplied NDI dll. That is harmless on an ephemeral runner, but this
          # is the snippet people copy to reproduce CI locally, where truncating a real
          # dll is silent and git-unrecoverable (binaries/ is gitignored). Never make
          # this unconditional. 86ak5rjh7.
          stage() { [ -e "$1" ] || : > "$1"; }
          if [[ "$triple" == *windows* ]]; then
            stage "binaries/selahcue-output-${triple}.exe"
          else
            stage "binaries/selahcue-output-${triple}"
          fi
          stage "binaries/Processing.NDI.Lib.x64.dll"
          echo "staged Tauri placeholders for ${triple}"
      # Three steps, not one `run:` block. As a single block under `bash -e`, a clippy
      # failure aborted before `cargo test` ever ran -- so this job still had exactly
      # the masking the rest of this change removes, while appearing to be covered.
      # From the first GATE step onward, `!cancelled()`, and NO setup step after it.
      # Staging used to sit between Format and Check as a `success()` step, so a
      # formatting failure skipped it and Check/Clippy/Test then ran WITHOUT the
      # placeholders — turning one formatting error into four red steps, three failing
      # for a reason unrelated to the code. In a change about signals that lie, that was
      # one. Setup steps above keep `success()`: if checkout, the toolchain install or
      # the pin assertion fails, every downstream result is meaningless.
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --check
      - name: Check
        if: ${{ !cancelled() }}
        run: cargo check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --no-fail-fast
      # `dev-keys` (86akby6yy) is OFF by default, so the four steps above compile none of the
      # `.env` loader and none of its tests. One of those tests is a SECURITY control: it asserts
      # at the WRITE boundary that no name outside the two-entry allowlist reaches the process
      # environment, which is what stops the loader injecting an arbitrary environment from a
      # `.env` file. Sana's PR #18 review (F1) found that control missing, and the mutation that
      # exposed it left the whole suite green -- so this is exactly the kind of gap a gate has to
      # cover rather than a developer remembering `make ci`. `selahcue-stt` is the standing
      # example of what happens otherwise: its own lint policy is unenforced because no CI job
      # compiles it. Runs on all three OSes, like the steps above.
      - name: Clippy (dev-keys)
        if: ${{ !cancelled() }}
        run: cargo clippy --features dev-keys --all-targets -- -D warnings
      - name: Test (dev-keys)
        if: ${{ !cancelled() }}
        run: cargo test --features dev-keys --no-fail-fast
      # Behavioural gate for the webview JS (audit #9): runs the real dist/ under
      # headless Chrome (pre-installed on ubuntu-latest) and asserts the console
      # render / plan-dedup / transcript-cap / designer wiring. Linux only (browser-
      # portable DOM behaviour; Chrome path/availability varies on macOS/Windows
      # runners). REQUIRE=1 turns a missing Chrome into a hard fail so the gate can
      # never silently no-op.
      # Chrome version (audit #11): this uses the runner's pre-installed google-chrome-stable
      # (currently 120+; the harness needs `--headless=new`, i.e. Chrome ≥ 112). The gate fails
      # CLOSED on a Chrome change (spurious RED, never a false green); if a bump ever breaks it,
      # pin a version here or switch the boot-render wait from a fixed sleep to a poll (#11).
      - name: Webview behavioural check (Linux, headless Chrome)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: ${{ github.workspace }}
        env:
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: python3 scripts/operator_headless.py
      # Engine-fidelity smoke (audit #10): the Blink gate above covers browser-portable DOM/JS
      # logic; this boot-smokes the SAME dist/ on WebKit (Playwright's WebKit = the JavaScript
      # Core/WebCore core Tauri ships on — WebKitGTK/WKWebView), catching an engine-specific JS
      # break Blink can't. Playwright bundles its own WebKit (self-contained; no GTK-version
      # coupling). REQUIRE=1 makes a missing engine a hard fail, never a silent no-op.
      - name: Install Playwright WebKit (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: ${{ github.workspace }}
        # Pinned so the WebKit engine under test is reproducible (bump deliberately); the
        # runner ships whatever WebKit that release bundles. `--break-system-packages` keeps the
        # `--user` install working on a PEP 668 externally-managed runner image (Ubuntu 24.04+),
        # where a plain `pip install --user` would otherwise refuse (audit #11 review).
        run: |
          python3 -m pip install --user --break-system-packages playwright==1.60.0
          python3 -m playwright install --with-deps webkit
      - name: Webview WebKit-engine smoke (Linux, Playwright WebKit)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: ${{ github.workspace }}
        env:
          SELAHCUE_WEBKIT_REQUIRE: "1"
        run: python3 scripts/operator_webkit_smoke.py

  flutter:
    name: flutter controller
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/mobile/selahcue_controller
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Compile-verify the Android host (Kotlin MulticastLock channel, 86ajp0b0t)
      # — the ubuntu runner ships the Android SDK; a debug build exercises the
      # Kotlin without needing a device. JDK 17 for the Android Gradle plugin.
      # Only when the Android/Kotlin (or its Dart callers) actually changed —
      # the Gradle/SDK build is the heaviest mobile step, wasted on pure-Dart edits.
      - uses: actions/setup-java@v4
        if: needs.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Android host compile-check (apk --debug)
        if: needs.changes.outputs.android == 'true'
        run: flutter build apk --debug

  # The Django Platform API (implementation/api). Until this job existed the API had
  # NO automated verification at all — it matched no path filter, so an API-only push
  # ran the change-detection job and nothing else.
  api:
    name: api (django)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation/api
    # Real Postgres + Redis so the suite runs against the engines production uses.
    # tests/test_concurrency_postgres.py SKIPS on SQLite by design (select_for_update
    # is a no-op there), so without these containers the DEC-004 instance-limit race
    # would never actually be exercised anywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selahcue_test
          POSTGRES_USER: selahcue
          POSTGRES_PASSWORD: selahcue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selahcue"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the local dev interpreter. Django 6.1 supports 3.12-3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: implementation/api/pyproject.toml
      # psycopg is not a project dependency — local dev and a bare `pytest` stay on
      # SQLite. It is installed only here, where the Postgres service container is.
      - name: Install
        run: pip install -e ".[dev]" "psycopg[binary]>=3.2,<4"
      - name: Django system checks
        run: python manage.py check
      # Migrations here are hand-committed, so a model shipped without one is an easy
      # miss. `--check` has implied `--dry-run` since Django 4.2, so that flag is noise;
      # `--noinput` is load-bearing — without it a field RENAME selects the interactive
      # questioner, which calls input() and dies on a TTY-less runner with an EOFError
      # traceback instead of a readable "migration missing" failure.
      - name: Migrations are committed
        run: python manage.py makemigrations --check --noinput
      - name: Tests
        env:
          SQL_ENGINE: django.db.backends.postgresql
          SQL_DATABASE: selahcue_test
          SQL_USER: selahcue
          SQL_PASSWORD: selahcue
          SQL_HOST: localhost
          SQL_PORT: "5432"
          CACHE_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/2
        run: python -m pytest tests -q

  marketing:
    name: marketing (vue spa)
    needs: changes
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation/marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: implementation/marketing/package-lock.json
      - name: Install
        run: npm ci
      # `build` is vue-tsc -b && vite build, so this is the typecheck gate too.
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      # Drives the real built bundle in headless Chrome (same pattern as
      # scripts/operator_headless.py). SELAHCUE_HEADLESS_REQUIRE=1 turns a missing
      # Chrome into a hard failure — without it the script skips, which on a runner
      # would silently report success while checking nothing.
      - name: Auth page states (headless)
        env:
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: npm run test:states

  audit:
    name: dependency audit (RustSec)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit desktop workspace
        working-directory: implementation/desktop
        run: cargo audit
      - name: Audit operator shell
        working-directory: implementation/desktop/crates/selahcue-operator
        run: cargo audit

  supply-chain:
    # Story 86ajpew0j: license allowlist (no copyleft in the shipped tree,
    # deny.toml) + a CycloneDX SBOM artifact per build. Advisories live in the
    # RustSec job above.
    name: supply chain (licenses + SBOM)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-cyclonedx
      - name: License / source / bans policy (desktop workspace)
        working-directory: implementation/desktop
        run: cargo deny check licenses sources bans
      - name: License / source / bans policy (operator shell)
        working-directory: implementation/desktop/crates/selahcue-operator
        run: cargo deny check licenses sources bans
      - name: Generate CycloneDX SBOM (desktop workspace)
        working-directory: implementation/desktop
        run: cargo cyclonedx --format json
      - name: Generate CycloneDX SBOM (operator shell)
        working-directory: implementation/desktop/crates/selahcue-operator
        run: cargo cyclonedx --format json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: implementation/desktop/**/*.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The alarm. Nine days without a green run on `main` went unnoticed because a
  # failure notifies nobody, and branch protection is unavailable for a private repo
  # on this plan -- so a red commit lands regardless and an alarm is the ONLY control
  # available. ClickUp 86ak5rc9c.
  #
  # It tracks WHICH jobs are outstanding, not a single red/green bit, because CI
  # path-filters by area: an api-only push to `main` SKIPS the entire desktop matrix.
  # A red/green alarm would read that skip as "nothing failed" and close itself while
  # `main` was still broken on `rust`, having verified nothing about `rust`. A job
  # leaves the outstanding set only by actually reporting success.
  #
  # The logic lives in a script with a self-test rather than in `if:` expressions,
  # because expressions cannot be tested and this one has to be right the first time
  # it matters -- by definition that is a moment when `main` is already broken.
  ci-alarm:
    name: alarm (main red/green tracking)
    needs:
      [changes, lint-workflows, rust, launch-smoke, operator, flutter, api, marketing,
       audit, supply-chain]
    # always(): several of the above are legitimately skipped by the path filters, and a
    # skipped dependency would otherwise skip the alarm exactly when it is needed.
    # Every job that can fail on `main` must be in this list, or its failure is invisible
    # -- which is the nine-days-unnoticed failure mode, recreated for one job.
    # A push only ever reaches here from `main` (see `on:` at the top). A dispatch is
    # additionally allowed from ANY ref so the alarm can be rehearsed before it is
    # merged -- but off `main` it runs in DRY_RUN, doing every read and withholding
    # every write. Without that, its first execution ever would be on an already-broken
    # `main`, which is the worst possible moment to discover a typo; and letting a
    # branch's results write to the real issue could close a genuine alarm.
    if: >-
      ${{ always()
          && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
              || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # BOTH scopes are load-bearing. Declaring any `permissions` block sets every scope
    # NOT listed to `none`, so an `issues: write`-only block leaves `contents: none` --
    # and on a private repo that means actions/checkout cannot clone, the first step
    # fails, and the alarm never runs at all. A dead alarm shipped next to a CLAUDE.md
    # that calls it "the only alarm" is this ticket's own worst case. 86ak5rc9c.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # This job holds `issues: write`; nothing here needs the token afterwards
          # (the reconcile step gets it via a step-scoped `env:`), so keep it out of
          # .git/config rather than leaving a writable credential lying in the tree.
          persist-credentials: false
      # Prove the reconcile logic before trusting it with the verdict. Cheap, and it
      # runs on every main push, so the alarm cannot rot into being wrong unnoticed.
      - name: Self-test the alarm logic
        run: python3 .github/scripts/ci_alarm.py --self-test
      - name: Reconcile the ci-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          NEEDS: ${{ toJSON(needs) }}
          DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
        run: python3 .github/scripts/ci_alarm.py
