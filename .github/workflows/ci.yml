name: wave2 PP-GEN var baseline and candidate CSS RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: PP-GEN real var browser RED and actual site witness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full unchanged-predicate suite and isolated candidate CSS
        run: |
          python3 - <<'PY'
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          dist = root / 'implementation/desktop/crates/selahcue-operator/dist'
          env = {**os.environ, 'SELAHCUE_HEADLESS_REQUIRE':'1'}

          def run(label, copied=None):
              child_env = dict(env)
              if copied is not None:
                  child_env['SELAHCUE_OPERATOR_DIST'] = str(copied)
              result = subprocess.run([sys.executable, str(root/'scripts/operator_headless.py')],
                                      env=child_env, text=True, capture_output=True, timeout=180)
              print(label, 'EXIT', result.returncode, flush=True)
              print(result.stdout, flush=True)
              print(result.stderr, file=sys.stderr, flush=True)
              return result

          baseline = run('UNCHANGED_PREDICATE_RED')
          assert 'FAIL: F30: the real PP-GEN predicate rejects brightness delivered through var()' in baseline.stdout
          assert 'PASS: F30 premise: the browser applies variable-delivered brightness' in baseline.stdout
          assert 'PASS: F30 control: a clean matching rule still passes both predicates' in baseline.stdout
          with tempfile.TemporaryDirectory(prefix='selahcue-f30-candidate-css-') as temp:
              copied = Path(temp)/'dist'
              shutil.copytree(dist, copied)
              css = copied/'app.css'
              original = css.read_text()
              assert '.pp-generate:hover' in original
              css.write_text(original + '\n:root{--__f30-real-glow:brightness(1.06);}\n.pp-generate:hover{background:#5a48d0;filter:var(--__f30-real-glow);}\n')
              candidate = run('OLD_GUARD_CANDIDATE_CSS_FALSE_GREEN_WITNESS', copied)
              assert 'PASS: PP-GEN: .pp-generate:hover does NOT use filter:brightness()' in candidate.stdout
              assert 'FAIL: F30: the real PP-GEN predicate rejects brightness delivered through var()' in candidate.stdout
              assert 'PASS: CSSOM-PARSE-06 (PP-GEN shape)' in candidate.stdout
              print('FALSE_GREEN_WITNESS: actual PP-GEN site passed adversarial var CSS; new real-browser self-test failed', flush=True)
          assert baseline.returncode != 0, 'actual assertion RED must remain a failed job'
          sys.exit(baseline.returncode)
          PY
