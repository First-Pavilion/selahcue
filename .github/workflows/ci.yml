name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dq0-proof:
    name: DQ0 ungated server type contracts five mutants and restoration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: implementation/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Exact source checkout
        working-directory: ${{ github.workspace }}
        run: |
          test "$(git rev-parse HEAD^)" = "1457af0ffcfacb6081f3f777c83da43f6ec333ca"
          git checkout --detach 1457af0ffcfacb6081f3f777c83da43f6ec333ca
          test "$(git rev-parse HEAD)" = "1457af0ffcfacb6081f3f777c83da43f6ec333ca"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Verify pinned toolchain
        working-directory: ${{ github.workspace }}
        run: sh scripts/check_toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Actual suites contracts mutants restoration
        run: |
          python3 - <<'PYRUN'
          import hashlib,json,pathlib,re,subprocess
          root=pathlib.Path.cwd()
          protocol=root/'crates/selahcue-lan/src/protocol.rs'
          failure=root/'crates/selahcue-lan/src/json_failure.rs'
          tls=root/'crates/selahcue-lan/src/tls.rs'
          test=root/'crates/selahcue-lan/tests/test_public_json_failure.rs'
          tracked=[protocol,failure,tls,test,root/'crates/selahcue-lan/src/lib.rs',root/'crates/selahcue-lan/tests/test_json_error_redaction.rs',root/'crates/selahcue-lan/tests/test_protocol.rs',root/'crates/selahcue-lan/Cargo.toml',root/'Cargo.toml',root/'Cargo.lock',root/'crates/selahcue-lan/src/wire.rs',root/'crates/selahcue-lan/src/server.rs',root/'crates/selahcue-app/src/operator.rs',root/'crates/selahcue-app/src/controller.rs']
          original={p:p.read_bytes() for p in tracked}
          def hashes():return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in tracked}
          baseline_hashes=hashes()
          print('DQ0_BASELINE_HASHES',json.dumps(baseline_hashes,sort_keys=True),flush=True)
          def run(label,args):
           result=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=600)
           clean=re.sub(r'\x1b\[[0-9;]*m','',result.stdout)
           print('DQ0_PHASE_BEGIN',label,flush=True);print(clean,flush=True)
           print('DQ0_PHASE_END',label,json.dumps({'exit':result.returncode,'summaries':re.findall(r'test result: .*',clean)}),flush=True)
           return result.returncode,clean
          def require_green(label,args):
           code,text=run(label,args);assert code==0,(label,code)
           assert 'test result: ok.' in text or 'Finished' in text,label
           return text
          def focus(label,server=False):
           args=['cargo','test','--locked','-p','selahcue-lan',*(['--features','server'] if server else ['--no-default-features']),'--test','test_public_json_failure','--','--nocapture']
           return run(label,args)
          def full(label,server):
           require_green(label,['cargo','test','--locked','-p','selahcue-lan',*(['--features','server'] if server else ['--no-default-features']),'--no-fail-fast'])
          for server in [False,True]:
           mode='server' if server else 'ungated'
           full('baseline-'+mode,server)
           code,text=focus('focused-baseline-'+mode,server);assert code==0 and '14 passed; 0 failed; 0 ignored' in text
           require_green('clippy-'+mode,['cargo','clippy','--locked','-p','selahcue-lan',*(['--features','server'] if server else ['--no-default-features']),'--all-targets','--','-D','warnings'])
          assert hashes()==baseline_hashes
          p=original[protocol].decode();f=original[failure].decode();t=original[tls].decode()
          old_encode='pub fn to_json<T: Serialize>(msg: &T) -> Result<String, JsonFailure> {\n    serde_json::to_string(msg).map_err(JsonFailure::from)\n}'
          new_encode='pub fn to_json<T: Serialize>(msg: &T) -> Result<String, serde_json::Error> {\n    serde_json::to_string(msg)\n}'
          old_decode="pub fn from_json<'a, T: Deserialize<'a>>(s: &'a str) -> Result<T, JsonFailure> {\n    serde_json::from_str(s).map_err(JsonFailure::from)\n}"
          new_decode="pub fn from_json<'a, T: Deserialize<'a>>(s: &'a str) -> Result<T, serde_json::Error> {\n    serde_json::from_str(s)\n}"
          anchors=[(p,old_decode),(p,old_encode),(f,'Category::Data => JsonFailureKind::Data,'),(f,'line: e.line(),\n            column: e.column(),'),(t,'Self::Json(error)')]
          for text,anchor in anchors:assert text.count(anchor)==1,anchor
          decode_line=next(i for i,l in enumerate(test.read_text().splitlines(),1) if 'let decode:' in l)
          encode_line=next(i for i,l in enumerate(test.read_text().splitlines(),1) if 'let encode:' in l)
          mutants=[
           ('raw-public-parse-type',protocol,p.replace(old_decode,new_decode),False,'type',decode_line),
           ('raw-public-serialize-type',protocol,p.replace(old_encode,new_encode),False,'type',encode_line),
           ('wrong-data-category',failure,f.replace('Category::Data => JsonFailureKind::Data,','Category::Data => JsonFailureKind::Syntax,'),False,'runtime','safe_kind_position_wording_and_conversion_remain_exact_for_all_categories'),
           ('discard-position',failure,f.replace('line: e.line(),\n            column: e.column(),','line: 0,\n            column: 0,'),False,'runtime','parse_positions_still_match_real_serde_syntax_eof_and_data_errors'),
           ('wrong-transport-variant',tls,t.replace('Self::Json(error)','Self::Protocol(error.to_string())'),True,'runtime','safe_kind_position_wording_and_conversion_remain_exact_for_all_categories'),
          ]
          verified=[]
          try:
           for name,path,text,server,oracle,witness in mutants:
            try:
             path.write_text(text)
             print('DQ0_MUTANT',name,json.dumps({'path':str(path.relative_to(root)),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'oracle':oracle,'witness':witness}),flush=True)
             code,output=focus(name,server)
             assert code==101,(name,code)
             if oracle=='type':
              assert output.count('error[E0308]')==1 and f'test_public_json_failure.rs:{witness}:' in output,(name,witness)
              assert 'JsonFailure' in output and 'serde_json::Error' in output and 'test result:' not in output,name
              assert not re.search(r'error\[E(?!0308)',output),name
              result={'oracle':'specific public return-type contract E0308','line':witness,'exit':code}
             else:
              failures=re.findall(r'^test (\w+) \.\.\. FAILED$',output,re.M)
              assert witness in failures and 'test result: FAILED.' in output and 'error[E' not in output,(name,failures)
              result={'oracle':'executed named behavioral assertion','failed':failures,'exit':code}
             verified.append(name);print('DQ0_MUTANT_VERIFIED',name,json.dumps(result),flush=True)
            finally:
             path.write_bytes(original[path]);assert hashes()==baseline_hashes,name
             print('DQ0_RESTORED',name,json.dumps(hashes(),sort_keys=True),flush=True)
          finally:
           for path,data in original.items():path.write_bytes(data)
           assert hashes()==baseline_hashes
           print('DQ0_FINAL_HASHES',json.dumps(hashes(),sort_keys=True),flush=True)
          assert len(verified)==5,verified
          for server in [False,True]:full('restored-'+('server' if server else 'ungated'),server)
          assert hashes()==baseline_hashes
          print('DQ0_ALL_FIVE_MUTANTS_AND_FULL_RESTORATION_VERIFIED',json.dumps(verified),flush=True)
          PYRUN
  dq0-dart:
    name: DQ0 unchanged real Dart cross-language fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation/mobile/selahcue_controller
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Exact source checkout
        working-directory: ${{ github.workspace }}
        run: |
          test "$(git rev-parse HEAD^)" = "1457af0ffcfacb6081f3f777c83da43f6ec333ca"
          git checkout --detach 1457af0ffcfacb6081f3f777c83da43f6ec333ca
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Locked real Dart fixture suite without source drift
        run: |
          python3 - <<'PYDART'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd();lock=root/'pubspec.lock'
          paths=[root/'lib/models/protocol.dart',root/'lib/models/session.dart',root/'test/models/protocol_test.dart',lock]
          initial={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          original=lock.read_bytes()
          print('DQ0_DART_INITIAL_HASHES',json.dumps(initial,sort_keys=True),flush=True)
          subprocess.run(['flutter','pub','get','--enforce-lockfile'],check=True)
          resolved=lock.read_bytes();marker=b'\nsdks:\n'
          assert original.count(marker)==1 and resolved.count(marker)==1
          assert original.split(marker)[0]==resolved.split(marker)[0],'pub get changed locked package graph'
          print('DQ0_DART_LOCKED_GRAPH_IDENTICAL',json.dumps({'sdkMetadataRewritten':resolved!=original}),flush=True)
          lock.write_bytes(original)
          subprocess.run(['flutter','test','--no-pub','test/models/protocol_test.dart'],check=True)
          assert initial=={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          print('DQ0_DART_FIXTURES_AND_SOURCE_HASHES_IDENTICAL',json.dumps(initial,sort_keys=True),flush=True)
          PYDART
