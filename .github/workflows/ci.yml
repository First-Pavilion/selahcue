name: wave2 exact-source Remote observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: exact NAX full-suite Remote observation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Observe unchanged waits, polls and assertions in isolated copies
        run: |
          python3 - <<'PY'
          """Hosted-only full-suite Remote observation; no assertion, wait or timer changes."""
          import ast
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          expected_source = '25f8a347b6eb926cf2b2c300e7761ff67cf31c3e'
          actual_parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert actual_parent == expected_source
          source = root / 'implementation/desktop/crates/selahcue-operator/dist'

          def replace_once(text, before, after):
              assert text.count(before) == 1, ('unique observation anchor required', before[:100], text.count(before))
              return text.replace(before, after, 1)

          with tempfile.TemporaryDirectory(prefix='selahcue-nax-remote-observation-') as temp:
              staged = Path(temp)
              copied = staged / 'dist'
              shutil.copytree(source, copied)
              script = copied / 'remote.js'
              original_remote = script.read_text()
              remote = original_remote
              remote = replace_once(remote, '  var mutationPending = false;\n', '''  var mutationPending = false;
            var observationRows = window.__rcObservationRows = [];
            function observeRemote(event, detail) {
              if (observationRows.length >= 2048) { window.__rcObservationOverflow = true; return; }
              var warning = document.getElementById("rc-action-error");
              var live = document.getElementById("rc-live");
              var counts = {};
              (window.__calls || []).forEach(function (c) {
                if (c.cmd.indexOf("remote_") === 0) counts[c.cmd] = (counts[c.cmd] || 0) + 1;
              });
              observationRows.push({seq:observationRows.length, mono_ms:performance.now(), clock_ms:Date.now(),
                event:event, detail:detail || null, mutationPending:mutationPending,
                active:root.classList.contains("active"), polling:!!polling,
                warningHidden:warning ? warning.hidden : null,
                warningDisplay:warning ? getComputedStyle(warning).display : null,
                live:live ? live.textContent : null, busy:root.getAttribute("aria-busy"), remoteCounts:counts});
            }
            window.__rcObserve = observeRemote;
          ''')
              remote = replace_once(remote, '    return INVOKE(cmd, args || {});',
                                    '    observeRemote("request:dispatch", {cmd:cmd, args:args || {}});\n    return INVOKE(cmd, args || {});')
              remote = replace_once(remote, '    if (live) live.textContent = msg;',
                                    '    if (live) live.textContent = msg;\n    observeRemote("announce", {message:msg});')
              remote = replace_once(remote, '  function applySnapshot(snap) {',
                                    '  function applySnapshot(snap, origin) {\n    observeRemote("applySnapshot:before", {origin:origin || "unspecified"});')
              remote = replace_once(remote, '    if (error) error.hidden = true;\n    render();',
                                    '    if (error) error.hidden = true;\n    render();\n    observeRemote("applySnapshot:after", {origin:origin || "unspecified"});')
              remote = replace_once(remote, '  function loadSnapshot() {\n    return invoke("remote_snapshot").then(applySnapshot).catch(function () {', '''  function loadSnapshot(origin) {
              observeRemote("snapshot:request", {origin:origin || "unspecified"});
              return invoke("remote_snapshot").then(function (snap) {
                observeRemote("snapshot:complete", {origin:origin || "unspecified"});
                return applySnapshot(snap, origin);
              }).catch(function () {
                observeRemote("snapshot:rejected", {origin:origin || "unspecified"});''')
              remote = replace_once(remote, '  function showUnconfirmed() {',
                                    '  function showUnconfirmed() {\n    observeRemote("showUnconfirmed:before");')
              remote = replace_once(remote, '    announce("Change not confirmed by the host. Showing the last confirmed device state.");',
                                    '    announce("Change not confirmed by the host. Showing the last confirmed device state.");\n    observeRemote("showUnconfirmed:after");')
              remote = replace_once(remote, '    return loadSnapshot();', '    return loadSnapshot("reconcile");')
              remote = replace_once(remote, '  function mutate(cmd, args, success) {',
                                    '  function mutate(cmd, args, success) {\n    observeRemote("mutation:entry", {cmd:cmd});')
              remote = replace_once(remote, '    return invoke(cmd, args).then(function (snap) {\n      applySnapshot(snap);',
                                    '    return invoke(cmd, args).then(function (snap) {\n      observeRemote("command:complete", {cmd:cmd});\n      applySnapshot(snap, "mutation:" + cmd);')
              remote = replace_once(remote, '      mutationPending = false;\n      render();',
                                    '      mutationPending = false;\n      render();\n      observeRemote("mutation:finally", {cmd:cmd});')
              remote = replace_once(remote, '  function rcPoll() {',
                                    '  function rcPoll() {\n    observeRemote("rcPoll:entry");')
              remote = replace_once(remote,
                                    '    lastPollSettle = Promise.allSettled([loadSnapshot(), checkHostConnection()]).then(function () { polling = false; });',
                                    '    lastPollSettle = Promise.allSettled([loadSnapshot("poll"), checkHostConnection()]).then(function () { polling = false; observeRemote("rcPoll:settled"); });')
              remote = replace_once(remote, '  loadSnapshot();\n  render();', '  loadSnapshot("init");\n  render();')
              # The literal timer statements and callback queues are not replaced or disabled.
              timer_lines = [line for line in original_remote.splitlines() if 'setInterval(' in line or 'setTimeout(' in line]
              assert timer_lines == [line for line in remote.splitlines() if 'setInterval(' in line or 'setTimeout(' in line]
              script.write_text(remote)

              original_driver = (root / 'scripts/operator_headless.py').read_text()
              harness = original_driver
              harness = replace_once(harness, '_REPO = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))',
                                    '_REPO = ' + repr(str(root)))
              harness = replace_once(harness, 'import json\n', 'import json\nimport html as html_codec\n')
              harness = replace_once(harness, '  function ok(c,m){ R.push((c?"PASS":"FAIL")+": "+m); }',
                                    '  function ok(c,m){ if (m.indexOf("Remote no-op") === 0 && window.__rcObserve) window.__rcObserve("driver:assertion", {message:m,result:!!c}); R.push((c?"PASS":"FAIL")+": "+m); }')
              harness = replace_once(harness, '    window.__calls.push({cmd:cmd, args:args});',
                                    '    window.__calls.push({cmd:cmd, args:args});\n    if (cmd.indexOf("remote_") === 0 && window.__rcObserve) window.__rcObserve("mock:request", {cmd:cmd});')
              harness = replace_once(harness, '        rcNoopCase.fire();\n        await waitFor(function(){ return el("surface-remote").getAttribute("aria-busy") === "false"; });', '''        if (window.__rcObserve) window.__rcObserve("driver:no-op-click:before", {cmd:rcNoopCase.cmd});
                  rcNoopCase.fire();
                  if (window.__rcObserve) window.__rcObserve("driver:no-op-click:after", {cmd:rcNoopCase.cmd});
                  await waitFor(function(){ return el("surface-remote").getAttribute("aria-busy") === "false"; });
                  if (window.__rcObserve) window.__rcObserve("driver:no-op-wait:complete", {cmd:rcNoopCase.cmd});''')
              harness = replace_once(harness, '    el("__r").textContent = "RESULTS\\n"+R.join("\\n")+"\\nDONE("+R.length+")";',
                                    '    el("__r").textContent = "RESULTS\\n"+R.join("\\n")+"\\nDONE("+R.length+")"+"\\nRC_OBSERVATIONS_BEGIN\\n"+JSON.stringify({overflow:!!window.__rcObservationOverflow,rows:window.__rcObservationRows || []})+"\\nRC_OBSERVATIONS_END";')
              harness = replace_once(harness, '    m = _RESULTS_RE.search(run.stdout)\n', '''    observation = re.search(r"RC_OBSERVATIONS_BEGIN\\n(.*?)\\nRC_OBSERVATIONS_END", run.stdout, re.S)
              if observation:
                  print("REMOTE_TRACE_JSON " + html_codec.unescape(observation.group(1)))
              m = _RESULTS_RE.search(run.stdout)
          ''')
              # Preserve the full assertion sites and every real timer/wait argument in the source.
              assert original_driver.count('ok(') == harness.count('ok(')
              for prefix in ('  var waitFor=', '  var sleep=', '  var settleMicro='):
                  before = next(line for line in original_driver.splitlines() if line.startswith(prefix))
                  after = next(line for line in harness.splitlines() if line.startswith(prefix))
                  assert before == after
              ast.parse(harness)
              (staged / 'operator_headless.py').write_text(harness)
              env = {**os.environ, 'SELAHCUE_HEADLESS_REQUIRE':'1', 'SELAHCUE_OPERATOR_DIST':str(copied),
                     'PYTHONPATH':str(root / 'scripts') + os.pathsep + os.environ.get('PYTHONPATH','')}
              print('OBSERVATION_SOURCE', expected_source, 'ALL_ASSERTIONS_AND_TIMERS_RETAINED', flush=True)
              result = subprocess.run([sys.executable, str(staged / 'operator_headless.py')],
                                      env=env, text=True, capture_output=True, timeout=180)
              print('OBSERVATION_EXIT', result.returncode, flush=True)
              print(result.stdout, flush=True)
              print(result.stderr, file=sys.stderr, flush=True)
              trace_lines = [line for line in result.stdout.splitlines() if line.startswith('REMOTE_TRACE_JSON ')]
              assert len(trace_lines) == 1, 'actual completed observation trace required'
              trace = json.loads(trace_lines[0].removeprefix('REMOTE_TRACE_JSON '))
              assert not trace['overflow'], 'bounded trace overflow cannot certify complete event order'
              print('OBSERVATION_ROWS', len(trace['rows']), flush=True)
              # Report every original suite assertion's result. No ignore/retry or green wrapper.
              sys.exit(result.returncode)
          PY
