name: wave3 Y0 actual modal fixture and consumer sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver:
    name: Y0 complete browser baseline three mutants and exact restoration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full unchanged driver baseline mutants restoration
        run: |
          python3 -u - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path
          
          source = '6ff7d6d6bdb60da3d64b29b0222ea97d6a50c8ba'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines() == ['.github/workflows/ci.yml']
          script = Path('scripts/operator_headless.py')
          app = Path('implementation/desktop/crates/selahcue-operator/dist/app.js')
          fixture_dir = Path('implementation/desktop/crates/selahcue-operator/fixtures/get_chapter')
          protected = [script, app, Path('implementation/desktop/crates/selahcue-operator/src/main.rs'), Path('implementation/desktop/crates/selahcue-operator/src/chapter_reply_contract_tests.rs'), *sorted(fixture_dir.iterdir())]
          original = {p:p.read_bytes() for p in protected}
          sha = lambda b:hashlib.sha256(b).hexdigest()
          records = []
          
          def restored():
              assert all(p.read_bytes() == b for p,b in original.items())
          
          def run(name, expected_failure):
              env = dict(os.environ, SELAHCUE_HEADLESS_REQUIRE='1')
              result = subprocess.run([sys.executable,'-u',str(script)],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=300)
              text = result.stdout
              Path(name+'.log').write_text(text)
              print(text,flush=True)
              summary = re.findall(r'^=== (\d+) checks, (\d+) FAIL ===$',text,re.M)
              failures = re.findall(r'^FAIL: (.*)$',text,re.M)
              new = re.findall(r'^(PASS|FAIL): Y0 host fixture: (.*)$',text,re.M)
              assert len(summary)==1 and int(summary[0][0])==2906,(name,summary)
              assert len(new)==75,(name,len(new))
              if expected_failure:
                  assert result.returncode==1 and int(summary[0][1])>0 and failures,(name,result.returncode,summary,failures)
                  assert all(f.startswith('Y0 host fixture:') for f in failures),(name,failures)
                  assert any(expected_failure in f for f in failures),(name,expected_failure,failures)
              else:
                  assert result.returncode==0 and summary==[('2906','0')] and not failures,(name,result.returncode,summary,failures)
              record={'name':name,'returncode':result.returncode,'summary':summary,'new_pass':sum(k=='PASS' for k,m in new),'new_fail':sum(k=='FAIL' for k,m in new),'old2831_pass':True,'failures':failures,'log_sha256':sha(text.encode()),'effective_script_sha256':sha(script.read_bytes()),'effective_app_sha256':sha(app.read_bytes())}
              records.append(record)
              print('Y0_FRONTEND_ACTUAL_RESULT='+json.dumps(record),flush=True)
          
          try:
              restored()
              run('baseline',None)
              # Returning to the legacy JS parser for one captured request must be caught
              # by exact provenance hits AND actual canonical spelling/full verse content.
              s=original[script].decode()
              old='return c.request.reference === (args && args.reference) &&'
              assert s.count(old)==1
              s=s.replace(old,'return c.request.reference !== "gen 1" && c.request.reference === (args && args.reference) &&',1)
              old='if (window.__chapterFixturesOnly) return Promise.reject('
              assert s.count(old)==1
              s=s.replace(old,'if (window.__chapterFixturesOnly && args.reference !== "gen 1") return Promise.reject(',1)
              script.write_text(s)
              run('fixture-bypass-to-old-parser','real canonical chapter/translation shown bare-chapter')
              script.write_bytes(original[script]);restored()
              print('Y0_FRONTEND_EXACT_RESTORE=fixture-bypass-to-old-parser',flush=True)
              # Break the actual UI nullable-navigation consumer, not fixture expectations.
              s=original[app].decode();old='prev.disabled = !chapter.prev;';assert s.count(old)==1
              app.write_text(s.replace(old,'prev.disabled = false;',1))
              run('nullable-prev-consumer','previous navigation consumes actual nullable prev bare-chapter')
              app.write_bytes(original[app]);restored()
              print('Y0_FRONTEND_EXACT_RESTORE=nullable-prev-consumer',flush=True)
              # Stop consuming the host canonical reference for a typed whole chapter.
              s=original[app].decode();old='if (ch.verse_start == null) return { reference: ch.reference, note: "" };';assert s.count(old)==1
              app.write_text(s.replace(old,'if (ch.verse_start == null) return { reference: typed, note: "" };',1))
              run('typed-canonical-consumer','typed Link commits real canonical reference/selection bare-chapter')
              app.write_bytes(original[app]);restored()
              print('Y0_FRONTEND_EXACT_RESTORE=typed-canonical-consumer',flush=True)
              run('restored',None)
              restored()
              print('Y0_FRONTEND_COMPLETE='+json.dumps({'source':source,'records':records,'original_hashes':{str(p):sha(b) for p,b in original.items()},'all_restored':True,'full_suites':5,'mutants':3,'original_assertions':2831,'new_assertions':75,'actual_count':2906}),flush=True)
          finally:
              for p,b in original.items():
                  p.write_bytes(b)
              restored()
              print('Y0_FRONTEND_FINAL_EXACT_RESTORE=true',flush=True)
          PY
