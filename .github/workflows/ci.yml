name: wave3 CSSOM cleanup viewport sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: AYETD actual unsafe-restore unpinned mutations and identical restoration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full siblings and real caller baseline three mutants restored
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          source = '479e6d458bd11d034f83e61fc5e208133413a66a'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines() == ['.github/workflows/ci.yml']
          script = root/'scripts/operator_headless.py'
          callers = root/'scripts/test_pipe_safe_launchers.py'
          original = script.read_bytes()
          dist = root/'implementation/desktop/crates/selahcue-operator/dist'
          def hashes():
              files = sorted(p for p in dist.rglob('*') if p.is_file())+[script,callers]
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          initial = hashes()
          print('AYETD_EXACT_SOURCE_COMPONENT_PROOF',source,json.dumps(initial),flush=True)

          def run(label, expected=(), unpinned=False):
              caller = subprocess.run([sys.executable,str(callers),'OperatorViewport'],text=True,capture_output=True,timeout=60)
              print('AYETD_CALLER',label,'EXIT',caller.returncode,flush=True)
              print(caller.stdout,flush=True)
              print(caller.stderr,flush=True)
              if unpinned:
                  assert caller.returncode == 1 and 'FAILED (failures=1)' in caller.stderr and "[] != ['--window-size=800,600']" in caller.stderr
              else:
                  assert caller.returncode == 0 and 'Ran 1 test' in caller.stderr and 'OK' in caller.stderr
              result = subprocess.run([sys.executable,str(script)],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1'},text=True,capture_output=True,timeout=240)
              print('AYETD_BROWSER',label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              failures = re.findall(r'^FAIL: (.*)$',result.stdout,re.M)
              assert '=== 2565 checks,' in result.stdout
              if unpinned:
                  # An unpinned default might coincidentally match on another Chrome build;
                  # the real caller contract above must still catch the missing guarantee.
                  assert len(failures) <= 1 and all(x.startswith('AYETD viewport control:') for x in failures),failures
                  assert result.returncode == (1 if failures else 0)
              elif expected:
                  assert result.returncode == 1 and len(failures) == len(expected), failures
                  assert all(any(f.startswith(prefix) for f in failures) for prefix in expected), failures
              else:
                  assert result.returncode == 0 and not failures and '=== 2565 checks, 0 FAIL ===' in result.stdout
              for control in ['CSSOM-PARSE-03','CSSOM-PARSE-05 first swap','CSSOM-PARSE-05 second swap']:
                  assert 'PASS: AYETD exception premise: '+control in result.stdout, (label,control)
              for control in ['AYETD isolation control:','CSSOM-PARSE-03:','CSSOM-PARSE-05:','CSSOM-PARSE-05 (false-red guard):','F30: the real PP-GEN predicate rejects brightness delivered through var()','WKG danger composed/media_danger','AYZVG cached UI replay:']:
                  assert 'PASS: '+control in result.stdout, (label,control)
              print('AYETD_VERIFIED',label,json.dumps({'checks':2565,'callerExit':caller.returncode,'browserFailures':failures}),flush=True)

          def unsafe(name):
              text = original.decode()
              start = text.index('        function '+name+'() {')
              end = text.index('        '+name+'();',start)
              block = text[start:end]
              assert block.count('          try {') == 1
              assert block.count('          } finally { window.__CSSTEXT = wSavedCssText; }') == 1
              # Preserve normal restoration; only exceptional cleanup is reverted.
              changed = block.replace('          try {','          {',1).replace('          } finally { window.__CSSTEXT = wSavedCssText; }','          }\n          window.__CSSTEXT = wSavedCssText;',1)
              script.write_text(text[:start]+changed+text[end:])

          try:
              run('baseline')
              unsafe('wCheckRejectedRawSource')
              run('CSSOM03_original_unsafe_restore',['AYETD exception cleanup: CSSOM-PARSE-03'])
              script.write_bytes(original)
              assert hashes() == initial
              unsafe('wCheckCommentRawSource')
              run('CSSOM05_original_unsafe_restore',['AYETD exception cleanup: CSSOM-PARSE-05 first swap','AYETD exception cleanup: CSSOM-PARSE-05 second swap'])
              script.write_bytes(original)
              assert hashes() == initial
              text = original.decode()
              assert text.count(', "--window-size=800,600"') == 1
              script.write_text(text.replace(', "--window-size=800,600"','',1))
              run('unpinned_operator_caller',unpinned=True)
          finally:
              script.write_bytes(original)
              assert hashes() == initial
              print('AYETD_IDENTICAL_RESTORATION_PROOF',json.dumps(hashes()),flush=True)
          run('restored')
          print('AYETD_BASELINE_THREE_MUTANTS_RESTORED_VERIFIED',flush=True)
          PY
