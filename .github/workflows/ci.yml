name: wave3 Restore cached UI replay review RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: AYZVG real modal poll Cancel selection replay RED
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full siblings unchanged production and actual modal replay
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          result = subprocess.run([sys.executable,str(root/'scripts/operator_headless.py')],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1'},text=True,capture_output=True,timeout=240)
          print('UNCHANGED_PRODUCT_CODY_AYZVG_01_RED','EXIT',result.returncode,flush=True)
          print(result.stdout,flush=True)
          print(result.stderr,file=sys.stderr,flush=True)
          failures = re.findall(r'^FAIL: (.*)$',result.stdout,re.M)
          behavior = [item for item in failures if not re.match(r'\d+ checks ran;',item)]
          assert len(behavior) == 1 and behavior[0].startswith('AYZVG cached UI replay:'), behavior
          for control in ['replay modal premise:','replay stale-view premise:','replay no-confirmation control:','false:','absent after false:','malformed after false:','unknown control:','true control:','poll demotion:','newer failure:','live-output control:']:
              assert 'PASS: AYZVG '+control in result.stdout, control
          assert result.returncode != 0
          sys.exit(result.returncode)
          PY
