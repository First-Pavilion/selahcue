name: wave2 plan-deck library mutation proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: NAX baseline mutation restored full DOM gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full siblings baseline, isolated publication mutant, restored source
        run: |
          python3 - <<'PY'
          """Hosted-only proof: mutate an isolated copy, retain the full sibling suite."""
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root / 'implementation/desktop/crates/selahcue-operator/dist'
          env = {**os.environ, 'SELAHCUE_HEADLESS_REQUIRE': '1'}
          command = [sys.executable, str(root / 'scripts/operator_headless.py')]

          def run(label, dist=None):
              invocation_env = dict(env)
              if dist is not None:
                  invocation_env['SELAHCUE_OPERATOR_DIST'] = str(dist)
              result = subprocess.run(command, env=invocation_env, text=True, capture_output=True, timeout=180)
              print(label, 'EXIT', result.returncode, flush=True)
              print(result.stdout, flush=True)
              print(result.stderr, file=sys.stderr, flush=True)
              return result

          baseline = run('BASELINE')
          assert baseline.returncode == 0 and '2384 checks, 0 FAIL' in baseline.stdout
          with tempfile.TemporaryDirectory(prefix='selahcue-nax-publication-mutant-') as temp:
              copied = Path(temp) / 'dist'
              shutil.copytree(source, copied)
              script = copied / 'app.js'
              original = script.read_text()
              anchor = '''        planDecksGen += 1;
                  planDecks = view && Array.isArray(view.decks) ? view.decks : null;
                  planDecksLatest = Promise.resolve(planDecks || []);
                  lastRendered = ""; // The next view poll must repaint links even if host items did not change.
          '''
              assert original.count(anchor) == 1, 'publication anchor must identify exactly one real production hook'
              script.write_text(original.replace(anchor, '', 1))
              mutant = run('PUBLICATION_MUTANT', copied)
              assert mutant.returncode == 1, 'only an actual behavioral assertion RED satisfies the mutation'
              assert re.search(r'2384 checks, [1-9][0-9]* FAIL', mutant.stdout)
              assert 'FAIL: NAX: a fresh library snapshot clears a false missing chip/count' in mutant.stdout
              assert 'FAIL: NAX: a superseded plan caller receives' in mutant.stdout
              assert 'PASS: NAX control: applying a library payload adds no hidden deck_list round trip' in mutant.stdout
              assert 'PASS: planLoadDecks catch-path guard: a stale, late-arriving FAILURE' in mutant.stdout
              script.write_text(original)
              read_fence = '          if (gen !== pmLibLoadGen || planGen !== planDecksGen) return;\n'
              assert original.count(read_fence) == 2, 'identify success and error publication fences only'
              script.write_text(original.replace(read_fence, ''))
              read_mutant = run('LIBRARY_READ_FENCE_MUTANT', copied)
              assert read_mutant.returncode == 1, 'real held-library assertions must catch the removed read fences'
              assert re.search(r'2384 checks, [1-9][0-9]* FAIL', read_mutant.stdout)
              assert 'FAIL: NAX library-read: late pre-restore refresh' in read_mutant.stdout
              assert "FAIL: NAX library-read: obsolete Library reply cannot replace a superseded plan caller's newer returned data" in read_mutant.stdout
              assert 'FAIL: NAX library-read: obsolete failed refresh' in read_mutant.stdout
              assert 'PASS: NAX library-read control: the real Undo button completes one host restore' in read_mutant.stdout
              assert 'PASS: NAX library-read control: the latest ordinary reload still publishes current data and completes' in read_mutant.stdout
              script.write_text(original)
              remote_script = copied / 'remote.js'
              remote_original = remote_script.read_text()
              remote_anchor = '      else showUnconfirmed();'
              assert remote_original.count(remote_anchor) == 1, 'mutate the actual no-op feedback branch'
              remote_script.write_text(remote_original.replace(remote_anchor, '      else { /* diagnostic: omit unconfirmed feedback */ }', 1))
              remote_mutant = run('REMOTE_UNCONFIRMED_MUTANT', copied)
              assert remote_mutant.returncode == 1, 'the deterministic immediate-action oracle must remain sensitive'
              assert re.search(r'2384 checks, [1-9][0-9]* FAIL', remote_mutant.stdout)
              assert 'FAIL: Remote no-op remote_approve: unfulfilled result is visibly unconfirmed rather than announced as success' in remote_mutant.stdout
              assert 'FAIL: Remote no-op remote_deny: unfulfilled result is visibly unconfirmed rather than announced as success' in remote_mutant.stdout
              assert 'FAIL: Remote no-op remote_revoke: unfulfilled result is visibly unconfirmed rather than announced as success' in remote_mutant.stdout
              assert 'FAIL: Remote no-op remote_set_role: unfulfilled result is visibly unconfirmed rather than announced as success' in remote_mutant.stdout
              assert 'PASS: Remote: Approve moves the request into paired devices' in remote_mutant.stdout
              assert 'PASS: NAX library-read: late pre-restore refresh cannot roll back' in remote_mutant.stdout
              remote_script.write_text(remote_original)
              source_files = {p.relative_to(source): p.read_bytes() for p in source.rglob('*') if p.is_file()}
              restored_files = {p.relative_to(copied): p.read_bytes() for p in copied.rglob('*') if p.is_file()}
              assert restored_files == source_files, 'restored dist must byte-match the complete unchanged source'
              print('RESTORED_DIST_IDENTICAL', len(source_files), 'files', flush=True)
              restored = run('RESTORED', copied)
              assert restored.returncode == 0 and '2384 checks, 0 FAIL' in restored.stdout
              assert script.read_text() == original
          print('MUTATION_VERIFIED: baseline GREEN, publication/read-fence/Remote-feedback mutants assertion RED, restored GREEN', flush=True)
          PY
