name: wave3 Restore permission current-source sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: AYZVG cache gate lifetime mutants and identical restoration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full siblings baseline three sensitive mutants and restored source
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          source = 'cc02f3572c0db3a5046cc5a532a2f6ab33e608bb'
          parent = subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert parent == source, (parent,source)
          changed = subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines()
          assert changed == ['.github/workflows/ci.yml'], changed
          dist = root/'implementation/desktop/crates/selahcue-operator/dist'
          app = dist/'app.js'
          original = app.read_bytes()
          script = root/'scripts/operator_headless.py'
          def hashes():
              files = sorted(p for p in dist.rglob('*') if p.is_file())
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in files+[script]}
          initial = hashes()
          print('CURRENT_SOURCE_COMPONENT_PROOF',json.dumps({'source':source,'diagnosticParent':parent,'workflowOnly':changed,'manifest':initial}),flush=True)

          def run(label, expected):
              assert hashlib.sha256(script.read_bytes()).hexdigest() == initial[str(script.relative_to(root))]
              result = subprocess.run([sys.executable,str(script)],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1'},text=True,capture_output=True,timeout=240)
              print('AYZVG_CASE',label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              actual = re.findall(r'^FAIL: (.*)$',result.stdout,re.M)
              assert '=== 2552 checks,' in result.stdout
              if not expected:
                  assert result.returncode == 0 and not actual, (label,result.returncode,actual)
                  assert '=== 2552 checks, 0 FAIL ===' in result.stdout
              else:
                  assert result.returncode == 1 and actual, (label,result.returncode,actual)
                  assert all(name.startswith('AYZVG ') for name in actual), actual
                  for name in expected:
                      assert any(item.startswith(name) for item in actual), (label,name,actual)
              for control in ['unknown control:','unknown action control:','true control:','malformed after true control:','live-output control:']:
                  assert 'PASS: AYZVG '+control in result.stdout, (label,control)
              print('AYZVG_VERIFIED',label,json.dumps({'checks':2552,'failures':actual}),flush=True)

          def mutate(before,after,count):
              text = original.decode()
              assert text.count(before) == count, (before,text.count(before),count)
              app.write_text(text.replace(before,after))

          try:
              run('baseline',[])
              mutate('if (canEdit === null) return;','if (canEdit === null || canEdit === false) return;',1)
              run('cache_false_verdict_dropped',['AYZVG false:','AYZVG absent after false:','AYZVG malformed after false:','AYZVG poll demotion:','AYZVG visible demotion:'])
              app.write_bytes(original)
              assert hashes() == initial
              mutate('planLastConfirmedCanEdit === false','false',3)
              run('permission_gates_removed',['AYZVG false:','AYZVG absent after false:','AYZVG malformed after false:','AYZVG poll demotion:'])
              app.write_bytes(original)
              assert hashes() == initial
              mutate('!list.contains(p)','false',2)
              run('failed_open_lifetime_fence_removed',['AYZVG superseded failure:','AYZVG newer failure:'])
          finally:
              app.write_bytes(original)
              assert hashes() == initial, 'all dist files and harness must restore identically'
              print('RESTORED_COMPONENT_PROOF',json.dumps(hashes()),flush=True)
          run('restored',[])
          print('AYZVG_BASELINE_THREE_MUTANTS_RESTORED_VERIFIED',flush=True)
          PY
