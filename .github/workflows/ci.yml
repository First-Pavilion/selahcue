name: wave3 Transcripts shared error boundary sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: AXPP3 baseline shared-boundary raw-original restored
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full siblings and actual raw-rendering regression mutants
        run: |
          python3 - <<'PY'
          import ast
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root/'implementation/desktop/crates/selahcue-operator/dist'
          driver = root/'scripts/operator_headless.py'
          expected = [n.value.value for n in ast.parse(driver.read_text()).body
                      if isinstance(n,ast.Assign) and isinstance(n.value,ast.Constant)
                      and any(isinstance(t,ast.Name) and t.id == 'EXPECTED_MIN_CHECKS' for t in n.targets)][-1]
          assert expected == 2536
          old_ref = 'cbd5e4e98c81c70e454970fc8b25580efa6312cd'
          old_path = 'implementation/desktop/crates/selahcue-operator/dist/transcripts.js'
          old_blob = subprocess.check_output(['git','rev-parse',old_ref+':'+old_path],text=True).strip()
          assert old_blob == '7f8b889a19a4e1b367d4d8fc0bf9b04822a27140'
          old_source = subprocess.check_output(['git','show',old_ref+':'+old_path])
          print('EXACT_ORIGINAL_SOURCE',old_ref,old_blob,hashlib.sha256(old_source).hexdigest(),flush=True)

          def run(label,dist=source):
              result = subprocess.run([sys.executable,str(driver)],
                                      env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1','SELAHCUE_OPERATOR_DIST':str(dist)},
                                      text=True,capture_output=True,timeout=240)
              print(label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              return result

          def clean(result):
              assert result.returncode == 0 and f'=== {expected} checks, 0 FAIL ===' in result.stdout

          def controls(result):
              for operation in ['generate','save','confirm','discard']:
                  modes = ['reject','refused','unknown'] if operation == 'generate' else ['reject','refused']
                  for mode in modes:
                      for kind in ['pending','pending control','accepted-data control','success control']:
                          assert 'PASS: AXPP3 '+kind+'/'+operation+'/'+mode in result.stdout
              assert 'PASS: TR REGEN-4: the refusal reason renders INLINE' in result.stdout
              assert 'PASS: F30: the real PP-GEN predicate rejects brightness delivered through var()' in result.stdout
              assert 'PASS: WKG danger composed/media_danger' in result.stdout

          baseline = run('BASELINE')
          clean(baseline)
          controls(baseline)
          with tempfile.TemporaryDirectory(prefix='selahcue-wave3-axpp3-mutants-') as temp:
              copied = Path(temp)/'dist'
              shutil.copytree(source,copied)
              script = copied/'transcripts.js'
              original = script.read_bytes()
              text = original.decode()
              anchor = '    return fallback;\n  }\n  function showGenError'
              assert text.count(anchor) == 1
              script.write_text(text.replace(anchor,'    return message || fallback;\n  }\n  function showGenError',1))
              unsafe = run('UNSAFE_SHARED_MESSAGE_BOUNDARY_MUTANT',copied)
              controls(unsafe)
              assert unsafe.returncode == 1 and re.search(rf'=== {expected} checks, [1-9][0-9]* FAIL ===',unsafe.stdout)
              for operation in ['generate','save','confirm','discard']:
                  assert 'FAIL: AXPP3 privacy DOM/'+operation+'/refused' in unsafe.stdout
                  assert 'FAIL: AXPP3 privacy channels/'+operation+'/refused' in unsafe.stdout
                  assert 'PASS: AXPP3 privacy DOM/'+operation+'/reject' in unsafe.stdout
              assert 'FAIL: AXPP3 privacy DOM/generate/unknown' in unsafe.stdout
              script.write_bytes(old_source)
              original_regression = run('EXACT_ORIGINAL_RAW_RENDERING_MUTANT',copied)
              controls(original_regression)
              assert original_regression.returncode == 1 and f'=== {expected} checks, 24 FAIL ===' in original_regression.stdout
              for operation in ['generate','save','confirm','discard']:
                  modes = ['reject','refused','unknown'] if operation == 'generate' else ['reject','refused']
                  for mode in modes:
                      assert 'FAIL: AXPP3 privacy DOM/'+operation+'/'+mode in original_regression.stdout
                      assert 'FAIL: AXPP3 privacy channels/'+operation+'/'+mode in original_regression.stdout
              script.write_bytes(original)
              source_files = {str(p.relative_to(source)):hashlib.sha256(p.read_bytes()).hexdigest()
                              for p in source.rglob('*') if p.is_file()}
              restored_files = {str(p.relative_to(copied)):hashlib.sha256(p.read_bytes()).hexdigest()
                                for p in copied.rglob('*') if p.is_file()}
              assert source_files == restored_files and len(source_files) == 16
              print('RESTORED_DIST_IDENTICAL',len(source_files),'files',source_files,flush=True)
              print('HARNESS_UNMODIFIED',hashlib.sha256(driver.read_bytes()).hexdigest(),flush=True)
              restored = run('RESTORED',copied)
              clean(restored)
              controls(restored)
          print('MUTATION_VERIFIED: full baseline GREEN; shared-boundary and exact original raw-rendering assertion RED; identical restoration GREEN',flush=True)
          PY
