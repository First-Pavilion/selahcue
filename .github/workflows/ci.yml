# Temporary branch-only Windows proof for17tnw2b2nxe. Restore before final review.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wal-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wal-proof:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: implementation/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned Rust version
        id: rust
        working-directory: ${{ github.workspace }}
        run: echo "version=$(sh scripts/check_toolchain.sh --print-channel)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy, rustfmt
      - name: Verify pinned toolchain
        working-directory: ${{ github.workspace }}
        run: sh scripts/check_toolchain.sh
      - uses: ilammy/setup-nasm@v1
      - name: Verify Perl for vendored OpenSSL
        shell: pwsh
        run: |
          $perl = (Get-Command perl -ErrorAction Stop).Source
          & $perl -v
          & $perl -MLocale::Maketext::Simple -MIPC::Cmd -e "exit 0"
          if ($LASTEXITCODE -ne 0) { throw "verified Perl lacks OpenSSL build modules" }
          # Git Bash prepends its own incomplete Perl; bind the actual build to
          # the Windows Perl we just verified instead of consulting PATH again.
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
      - name: Build the two data regression targets with the workspace SQLCipher backend
        run: cargo test --locked -p selahcue-data --features encryption --lib --test test_transcript_repo --no-run
      - name: Twenty consecutive WAL regression runs, no retries
        run: |
          set -euo pipefail
          for iteration in $(seq 1 20); do
            echo "WAL_PROOF_START=$iteration"
            cargo test --locked -p selahcue-data --features encryption --lib checkpoint_tests -- --nocapture
            cargo test --locked -p selahcue-data --features encryption --test test_transcript_repo deleting_with_a_reader_holding_the_wal_open_does_not_stall_the_caller_or_other_writers -- --exact --nocapture
            echo "WAL_PROOF_PASS=$iteration"
          done
          echo "WAL_PROOF_COMPLETE=20"
