name: F31 bounded native observation bf
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  operator-native:
    name: native observation bf
    # Sized from real per-step timings, not a guess. Run 33984097274 (windows-latest, this
    # job's slowest OS, COLD cache -- the first run the RELEASE steps ever executed) recorded
    # these to completion before the old job's 25-minute cap killed it further down the same
    # steps: setup (checkout+toolchain+pin-check+cache-restore+staging) 66s, Clippy (RELEASE)
    # 373s, Test (RELEASE) 653s. Clippy(stt,cloud-stt)/Test(stt,cloud-stt) were themselves cut
    # off mid-step by that cap, so their duration here is the last time they ran to completion,
    # pre-merge, on PR #22's own final run (33951200403, also windows-latest): 326s + 285s, plus
    # that run's own post-job cache-save of 238s (this job now caches more artefacts than that
    # run did, so treat 238s as a floor, not a ceiling). Sum: 66 + 373 + 653 + 326 + 285 + 238 +
    # ~5 (post-checkout/complete) = 1946s ≈ 32.4 minutes. That sizing predates 86akgrz3b and no
    # longer holds:
    #
    # RAISED 45 -> 60 (86akgrz3b, Vera's performance review of PR #125). `encryption`/
    # `read-encrypted-transcripts` default-on means the vendored-OpenSSL build now compiles
    # TWICE in this job (once for the RELEASE steps, once for stt,cloud-stt) on top of the
    # `openssl-src`/`nmake` cost already described on the `operator` job above. Vera measured
    # directly on a real PR #125 run: `Clippy (RELEASE)` 181s -> 545s, `Clippy (stt,cloud-stt)`
    # 206s -> 526s. A partly-warm run was already at ~24 minutes when a subsequent push's
    # concurrency cancel landed; Vera projects ~28-30 minutes partly warm and ~39-41 of the old
    # 45-minute cap on a fully cold run -- ~10% headroom, not the ~40% this comment used to
    # claim (the arithmetic above is left in place as the pre-86akgrz3b baseline, not updated in
    # place, so the delta this bump represents stays visible). 60 minutes restores real headroom
    # over the cold-run projection.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/desktop/crates/selahcue-operator
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bf8190c26b66cc998d54cc316eeaff6823e0f8ee
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      # Refuse to gate on a compiler nobody pinned. Same script `make ci` runs, so a
      # divergence between this pipeline and the local gate fails loudly here instead
      # of silently producing a green that means nothing (86ak5rc9c).
      - name: Verify the pinned toolchain is what is running
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sh scripts/check_toolchain.sh
      # `encryption` (86akgrz3b) is now default-on for selahcue-operator too, so the RELEASE and
      # stt,cloud-stt steps below compile the vendored-OpenSSL build here as well — see the
      # `rust` job's identical pair of steps for the full reasoning; not repeated per-job.
      - name: NASM for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Verify Perl is on PATH for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $p) {
            throw "perl not found on PATH -- see the 'rust' job's identical step for the full " + `
              "reasoning."
          }
          perl -v
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop/crates/selahcue-operator
          # Main saves, pull requests only restore -- see the `rust` job (17tnw2b1f24).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same packages as `operator`'s "Linux system deps" step above, needed here for the
      # identical reason: this job compiles the same crate (Tauri webview deps) and, from the
      # stt,cloud-stt pair below, `cpal`'s ALSA backend (`libasound2-dev`).
      - name: Linux system deps (Tauri v2 webview + ALSA for cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev libxkbcommon-dev \
            libasound2-dev
      - name: Stage Tauri sidecar/resource placeholders (compile-check only)
        # tauri-build validates that the externalBin sidecar (`selahcue-output`) and the NDI
        # resource dll exist at build time. This job COMPILE-checks the operator (it does not
        # bundle the app), so empty placeholders satisfy the existence check — the real sidecar is
        # built in the packaging/release flow. Without this the build script fails on CI
        # ("resource path `binaries/selahcue-output-<triple>` doesn't exist").
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          # CREATE-ONLY. `: > file` truncates, and these names include the
          # owner-supplied NDI dll. That is harmless on an ephemeral runner, but this
          # is the snippet people copy to reproduce CI locally, where truncating a real
          # dll is silent and git-unrecoverable (binaries/ is gitignored). Never make
          # this unconditional. 86ak5rjh7.
          stage() { [ -e "$1" ] || : > "$1"; }
          if [[ "$triple" == *windows* ]]; then
            stage "binaries/selahcue-output-${triple}.exe"
          else
            stage "binaries/selahcue-output-${triple}"
          fi
          stage "binaries/Processing.NDI.Lib.x64.dll"
          echo "staged Tauri placeholders for ${triple}"
      # From the first GATE step onward, `!cancelled()`, and NO setup step after it -- same
      # rationale as `operator` above: one broken gate should cost one gate's worth of
      # information, not silently skip the rest of this job too.
      # THE release-profile gate on this crate (Sana's Medium-Low finding on PR #24, 86akcmzyq):
      # every operator test in the `operator` job above runs in DEBUG only, so `dev_env.rs`'s
      # `loads_the_env_file_iff_this_is_a_debug_build` and main.rs's
      # `the_environment_reaches_the_view_not_only_the_request` never exercised their RELEASE arm
      # in any gate -- a hardcoded argument, an inverted `!`, or a deleted early return in either
      # guard's call site would have passed every check in `operator` green. Same shape as the
      # licensing crate's RELEASE test in the `rust` job; `selahcue-operator` is excluded from
      # the workspace, so it needs its own explicit lines, on every OS this job's own matrix runs
      # (Linux; Windows when the tier includes it).
      - name: Install error-preserving runtime-only observer
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          source='bf8190c26b66cc998d54cc316eeaff6823e0f8ee'
          expected={'implementation/desktop': 'b887d01265f23aaea84d9c4298cacd99ef6d45da', 'rust-toolchain.toml': 'ce5c05ce58bc7315a053bd714ef7080757b90ad4', '.github/workflows/ci.yml': 'eb442c32705ccf67be7151118f70ef93aa438f8f', 'implementation/desktop/crates/selahcue-operator/src/autolaunch.rs': '788e87139d22ff7110c35c35c86281f765586ecb', 'implementation/desktop/crates/selahcue-operator/Cargo.toml': '59ae3b3a6af61a7cd1b0d58ea9fb87191e54c2b5', 'implementation/desktop/crates/selahcue-operator/Cargo.lock': 'c723f922b94ec828e9c4c0056d37eeb12ed33773', 'implementation/desktop/Cargo.toml': 'b4ad3a7549d380cca477a17b40d0c04010396428', 'implementation/desktop/Cargo.lock': '7d49a890267885bc0d1600f27f58b1ff967b8c3d', 'implementation/desktop/crates/selahcue-operator/build.rs': '833b7b79dab39b8dfddde35175d055a4a93e6981', 'implementation/desktop/crates/selahcue-operator/tauri.conf.json': 'f2b9449e0cd0631c84222e1e1f63720c8abff351', 'scripts/check_toolchain.sh': 'fe33642f288496a30049ba5994eb54660e558877'}
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==source
          assert {p:subprocess.check_output(['git','rev-parse',source+':'+p]).decode().strip() for p in expected}==expected
          path=pathlib.Path('src/autolaunch.rs')
          before=path.read_text()
          assert hashlib.sha256(before.encode()).hexdigest()=='a40a60f216f20052883670f0a26540dbf179b03b9b9ab9e4142774ee94f305b1'
          needle='    let child = Command::new(&sidecar).spawn().ok()?;'
          replacement='    let spawn_result = Command::new(&sidecar).spawn();\n    #[cfg(test)]\n    if let Err(error) = &spawn_result {\n        f31_native_observer::on_error(error, &sidecar);\n    }\n    let child = spawn_result.ok()?;'
          observer='// AUXILIARY DIAGNOSTIC ONLY: no work on success or before Command::spawn.\n#[cfg(test)]\nmod f31_native_observer {\n    use std::io::Read;\n    use std::os::unix::fs::MetadataExt;\n    use std::path::Path;\n    std::thread_local! {\n        pub(super) static LAST_ERRNO: std::cell::Cell<Option<i32>> = const { std::cell::Cell::new(None) };\n    }\n    fn tag() -> &\'static str {\n        let thread = std::thread::current();\n        let name = thread.name().unwrap_or("");\n        if name.ends_with("errno_26_held_writer") {\n            "control_26"\n        } else if name.ends_with("errno_13_nonexecutable") {\n            "control_13"\n        } else if name.ends_with("errno_2_missing_interpreter") {\n            "control_2"\n        } else if name\n            .ends_with("spawn_never_follows_a_symlinked_directory_to_delete_a_stale_endpoint")\n        {\n            "natural_symlink"\n        } else if name.ends_with("spawn_removes_a_stale_endpoint_from_a_private_directory") {\n            "natural_private"\n        } else {\n            "other"\n        }\n    }\n    fn text(path: &Path, cap: u64) -> Option<String> {\n        let file = std::fs::File::open(path).ok()?;\n        let mut result = String::new();\n        file.take(cap).read_to_string(&mut result).ok()?;\n        Some(result)\n    }\n    fn numeric_status() -> Vec<(&\'static str, Option<u64>)> {\n        let status = text(Path::new("/proc/self/status"), 8192).unwrap_or_default();\n        [\n            "Threads",\n            "FDSize",\n            "voluntary_ctxt_switches",\n            "nonvoluntary_ctxt_switches",\n        ]\n        .into_iter()\n        .map(|key| {\n            let value = status.lines().find_map(|line| {\n                line.strip_prefix(key)\n                    .and_then(|rest| rest.strip_prefix(\':\'))\n                    .and_then(|v| v.trim().parse::<u64>().ok())\n            });\n            (key, value)\n        })\n        .collect()\n    }\n    // No process name, argv, environment, symlink target or descriptor content is emitted.\n    fn ppid(pid: u32) -> Option<u32> {\n        let value = text(&Path::new("/proc").join(pid.to_string()).join("stat"), 2048)?;\n        value\n            .rsplit_once(") ")?\n            .1\n            .split_whitespace()\n            .nth(1)?\n            .parse()\n            .ok()\n    }\n    pub(super) fn on_error(error: &std::io::Error, sidecar: &Path) {\n        let label = tag();\n        // First observation precedes all metadata/proc scans; retain the original Error object.\n        eprintln!(\n            "F31_NATIVE_SPAWN_ERR tag={} kind={:?} raw={:?} pid={} thread={:?}",\n            label,\n            error.kind(),\n            error.raw_os_error(),\n            std::process::id(),\n            std::thread::current().id()\n        );\n        LAST_ERRNO.with(|value| value.set(error.raw_os_error()));\n        let target = std::fs::symlink_metadata(sidecar).ok();\n        let parent = sidecar\n            .parent()\n            .and_then(|p| std::fs::symlink_metadata(p).ok());\n        eprintln!(\n            "F31_NATIVE_META tag={} target={:?} parent={:?}",\n            label,\n            target.as_ref().map(|m| (\n                m.dev(),\n                m.ino(),\n                m.mode(),\n                m.uid(),\n                m.len(),\n                m.nlink(),\n                m.is_file(),\n                m.file_type().is_symlink(),\n                m.mtime(),\n                m.mtime_nsec(),\n                m.ctime(),\n                m.ctime_nsec()\n            )),\n            parent.as_ref().map(|m| (\n                m.dev(),\n                m.ino(),\n                m.mode(),\n                m.uid(),\n                m.is_dir(),\n                m.file_type().is_symlink()\n            ))\n        );\n        let sched = text(Path::new("/proc/thread-self/schedstat"), 256).map(|value| {\n            value\n                .split_whitespace()\n                .take(3)\n                .map(|v| v.parse::<u64>().ok())\n                .collect::<Vec<_>>()\n        });\n        eprintln!(\n            "F31_NATIVE_SCHED tag={} schedstat={:?} status={:?} available_parallelism={:?}",\n            label,\n            sched,\n            numeric_status(),\n            std::thread::available_parallelism().ok().map(|v| v.get())\n        );\n        let Some(target) = target else {\n            eprintln!(\n                "F31_NATIVE_FD_SCAN tag={} unavailable=target_metadata post_error_nonatomic=true",\n                label\n            );\n            return;\n        };\n        let uid = selahcue_lan::local_endpoint::current_uid();\n        if !target.is_file() || target.uid() != uid {\n            eprintln!("F31_NATIVE_FD_SCAN tag={} unavailable=not_owned_regular_file post_error_nonatomic=true", label);\n            return;\n        }\n        let mut pids = vec![std::process::id()];\n        let mut enumerated = 0usize;\n        let mut candidate_pids = Vec::new();\n        if let Ok(entries) = std::fs::read_dir("/proc") {\n            for entry in entries.flatten().take(256) {\n                enumerated += 1;\n                let Some(pid) = entry\n                    .file_name()\n                    .to_str()\n                    .and_then(|p| p.parse::<u32>().ok())\n                else {\n                    continue;\n                };\n                if pid != std::process::id()\n                    && std::fs::metadata(entry.path())\n                        .ok()\n                        .is_some_and(|m| m.uid() == uid)\n                {\n                    candidate_pids.push(pid);\n                }\n            }\n        } else {\n            eprintln!(\n                "F31_NATIVE_FD_SCAN tag={} unavailable=proc_directory post_error_nonatomic=true",\n                label\n            );\n            return;\n        }\n        candidate_pids.sort_unstable_by(|a, b| b.cmp(a));\n        let process_truncated = candidate_pids.len() > 31 || enumerated == 256;\n        pids.extend(candidate_pids.into_iter().take(31));\n        let mut scanned_pids = 0usize;\n        let mut scanned_fds = 0usize;\n        let mut unavailable = 0usize;\n        let mut truncated_pids = 0usize;\n        let mut matches = 0usize;\n        let mut rows = 0usize;\n        for pid in pids {\n            let dir = Path::new("/proc").join(pid.to_string());\n            let Ok(entries) = std::fs::read_dir(dir.join("fd")) else {\n                unavailable += 1;\n                continue;\n            };\n            scanned_pids += 1;\n            let descriptors: Vec<_> = entries.flatten().take(128).collect();\n            if descriptors.len() == 128 {\n                truncated_pids += 1;\n            }\n            for descriptor in descriptors {\n                scanned_fds += 1;\n                let Some(fd) = descriptor\n                    .file_name()\n                    .to_str()\n                    .and_then(|p| p.parse::<u32>().ok())\n                else {\n                    continue;\n                };\n                let Ok(metadata) = std::fs::metadata(descriptor.path()) else {\n                    unavailable += 1;\n                    continue;\n                };\n                if metadata.dev() != target.dev() || metadata.ino() != target.ino() {\n                    continue;\n                }\n                matches += 1;\n                if rows == 16 {\n                    continue;\n                }\n                let flags = text(&dir.join("fdinfo").join(fd.to_string()), 512).and_then(|info| {\n                    info.lines().find_map(|line| {\n                        line.strip_prefix("flags:")\n                            .and_then(|v| u64::from_str_radix(v.trim(), 8).ok())\n                    })\n                });\n                eprintln!("F31_NATIVE_FD_OWNER tag={} pid={} ppid={:?} fd={} dev={} ino={} flags={:?} access={:?}",\n                    label, pid, ppid(pid), fd, metadata.dev(), metadata.ino(), flags, flags.map(|f| f & 3));\n                rows += 1;\n            }\n        }\n        eprintln!("F31_NATIVE_FD_SCAN tag={} scanned_pids={} scanned_fds={} matches={} emitted_rows={} unavailable={} process_truncated={} fd_truncated_pids={} rows_truncated={} post_error_nonatomic=true absence_does_not_disprove_prior_writer=true",\n            label, scanned_pids, scanned_fds, matches, rows, unavailable, process_truncated, truncated_pids, matches > rows);\n    }\n}\n'
          anchor='#[cfg(test)]\nmod tests {'
          assert before.count(needle)==1 and before.count(anchor)==1
          assert '#[test]' not in observer
          changed=before.replace(needle,replacement).replace(anchor,observer+'\n'+anchor)
          assert hashlib.sha256(changed.encode()).hexdigest()=='e0bce44571657cb995b10f42d20e2032f2e47bcf7b57b60b62a0bec1ce11b68f'
          assert changed.replace(replacement,needle).replace(observer+'\n','')==before
          assert changed.split(anchor,1)[1]==before.split(anchor,1)[1]
          path.write_text(changed)
          assert subprocess.check_output(['git','diff','--name-only']).decode().strip()=='implementation/desktop/crates/selahcue-operator/src/autolaunch.rs'
          print('F31_NATIVE_CONTEXT='+json.dumps({'source':source,'objects':expected,'original_sha256':'a40a60f216f20052883670f0a26540dbf179b03b9b9ab9e4142774ee94f305b1','instrumented_sha256':'e0bce44571657cb995b10f42d20e2032f2e47bcf7b57b60b62a0bec1ce11b68f','natural_test_bodies_exact':True,'no_success_or_prespawn_observation':True,'normal_gate':False},sort_keys=True),flush=True)
          PY
      - name: Clippy (dev-keys,openai-notes, RELEASE)
        if: ${{ !cancelled() }}
        run: cargo clippy --features dev-keys,openai-notes --release --all-targets -- -D warnings
      - name: Test (dev-keys,openai-notes, RELEASE — the release refusals only hold here)
        if: ${{ !cancelled() }}
        run: cargo test --features dev-keys,openai-notes --release --no-fail-fast
      # Cloud (Deepgram) live transcription (86akby7th): `cloud-stt` wires the already-tested
      # `selahcue-stt-cloud` streaming session into `listening.rs`'s capture path. It implies
      # `stt` (mic capture lives in `selahcue-stt` regardless of which recognizer consumes it),
      # so THIS is the first step in this job that compiles `stt` -- and therefore all of
      # `listening.rs`, where the routing decision this ticket fixes actually lives -- at all.
      # Without it, `listening.rs` would be exactly as "linted and tested by nothing" as
      # `selahcue-stt` itself (the standing example every feature-gate comment in this job
      # cites). whisper-rs-sys's native build needs only a C/C++ toolchain + cmake, which all
      # three GitHub-hosted runner images carry by default -- so the `stt`-only step at the end of
      # this job (86ak4y8yr) needs no setup of its own. It is NOT true, though, that this step
      # needs no extra system packages at all: `stt` also pulls in `selahcue-stt`'s `capture`
      # feature (`CpalSource`, real microphone capture via `cpal`), and on Linux `cpal` builds
      # against ALSA -- `alsa-sys` fails to compile without the ALSA development headers.
      #
      # That gap shipped TWICE in this ticket's own remediation, which is worth recording
      # exactly rather than smoothing over. First revision: this step and the Test step below
      # were red on ubuntu only, `libasound2-dev` was missing everywhere, and a step comment
      # claiming "no extra deps" was itself the confident-but-wrong signal this job's other
      # comments warn about. Second revision (still this ticket): the fix was made -- but in
      # the WRONG job. `libasound2-dev` was added to the `rust` job's "Linux system deps"
      # step, a job that never compiles `selahcue-operator` at all (it is excluded from the
      # workspace -- see this repo's CLAUDE.md) and has no `cpal` dependency to satisfy. This
      # step and the Test step below stayed red, because each CI job runs on its OWN fresh
      # runner -- a package installed in one job's runner does not exist in another's. The
      # comment that "fixed" it even said so in the same breath it got the job wrong.
      #
      # `libasound2-dev` is installed in THIS job's ("operator-native", `ci.yml`'s
      # `operator-native:` block) OWN "Linux system deps (Tauri v2 webview + ALSA for cpal)"
      # step, a few lines above -- not a step in a different job reached by the word "above"
      # alone. Check the claim against `ci.yml`'s `operator-native:` job, not against this
      # comment. A macOS `make ci` run cannot catch this class of gap by construction (Core
      # Audio needs no such package) -- see CLAUDE.md's "One OS, not three" note; nor would a
      # mismatched-job fix ever be caught by re-reading the diff instead of the actual GitHub
      # Actions run.
      - name: Clippy (stt,cloud-stt)
        if: ${{ !cancelled() }}
        run: cargo clippy --features stt,cloud-stt --all-targets -- -D warnings
      - name: Test (stt,cloud-stt)
        if: ${{ !cancelled() }}
        run: cargo test --features stt,cloud-stt --no-fail-fast
      # `stt` ALONE -- the configuration users actually install (86ak4y8yr). `windows-installer.yml`
      # builds `cargo tauri build --features stt`, with no `cloud-stt` (that feature is
      # `RELEASE: UNSAFE`, so the Makefile strips it from release builds). The `stt,cloud-stt` pair
      # above is a DIFFERENT compilation: `cloud-stt` implies `stt`, so it lints most of
      # `listening.rs`, but `start_listening` has a `#[cfg(not(feature = "cloud-stt"))]` arm that is
      # compiled ONLY when `stt` is on and `cloud-stt` is off, i.e. only in the shipped build. Until
      # this step, no push or PR compiled that arm; the first sign of a break there would have been a
      # manual `windows-installer` run.
      #
      # Clippy, not a separate `cargo check`: clippy type-checks every cfg arm, so a compile error
      # fails here too. No `Test (stt)` step: measured on macOS, `cargo test --features stt` runs 198
      # tests and every one of them also runs in the `stt,cloud-stt` pair above (206; the 8 extras
      # are `cloud-stt`-gated), and the only non-test code that differs is that one arm. Revisit if a
      # test is ever gated `not(feature = "cloud-stt")`.
      #
      # Cost: this job already builds `whisper-rs-sys` (cmake/whisper.cpp) and the vendored OpenSSL
      # for the steps above, with an identical `selahcue-stt` feature set, so cargo reuses those
      # artefacts and this step re-checks only six packages -- `tungstenite`, `tokio-tungstenite`,
      # `selahcue-stt-cloud` (its non-`deepgram` build), `selahcue-lan`, `selahcue-app` and the
      # operator crate itself -- the same six on every OS. That is why it lives here, on every
      # OS this job runs on, rather than in a new job (a new job would pay checkout/toolchain/cache setup
      # AND a second cold whisper.cpp + OpenSSL build per OS) and rather than Linux-only (Windows
      # is the one OS the installer ships on, and this job's own history rejects dropping it).
      # Measured on PR #137's run 36819129002: 5s on ubuntu (a full cache miss, so `whisper-rs-sys`
      # had just been built cold by the step before and was still reused), 10s on windows, 16s on
      # macOS; 7s locally on macOS arm64. If a later run shows a matrix arm near `timeout-minutes`,
      # the fallback is a Linux-only `if:` here -- the cfg arm is platform-independent -- not
      # removing the step.
      - name: Clippy (stt -- the shipped configuration, no cloud-stt)
        if: ${{ !cancelled() }}
        run: cargo clippy --features stt --all-targets -- -D warnings

      - name: Bounded additional native observations then deliberate errno controls
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,signal,subprocess,time
          source='bf8190c26b66cc998d54cc316eeaff6823e0f8ee'
          source_path=pathlib.Path('src/autolaunch.rs')
          original=subprocess.check_output(['git','show',source+':implementation/desktop/crates/selahcue-operator/src/autolaunch.rs'])
          instrumented=source_path.read_bytes()
          assert hashlib.sha256(original).hexdigest()=='a40a60f216f20052883670f0a26540dbf179b03b9b9ab9e4142774ee94f305b1'
          assert hashlib.sha256(instrumented).hexdigest()=='e0bce44571657cb995b10f42d20e2032f2e47bcf7b57b60b62a0bec1ce11b68f'
          controls='// Added ONLY after all original natural suites; these are deliberate errno controls, not reproduction.\n#[cfg(test)]\nmod f31_native_errno_controls {\n    use super::*;\n    use std::os::unix::fs::PermissionsExt;\n    fn fixture(missing_interpreter: bool) -> (tempfile::TempDir, PathBuf, PathBuf) {\n        let dir = tempfile::tempdir().expect("private control directory");\n        std::fs::set_permissions(dir.path(), std::fs::Permissions::from_mode(0o700))\n            .expect("private mode");\n        let sidecar = dir.path().join("selahcue-output");\n        let script = if missing_interpreter {\n            "#!/__selahcue_f31_diag_missing_interpreter\\nexit 0\\n"\n        } else {\n            "#!/bin/sh\\nexit 0\\n"\n        };\n        if missing_interpreter {\n            assert!(!Path::new("/__selahcue_f31_diag_missing_interpreter").exists());\n        }\n        std::fs::write(&sidecar, script).expect("control script");\n        std::fs::set_permissions(&sidecar, std::fs::Permissions::from_mode(0o755))\n            .expect("control executable");\n        let operator = dir.path().join("selahcue-operator");\n        let endpoint = dir.path().join("selahcue-operator-endpoint.json");\n        (dir, operator, endpoint)\n    }\n    #[test]\n    fn errno_26_held_writer() {\n        let (_dir, operator, endpoint) = fixture(false);\n        let writer = std::fs::OpenOptions::new()\n            .write(true)\n            .open(output_sidecar_path(&operator))\n            .expect("held writable descriptor");\n        f31_native_observer::LAST_ERRNO.with(|v| v.set(None));\n        assert!(spawn_output_window_with(&operator, &endpoint, 1, Duration::ZERO).is_none());\n        assert_eq!(f31_native_observer::LAST_ERRNO.with(|v| v.get()), Some(26));\n        drop(writer);\n    }\n    #[test]\n    fn errno_13_nonexecutable() {\n        let (_dir, operator, endpoint) = fixture(false);\n        std::fs::set_permissions(\n            output_sidecar_path(&operator),\n            std::fs::Permissions::from_mode(0o644),\n        )\n        .expect("no executable bits");\n        f31_native_observer::LAST_ERRNO.with(|v| v.set(None));\n        assert!(spawn_output_window_with(&operator, &endpoint, 1, Duration::ZERO).is_none());\n        assert_eq!(f31_native_observer::LAST_ERRNO.with(|v| v.get()), Some(13));\n    }\n    #[test]\n    fn errno_2_missing_interpreter() {\n        let (_dir, operator, endpoint) = fixture(true);\n        f31_native_observer::LAST_ERRNO.with(|v| v.set(None));\n        assert!(spawn_output_window_with(&operator, &endpoint, 1, Duration::ZERO).is_none());\n        assert_eq!(f31_native_observer::LAST_ERRNO.with(|v| v.get()), Some(2));\n    }\n}\n'
