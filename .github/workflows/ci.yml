name: wave2 unsaved notes fallback mutation proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: notes baseline mutant restored full DOM gates
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full siblings baseline, isolated fallback mutant, restored source
        run: |
          python3 - <<'PY'
          """Hosted-only mutation proof; change an isolated dist copy, never the checkout."""
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root / 'implementation/desktop/crates/selahcue-operator/dist'
          env = {**os.environ, 'SELAHCUE_HEADLESS_REQUIRE': '1'}
          command = [sys.executable, str(root / 'scripts/operator_headless.py')]

          def run(label, dist=None):
              invocation_env = dict(env)
              if dist is not None:
                  invocation_env['SELAHCUE_OPERATOR_DIST'] = str(dist)
              result = subprocess.run(command, env=invocation_env, text=True, capture_output=True, timeout=180)
              print(label, 'EXIT', result.returncode, flush=True)
              print(result.stdout, flush=True)
              print(result.stderr, file=sys.stderr, flush=True)
              return result

          baseline = run('BASELINE')
          assert baseline.returncode == 0 and '2358 checks, 0 FAIL' in baseline.stdout
          with tempfile.TemporaryDirectory(prefix='selahcue-dq6-fallback-mutant-') as temp:
              copied = Path(temp) / 'dist'
              shutil.copytree(source, copied)
              script = copied / 'transcripts.js'
              original = script.read_text()
              anchor = 'transcriptId: (typeof res.transcript_id === "number") ? res.transcript_id : null,'
              assert original.count(anchor) == 1, 'mutation anchor must identify exactly one production fallback'
              script.write_text(original.replace(anchor, anchor.replace(': null,', ': openId,'), 1))
              mutant = run('FALLBACK_MUTANT', copied)
              assert mutant.returncode == 1, 'only a real behavioral assertion RED satisfies this mutation'
              assert re.search(r'2358 checks, [1-9][0-9]* FAIL', mutant.stdout)
              assert 'FAIL: DQ6:' in mutant.stdout
              assert "PASS: DQ6 control: real accepted Edit/Save sends one update and persists the operator's wording" in mutant.stdout
              script.write_text(original)
              restored = run('RESTORED', copied)
              assert restored.returncode == 0 and '2358 checks, 0 FAIL' in restored.stdout
              assert script.read_text() == original
          print('MUTATION_VERIFIED: baseline GREEN, exact fallback mutant assertion RED, restored GREEN', flush=True)

          PY
