              assert subprocess.check_output(['git','diff','--name-only']).decode().strip()==''
              print('F31_NATIVE_EXACT_ORIGINAL_RESTORED_SHA256='+'a40a60f216f20052883670f0a26540dbf179b03b9b9ab9e4142774ee94f305b1',flush=True)
          print('F31_NATIVE_MATRIX_RESULT='+json.dumps({'source':source,'natural_trials':trials,'deliberate_control':control_result,'original_healthy':healthy_result,'sticky_failure':sticky,'hard_deadline_seconds':300,'process_budget_seconds':295,'cleanup_margin_seconds':5,'max_additional_full':4,'max_focused':4,'no_retry_until_green':True},sort_keys=True),flush=True)
          raise SystemExit(1 if sticky else 0)
