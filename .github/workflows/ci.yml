name: wave3 DNU HTTPS admission GREEN and sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementation/desktop
    steps:
      - uses: actions/checkout@v7
      # Disk headroom on the hosted Linux runner (17tnw2b2k23). From about 21:00 UTC on
      # 2026-10-04 this job failed on every run, in the "LAN server + app server features"
      # step, with the same code, the same runner image and the same Rust cache that had
      # passed an hour earlier: the runner has one 72 GB disk with 13.3 GB free, and this job
      # writes about 16.4 GB to it. A full disk crashes the runner agent, which loses the step
      # logs of the whole job (BlobNotFound), so those failures could not be read back.
      #
      # `free` deletes preinstalled software this job never uses (Android SDK, .NET, GHC,
      # CodeQL; about 21.7 GB, takes about 40 to 90 s) BEFORE anything is built, only on a
      # GitHub-hosted runner, and only when the runner is small: it SKIPS (and prints "skipped")
      # when 40 GB or more is free at job start. On the runners seen on 2026-10-05 (86 GB free)
      # the deletion therefore does not run at all; it was proven on the 13.3 GB runners of
      # 2026-10-04 and matters again only if the pool shrinks. Either way the step prints the
      # start figure. The `check` steps below are headroom alarms with a floor per
      # checkpoint, set on the step: each fails its own step, by name, while there is still
      # room to write. The last step warns below 10 GB free and adds one line to the job
      # summary. Linux only: macOS and Windows runners did not fail and are left alone. The
      # free step and the first check sit in the setup zone and the rest carry a status
      # function, as check_workflows.py requires. All the numbers, and why each floor is what
      # it is, are in scripts/ci_disk.sh.
      - name: Free disk space and report it at job start (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sh scripts/ci_disk.sh free
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      # Refuse to gate on a compiler nobody pinned. Same script `make ci` runs, so a
      # divergence between this pipeline and the local gate fails loudly here instead
      # of silently producing a green that means nothing (86ak5rc9c).
      - name: Verify the pinned toolchain is what is running
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sh scripts/check_toolchain.sh
      # `encryption` (86akgrz3b) is now a Cargo DEFAULT feature of both selahcue-desktop and
      # selahcue-data, so EVERY step below that builds this workspace with no --no-default-
      # features override — Format doesn't touch code, but Clippy (default features) and
      # Test (workspace) both do — now compiles rusqlite's `bundled-sqlcipher-vendored-openssl`,
      # which builds OpenSSL from source via openssl-src. That needs a Perl interpreter
      # (Configure) and NASM (assembly-optimized crypto routines) on Windows only — Linux and
      # macOS need just the C/C++ toolchain the runner already has (see selahcue-data/Cargo.toml's
      # `encryption` comment). Before 86akgrz3b this was moot because the feature was off by
      # default everywhere; now it is the actual, load-bearing reason the "Test (at-rest
      # encryption)" step further down no longer excludes Windows.
      #
      # ilammy/setup-nasm is the action the rust-openssl ecosystem commonly uses for exactly this
      # gap (pinned major version, matching this workflow's existing convention for narrowly-
      # scoped third-party actions like ilammy/msvc-dev-cmd and Swatinem/rust-cache).
      - name: NASM for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      # windows-latest is DOCUMENTED to ship Strawberry Perl, but "documented to" is not
      # "verified here" — asserting it explicitly turns a wrong assumption into a clear, named
      # failure at this step instead of a confusing OpenSSL Configure error buried inside a
      # `cargo build` several steps later.
      - name: Verify Perl is on PATH for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $p) {
            throw "perl not found on PATH -- the encryption feature's vendored-OpenSSL build " + `
              "(now default-on, 86akgrz3b) cannot run its Configure step without it. " + `
              "windows-latest is documented to ship Strawberry Perl; if this throws, the " + `
              "runner image changed and perl must be installed explicitly (e.g. " + `
              "'choco install strawberryperl')."
          }
          perl -v
      # Quinn's process finding on PR #24 (86akcmzyq): the PR template's feature-flag-
      # reachability section is three checkboxes a human ticks, unenforced by CI — exactly the
      # human step that let 86akby7d8 ship, merge, and stay invisible from `make launch` in the
      # first place. This makes it a build failure instead: asserts `make -n launch`/`make -n
      # operator`'s resolved feature list is a superset of the features the product has decided
      # must be default-reachable (dev-keys/openai-notes today, 86akcmzrd).
      #
      # Linux only now (this was Linux + macOS until the macOS leg left CI on 2026-10-05,
      # 17tnw2b2nxk; a Mac's own `make ci` still runs this script); Windows excluded. The history
      # below is why macOS had been included. Originally Linux-only, citing this pipeline's `nfr` job
      # as precedent for "make is not cross-OS-reliable" — Cody and Quinn (PR #24 remediation)
      # independently tested that precedent and it does not hold: `nfr`'s macOS skip is about a
      # one-time recorded timing baseline, and its Windows skip is about a POSIX shell script
      # doing memory measurement, neither of which is about Make itself being unreliable
      # cross-OS. Cody read the feature computation this script inspects and found zero
      # $(UNAME)-conditional branching in it — the Makefile's only OS-conditional code selects
      # NDI library paths and which shell wrapper launches the operator, not which Cargo features
      # get requested. Quinn confirmed empirically by running every one of this script's
      # self-test mutations successfully on macOS. Leaving macOS unguarded left uncovered exactly
      # the platform most likely to run `make launch` interactively — the signed `.app` path
      # exists for its microphone permissions — for the regression class this check exists to
      # catch. Windows stays excluded: GNU Make dry-run parsing there is unproven, unlike Linux
      # and macOS which both ship `make` by default.
      - name: Feature-flag reachability (make launch / make operator resolve the required set)
        # Setup-zone `if:` (implicit success()), NOT !cancelled(): this step sits before Format,
        # the first gate below, and check_workflows.py's ordinal rule forbids a success()-default
        # step running after a !cancelled() one — verified by running that checker against this
        # exact placement.
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/check_launch_reachability.py --self-test
          python3 scripts/check_launch_reachability.py
      # 17tnw2b2jfy: the translation-mirror converter's self-test (synthetic USFM, no network, about
      # a second) and the licence rules it enforces on the committed allowlist. Same setup-zone
      # placement and `if:` as the reachability step above, for the same ordinal-rule reason.
      - name: Translation mirror converter self-test
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/build_translation_catalog.py --self-test
      # 17tnw2b2jqd: the publish half of the same mirror (scripts/publish_translations.py, run by the manual
      # publish-translations workflow). Its self-test needs no network, no `aws` and no credentials: a fake `aws`
      # (a POSIX script, hence the same non-Windows `if:`) and a fake network stand in. Same setup-zone placement as
      # the converter step above, for the same ordinal-rule reason.
      - name: Translation publish script self-test
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/publish_translations.py --self-test
      # 17tnw2b9aga: the logic of the check `make nfr` (below, under xvfb) runs on the real release host's
      # stdout/stderr log: the live Operator token must not be in it. Offline and display-free; same
      # setup-zone placement and `if:` as the steps above, for the same ordinal-rule reason.
      - name: NFR token-leak check self-test
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_nfr_token_leak.py --self-test
      # 17tnw2b9ax3: the logic of `make audit` (scripts/cargo_audit_all.sh), run against a stub `cargo` in
      # throwaway git repos: offline, no cargo-audit, no advisory database. It proves the local audit cannot
      # print PASS for a root it did not check. (The audit itself needs the network and is not run here: the
      # `audit` job below is its hosted counterpart.) The script is POSIX sh, hence the same non-Windows
      # `if:`; same setup-zone placement as the steps above, for the same ordinal-rule reason.
      - name: Audit script (make audit) self-test
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_cargo_audit_all.py --self-test
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop
          # Save from `main` only (17tnw2b1f24). The cache key has no ref in it, so a pull
          # request restores main's entry exactly; what it must not do is SAVE its own copy.
          # Every PR run used to write a private 0.3-1.6 GB entry per job and OS, which put
          # the repo over its Actions cache limit and got main's own entries evicted, so
          # main's jobs then started cold.
          #
          # THE COST, so nobody removes this in a hurry. A PR can only restore what main
          # holds. While main has no entry for a job -- the job is red on main (a red job
          # saves nothing; macOS operator-native today, via flaky test 17tnw2b1vyy), the
          # entry was evicted, or a lockfile/toolchain change moved the key -- EVERY push of
          # EVERY PR runs that job cold. Before, a PR's first push seeded an entry its later
          # pushes reused. A cold Windows operator-native job is about 35 min against about
          # 4 warm. The remedy is to keep main's entries whole (17tnw2b1waw), not to let PRs
          # save again. Same line on every rust-cache step below; check_workflows.py fails
          # the build if one is missing.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system deps (winit/wgpu + software Vulkan for GPU parity)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libvulkan1 mesa-vulkan-drivers libdbus-1-dev
      # A real serif face, so the typography tests can do real work (86ak643rc).
      #
      # `themes_differing_only_in_typography_never_share_a_measurement` (selahcue-present)
      # needs one INSTALLED face that shapes differently from the BUNDLED Noto Sans, or its
      # serif comparisons cannot tell a font-blind cache key from a correct one. On Linux an
      # unresolved family name falls back to that same bundled face — see
      # `a_missing_font_falls_back_readably_and_deterministically` in selahcue-engine — so
      # with no real serif installed the test cannot pass. That is why it went red on this
      # runner and only this runner.
      #
      # WHAT THIS BUYS, PRECISELY -- it matters if anyone weighs dropping the pinned package.
      # It RESTORES a layer of checking; it is NOT what holds the font/weight cache-key
      # contract up. That contract is carried by `every_shaping_attribute_is_part_of_the_cache_key`,
      # which compares KEYS rather than frames and deliberately uses an uninstalled family, so
      # it needs no font at all. Measured on a bare ubuntu:24.04 with zero fonts installed:
      # that test PASSES unmutated, and still goes RED when `font` is dropped from
      # `measure::Key` (7 passed/1 failed unmutated; 6 passed/2 failed mutated). So a runner
      # without a serif still guards the contract -- what it loses is the LAYOUT-level check,
      # and it loses it LOUDLY: the typography test fails naming every face it looked for.
      #
      # WHY THE PACKAGE IS DECLARED HERE AT ALL. fonts-liberation is already on the
      # ubuntu-latest image, but only as an undocumented transitive dependency (of Chrome) --
      # the published ubuntu-24.04 software manifest lists just fonts-noto-color-emoji under
      # fonts. Resting a gate on a package nobody declared is the fragile inheritance this
      # step removes. Declaring it is the point.
      #
      # WHY THE VERSION IS *NOT* PINNED -- this was pinned to =1:2.1.5-3 and the pin was wrong.
      # Measured in containers:
      #   ubuntu:24.04  candidate 1:2.1.5-3       LiberationSerif-Regular.ttf sha256 705903ae...
      #   ubuntu:26.04  candidate 1:2.1.5-3build1 LiberationSerif-Regular.ttf sha256 350f4ffd...
      # `ubuntu-26.04` is already a preview runner label and GitHub migrates `-latest` gradually
      # over 1-2 months, so during that window the SAME commit can land on either image and the
      # 26.04 half dies with "E: Version '1:2.1.5-3' for 'fonts-liberation' was not found".
      # That reads as a flake on `main` and blocks everyone, not just this branch -- a bigger
      # failure than the drift the pin was meant to prevent. Note also the two packages ship
      # DIFFERENT BYTES, so the version string was never pinning the face the test measures; it
      # pinned a packaging label that merely correlates with one.
      #
      # WHAT IS PINNED INSTEAD: the property, asserted at the point of use. The `test -f` below
      # is the real contract -- a serif face present at a path fontdb scans -- and the test
      # itself independently proves that face RESOLVES and DIFFERS from the bundled Noto Sans,
      # failing with a diagnostic that names every candidate if it does not. An assertion about
      # the thing we need beats a version string that stands in for it.
      #
      # Rejected alternatives: pinning the .ttf's sha256 (tighter than the version pin and
      # dated the same way -- it would fail on a face that works perfectly); vendoring the .ttf
      # (the path under test is specifically "a font the OS provides", and it would still need
      # a copy-into-/usr/share/fonts step here, plus a binary asset and a licence file).
      # Pinning the runner image to `ubuntu-24.04` in the matrix would ALSO fix this and is
      # arguably better -- but it is a matrix-wide reproducibility decision affecting every job
      # and OS, with its own EOL/security-update cost, so it belongs in its own change and not
      # smuggled in under a font fix.
      - name: Linux fonts (a real serif face for the typography tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-liberation
          # Assert the file LANDED -- fail here, not 20 minutes later inside a test. This is
          # one layer of the contract, not all of it: it proves a serif face exists at a path
          # fontdb scans, NOT that fontdb resolves it or that it measures differently from the
          # bundled face. Those two are asserted at runtime by `verdict()` in installed_serif.
          test -f /usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf
      # Floor 10 GB here and after clippy (healthy runs show about 30 GB at both): the workspace
      # test step that follows writes 7.1 GB, so 5 GB would let a runner that had 9.6 to 11.7 GB
      # free AT JOB START (before the 4.6 GB written up to this point) crash with no red step
      # ahead of it. The two checks after the tests use 5 GB.
      - name: Disk space before the gates, cache restored (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        env:
          CI_DISK_MIN_FREE_GB: "10"
        run: sh scripts/ci_disk.sh check before-gates-cache-restored
      # From the first GATE step onward, `!cancelled()`. Setup steps above deliberately
      # keep the default `success()`: if checkout, the toolchain install or the pin
      # assertion fails, every downstream result is meaningless or measured on the wrong
      # compiler, so running them would produce noise rather than information.
      - name: Actual focused GREEN, three sensitive mutants and exact restored GREEN
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: |
          python3 - <<'PYDNU'
          import hashlib, json, re, subprocess
          from pathlib import Path
          variants = {'licensing-constructor': {'path': 'implementation/desktop/crates/selahcue-licensing/src/client.rs', 'text': '//! The licensing client: sign-in, and both shipped activation paths.\n//!\n//! Everything here runs over the injected [`HttpTransport`], so the tests drive the whole\n//! surface — including every failure mode — with no network, and the shell swaps in the\n//! real `ReqwestTransport` without a code change.\n//!\n//! # Both paths, permanently\n//!\n//! - [`LicensingClient::sign_in`] then [`LicensingClient::activate_with_session`] is the\n//!   **primary** path (DEC-005/007, DEC-011 pt 3): `POST /v1/sessions`, then\n//!   `POST /v1/activations:with-session` with the session as a bearer. These are the\n//!   server\'s native-client routes (86ak5t1gw, ADR-0029). They need no cookie and no CSRF\n//!   token, and this client sends neither: the transport seam can carry a bearer and\n//!   nothing else, and `tests/test_client.rs` pins that nothing here names a cookie, a CSRF\n//!   header or the browser\'s `/graphql/account` route.\n//!   A valid activation is followed by one `/v1/sessions:revoke` attempt; its\n//!   separate cleanup result never masks the activated device.\n//! - [`LicensingClient::activate_with_enrollment_key`] is the **delegation** path, and is\n//!   not legacy. It exists for the case DEC-011 records: a volunteer setting up machines\n//!   in the sound booth, who would otherwise need the administrator\'s account password on\n//!   every device. An enrolment key is the credential that does exactly one thing.\n//!\n//! Removing either path was considered and rejected by the owner. Both stay.\n//!\n//! # What a response is allowed to become\n//!\n//! A response body is untrusted text: the API\'s, but equally a proxy\'s, a WAF\'s or Django\'s\n//! CSRF page. It is read by the transport under a hard byte cap, refused here above\n//! [`MAX_RESPONSE_BODY_BYTES`] without being parsed, and never copied into a failure — see\n//! [`crate::error`]. A body that is not the API\'s coded envelope is classified by its\n//! HTTP status alone.\n//!\n//! # Nothing here gates anything\n//!\n//! There is no `check`, `enforce` or `is_allowed` in this crate. It obtains credentials\n//! and reports what happened. Enforcement is 86ak5mn1t and is ladder-shaped by design\n//! (FR-520). A failure of any kind returns an [`ActivationFailure`], every variant of\n//! which permits presentation.\n\nuse crate::contract::{\n    ActivationRequest, ActivationResponse, ApiErrorEnvelope, ErrorCode, LicenseDto,\n    SessionActivationRequest, SessionRequest, SessionResponse, SessionRevokeResponse, TokenMetaDto,\n    ACTIVATIONS_PATH, ACTIVATIONS_WITH_SESSION_PATH, SESSIONS_PATH, SESSION_REVOKE_PATH,\n};\nuse crate::custody::DeviceCredentials;\nuse crate::device::{DeviceIdentity, IdempotencyKey};\nuse crate::error::ActivationFailure;\nuse selahcue_cloud::transport::{require_https_base_url, require_loopback_test_url};\nuse selahcue_cloud::{\n    HttpResponse, HttpTransport, SecretError, SecretStore, Token, TransportError,\n};\nuse serde::de::DeserializeOwned;\n\n/// The most response body this client will parse.\n///\n/// Every success body here is a few hundred bytes and every coded error is under 200, so\n/// 64 KiB is two orders of magnitude of headroom. The transport already refuses to *read*\n/// more than `MAX_TRANSPORT_RESPONSE_BYTES` (4 MiB) off the socket; this is the second,\n/// tighter bound for what is handed to a parser, and it holds for any transport, including\n/// a test double. A body over it is refused unparsed and is never quoted.\npub const MAX_RESPONSE_BODY_BYTES: usize = 64 * 1024;\n\n/// Which path produced an activation.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ActivationPath {\n    /// Account sign-in (`POST /v1/activations:with-session`) — the primary path.\n    AccountSession,\n    /// Enrollment key (`POST /v1/activations`) — the delegation path.\n    EnrollmentKey,\n}\n\n/// A signed-in account session.\n#[derive(Debug, Clone)]\npub struct AccountSession {\n    /// The session token. Redacted in `Debug`; hand it straight to\n    /// [`LicensingClient::activate_with_session`] or to custody.\n    pub token: Token,\n    pub expires_at: String,\n    pub role: String,\n    pub org_id: String,\n}\n\n/// What the server said about this device\'s token.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum TokenDisposition {\n    /// A token was issued — store it, replacing anything cached.\n    Store(Token),\n    /// The device already holds a live token and the server will not re-show it\n    /// (show-once). Keep what is cached.\n    KeepExisting,\n}\n\n/// The result of persisting an activation.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum PersistOutcome {\n    /// A new or replacement token was written to the secret store.\n    Stored,\n    /// The server replayed and this install already holds its token. Nothing to do.\n    KeptExisting,\n    /// **The awkward one.** The server replayed — so it will not re-show the token — but\n    /// this install has no token cached. That happens if the keychain entry was deleted\n    /// or the machine was re-imaged while the server-side device row stayed live.\n    ///\n    /// It cannot be resolved by retrying: show-once means the server will keep replaying.\n    /// Recovery is to deactivate the device server-side (freeing its slot) and activate\n    /// again. Reported rather than hidden, because a silent "success" that leaves the\n    /// install with no credential is worse than a state the operator can act on — and\n    /// because, per CON-P1, this still stops nothing: the app presents regardless.\n    MissingLocally,\n}\n\n/// The bootstrap account session\'s cleanup, independent of device activation.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum SessionCleanup {\n    /// The server positively acknowledged revoking the presented session.\n    Revoked,\n    /// One cleanup attempt was not confirmed. Retain custody for an explicit retry;\n    /// never erase a device credential or turn the valid activation into a failure.\n    RetryRequired(ActivationFailure),\n}\n\n/// Device persistence and local account cleanup have separate outcomes.\n#[derive(Debug, Clone)]\npub struct PersistedActivation {\n    pub activation: Activation,\n    pub device_persistence: Result<PersistOutcome, SecretError>,\n    /// False when remote cleanup was unconfirmed or another session is stored.\n    /// A keychain error is reported separately from the successfully activated device.\n    pub account_session_cleared: Result<bool, SecretError>,\n}\n\n/// A successful activation. Both paths answer with the same body, so every field is\n/// present whichever way the device was activated.\n#[derive(Debug, Clone)]\npub struct Activation {\n    /// Which path was used.\n    pub path: ActivationPath,\n    /// The show-once token, when one was issued.\n    pub token: Option<Token>,\n    /// True on a first activation.\n    pub created: bool,\n    /// True when a replacement token was minted for an existing device because its own was\n    /// expired or revoked. A `true` here means the previously cached token is now revoked.\n    pub reminted: bool,\n    pub device_public_id: String,\n    pub platform: String,\n    /// Non-secret token metadata.\n    pub token_meta: TokenMetaDto,\n    /// The backing licence.\n    pub license: LicenseDto,\n    /// Account activations attempt one immediate native cleanup; enrollment activation is None.\n    pub session_cleanup: Option<SessionCleanup>,\n}\n\nimpl Activation {\n    /// What to do with the device token.\n    pub fn disposition(&self) -> TokenDisposition {\n        match &self.token {\n            Some(token) => TokenDisposition::Store(token.clone()),\n            None => TokenDisposition::KeepExisting,\n        }\n    }\n\n    /// The licensing status this activation establishes.\n    ///\n    /// Both paths report the server-side instance id, so this is the one field that is\n    /// meaningful whichever way the device was activated. Persisting it for display across\n    /// restarts is the console\'s business (86ajy7anx) — it is not a secret, and it is\n    /// deliberately not put in the secret store alongside the token.\n    pub fn status(&self) -> crate::LicensingStatus {\n        crate::LicensingStatus::Activated {\n            device_public_id: self.device_public_id.clone(),\n        }\n    }\n\n    /// Persist the outcome into the OS secret store, doing the right thing for each of\n    /// the three server outcomes.\n    ///\n    /// Provided so a caller cannot get the re-mint case wrong: when `reminted` is true the\n    /// previously cached token has already been revoked server-side and will 401 on its\n    /// next use, so overwriting is mandatory rather than an optimisation.\n    pub fn persist<S: SecretStore>(\n        &self,\n        credentials: &DeviceCredentials<S>,\n    ) -> Result<PersistOutcome, SecretError> {\n        match self.disposition() {\n            TokenDisposition::Store(token) => {\n                credentials.store_device_token(&token)?;\n                Ok(PersistOutcome::Stored)\n            }\n            TokenDisposition::KeepExisting => {\n                if credentials.is_activated()? {\n                    Ok(PersistOutcome::KeptExisting)\n                } else {\n                    Ok(PersistOutcome::MissingLocally)\n                }\n            }\n        }\n    }\n}\n\n/// A client for the Platform API\'s licensing surfaces.\npub struct LicensingClient<T: HttpTransport> {\n    transport: T,\n    base_url: String,\n}\n\nimpl<T: HttpTransport> LicensingClient<T> {\n    /// A client against an HTTPS base, e.g. `https://api.selahcue.example`.\n    ///\n    /// Invalid/non-HTTPS configuration is refused before any call can carry a password,\n    /// enrollment key or bearer. The error contains no URL, query, userinfo or parser text.\n    pub fn new(transport: T, base_url: impl Into<String>) -> Result<Self, TransportError> {\n        let base_url = base_url.into();\n        let _ = &base_url;\n        Ok(LicensingClient {\n            transport,\n            base_url,\n        })\n    }\n\n    /// Explicit local HTTP fixture constructor, never the normal application constructor.\n    /// Accepts HTTPS or HTTP with a parsed loopback host only. A real HTTP fixture must also\n    /// explicitly use `ReqwestTransport::new_for_loopback_tests`.\n    pub fn new_for_loopback_tests(\n        transport: T,\n        base_url: impl Into<String>,\n    ) -> Result<Self, TransportError> {\n        let base_url = base_url.into();\n        require_loopback_test_url(&base_url)?;\n        Ok(LicensingClient {\n            transport,\n            base_url,\n        })\n    }\n\n    /// The transport, for tests that assert what left the device.\n    pub fn transport(&self) -> &T {\n        &self.transport\n    }\n\n    fn url(&self, path: &str) -> String {\n        format!("{}{}", self.base_url.trim_end_matches(\'/\'), path)\n    }\n\n    // -----------------------------------------------------------------------\n    // Primary path: account sign-in, then session-authenticated activation\n    // -----------------------------------------------------------------------\n\n    /// Sign in with email and password, returning an account session.\n    ///\n    /// `POST /v1/sessions`. The password is used once, here, and is never stored: only the\n    /// returned session token is persisted, and only in the OS secret store.\n    ///\n    /// A refusal is classified by [`ActivationFailure::from_sign_in_code`], not by\n    /// `from_code`: a wrong password is [`ActivationFailure::InvalidCredentials`], not "the\n    /// session is not valid".\n    pub fn sign_in(\n        &self,\n        email: &str,\n        password: &Token,\n    ) -> Result<AccountSession, ActivationFailure> {\n        let request = SessionRequest {\n            email: email.to_string(),\n            password: password.expose().to_string(),\n        };\n        let body = Self::encode(&request)?;\n        let response = self.post(SESSIONS_PATH, &body, None)?;\n        let parsed: SessionResponse = Self::decode(response, ActivationFailure::from_sign_in_code)?;\n        if Self::unusable_bearer(&parsed.session_token) {\n            // The server never issues one. Accepting it would store a blank (or header-\n            // splitting) credential and send it as the bearer on the next call, which fails as\n            // an unexplained 401. Nothing about the value is repeated.\n            return Err(ActivationFailure::Malformed(\n                "the response carried an unusable session token".into(),\n            ));\n        }\n\n        Ok(AccountSession {\n            token: parsed.session_token,\n            expires_at: parsed.expires_at,\n            role: parsed.role,\n            org_id: parsed.org_id,\n        })\n    }\n\n    /// Activate this device against a signed-in account session — the **primary**\n    /// activation path.\n    ///\n    /// `POST /v1/activations:with-session` with the session as the bearer. The caller\'s org\n    /// is resolved server-side from the session, so no key and no org id are sent. The\n    /// server requires the session\'s role to be ADMIN (a MEMBER is\n    /// [`ActivationFailure::PermissionDenied`]).\n    pub fn activate_with_session(\n        &self,\n        session: &Token,\n        identity: &DeviceIdentity,\n        idempotency_key: &IdempotencyKey,\n    ) -> Result<Activation, ActivationFailure> {\n        let mut activation = self.request_session_activation(session, identity, idempotency_key)?;\n        self.cleanup_session(session, &mut activation);\n        Ok(activation)\n    }\n\n    fn request_session_activation(\n        &self,\n        session: &Token,\n        identity: &DeviceIdentity,\n        idempotency_key: &IdempotencyKey,\n    ) -> Result<Activation, ActivationFailure> {\n        if Self::unusable_bearer(session) {\n            // Nothing sensible can be sent: the server would answer 401 to a blank bearer, and\n            // a control character cannot be put in a header at all. Say so without a request.\n            return Err(ActivationFailure::Unauthenticated);\n        }\n        let request = SessionActivationRequest {\n            idempotency_key: idempotency_key.as_str().to_string(),\n            device_fingerprint: identity.fingerprint.clone(),\n            platform: identity.platform.clone(),\n            app_version: identity.app_version.clone(),\n            display_name: identity.display_name.clone(),\n        };\n        let body = Self::encode(&request)?;\n        let response = self.post(ACTIVATIONS_WITH_SESSION_PATH, &body, Some(session))?;\n        let parsed: ActivationResponse = Self::decode(response, |code| {\n            ActivationFailure::from_code(code, ActivationPath::AccountSession)\n        })?;\n\n        Self::activation(ActivationPath::AccountSession, parsed)\n    }\n\n    fn cleanup_session(&self, session: &Token, activation: &mut Activation) {\n        activation.session_cleanup = Some(match self.revoke_session(session) {\n            Ok(()) => SessionCleanup::Revoked,\n            Err(failure) => SessionCleanup::RetryRequired(failure),\n        });\n    }\n\n    /// End this account session without cookies or CSRF. One request, no implicit retries.\n    /// This is also the explicit cancellation/retry operation; it never touches device custody.\n    pub fn revoke_session(&self, session: &Token) -> Result<(), ActivationFailure> {\n        if Self::unusable_bearer(session) {\n            return Err(ActivationFailure::Unauthenticated);\n        }\n        let response = self.post(SESSION_REVOKE_PATH, "{}", Some(session))?;\n        let parsed: SessionRevokeResponse = Self::decode(response, |code| match code {\n            // NOT_FOUND here does not mean the device\'s license has lapsed.\n            ErrorCode::NotFound => ActivationFailure::Coded(ErrorCode::NotFound),\n            other => ActivationFailure::from_code(other, ActivationPath::AccountSession),\n        })?;\n        if !parsed.revoked {\n            return Err(ActivationFailure::Malformed(\n                "session cleanup was not acknowledged".into(),\n            ));\n        }\n        Ok(())\n    }\n\n    /// Complete the existing activation path and persist its device credential, while\n    /// clearing only the matching account entry after confirmed remote cleanup.\n    ///\n    /// The caller owns/serializes this credential lifecycle. Neither cleanup nor keychain\n    /// failure masks a valid activation: separate outcomes preserve the device token and\n    /// allow explicit recovery. An unsuccessful/ambiguous activation retains its session\n    /// for retrying the same idempotency key; no cleanup request is sent in that case.\n    pub fn activate_and_persist_with_session<S: SecretStore>(\n        &self,\n        session: &Token,\n        identity: &DeviceIdentity,\n        idempotency_key: &IdempotencyKey,\n        credentials: &DeviceCredentials<S>,\n    ) -> Result<PersistedActivation, ActivationFailure> {\n        let mut activation = self.request_session_activation(session, identity, idempotency_key)?;\n        // Preserve the show-once device token before waiting on a second remote operation.\n        let device_persistence = activation.persist(credentials);\n        self.cleanup_session(session, &mut activation);\n        let account_session_cleared = if activation.session_cleanup == Some(SessionCleanup::Revoked)\n        {\n            credentials.clear_account_session_if_matches(session)\n        } else {\n            Ok(false)\n        };\n        Ok(PersistedActivation {\n            activation,\n            device_persistence,\n            account_session_cleared,\n        })\n    }\n\n    // -----------------------------------------------------------------------\n    // Delegation path: enrollment key\n    // -----------------------------------------------------------------------\n\n    /// Activate this device with an org enrollment key — the **delegation** path.\n    ///\n    /// Retained permanently (DEC-011 pt 3). The key travels in the request body; this\n    /// endpoint takes no `Authorization` header, because the presented key *is* the\n    /// credential and the device is its own actor.\n    pub fn activate_with_enrollment_key(\n        &self,\n        enrollment_key: &Token,\n        identity: &DeviceIdentity,\n        idempotency_key: &IdempotencyKey,\n    ) -> Result<Activation, ActivationFailure> {\n        let request = ActivationRequest {\n            idempotency_key: idempotency_key.as_str().to_string(),\n            license_key: enrollment_key.expose().to_string(),\n            device_fingerprint: identity.fingerprint.clone(),\n            platform: identity.platform.clone(),\n            app_version: identity.app_version.clone(),\n            display_name: identity.display_name.clone(),\n        };\n        let body = Self::encode(&request)?;\n        let response = self.post(ACTIVATIONS_PATH, &body, None)?;\n        let parsed: ActivationResponse = Self::decode(response, |code| {\n            ActivationFailure::from_code(code, ActivationPath::EnrollmentKey)\n        })?;\n\n        Self::activation(ActivationPath::EnrollmentKey, parsed)\n    }\n\n    // -----------------------------------------------------------------------\n    // Transport plumbing\n    // -----------------------------------------------------------------------\n\n    /// The one place a request leaves this crate: a JSON `POST`, with the session token as\n    /// the only credential header there can be. This crate sets no cookie, CSRF, `Origin` or\n    /// `Referer` header, and the transport seam (`post_json(url, body, bearer)`) gives it no way\n    /// to; that is the property the native routes\' CSRF exemption rests on.\n    ///\n    /// What the production transport really puts on the wire is pinned by\n    /// `selahcue-cloud/tests/test_wire.rs`. The production transport never follows a redirect\n    /// (ClickUp 17tnw2b9aaz), so a 3xx comes back as a status and is classified below like any\n    /// other non-2xx response (a coded error envelope in its body gives that code\'s failure,\n    /// otherwise [`ActivationFailure::UnexpectedStatus`]): the password and the enrollment key\n    /// are never replayed to another host, and `reqwest` never adds the `Referer` it sets on a\n    /// followed redirect. The policy is the transport\'s to set, not this crate\'s.\n    fn post(\n        &self,\n        path: &str,\n        body: &str,\n        bearer: Option<&Token>,\n    ) -> Result<HttpResponse, ActivationFailure> {\n        self.transport\n            .post_json(&self.url(path), body, bearer.map(Token::expose))\n            .map_err(|e| ActivationFailure::Unreachable(e.to_string()))\n    }\n\n    fn encode<R: serde::Serialize>(request: &R) -> Result<String, ActivationFailure> {\n        // A request of plain strings cannot fail to encode; if it somehow does, the\n        // serializer\'s message is not forwarded, since it is written against our own value.\n        serde_json::to_string(request)\n            .map_err(|_| ActivationFailure::Malformed("the request could not be encoded".into()))\n    }\n\n    fn activation(\n        path: ActivationPath,\n        response: ActivationResponse,\n    ) -> Result<Activation, ActivationFailure> {\n        // `Some("")` is not a replay (that is `null`): persisting it would overwrite a working\n        // device token with a blank one and report `Stored`.\n        if response\n            .activation_token\n            .as_ref()\n            .is_some_and(Self::unusable_bearer)\n        {\n            return Err(ActivationFailure::Malformed(\n                "the response carried an unusable device token".into(),\n            ));\n        }\n        Ok(Activation {\n            path,\n            token: response.activation_token,\n            created: response.created,\n            reminted: response.reminted,\n            device_public_id: response.device.device_public_id,\n            platform: response.device.platform,\n            token_meta: response.token,\n            license: response.license,\n            session_cleanup: None,\n        })\n    }\n\n    /// A token that cannot serve as a bearer: blank, or holding a control character. Asked of\n    /// [`Token`] itself so no new `expose()` site is needed.\n    fn unusable_bearer(token: &Token) -> bool {\n        token.is_blank() || token.has_control_characters()\n    }\n\n    /// Decode a response, mapping non-2xx onto coded failures with `classify`.\n    ///\n    /// Nothing in the body reaches the returned failure except a code that has passed\n    /// [`ErrorCode::parse`]\'s shape check; see the module docs.\n    fn decode<D: DeserializeOwned>(\n        response: HttpResponse,\n        classify: impl Fn(ErrorCode) -> ActivationFailure,\n    ) -> Result<D, ActivationFailure> {\n        let ok = (200..300).contains(&response.status);\n        if response.body.len() > MAX_RESPONSE_BODY_BYTES {\n            // Refused unparsed: no allocation proportional to the body, and no echo of it.\n            return Err(if ok {\n                ActivationFailure::Malformed(format!(\n                    "the response was larger than the {MAX_RESPONSE_BODY_BYTES}-byte limit"\n                ))\n            } else {\n                Self::status_failure(response.status, &classify)\n            });\n        }\n        if !ok {\n            return Err(Self::error(&response, classify));\n        }\n        serde_json::from_str(&response.body).map_err(|e| Self::malformed(&e))\n    }\n\n    /// Classify a non-2xx response.\n    ///\n    /// The coded body is authoritative when present. It is not always present: a wrong\n    /// HTTP method yields a bare Django 405 with an HTML body, and a proxy or WAF answers\n    /// with its own page, so an unparseable error is classified by status rather than\n    /// being reported as contract drift.\n    fn error(\n        response: &HttpResponse,\n        classify: impl Fn(ErrorCode) -> ActivationFailure,\n    ) -> ActivationFailure {\n        match serde_json::from_str::<ApiErrorEnvelope>(&response.body) {\n            Ok(envelope) => match classify(ErrorCode::parse(&envelope.error.code)) {\n                // `INTERNAL` carries no status of its own; keep the real 5xx the server sent\n                // rather than flattening 502/503/504 to 500.\n                ActivationFailure::Server(_) if (500..600).contains(&response.status) => {\n                    ActivationFailure::Server(response.status)\n                }\n                other => other,\n            },\n            Err(_) => Self::status_failure(response.status, &classify),\n        }\n    }\n\n    /// A 5xx is the server failing; a bare 429 is rate limiting whoever said it (a proxy\'s page\n    /// is as good a signal as the API\'s envelope, and "try again shortly" is true of both);\n    /// anything else at a non-2xx is something in FRONT of the application answering — a proxy\n    /// page, a Django middleware rejection, a wrong-method 405. None of these is contract\n    /// drift, and calling them `Malformed` sent the reader hunting for a schema change that\n    /// does not exist.\n    fn status_failure(\n        status: u16,\n        classify: &impl Fn(ErrorCode) -> ActivationFailure,\n    ) -> ActivationFailure {\n        if status == 429 {\n            classify(ErrorCode::RateLimited)\n        } else if (500..600).contains(&status) {\n            ActivationFailure::Server(status)\n        } else {\n            ActivationFailure::UnexpectedStatus(status)\n        }\n    }\n\n    /// Describe a parse failure WITHOUT quoting the body.\n    ///\n    /// `serde_json::Error`\'s own message is not safe to forward: for a type mismatch it\n    /// quotes the offending value (`invalid type: string "SC-DEV-...", expected a boolean`),\n    /// so a body that put a credential-shaped string in the wrong field would carry it into\n    /// an error message and from there into a log. This keeps the error\'s category and\n    /// position, plus the name of a missing field (which comes from this crate\'s own struct\n    /// definitions, not from the body).\n    fn malformed(error: &serde_json::Error) -> ActivationFailure {\n        use serde_json::error::Category;\n        let what = match error.classify() {\n            Category::Syntax => "was not valid JSON",\n            Category::Data => "did not have the shape the contract defines",\n            Category::Eof => "ended early",\n            Category::Io => "could not be read",\n        };\n        let field = missing_field(&error.to_string())\n            .map(|name| format!(", missing field `{name}`"))\n            .unwrap_or_default();\n        ActivationFailure::Malformed(format!(\n            "the response body {what} (line {}, column {}{field})",\n            error.line(),\n            error.column()\n        ))\n    }\n}\n\n/// The field name in a serde `missing field `name`` message, when it is one and the name is\n/// plainly an identifier. Anything else yields `None`, so no free text from a message is\n/// ever forwarded.\n///\n/// `pub` and hidden only so that `tests/` can drive it with messages serde would never\n/// produce from this crate\'s own structs: with real parse errors the identifier check can\n/// never fire, which would leave it untested.\n#[doc(hidden)]\npub fn missing_field(message: &str) -> Option<&str> {\n    let rest = message.strip_prefix("missing field `")?;\n    let name = &rest[..rest.find(\'`\')?];\n    let identifier = !name.is_empty()\n        && name.len() <= 40\n        && name.bytes().all(|b| b.is_ascii_lowercase() || b == b\'_\');\n    identifier.then_some(name)\n}\n', 'tests': ['cargo', 'test', '-p', 'selahcue-licensing', '--test', 'test_https_admission', '--', '--nocapture'], 'failures': ['dnu_http_password_is_refused_before_send', 'dnu_http_enrollment_is_refused_before_send', 'dnu_http_session_is_refused_before_send', 'dnu_http_revoke_is_refused_before_send', 'dnu_insecure_scheme_refusal_does_not_echo_configuration'], 'positive': 2, 'sha256': '73988abfc1182763971d19a5e7595780cafd68a97574c10f03ae6d801c396038'}, 'transport-admission': {'path': 'implementation/desktop/crates/selahcue-cloud/src/transport.rs', 'text': '//! The HTTP transport seam. The client depends on this trait, not on any concrete\n//! network library, so tests inject a deterministic [`crate::mock::MockTransport`]\n//! and the production build injects [`ReqwestTransport`] (behind the `http` feature).\n//!\n//! # Convention: an error branch lands with its no-echo assertion in the same commit\n//!\n//! Response bodies are attacker-influenced, and on at least one real provider a 401 body\n//! contains a partially-masked copy of the API key that was sent. So no error raised anywhere in\n//! this crate may quote a response body. That is a property of *every* branch, and it has now\n//! been rediscovered three times in one review cycle, each time on a branch or fixture that\n//! existed before its pin did:\n//!\n//! - status arms that had no captured fixture, so the sweep never reached them;\n//! - a fixture that could drift until it no longer contained the markers asserted absent;\n//! - a **newly added** branch — the timeout returns below — born unpinned.\n//!\n//! The rule that stops a fourth: **when you add an error branch, add its no-echo assertion in\n//! the same commit.** Not in the same PR, not "when the file is next open" — the same commit,\n//! because every instance so far is a gap that opened between writing the branch and getting\n//! round to pinning it.\n\n/// A minimal HTTP response: status code + raw body text.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct HttpResponse {\n    pub status: u16,\n    pub body: String,\n}\n\n/// A transport-level failure (no HTTP response was obtained): DNS/TLS/connection/\n/// timeout. Distinct from an HTTP error *status*, which arrives as an [`HttpResponse`]\n/// with a non-2xx `status`. The message never contains request bodies or secrets.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct TransportError(pub String);\n\nimpl core::fmt::Display for TransportError {\n    fn fmt(&self, f: &mut core::fmt::Formatter<\'_>) -> core::fmt::Result {\n        write!(f, "{}", self.0)\n    }\n}\n\nimpl std::error::Error for TransportError {}\n\n/// Refuse an invalid or non-HTTPS hosted endpoint without retaining or quoting its input.\n/// Used at both the operator configuration and licensing construction boundaries.\npub fn require_https_base_url(base_url: &str) -> Result<(), TransportError> {\n    let valid =\n        url::Url::parse(base_url).is_ok_and(|url| url.scheme() == "https" && url.host().is_some());\n    if valid {\n        Ok(())\n    } else {\n        Err(TransportError(\n            "hosted base URL must be an HTTPS URL".into(),\n        ))\n    }\n}\n\n/// The explicit test seam: HTTPS, or HTTP whose parsed host is loopback only.\n/// This never resolves DNS or treats a loopback-looking domain suffix as an IP address.\npub fn require_loopback_test_url(base_url: &str) -> Result<(), TransportError> {\n    let valid = url::Url::parse(base_url).is_ok_and(|url| {\n        url.scheme() == "https" && url.host().is_some()\n            || url.scheme() == "http"\n                && match url.host() {\n                    Some(url::Host::Ipv4(ip)) => ip.is_loopback(),\n                    Some(url::Host::Ipv6(ip)) => ip.is_loopback(),\n                    Some(url::Host::Domain(host)) => host == "localhost",\n                    None => false,\n                }\n    });\n    if valid {\n        Ok(())\n    } else {\n        Err(TransportError(\n            "test URL must use HTTPS or HTTP on a loopback host".into(),\n        ))\n    }\n}\n\n/// A blocking HTTP transport. Blocking (not async) keeps the seam simple and the core\n/// deterministic; callers run it off any UI/render thread (the operator command is\n/// `async` and offloads it). Implementations must not log request bodies or the bearer.\npub trait HttpTransport {\n    /// POST a JSON `body` to `url`, optionally with a bearer token.\n    fn post_json(\n        &self,\n        url: &str,\n        body: &str,\n        bearer: Option<&str>,\n    ) -> Result<HttpResponse, TransportError>;\n\n    /// GET `url`, optionally with a bearer token.\n    fn get(&self, url: &str, bearer: Option<&str>) -> Result<HttpResponse, TransportError>;\n}\n\n/// The most response body the production transport will read off the socket.\n///\n/// **This is the bound that actually holds.** A cap applied after the body is in hand\n/// bounds *parsing*, not memory: by then an unbounded read has already allocated\n/// whatever the peer chose to send. `reqwest`\'s `text()` reads to end-of-stream, so a\n/// hostile or malfunctioning server could hand us gigabytes before any check ran.\n/// Reading through `Read::take` refuses at the socket instead.\n///\n/// Set above the parse-side caps so the two do not collide: a body between the parse cap\n/// and this one is still *read*, and then refused by the parser with a precise error,\n/// which is a better diagnostic than a truncated read.\npub const MAX_TRANSPORT_RESPONSE_BYTES: usize = 4 * 1024 * 1024;\n\n/// The production transport over `reqwest` 0.13 (blocking, rustls). Compiled only with\n/// the `http` feature so the default workspace build/tests stay light and offline.\n///\n/// # TLS posture (owner decision 2026-10-24, DEC-019, ClickUp 17tnw2b9ax2)\n///\n/// - **Trust roots are the operating system\'s store**, through `rustls-platform-verifier`\n///   (reqwest 0.13\'s own default). There is no bundled Mozilla root set in this client, so a\n///   root the operating system trusts *for this user* is a root this client trusts. That\n///   includes a TLS-inspecting (man-in-the-middle) root. Getting one in needs no administrator\n///   rights: on macOS a standard user can mark a root "Always Trust" in their own login keychain\n///   (user-domain trust settings), on Windows a user can add a root to the current-user store\n///   (after a confirmation dialog), and on Linux and the BSDs `SSL_CERT_FILE` and `SSL_CERT_DIR`\n///   REPLACE the system bundle for the process (rustls-native-certs 0.8.4, `lib.rs`\n///   `load_native_certs`: when either is set it is used exclusively). The macOS and Windows\n///   mechanisms are the platform\'s documented behaviour and were not exercised here. This is a\n///   same-user vector, not a privilege escalation, and `tests/test_tls_system_store_linux.rs`\n///   uses exactly the Linux mechanism.\n/// - **`ring` is the only crypto provider.** reqwest\'s own `rustls` feature would add aws-lc-rs;\n///   we use `rustls-no-provider` and install ring ourselves ([`ensure_crypto_provider`]). A client\n///   built before a provider is installed panics, so every constructor goes through it.\n/// - **A machine with no usable roots fails closed.** On Linux the verifier reads the CA bundle\n///   through `rustls-native-certs`; when it finds none, building the client fails with\n///   "No CA certificates were loaded from the system", and [`ReqwestTransport::new`] returns a\n///   [`TransportError`] saying so. It never falls back to trusting everything, and the message\n///   carries no request data. Run: on a macOS host and in a Debian bookworm arm64 container\n///   (`tests/test_tls_system_store_linux.rs`). Not run: Windows and the ubuntu CI runner. macOS\n///   and Windows use the system verifier APIs, which have no such load step. A consequence for\n///   anyone running the tests on a Linux host with no CA bundle: every test that calls `new()`\n///   fails, including the plaintext loopback ones, because `new()` itself errors by design.\n/// - **Revocation is now checked, where the old bundled-roots client checked none.** Observed on\n///   macOS: a revoked certificate is refused (cause "Revoked"); Linux accepted it. From the\n///   verifier\'s source (`windows.rs`, around lines 461-469, not run): on Windows the end\n///   certificate is checked online with a 10 s URL-retrieval budget and accepted if no answer\n///   arrives. The checks send OCSP/CRL requests from the user\'s machine to the CA\'s responder\n///   (no user data, but the CA learns which certificate is being checked) and are an extra source\n///   of latency. Whether a network that silently drops port 80 pushes a handshake past\n///   [`CONNECT_TIMEOUT_SECS`] is unverified.\n/// - **Certificates are checked, not skipped**: an unknown signer, a wrong name and an expired\n///   certificate are each refused before a single request byte is written. Pinned in\n///   `transport/tls_tests.rs`.\n///\n/// # First-hop HTTPS (ClickUp 17tnw2b9dnu)\n///\n/// Ordinary requests must use HTTPS before any body or bearer is attached, with a fixed\n/// data-free configuration error. The builder also sets `https_only(true)`. Only the explicit\n/// [`ReqwestTransport::new_for_loopback_tests`] seam admits HTTP, and only to parsed loopback\n/// hosts; normal application wiring never selects it. TLS trust and redirects are unchanged.\n///\n/// # Redirect posture (ClickUp 17tnw2b9aaz)\n///\n/// **Redirects are never followed.** A 3xx is returned to the caller as an ordinary\n/// [`HttpResponse`] carrying that status, and the `Location` it names is never requested.\n///\n/// *Why.* reqwest\'s default policy follows up to ten redirects, and on a 307 or 308 it replays the\n/// request BODY to the new location. It strips `Authorization` and cookies when the host, port or\n/// scheme changes, but never the body, and the body is where this app\'s credentials travel: the account\n/// password (`POST /v1/sessions`), the enrollment key (`POST /v1/activations`) and the sermon\n/// transcript (`POST /v1/notes:generate`). It also adds a `Referer` naming the URL it came from.\n/// Measured: a loopback server that answered a POST with a 307 to another port received the whole\n/// JSON body, and the replayed request carried the origin URL as its `Referer`.\n///\n/// *Why that is safe for every consumer.* Each consumer calls a URL built from a configured base\n/// and a fixed path, and the service answers there directly; none depends on a redirect. The\n/// consumers are the hosted SelahCue API (licensing sign-in and activation, notes, quota) and the\n/// direct OpenAI note provider (developer builds only). Cloud transcription (Deepgram) does not\n/// use this transport at all: `selahcue-stt-cloud` opens its own WebSocket and has no dependency\n/// on this crate. If a consumer ever needs a redirect, that is a decision for that consumer, made\n/// per call and reviewed as its own change, not a default to turn back on here.\n///\n/// *What the callers see.* A 3xx reaches each client as a non-2xx response and is classified like\n/// any other non-2xx response, in the client\'s own fixed wording, with nothing of the response\n/// quoted. `selahcue-licensing` parses a non-2xx body as the API\'s error envelope first (a coded\n/// envelope gives that code\'s failure) and otherwise reports `UnexpectedStatus(n)`; the hosted\n/// notes client reports `Malformed("unexpected status n")`, plus a reason code when the body\n/// carries one from its closed list; the OpenAI provider reports `Malformed("unexpected provider\n/// status n")`. [`HttpResponse`] carries no headers, so the `Location` (which can hold a token in\n/// its query) never leaves the transport. The redirect\'s own body is read under the same\n/// [`MAX_TRANSPORT_RESPONSE_BYTES`] cap as any other.\n///\n/// *One exception to "a 3xx arrives as a status".* A `Location` of 1 MiB or more, or one holding\n/// a control byte, makes hyper reject the response head, so the caller gets a [`TransportError`]\n/// ("message head is too large", "invalid HTTP header parsed") instead of the 3xx status (QA\n/// measured both). The target is still never contacted. For hosted notes a `TransportError` is\n/// the transport-class failure, so it takes the degrade-to-local-draft path rather than the\n/// visible `Malformed` error an ordinary 3xx gives.\n///\n/// Pinned by `tests/test_redirect_credentials.rs` and `tests/test_redirect_limit.rs`.\n#[cfg(feature = "http")]\npub struct ReqwestTransport {\n    client: reqwest::blocking::Client,\n    loopback_http_for_tests: bool,\n}\n\n/// Ceiling on the TCP/TLS connect phase alone.\n///\n/// A pure improvement with no trade-off: it can only make a failure *faster*, never abort\n/// valid work, because no legitimate connect takes ten seconds. It exists so the common\n/// case — an unreachable host, a church that has lost its uplink mid-service — reports in\n/// ten seconds rather than sitting on the full request budget.\n#[cfg(feature = "http")]\npub const CONNECT_TIMEOUT_SECS: u64 = 10;\n\n/// Ceiling on the whole request: connect, send, and body read.\n///\n/// **Measured, not guessed.** Four live runs of a realistic 7,165-word sermon (a ~45-minute\n/// service) through the shipped prompt took **15.3s, 16.5s, 16.8s and 17.3s**. Latency is\n/// dominated by *output* length, which the schema bounds, rather than by transcript length —\n/// so it does not grow with the sermon the way one would expect.\n///\n/// At 30s that was only ~1.7-2x headroom, and every one of those measurements came from a fast\n/// connection to an unloaded API. 60s is chosen on the **asymmetry of the two failures**, not\n/// on the numbers: crossing the cap costs a real church its notes on a slow day, while an\n/// over-long cap costs only that a genuine hang reports in 60s instead of 30s. With\n/// [`CONNECT_TIMEOUT_SECS`] at 10s the common unreachable case never approaches either.\n///\n/// This bound is real and is exercised: a peer that completes the handshake and then says\n/// nothing, and a peer that sends headers and stalls before the body, were both measured\n/// against stalling TCP servers and both fail at the deadline rather than hanging. The second\n/// case matters most — the body read is a hand-rolled `Read::take(..).read_to_end(..)` in\n/// [`read_capped`], not `reqwest`\'s own `text()`, so that the client deadline still covers it\n/// was worth measuring rather than assuming.\n#[cfg(feature = "http")]\npub const REQUEST_TIMEOUT_SECS: u64 = 60;\n\n/// How this process came to have a rustls crypto provider; see [`ensure_crypto_provider`].\n#[cfg(feature = "http")]\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum CryptoProviderInstall {\n    /// Nothing was installed, so this call installed `ring` as the process default.\n    InstalledRing,\n    /// A default provider was already installed by someone else (in this workspace only\n    /// `selahcue-stt-cloud`\'s Deepgram transport does that; `selahcue-lan` builds its configs with\n    /// `builder_with_provider` and never installs a default). It is **kept, never replaced**, and\n    /// not inspected: reqwest uses whichever default is installed. In this workspace that can only be `ring`, because\n    /// `scripts/import_guards.sh` refuses any lock file that contains aws-lc.\n    AlreadyInstalled,\n}\n\n/// Install `ring` as rustls\' process-wide crypto provider, once, and say how it came about.\n///\n/// reqwest 0.13\'s `rustls-no-provider` feature builds no provider of its own and **panics at\n/// `Client` construction** when none is installed, so every [`ReqwestTransport`] constructor\n/// calls this first. It is idempotent and safe to call from any number of threads: the first\n/// caller does the work, concurrent callers wait for it, and every caller gets the same answer\n/// (the outcome of that first install, not a fresh probe). `install_default` returns `Err` when\n/// a provider is already installed; that is success for our purposes and is reported as\n/// [`CryptoProviderInstall::AlreadyInstalled`] rather than treated as a failure or, worse,\n/// replaced.\n#[cfg(feature = "http")]\npub fn ensure_crypto_provider() -> CryptoProviderInstall {\n    static OUTCOME: std::sync::OnceLock<CryptoProviderInstall> = std::sync::OnceLock::new();\n    *OUTCOME.get_or_init(\n        || match rustls::crypto::ring::default_provider().install_default() {\n            Ok(()) => CryptoProviderInstall::InstalledRing,\n            Err(_already_installed) => CryptoProviderInstall::AlreadyInstalled,\n        },\n    )\n}\n\n/// How many causes of an error [`cause_chain`] will print. A rustls or hyper chain is two or\n/// three deep; the bound only keeps a pathological chain from producing an unbounded message.\n#[cfg(feature = "http")]\nconst MAX_CAUSES: usize = 8;\n\n/// The causes of `e` (not `e` itself), each preceded by ": ", at most [`MAX_CAUSES`] of them.\n///\n/// reqwest\'s own `Display` stops at the top of the chain: a builder error reads only "builder\n/// error" and a send error only "error sending request for url (...)", so an operator whose note\n/// generation fails cannot tell "the certificate is for another name" from "the network is down".\n/// The causes of a *builder* error come from TLS set-up and the causes of a *send* error from the\n/// connection and the TLS handshake (for example "invalid peer certificate: UnknownIssuer" or\n/// "Revoked"); none of them carries a request header, a request body or a credential (the bearer\n/// is a header, and a header is not part of an error). The URL in the top-level text is as it\n/// always was.\n#[cfg(feature = "http")]\nfn cause_chain(e: &(dyn std::error::Error + \'static)) -> String {\n    let mut text = String::new();\n    let mut cause = e.source();\n    let mut shown = 0;\n    while let Some(c) = cause {\n        if shown == MAX_CAUSES {\n            text.push_str(": ...");\n            break;\n        }\n        text.push_str(": ");\n        text.push_str(&c.to_string());\n        cause = c.source();\n        shown += 1;\n    }\n    text\n}\n\n/// The reason a client could not be built, from reqwest\'s error and its causes.\n#[cfg(feature = "http")]\nfn describe_build_error(e: &reqwest::Error) -> String {\n    format!("could not set up TLS{}", cause_chain(e))\n}\n\n/// A failed send: reqwest\'s one-line text (with the URL, as before) plus the causes.\n#[cfg(feature = "http")]\nfn describe_send_error(e: &reqwest::Error) -> String {\n    format!("{e}{}", cause_chain(e))\n}\n\n#[cfg(feature = "http")]\nimpl ReqwestTransport {\n    /// A transport that is bounded at both the connect phase and the whole request, so a\n    /// stalling peer always fails rather than hanging the caller. Trusts the operating\n    /// system\'s certificate store and nothing else (see the type documentation).\n    pub fn new() -> Result<Self, TransportError> {\n        Self::build(&[])\n    }\n\n    /// Explicit test transport for local HTTP fixture servers. Every request still validates\n    /// its parsed host: non-loopback HTTP is refused, HTTPS keeps ordinary TLS verification,\n    /// and redirects are never followed. Normal application wiring must use [`Self::new`].\n    pub fn new_for_loopback_tests() -> Result<Self, TransportError> {\n        let mut transport = Self::from_builder(Self::shipped_builder(&[]).https_only(false))?;\n        transport.loopback_http_for_tests = true;\n        Ok(transport)\n    }\n\n    fn require_request_url(&self, url: &str) -> Result<(), TransportError> {\n        if self.loopback_http_for_tests {\n            require_loopback_test_url(url)\n        } else {\n            Ok(())\n        }\n    }\n\n    /// The one place a production client is built. `extra_roots` is always empty in production;\n    /// the TLS tests pass a throwaway CA so that "signed by a root we were given" can be exercised\n    /// against the real client. The function is private and its only non-test caller is\n    /// [`ReqwestTransport::new`] passing `&[]`, so no release code path can widen the trust set.\n    fn build(extra_roots: &[reqwest::Certificate]) -> Result<Self, TransportError> {\n        Self::from_builder(Self::shipped_builder(extra_roots))\n    }\n\n    /// The builder `build` uses: the shipped timeouts, [`CONNECT_TIMEOUT_SECS`] and\n    /// [`REQUEST_TIMEOUT_SECS`], applied by [`ReqwestTransport::configured_builder`]. A separate\n    /// function so a test can read back what `build` configures (the `Debug` text of a reqwest\n    /// builder carries both timeouts) instead of trusting that the constants were passed on.\n    fn shipped_builder(extra_roots: &[reqwest::Certificate]) -> reqwest::blocking::ClientBuilder {\n        Self::configured_builder(\n            extra_roots,\n            std::time::Duration::from_secs(CONNECT_TIMEOUT_SECS),\n            std::time::Duration::from_secs(REQUEST_TIMEOUT_SECS),\n        )\n    }\n\n    /// The client builder before `.build()`, with the two timeouts as arguments so a test can prove\n    /// they take effect without waiting ten or sixty seconds.\n    fn configured_builder(\n        extra_roots: &[reqwest::Certificate],\n        connect_timeout: std::time::Duration,\n        timeout: std::time::Duration,\n    ) -> reqwest::blocking::ClientBuilder {\n        let mut builder = reqwest::blocking::Client::builder()\n            .https_only(false)\n            .connect_timeout(connect_timeout)\n            .timeout(timeout)\n            // NEVER follow a redirect: see "Redirect posture" on the type. The default policy\n            // follows ten and replays a 307/308 request body, which is the credential, to\n            // whichever host the response names.\n            .redirect(reqwest::redirect::Policy::none());\n        if !extra_roots.is_empty() {\n            builder = builder.tls_certs_merge(extra_roots.iter().cloned());\n        }\n        builder\n    }\n\n    /// Install the crypto provider, then build. Reqwest 0.13 with `rustls-no-provider` panics at\n    /// this point if no provider is installed, so nothing builds a client without going through here.\n    fn from_builder(builder: reqwest::blocking::ClientBuilder) -> Result<Self, TransportError> {\n        ensure_crypto_provider();\n        let client = builder\n            .build()\n            .map_err(|e| TransportError(describe_build_error(&e)))?;\n        Ok(ReqwestTransport {\n            client,\n            loopback_http_for_tests: false,\n        })\n    }\n}\n\n#[cfg(all(test, feature = "http"))]\nmod tls_tests;\n\n/// Read at most `cap` bytes from `r`, refusing anything larger, and giving up at `deadline`.\n///\n/// **Deliberately free of `reqwest`** — it takes `impl Read`, so it compiles in the default build\n/// and a test can drive it with a `Cursor`, a failing reader, or a dripping one. An earlier version\n/// took a `reqwest::blocking::Response`, which meant it existed only under the `http` feature:\n/// linted there, executed by no gate at all.\n///\n/// # Why this takes a deadline (PERF-2)\n///\n/// This function replaced `reqwest`\'s own `text()`, and that swap **introduced a hang** that\n/// `text()` did not have. Measured: a drip server was still being read **172 seconds past** a\n/// 60-second client deadline, while the pre-change `text()` path errored at exactly 30.0s under\n/// an identical drip.\n///\n/// **Which phase owns which bound — the precise version, because the loose one is dangerous.**\n/// `reqwest`\'s client timeout *is* a running total over the **response head**: connect, send,\n/// status line and headers. Measured, a peer that sends a valid status line and then drips header\n/// bytes forever is cut off at exactly the client deadline, by `reqwest`, with no help from here.\n/// It degrades to **per read-wait** only over the **body**, and only once the body read is taken\n/// out from under `reqwest`\'s own bookkeeping — which is exactly what replacing `text()` with this\n/// loop did.\n///\n/// So this is **not an inherited `reqwest` weakness**. The gap was created by moving the read\n/// here, and it is re-created by any future change that takes a read into its own hands. That is\n/// the thing to watch for, not `reqwest`. Saying "reqwest\'s timeout is per-wait" without the split\n/// invites a reader to conclude this deadline is redundant *wherever* `reqwest` is involved and\n/// delete it; over the body it is the only bound there is.\n///\n/// | peer behaviour              | phase         | outcome                          |\n/// |-----------------------------|---------------|----------------------------------|\n/// | headers done, body drips    | body read     | 60.0s — this function\'s deadline  |\n/// | status line, headers drip   | response head | 60.0s — `reqwest`\'s client timeout |\n///\n/// A **zero-byte** stall also cuts at the client deadline, which is why the hang was invisible:\n/// every probe written for the original bound tested silence, and silence was the one shape that\n/// already worked. "It fails rather than hanging" was true for the case that had been tried and\n/// false in general.\n///\n/// So the loop owns its own deadline. It is checked before every read and after every chunk, which\n/// bounds total elapsed time regardless of how the bytes are paced.\n///\n/// Reads `cap + 1` so **"exactly at the cap" is distinguishable from "over it"**: stopping at\n/// exactly `cap` would silently truncate a legitimately cap-sized body, and a truncated JSON body\n/// surfaces as a confusing parse error rather than the size problem it is.\n///\n/// Errors carry the cap or the deadline and **nothing from the body**: a response body is\n/// attacker-influenced and, on at least one real provider, contains key material.\npub fn read_capped(\n    r: impl std::io::Read,\n    cap: usize,\n    deadline: Option<std::time::Instant>,\n) -> Result<Vec<u8>, TransportError> {\n    use std::io::Read;\n    let expired = |d: Option<std::time::Instant>| d.is_some_and(|d| std::time::Instant::now() >= d);\n    // `saturating_add`: a caller may legitimately pass `usize::MAX` to mean "no size cap, bound\n    // me by the deadline alone", and `+ 1` on that overflows and panics in a debug build. Found by\n    // the PERF-2 drip test, which does exactly that.\n    let mut limited = r.take((cap as u64).saturating_add(1));\n    let mut buf: Vec<u8> = Vec::new();\n    let mut chunk = [0u8; 8 * 1024];\n    loop {\n        if expired(deadline) {\n            return Err(TransportError(\n                "timed out reading the response body".to_string(),\n            ));\n        }\n        let n = limited\n            .read(&mut chunk)\n            .map_err(|e| TransportError(e.to_string()))?;\n        if n == 0 {\n            break;\n        }\n        buf.extend_from_slice(&chunk[..n]);\n        // Checked inside the loop, so an over-cap body is refused as soon as it crosses rather\n        // than after the whole thing is resident.\n        if buf.len() > cap {\n            return Err(TransportError(format!(\n                "response exceeded the {cap}-byte transport cap"\n            )));\n        }\n        if expired(deadline) {\n            return Err(TransportError(\n                "timed out reading the response body".to_string(),\n            ));\n        }\n    }\n    Ok(buf)\n}\n\n/// Read a response body with a hard ceiling, instead of `text()`\'s read-to-end.\n#[cfg(feature = "http")]\nfn read_bounded(resp: reqwest::blocking::Response) -> Result<HttpResponse, TransportError> {\n    let status = resp.status().as_u16();\n    // The body read gets its own deadline because the client timeout does not bound it (PERF-2).\n    // Worst case is therefore the head phase plus this budget rather than a single\n    // REQUEST_TIMEOUT_SECS — stated plainly rather than hidden, since the alternative is a bound\n    // that only holds for peers that stay silent.\n    let deadline = std::time::Instant::now() + std::time::Duration::from_secs(REQUEST_TIMEOUT_SECS);\n    let buf = read_capped(resp, MAX_TRANSPORT_RESPONSE_BYTES, Some(deadline))?;\n    // Bodies are untrusted bytes; decode lossily rather than failing on bad UTF-8, so a\n    // mangled response becomes a parse error the caller can map, not a transport error\n    // that would trigger the degraded-fallback path for the wrong reason.\n    Ok(HttpResponse {\n        status,\n        body: String::from_utf8_lossy(&buf).into_owned(),\n    })\n}\n\n#[cfg(feature = "http")]\nimpl HttpTransport for ReqwestTransport {\n    fn post_json(\n        &self,\n        url: &str,\n        body: &str,\n        bearer: Option<&str>,\n    ) -> Result<HttpResponse, TransportError> {\n        self.require_request_url(url)?;\n        let mut req = self\n            .client\n            .post(url)\n            .header("content-type", "application/json")\n            .body(body.to_string());\n        if let Some(t) = bearer {\n            req = req.bearer_auth(t);\n        }\n        let resp = req\n            .send()\n            .map_err(|e| TransportError(describe_send_error(&e)))?;\n        read_bounded(resp)\n    }\n\n    fn get(&self, url: &str, bearer: Option<&str>) -> Result<HttpResponse, TransportError> {\n        self.require_request_url(url)?;\n        let mut req = self.client.get(url);\n        if let Some(t) = bearer {\n            req = req.bearer_auth(t);\n        }\n        let resp = req\n            .send()\n            .map_err(|e| TransportError(describe_send_error(&e)))?;\n        read_bounded(resp)\n    }\n}\n', 'tests': ['cargo', 'test', '-p', 'selahcue-cloud', '--features', 'http', '--test', 'test_https_admission', '--', '--nocapture'], 'failures': ['dnu_production_transport_refuses_http_before_body_or_bearer_send', 'dnu_production_get_refusal_does_not_echo_url_secrets'], 'positive': 1, 'sha256': 'c3ba3aba0eff85d8819b1fefbb9a50d65ce3b5817aab56584a5de1d9f827bd43'}, 'builder-defense': {'path': 'implementation/desktop/crates/selahcue-cloud/src/transport.rs', 'text': '//! The HTTP transport seam. The client depends on this trait, not on any concrete\n//! network library, so tests inject a deterministic [`crate::mock::MockTransport`]\n//! and the production build injects [`ReqwestTransport`] (behind the `http` feature).\n//!\n//! # Convention: an error branch lands with its no-echo assertion in the same commit\n//!\n//! Response bodies are attacker-influenced, and on at least one real provider a 401 body\n//! contains a partially-masked copy of the API key that was sent. So no error raised anywhere in\n//! this crate may quote a response body. That is a property of *every* branch, and it has now\n//! been rediscovered three times in one review cycle, each time on a branch or fixture that\n//! existed before its pin did:\n//!\n//! - status arms that had no captured fixture, so the sweep never reached them;\n//! - a fixture that could drift until it no longer contained the markers asserted absent;\n//! - a **newly added** branch — the timeout returns below — born unpinned.\n//!\n//! The rule that stops a fourth: **when you add an error branch, add its no-echo assertion in\n//! the same commit.** Not in the same PR, not "when the file is next open" — the same commit,\n//! because every instance so far is a gap that opened between writing the branch and getting\n//! round to pinning it.\n\n/// A minimal HTTP response: status code + raw body text.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct HttpResponse {\n    pub status: u16,\n    pub body: String,\n}\n\n/// A transport-level failure (no HTTP response was obtained): DNS/TLS/connection/\n/// timeout. Distinct from an HTTP error *status*, which arrives as an [`HttpResponse`]\n/// with a non-2xx `status`. The message never contains request bodies or secrets.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct TransportError(pub String);\n\nimpl core::fmt::Display for TransportError {\n    fn fmt(&self, f: &mut core::fmt::Formatter<\'_>) -> core::fmt::Result {\n        write!(f, "{}", self.0)\n    }\n}\n\nimpl std::error::Error for TransportError {}\n\n/// Refuse an invalid or non-HTTPS hosted endpoint without retaining or quoting its input.\n/// Used at both the operator configuration and licensing construction boundaries.\npub fn require_https_base_url(base_url: &str) -> Result<(), TransportError> {\n    let valid =\n        url::Url::parse(base_url).is_ok_and(|url| url.scheme() == "https" && url.host().is_some());\n    if valid {\n        Ok(())\n    } else {\n        Err(TransportError(\n            "hosted base URL must be an HTTPS URL".into(),\n        ))\n    }\n}\n\n/// The explicit test seam: HTTPS, or HTTP whose parsed host is loopback only.\n/// This never resolves DNS or treats a loopback-looking domain suffix as an IP address.\npub fn require_loopback_test_url(base_url: &str) -> Result<(), TransportError> {\n    let valid = url::Url::parse(base_url).is_ok_and(|url| {\n        url.scheme() == "https" && url.host().is_some()\n            || url.scheme() == "http"\n                && match url.host() {\n                    Some(url::Host::Ipv4(ip)) => ip.is_loopback(),\n                    Some(url::Host::Ipv6(ip)) => ip.is_loopback(),\n                    Some(url::Host::Domain(host)) => host == "localhost",\n                    None => false,\n                }\n    });\n    if valid {\n        Ok(())\n    } else {\n        Err(TransportError(\n            "test URL must use HTTPS or HTTP on a loopback host".into(),\n        ))\n    }\n}\n\n/// A blocking HTTP transport. Blocking (not async) keeps the seam simple and the core\n/// deterministic; callers run it off any UI/render thread (the operator command is\n/// `async` and offloads it). Implementations must not log request bodies or the bearer.\npub trait HttpTransport {\n    /// POST a JSON `body` to `url`, optionally with a bearer token.\n    fn post_json(\n        &self,\n        url: &str,\n        body: &str,\n        bearer: Option<&str>,\n    ) -> Result<HttpResponse, TransportError>;\n\n    /// GET `url`, optionally with a bearer token.\n    fn get(&self, url: &str, bearer: Option<&str>) -> Result<HttpResponse, TransportError>;\n}\n\n/// The most response body the production transport will read off the socket.\n///\n/// **This is the bound that actually holds.** A cap applied after the body is in hand\n/// bounds *parsing*, not memory: by then an unbounded read has already allocated\n/// whatever the peer chose to send. `reqwest`\'s `text()` reads to end-of-stream, so a\n/// hostile or malfunctioning server could hand us gigabytes before any check ran.\n/// Reading through `Read::take` refuses at the socket instead.\n///\n/// Set above the parse-side caps so the two do not collide: a body between the parse cap\n/// and this one is still *read*, and then refused by the parser with a precise error,\n/// which is a better diagnostic than a truncated read.\npub const MAX_TRANSPORT_RESPONSE_BYTES: usize = 4 * 1024 * 1024;\n\n/// The production transport over `reqwest` 0.13 (blocking, rustls). Compiled only with\n/// the `http` feature so the default workspace build/tests stay light and offline.\n///\n/// # TLS posture (owner decision 2026-10-24, DEC-019, ClickUp 17tnw2b9ax2)\n///\n/// - **Trust roots are the operating system\'s store**, through `rustls-platform-verifier`\n///   (reqwest 0.13\'s own default). There is no bundled Mozilla root set in this client, so a\n///   root the operating system trusts *for this user* is a root this client trusts. That\n///   includes a TLS-inspecting (man-in-the-middle) root. Getting one in needs no administrator\n///   rights: on macOS a standard user can mark a root "Always Trust" in their own login keychain\n///   (user-domain trust settings), on Windows a user can add a root to the current-user store\n///   (after a confirmation dialog), and on Linux and the BSDs `SSL_CERT_FILE` and `SSL_CERT_DIR`\n///   REPLACE the system bundle for the process (rustls-native-certs 0.8.4, `lib.rs`\n///   `load_native_certs`: when either is set it is used exclusively). The macOS and Windows\n///   mechanisms are the platform\'s documented behaviour and were not exercised here. This is a\n///   same-user vector, not a privilege escalation, and `tests/test_tls_system_store_linux.rs`\n///   uses exactly the Linux mechanism.\n/// - **`ring` is the only crypto provider.** reqwest\'s own `rustls` feature would add aws-lc-rs;\n///   we use `rustls-no-provider` and install ring ourselves ([`ensure_crypto_provider`]). A client\n///   built before a provider is installed panics, so every constructor goes through it.\n/// - **A machine with no usable roots fails closed.** On Linux the verifier reads the CA bundle\n///   through `rustls-native-certs`; when it finds none, building the client fails with\n///   "No CA certificates were loaded from the system", and [`ReqwestTransport::new`] returns a\n///   [`TransportError`] saying so. It never falls back to trusting everything, and the message\n///   carries no request data. Run: on a macOS host and in a Debian bookworm arm64 container\n///   (`tests/test_tls_system_store_linux.rs`). Not run: Windows and the ubuntu CI runner. macOS\n///   and Windows use the system verifier APIs, which have no such load step. A consequence for\n///   anyone running the tests on a Linux host with no CA bundle: every test that calls `new()`\n///   fails, including the plaintext loopback ones, because `new()` itself errors by design.\n/// - **Revocation is now checked, where the old bundled-roots client checked none.** Observed on\n///   macOS: a revoked certificate is refused (cause "Revoked"); Linux accepted it. From the\n///   verifier\'s source (`windows.rs`, around lines 461-469, not run): on Windows the end\n///   certificate is checked online with a 10 s URL-retrieval budget and accepted if no answer\n///   arrives. The checks send OCSP/CRL requests from the user\'s machine to the CA\'s responder\n///   (no user data, but the CA learns which certificate is being checked) and are an extra source\n///   of latency. Whether a network that silently drops port 80 pushes a handshake past\n///   [`CONNECT_TIMEOUT_SECS`] is unverified.\n/// - **Certificates are checked, not skipped**: an unknown signer, a wrong name and an expired\n///   certificate are each refused before a single request byte is written. Pinned in\n///   `transport/tls_tests.rs`.\n///\n/// # First-hop HTTPS (ClickUp 17tnw2b9dnu)\n///\n/// Ordinary requests must use HTTPS before any body or bearer is attached, with a fixed\n/// data-free configuration error. The builder also sets `https_only(true)`. Only the explicit\n/// [`ReqwestTransport::new_for_loopback_tests`] seam admits HTTP, and only to parsed loopback\n/// hosts; normal application wiring never selects it. TLS trust and redirects are unchanged.\n///\n/// # Redirect posture (ClickUp 17tnw2b9aaz)\n///\n/// **Redirects are never followed.** A 3xx is returned to the caller as an ordinary\n/// [`HttpResponse`] carrying that status, and the `Location` it names is never requested.\n///\n/// *Why.* reqwest\'s default policy follows up to ten redirects, and on a 307 or 308 it replays the\n/// request BODY to the new location. It strips `Authorization` and cookies when the host, port or\n/// scheme changes, but never the body, and the body is where this app\'s credentials travel: the account\n/// password (`POST /v1/sessions`), the enrollment key (`POST /v1/activations`) and the sermon\n/// transcript (`POST /v1/notes:generate`). It also adds a `Referer` naming the URL it came from.\n/// Measured: a loopback server that answered a POST with a 307 to another port received the whole\n/// JSON body, and the replayed request carried the origin URL as its `Referer`.\n///\n/// *Why that is safe for every consumer.* Each consumer calls a URL built from a configured base\n/// and a fixed path, and the service answers there directly; none depends on a redirect. The\n/// consumers are the hosted SelahCue API (licensing sign-in and activation, notes, quota) and the\n/// direct OpenAI note provider (developer builds only). Cloud transcription (Deepgram) does not\n/// use this transport at all: `selahcue-stt-cloud` opens its own WebSocket and has no dependency\n/// on this crate. If a consumer ever needs a redirect, that is a decision for that consumer, made\n/// per call and reviewed as its own change, not a default to turn back on here.\n///\n/// *What the callers see.* A 3xx reaches each client as a non-2xx response and is classified like\n/// any other non-2xx response, in the client\'s own fixed wording, with nothing of the response\n/// quoted. `selahcue-licensing` parses a non-2xx body as the API\'s error envelope first (a coded\n/// envelope gives that code\'s failure) and otherwise reports `UnexpectedStatus(n)`; the hosted\n/// notes client reports `Malformed("unexpected status n")`, plus a reason code when the body\n/// carries one from its closed list; the OpenAI provider reports `Malformed("unexpected provider\n/// status n")`. [`HttpResponse`] carries no headers, so the `Location` (which can hold a token in\n/// its query) never leaves the transport. The redirect\'s own body is read under the same\n/// [`MAX_TRANSPORT_RESPONSE_BYTES`] cap as any other.\n///\n/// *One exception to "a 3xx arrives as a status".* A `Location` of 1 MiB or more, or one holding\n/// a control byte, makes hyper reject the response head, so the caller gets a [`TransportError`]\n/// ("message head is too large", "invalid HTTP header parsed") instead of the 3xx status (QA\n/// measured both). The target is still never contacted. For hosted notes a `TransportError` is\n/// the transport-class failure, so it takes the degrade-to-local-draft path rather than the\n/// visible `Malformed` error an ordinary 3xx gives.\n///\n/// Pinned by `tests/test_redirect_credentials.rs` and `tests/test_redirect_limit.rs`.\n#[cfg(feature = "http")]\npub struct ReqwestTransport {\n    client: reqwest::blocking::Client,\n    loopback_http_for_tests: bool,\n}\n\n/// Ceiling on the TCP/TLS connect phase alone.\n///\n/// A pure improvement with no trade-off: it can only make a failure *faster*, never abort\n/// valid work, because no legitimate connect takes ten seconds. It exists so the common\n/// case — an unreachable host, a church that has lost its uplink mid-service — reports in\n/// ten seconds rather than sitting on the full request budget.\n#[cfg(feature = "http")]\npub const CONNECT_TIMEOUT_SECS: u64 = 10;\n\n/// Ceiling on the whole request: connect, send, and body read.\n///\n/// **Measured, not guessed.** Four live runs of a realistic 7,165-word sermon (a ~45-minute\n/// service) through the shipped prompt took **15.3s, 16.5s, 16.8s and 17.3s**. Latency is\n/// dominated by *output* length, which the schema bounds, rather than by transcript length —\n/// so it does not grow with the sermon the way one would expect.\n///\n/// At 30s that was only ~1.7-2x headroom, and every one of those measurements came from a fast\n/// connection to an unloaded API. 60s is chosen on the **asymmetry of the two failures**, not\n/// on the numbers: crossing the cap costs a real church its notes on a slow day, while an\n/// over-long cap costs only that a genuine hang reports in 60s instead of 30s. With\n/// [`CONNECT_TIMEOUT_SECS`] at 10s the common unreachable case never approaches either.\n///\n/// This bound is real and is exercised: a peer that completes the handshake and then says\n/// nothing, and a peer that sends headers and stalls before the body, were both measured\n/// against stalling TCP servers and both fail at the deadline rather than hanging. The second\n/// case matters most — the body read is a hand-rolled `Read::take(..).read_to_end(..)` in\n/// [`read_capped`], not `reqwest`\'s own `text()`, so that the client deadline still covers it\n/// was worth measuring rather than assuming.\n#[cfg(feature = "http")]\npub const REQUEST_TIMEOUT_SECS: u64 = 60;\n\n/// How this process came to have a rustls crypto provider; see [`ensure_crypto_provider`].\n#[cfg(feature = "http")]\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum CryptoProviderInstall {\n    /// Nothing was installed, so this call installed `ring` as the process default.\n    InstalledRing,\n    /// A default provider was already installed by someone else (in this workspace only\n    /// `selahcue-stt-cloud`\'s Deepgram transport does that; `selahcue-lan` builds its configs with\n    /// `builder_with_provider` and never installs a default). It is **kept, never replaced**, and\n    /// not inspected: reqwest uses whichever default is installed. In this workspace that can only be `ring`, because\n    /// `scripts/import_guards.sh` refuses any lock file that contains aws-lc.\n    AlreadyInstalled,\n}\n\n/// Install `ring` as rustls\' process-wide crypto provider, once, and say how it came about.\n///\n/// reqwest 0.13\'s `rustls-no-provider` feature builds no provider of its own and **panics at\n/// `Client` construction** when none is installed, so every [`ReqwestTransport`] constructor\n/// calls this first. It is idempotent and safe to call from any number of threads: the first\n/// caller does the work, concurrent callers wait for it, and every caller gets the same answer\n/// (the outcome of that first install, not a fresh probe). `install_default` returns `Err` when\n/// a provider is already installed; that is success for our purposes and is reported as\n/// [`CryptoProviderInstall::AlreadyInstalled`] rather than treated as a failure or, worse,\n/// replaced.\n#[cfg(feature = "http")]\npub fn ensure_crypto_provider() -> CryptoProviderInstall {\n    static OUTCOME: std::sync::OnceLock<CryptoProviderInstall> = std::sync::OnceLock::new();\n    *OUTCOME.get_or_init(\n        || match rustls::crypto::ring::default_provider().install_default() {\n            Ok(()) => CryptoProviderInstall::InstalledRing,\n            Err(_already_installed) => CryptoProviderInstall::AlreadyInstalled,\n        },\n    )\n}\n\n/// How many causes of an error [`cause_chain`] will print. A rustls or hyper chain is two or\n/// three deep; the bound only keeps a pathological chain from producing an unbounded message.\n#[cfg(feature = "http")]\nconst MAX_CAUSES: usize = 8;\n\n/// The causes of `e` (not `e` itself), each preceded by ": ", at most [`MAX_CAUSES`] of them.\n///\n/// reqwest\'s own `Display` stops at the top of the chain: a builder error reads only "builder\n/// error" and a send error only "error sending request for url (...)", so an operator whose note\n/// generation fails cannot tell "the certificate is for another name" from "the network is down".\n/// The causes of a *builder* error come from TLS set-up and the causes of a *send* error from the\n/// connection and the TLS handshake (for example "invalid peer certificate: UnknownIssuer" or\n/// "Revoked"); none of them carries a request header, a request body or a credential (the bearer\n/// is a header, and a header is not part of an error). The URL in the top-level text is as it\n/// always was.\n#[cfg(feature = "http")]\nfn cause_chain(e: &(dyn std::error::Error + \'static)) -> String {\n    let mut text = String::new();\n    let mut cause = e.source();\n    let mut shown = 0;\n    while let Some(c) = cause {\n        if shown == MAX_CAUSES {\n            text.push_str(": ...");\n            break;\n        }\n        text.push_str(": ");\n        text.push_str(&c.to_string());\n        cause = c.source();\n        shown += 1;\n    }\n    text\n}\n\n/// The reason a client could not be built, from reqwest\'s error and its causes.\n#[cfg(feature = "http")]\nfn describe_build_error(e: &reqwest::Error) -> String {\n    format!("could not set up TLS{}", cause_chain(e))\n}\n\n/// A failed send: reqwest\'s one-line text (with the URL, as before) plus the causes.\n#[cfg(feature = "http")]\nfn describe_send_error(e: &reqwest::Error) -> String {\n    format!("{e}{}", cause_chain(e))\n}\n\n#[cfg(feature = "http")]\nimpl ReqwestTransport {\n    /// A transport that is bounded at both the connect phase and the whole request, so a\n    /// stalling peer always fails rather than hanging the caller. Trusts the operating\n    /// system\'s certificate store and nothing else (see the type documentation).\n    pub fn new() -> Result<Self, TransportError> {\n        Self::build(&[])\n    }\n\n    /// Explicit test transport for local HTTP fixture servers. Every request still validates\n    /// its parsed host: non-loopback HTTP is refused, HTTPS keeps ordinary TLS verification,\n    /// and redirects are never followed. Normal application wiring must use [`Self::new`].\n    pub fn new_for_loopback_tests() -> Result<Self, TransportError> {\n        let mut transport = Self::from_builder(Self::shipped_builder(&[]).https_only(false))?;\n        transport.loopback_http_for_tests = true;\n        Ok(transport)\n    }\n\n    fn require_request_url(&self, url: &str) -> Result<(), TransportError> {\n        if self.loopback_http_for_tests {\n            require_loopback_test_url(url)\n        } else {\n            require_https_base_url(url)\n        }\n    }\n\n    /// The one place a production client is built. `extra_roots` is always empty in production;\n    /// the TLS tests pass a throwaway CA so that "signed by a root we were given" can be exercised\n    /// against the real client. The function is private and its only non-test caller is\n    /// [`ReqwestTransport::new`] passing `&[]`, so no release code path can widen the trust set.\n    fn build(extra_roots: &[reqwest::Certificate]) -> Result<Self, TransportError> {\n        Self::from_builder(Self::shipped_builder(extra_roots))\n    }\n\n    /// The builder `build` uses: the shipped timeouts, [`CONNECT_TIMEOUT_SECS`] and\n    /// [`REQUEST_TIMEOUT_SECS`], applied by [`ReqwestTransport::configured_builder`]. A separate\n    /// function so a test can read back what `build` configures (the `Debug` text of a reqwest\n    /// builder carries both timeouts) instead of trusting that the constants were passed on.\n    fn shipped_builder(extra_roots: &[reqwest::Certificate]) -> reqwest::blocking::ClientBuilder {\n        Self::configured_builder(\n            extra_roots,\n            std::time::Duration::from_secs(CONNECT_TIMEOUT_SECS),\n            std::time::Duration::from_secs(REQUEST_TIMEOUT_SECS),\n        )\n    }\n\n    /// The client builder before `.build()`, with the two timeouts as arguments so a test can prove\n    /// they take effect without waiting ten or sixty seconds.\n    fn configured_builder(\n        extra_roots: &[reqwest::Certificate],\n        connect_timeout: std::time::Duration,\n        timeout: std::time::Duration,\n    ) -> reqwest::blocking::ClientBuilder {\n        let mut builder = reqwest::blocking::Client::builder()\n            .https_only(false)\n            .connect_timeout(connect_timeout)\n            .timeout(timeout)\n            // NEVER follow a redirect: see "Redirect posture" on the type. The default policy\n            // follows ten and replays a 307/308 request body, which is the credential, to\n            // whichever host the response names.\n            .redirect(reqwest::redirect::Policy::none());\n        if !extra_roots.is_empty() {\n            builder = builder.tls_certs_merge(extra_roots.iter().cloned());\n        }\n        builder\n    }\n\n    /// Install the crypto provider, then build. Reqwest 0.13 with `rustls-no-provider` panics at\n    /// this point if no provider is installed, so nothing builds a client without going through here.\n    fn from_builder(builder: reqwest::blocking::ClientBuilder) -> Result<Self, TransportError> {\n        ensure_crypto_provider();\n        let client = builder\n            .build()\n            .map_err(|e| TransportError(describe_build_error(&e)))?;\n        Ok(ReqwestTransport {\n            client,\n            loopback_http_for_tests: false,\n        })\n    }\n}\n\n#[cfg(all(test, feature = "http"))]\nmod tls_tests;\n\n/// Read at most `cap` bytes from `r`, refusing anything larger, and giving up at `deadline`.\n///\n/// **Deliberately free of `reqwest`** — it takes `impl Read`, so it compiles in the default build\n/// and a test can drive it with a `Cursor`, a failing reader, or a dripping one. An earlier version\n/// took a `reqwest::blocking::Response`, which meant it existed only under the `http` feature:\n/// linted there, executed by no gate at all.\n///\n/// # Why this takes a deadline (PERF-2)\n///\n/// This function replaced `reqwest`\'s own `text()`, and that swap **introduced a hang** that\n/// `text()` did not have. Measured: a drip server was still being read **172 seconds past** a\n/// 60-second client deadline, while the pre-change `text()` path errored at exactly 30.0s under\n/// an identical drip.\n///\n/// **Which phase owns which bound — the precise version, because the loose one is dangerous.**\n/// `reqwest`\'s client timeout *is* a running total over the **response head**: connect, send,\n/// status line and headers. Measured, a peer that sends a valid status line and then drips header\n/// bytes forever is cut off at exactly the client deadline, by `reqwest`, with no help from here.\n/// It degrades to **per read-wait** only over the **body**, and only once the body read is taken\n/// out from under `reqwest`\'s own bookkeeping — which is exactly what replacing `text()` with this\n/// loop did.\n///\n/// So this is **not an inherited `reqwest` weakness**. The gap was created by moving the read\n/// here, and it is re-created by any future change that takes a read into its own hands. That is\n/// the thing to watch for, not `reqwest`. Saying "reqwest\'s timeout is per-wait" without the split\n/// invites a reader to conclude this deadline is redundant *wherever* `reqwest` is involved and\n/// delete it; over the body it is the only bound there is.\n///\n/// | peer behaviour              | phase         | outcome                          |\n/// |-----------------------------|---------------|----------------------------------|\n/// | headers done, body drips    | body read     | 60.0s — this function\'s deadline  |\n/// | status line, headers drip   | response head | 60.0s — `reqwest`\'s client timeout |\n///\n/// A **zero-byte** stall also cuts at the client deadline, which is why the hang was invisible:\n/// every probe written for the original bound tested silence, and silence was the one shape that\n/// already worked. "It fails rather than hanging" was true for the case that had been tried and\n/// false in general.\n///\n/// So the loop owns its own deadline. It is checked before every read and after every chunk, which\n/// bounds total elapsed time regardless of how the bytes are paced.\n///\n/// Reads `cap + 1` so **"exactly at the cap" is distinguishable from "over it"**: stopping at\n/// exactly `cap` would silently truncate a legitimately cap-sized body, and a truncated JSON body\n/// surfaces as a confusing parse error rather than the size problem it is.\n///\n/// Errors carry the cap or the deadline and **nothing from the body**: a response body is\n/// attacker-influenced and, on at least one real provider, contains key material.\npub fn read_capped(\n    r: impl std::io::Read,\n    cap: usize,\n    deadline: Option<std::time::Instant>,\n) -> Result<Vec<u8>, TransportError> {\n    use std::io::Read;\n    let expired = |d: Option<std::time::Instant>| d.is_some_and(|d| std::time::Instant::now() >= d);\n    // `saturating_add`: a caller may legitimately pass `usize::MAX` to mean "no size cap, bound\n    // me by the deadline alone", and `+ 1` on that overflows and panics in a debug build. Found by\n    // the PERF-2 drip test, which does exactly that.\n    let mut limited = r.take((cap as u64).saturating_add(1));\n    let mut buf: Vec<u8> = Vec::new();\n    let mut chunk = [0u8; 8 * 1024];\n    loop {\n        if expired(deadline) {\n            return Err(TransportError(\n 