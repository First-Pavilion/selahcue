name: wave3 DNV standalone real TLS redirect RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stt-redirects:
    name: standalone STT redirect baseline (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation/desktop/crates/selahcue-stt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: clippy, rustfmt
      - name: Verify pinned compiler
        working-directory: ${{ github.workspace }}
        run: sh scripts/check_toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop/crates/selahcue-stt
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Standalone default tests and necessary dev-only lock resolution
        run: cargo test --no-fail-fast
      - name: Real TLS redirect RED and unchanged model fetch controls
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --features download --lib model_fetch:: -- --nocapture
      - name: Preserve Cargo-generated fixture lock and its diff
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYLOCK'
          import base64, hashlib
          from pathlib import Path
          data = Path('Cargo.lock').read_bytes()
          print('DNV_GENERATED_LOCK_SHA256 ' + hashlib.sha256(data).hexdigest())
          print('DNV_GENERATED_LOCK_BASE64 ' + base64.b64encode(data).decode())
          PYLOCK
          git diff -- Cargo.lock
      - name: Actual default standalone clippy baseline
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Actual download standalone clippy baseline
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets --features download -- -D warnings
