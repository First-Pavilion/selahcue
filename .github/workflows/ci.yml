name: wave2 PP-GEN var sensitivity and restored full DOM proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: PP-GEN baseline old-helper actual-site CSS restored
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full suite baseline exact helper regression actual CSS hazard and restoration
        run: |
          python3 - <<'PY'
          import ast
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root/'implementation/desktop/crates/selahcue-operator/dist'
          driver = root/'scripts/operator_headless.py'
          original = driver.read_text()
          expected = [n.value.value for n in ast.parse(original).body
                      if isinstance(n, ast.Assign) and isinstance(n.value, ast.Constant)
                      and any(isinstance(t, ast.Name) and t.id == 'EXPECTED_MIN_CHECKS' for t in n.targets)][-1]
          assert expected == 2406
          env = {**os.environ, 'SELAHCUE_HEADLESS_REQUIRE':'1', 'PYTHONPATH':str(root/'scripts')}

          def run(label, harness=driver, dist=source):
              result = subprocess.run([sys.executable,str(harness)],
                                      env={**env, 'SELAHCUE_OPERATOR_DIST':str(dist)},
                                      text=True,capture_output=True,timeout=180)
              print(label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              return result

          def clean(result):
              assert result.returncode == 0 and f'{expected} checks, 0 FAIL' in result.stdout

          def controls(result):
              for text in [
                  'F30 premise: the browser applies variable-delivered brightness',
                  'F30 premise: the matching raw rule contains no literal brightness',
                  "F30 control: the four siblings' conservative composed predicate already rejects",
                  'F30 control: a clean matching rule still passes both predicates',
                  'CSSOM-PARSE-06 (PP-GEN shape)',
              ]:
                  assert 'PASS: '+text in result.stdout, text

          clean(run('BASELINE'))
          with tempfile.TemporaryDirectory(prefix='selahcue-f30-mutants-') as temp:
              copied = Path(temp)/'dist'
              shutil.copytree(source,copied)
              harness = Path(temp)/'operator_headless.py'
              repo_anchor = '_REPO = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))'
              assert original.count(repo_anchor) == 1
              prepared = original.replace(repo_anchor,'_REPO = '+repr(str(root)),1)
              fixed = '''  window.__cssNoBrightnessFilter = function(sel, src) {
              return window.__cssFilterGuardOk(sel, src);
            };'''
              # Exact old production helper body, not a duplicate test-only predicate.
              old = '''  window.__cssNoBrightnessFilter = function(sel, src) {
              if (window.__cssRules(sel, src).length === 0) { return false; }  // fail-closed, as above
              var filterVal = window.__cssEffectiveFilter(sel, src);
              var rawBlocks = window.__cssRawBlocks(sel, src);
              return (!filterVal || !/brightness/.test(filterVal)) &&
                !rawBlocks.some(function(body) { return /brightness/i.test(body); });
            };'''
              assert prepared.count(fixed) == 1, repr(fixed)
              harness.write_text(prepared.replace(fixed,old,1))
              regression = run('EXACT_OLD_HELPER_MUTANT',harness,copied)
              controls(regression)
              assert regression.returncode == 1 and f'{expected} checks, 1 FAIL' in regression.stdout
              assert 'FAIL: F30: the real PP-GEN predicate rejects brightness delivered through var()' in regression.stdout
              assert 'PASS: PP-GEN: .pp-generate:hover does NOT use filter:brightness()' in regression.stdout
              harness.write_text(prepared)
              css = copied/'app.css'
              original_css = css.read_bytes()
              css.write_bytes(original_css+b'\n:root{--__f30-real-glow:brightness(1.06);}\n.pp-generate:hover{background:#5a48d0;filter:var(--__f30-real-glow);}\n')
              hazard = run('REAL_PP_GEN_CANDIDATE_CSS_MUTANT',harness,copied)
              controls(hazard)
              assert hazard.returncode == 1 and f'{expected} checks, 1 FAIL' in hazard.stdout
              assert 'FAIL: PP-GEN: .pp-generate:hover does NOT use filter:brightness()' in hazard.stdout
              assert 'PASS: F30: the real PP-GEN predicate rejects brightness delivered through var()' in hazard.stdout
              css.write_bytes(original_css)
              source_files = {str(p.relative_to(source)):hashlib.sha256(p.read_bytes()).hexdigest()
                              for p in source.rglob('*') if p.is_file()}
              restored_files = {str(p.relative_to(copied)):hashlib.sha256(p.read_bytes()).hexdigest()
                                for p in copied.rglob('*') if p.is_file()}
              assert source_files == restored_files
              assert harness.read_text() == prepared
              assert prepared.replace('_REPO = '+repr(str(root)),repo_anchor,1) == original
              print('RESTORED_DIST_IDENTICAL',len(source_files),'files',source_files,flush=True)
              print('RESTORED_HARNESS_IDENTICAL_EXCEPT_EXPLICIT_REPO_PATH',hashlib.sha256(original.encode()).hexdigest(),flush=True)
              clean(run('RESTORED',harness,copied))
          assert driver.read_text() == original
          print('MUTATION_VERIFIED: baseline GREEN; exact old helper and actual-site CSS RED; complete restoration GREEN',flush=True)
          PY
