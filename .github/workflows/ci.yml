name: wave2 plan-deck library snapshot diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: plan-deck library real DOM regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full operator DOM suite with existing race controls
        env:
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: python3 scripts/operator_headless.py
