name: wave3 F31 recovery GREEN and complete count measurement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    name: F31 corrected current and previous raw helper recovery controls
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Existing pinned browser automation
        run: python3 -m pip install --quiet playwright==1.60.0
      - name: Committed regression block actual CSSOM raw and composed helpers
        run: |
          python3 -u - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          source = '5e84933ad77185780af39b6300bf93cb7cdbe238'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines() == ['.github/workflows/ci.yml']
          script = Path('scripts/operator_headless.py')
          original = script.read_bytes()
          module = ast.parse(original)
          nodes = {n.targets[0].id:n.value for n in module.body if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name)}
          driver = ast.literal_eval(nodes['DRIVER'])
          block = driver.split('// F31-RECOVERY-BEGIN',1)[1].split('// F31-RECOVERY-END',1)[0]
          current = eval(compile(ast.Expression(nodes['CSS_SRC']),str(script),'eval'),{'json':json,'os':os,'DIST':'implementation/desktop/crates/selahcue-operator/dist'})
          baseline = ast.parse(subprocess.check_output(['git','show','b7c3d8156986d482a3a229884f8afb45f484c3a3:scripts/operator_headless.py'],text=True))
          baseline_css = next(n.value for n in baseline.body if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name) and n.targets[0].id=='CSS_SRC')
          assert ast.dump(nodes['CSS_SRC']) != ast.dump(baseline_css)  # scoped recovery correction now present
          previous = subprocess.check_output(['git','show','71d2cbc9d4638fd58c27e46303e13addabad5f31:scripts/operator_headless.py'],text=True)
          start = '  window.__cssRawBlocks = function(sel, src) {'
          end = '  window.__cssRawHasFilter = function(sel, src) {'
          old_raw = previous[previous.index(start):previous.index(end,previous.index(start))]
          a = current.index(start); b = current.index(end,a)
          old_control = current[:a]+old_raw+current[b:]
          print('F31_REVIEW_SOURCE_PROOF',json.dumps({'source':source,'guardRecoveryCorrectedAfterActualRED':True,'previousRawSource':'71d2cbc9d4638fd58c27e46303e13addabad5f31','onlyControlDifference':'actual previous raw-block function inside same actual helper closure','harnessSHA256':hashlib.sha256(original).hexdigest(),'committedBlockSHA256':hashlib.sha256(block.encode()).hexdigest(),'previousRawSHA256':hashlib.sha256(old_raw.encode()).hexdigest()}),flush=True)
          results = {}
          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox'])
              page = browser.new_page(viewport={'width':800,'height':600})
              for label,helpers in [('current',current),('actual_previous_raw',old_control)]:
                  page.set_content('<html><head></head><body>'+helpers+'</body></html>')
                  records = page.evaluate('(block)=>{window.f31reviewRecords=[];window.ok=(pass,name)=>f31reviewRecords.push({pass:!!pass,name});eval(block);return f31reviewRecords}',block)
                  for item in records:
                      print('F31_REVIEW_RECORD',label,'PASS' if item['pass'] else 'FAIL',item['name'],flush=True)
                  assert len(records) == 28,(label,records)
                  assert all(r['pass'] for r in records if r['name'].startswith(('F31 recovery premise/','F31 recovery clean/'))),(label,records)
                  assert all(r['pass'] for r in records if '/balanced_value/' in r['name'] or r['name'].startswith('F31 recovery clean/balanced_value:')),(label,records)
                  results[label] = records
              browser.close()
          current_failures = [r['name'] for r in results['current'] if not r['pass']]
          assert not current_failures and all(r['pass'] for r in results['actual_previous_raw']),results
          assert script.read_bytes() == original
          print('F31_REVIEW_CURRENT_AND_PREVIOUS_PASS_VERIFIED',json.dumps({'source':source,'currentFailures':current_failures,'currentPass':sum(r['pass'] for r in results['current']),'previousPass':sum(r['pass'] for r in results['actual_previous_raw']),'harnessUnchanged':True}),flush=True)
          sys.exit(0)
          PY
  driver:
    name: F31 recovery complete behavior and actual strict-count measurement
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Actual full driver current candidate
        env:
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: |
          test "$(git rev-parse HEAD^)" = 5e84933ad77185780af39b6300bf93cb7cdbe238
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci.yml
          set +e
          python3 -u scripts/operator_headless.py > f31-driver.log 2>&1
          gate_status=$?
          set -e
          cat f31-driver.log
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          text = Path('f31-driver.log').read_text()
          summary = re.findall(r'^=== (\d+) checks, (\d+) FAIL ===$',text,re.M)
          named = re.findall(r'^FAIL: (.*)$',text,re.M)
          assert len(summary) == 1 and summary[0][1] == '0',(summary,named)
          assert len(named) == 1 and re.match(r'\d+ checks ran; expected exactly 2733 ',named[0]),named
          assert len(re.findall(r'^PASS: F31 recovery ',text,re.M)) == 28
          assert all(name.startswith('F31 ') or re.match(r'\d+ checks ran; expected exactly ',name) for name in named),named
          premises = re.findall(r'^PASS: F31 (?:CSSOM premise|escaped premise|dropped premise|condition premise)/.*$',text,re.M)
          clean = re.findall(r'^PASS: F31 clean/.*$',text,re.M)
          assert len(premises) == 32 and len(clean) == 16,(premises,clean)
          assert 'PASS: F31 clean boundary:' in text
          print('F31_RECOVERY_FULL_BEHAVIOR_ACTUAL_COUNT',json.dumps({'summary':summary,'namedFailures':named,'positivePremises':len(premises),'cleanControls':len(clean),'source':'5e84933ad77185780af39b6300bf93cb7cdbe238'}))
          PY
          exit "$gate_status"
