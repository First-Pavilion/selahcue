name: wave3 F31 final current halves recovery and restoration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    name: F31 final ${{ matrix.mutant }} and restored full2761
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mutant: [cssom_exact, raw_previous, nested_context_removed, recovery_previous]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Existing pinned browser automation for actual recovery branch controls
        run: python3 -m pip install --quiet playwright==1.60.0
      - name: Exact current mutant focused recovery controls and restored complete siblings
        env:
          MUTANT: ${{ matrix.mutant }}
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: |
          python3 -u - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          from playwright.sync_api import sync_playwright


          SOURCE = "3f378248046a77fc790ebf998e3569e167a20286"
          SCRIPT = Path("scripts/operator_headless.py")
          DIST = Path("implementation/desktop/crates/selahcue-operator/dist")
          MUTANT = os.environ["MUTANT"]
          assert subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip() == SOURCE
          assert subprocess.check_output(["git", "diff", "--name-only", SOURCE, "HEAD"], text=True).splitlines() == [".github/workflows/ci.yml"]
          ORIGINAL = SCRIPT.read_bytes()


          def hashes():
              files = sorted(p for p in DIST.iterdir() if p.is_file()) + [SCRIPT]
              return {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}


          INITIAL = hashes()
          assert len(INITIAL) == 17
          for path, digest in INITIAL.items():
              assert hashlib.sha256(subprocess.check_output(["git", "show", SOURCE + ":" + path])).hexdigest() == digest, path
          print("F31_FINAL_SOURCE_PROOF", SOURCE, MUTANT, json.dumps(INITIAL), flush=True)
          print("F31_FINAL_BOUND_REPLAN", json.dumps({"oldAuxiliarySeconds": 240, "newAuxiliarySeconds": 300, "jobMinutes": 12, "productBrowserSeconds": 90, "authorizedBy": "root final qualification iteration8", "finiteEvidence": "b7 normal Chrome step ~263s;5e complete measurement ~259s", "oldTimeoutCause": "UNKNOWN; no flake/pass relabel", "guarantee": "none; all current bounds/assertions remain gates"}), flush=True)


          def assignment(tree, name):
              return next(n.value for n in tree.body if isinstance(n, ast.Assign) and isinstance(n.targets[0], ast.Name) and n.targets[0].id == name)


          observed = ast.parse(subprocess.check_output(["git", "show", "5e84933ad77185780af39b6300bf93cb7cdbe238:scripts/operator_headless.py"], text=True))
          current = ast.parse(ORIGINAL)
          for name in ["CSS_SRC", "DRIVER", "STUB"]:
              assert ast.dump(assignment(current, name)) == ast.dump(assignment(observed, name)), name
          print("F31_LINKED_ACTUAL_BEHAVIOR_MEASUREMENT", json.dumps({"observedSource": "5e84933ad77185780af39b6300bf93cb7cdbe238", "run": 41189844529, "actualBehavior": "2761/0", "oldStrictCount": "2733 exited4, separate", "finalSource": SOURCE, "CSS_SRC_DRIVER_STUB_Equal": True, "finalStrictCount": 2761, "freshNormal": "mandatory independent gate, not inferred from measurement"}), flush=True)


          def replace_once(text, before, after):
              assert text.count(before) == 1, (before, text.count(before))
              return text.replace(before, after, 1)


          def raw_function(ref):
              text = subprocess.check_output(["git", "show", ref + ":scripts/operator_headless.py"], text=True)
              start = text.index("  window.__cssRawBlocks = function(sel, src) {")
              end = text.index("  window.__cssRawHasFilter = function(sel, src) {", start)
              return text[start:end]


          def replace_raw(text, ref):
              start = text.index("  window.__cssRawBlocks = function(sel, src) {")
              end = text.index("  window.__cssRawHasFilter = function(sel, src) {", start)
              return text[:start] + raw_function(ref) + text[end:]


          def capture_phase(label):
              started = time.monotonic()
              seen = {}
              timed_out = False
              markers = {
                  "startup_d5": "PASS: D5 (ADR-0026)",
                  "selector_check_started": "PASS: filter-guard-selector (17tnw2ayetm)",
                  "selector_controls_complete": "PASS: filter-guard-selector negative controls (17tnw2ayetm)",
                  "launcher_contract_complete": "PASS: headless-launch contract (17tnw2b1f32)",
                  "browser_output_received": "PASS: #7-fix render_console",
                  "complete_browser_summary": "=== 2761 checks,",
              }
              with tempfile.TemporaryDirectory(prefix="f31-final-output-") as temp:
                  stdout_path = Path(temp) / "stdout.log"
                  stderr_path = Path(temp) / "stderr.log"
                  with stdout_path.open("w") as out, stderr_path.open("w") as err:
                      process = subprocess.Popen([sys.executable, "-u", str(SCRIPT)], stdout=out, stderr=err)
                      while True:
                          elapsed = time.monotonic() - started
                          output = stdout_path.read_text()
                          for name, marker in markers.items():
                              if name not in seen and marker in output:
                                  seen[name] = elapsed
                                  print("F31_FINAL_PHASE", label, name, elapsed, flush=True)
                          if process.poll() is not None:
                              break
                          remaining = 300 - elapsed
                          if remaining <= 0:
                              timed_out = True
                              process.kill()
                              process.wait(timeout=10)
                              break
                          try:
                              process.wait(timeout=min(1, remaining))
                          except subprocess.TimeoutExpired:
                              pass
                  result = subprocess.CompletedProcess([sys.executable, "-u", str(SCRIPT)], process.returncode, stdout_path.read_text(), stderr_path.read_text())
              print("F31_FINAL_PHASE_SUMMARY", label, json.dumps({"elapsedSeconds": time.monotonic() - started, "timedOut300": timed_out, "observedMarkers": seen, "source": SOURCE, "singleProcessOnly": True}), flush=True)
              print(result.stdout, flush=True)
              print(result.stderr, file=sys.stderr, flush=True)
              assert not timed_out, "explicit300s auxiliary cap reached; partial output retained, no proof"
              return result


          def run_case(label, restored=False):
              result = capture_phase(label)
              summaries = re.findall(r"^=== (\d+) checks, (\d+) FAIL ===$", result.stdout, re.M)
              failures = re.findall(r"^FAIL: (.*)$", result.stdout, re.M)
              passes = re.findall(r"^PASS: (.*)$", result.stdout, re.M)
              assert len(summaries) == 1 and summaries[0][0] == "2761", (label, summaries)
              assert sum(x.startswith(("F31 CSSOM premise/", "F31 escaped premise/", "F31 dropped premise/", "F31 condition premise/")) for x in passes) == 32
              assert sum(x.startswith("F31 clean/") for x in passes) == 16
              assert any(x.startswith("F31 clean boundary:") for x in passes)
              assert sum(x.startswith("F31 recovery premise/") for x in passes) == 8
              assert sum(x.startswith("F31 recovery clean/") for x in passes) == 4
              for old in ["WKH background cascade/important-longhand:", "WKH background cascade/local-var-shorthand:", "AYETD viewport control:", "AYZVG cached UI replay:", "F30: the real PP-GEN predicate rejects brightness delivered through var()", "WKG danger composed/media_danger"]:
                  assert any(x.startswith(old) for x in passes), (label, old)
              if restored:
                  assert result.returncode == 0 and summaries == [("2761", "0")] and failures == []
                  assert sum(x.startswith("F31 ") for x in passes) == 149
              else:
                  assert result.returncode == 1 and failures and all(x.startswith("F31 ") for x in failures), (label, result.returncode, failures)
                  required = {
                      "cssom_exact": ["F31 CSSOM candidate/list_first:", "F31 escaped composed/list_first:", "F31 escaped composed/is:", "F31 escaped composed/nested:"],
                      "raw_previous": ["F31 raw candidate/list_first:", "F31 dropped composed/list_first:", "F31 condition composed/is:", "F31 dropped composed/nested:"],
                      "nested_context_removed": ["F31 CSSOM candidate/nested:", "F31 raw candidate/nested:", "F31 composed/nested:", "F31 escaped composed/nested_twice:", "F31 condition composed/nested_twice:"],
                      "recovery_previous": ["F31 recovery raw/stray_paren/dropped:", "F31 recovery composed/stray_paren/inactive:", "F31 recovery raw/stray_bracket/dropped:", "F31 recovery composed/stray_bracket/inactive:", "F31 recovery raw/bad_string_newline/dropped:", "F31 recovery composed/bad_string_newline/inactive:"],
                  }[MUTANT]
                  for prefix in required:
                      assert any(x.startswith(prefix) for x in failures), (label, prefix, failures)
                  if MUTANT == "recovery_previous":
                      assert len(failures) == 12 and all(x.startswith("F31 recovery ") for x in failures)
                      assert sum(x.startswith("F31 ") and not x.startswith("F31 recovery ") for x in passes) == 121
                  else:
                      assert sum(x.startswith("F31 recovery ") for x in passes) == 28
                  independent = {
                      "cssom_exact": ["F31 dropped composed/list_first:", "F31 condition composed/list_first:"],
                      "raw_previous": ["F31 escaped composed/list_first:", "F31 CSSOM candidate/is:"],
                      "nested_context_removed": ["F31 composed/is:", "F31 composed/list_first:"],
                      "recovery_previous": ["F31 composed/list_first:", "F31 escaped composed/is:", "F31 composed/nested:"],
                  }[MUTANT]
                  for prefix in independent:
                      assert any(x.startswith(prefix) for x in passes), (label, prefix)
              print("F31_FINAL_MUTATION_VERIFIED", label, json.dumps({"source": SOURCE, "mutant": MUTANT, "summary": summaries, "exit": result.returncode, "failures": failures, "oldSiblingsAndIndependentPositives": True}), flush=True)


          def focused_recovery(page, label, expected_prefix=None):
              module = ast.parse(SCRIPT.read_bytes())
              css_src = eval(compile(ast.Expression(assignment(module, "CSS_SRC")), str(SCRIPT), "eval"), {"json": json, "os": os, "DIST": str(DIST)})
              driver = ast.literal_eval(assignment(module, "DRIVER"))
              block = driver.split("// F31-RECOVERY-BEGIN", 1)[1].split("// F31-RECOVERY-END", 1)[0]
              page.set_content("<html><head></head><body>" + css_src + "</body></html>")
              records = page.evaluate("(block)=>{window.f31records=[];window.ok=(pass,name)=>f31records.push({pass:!!pass,name});eval(block);return f31records}", block)
              for record in records:
                  print("F31_FINAL_FOCUSED_RECORD", label, "PASS" if record["pass"] else "FAIL", record["name"], flush=True)
              assert len(records) == 28
              failures = [r["name"] for r in records if not r["pass"]]
              assert all(r["pass"] for r in records if r["name"].startswith(("F31 recovery premise/", "F31 recovery clean/")))
              if expected_prefix:
                  assert len(failures) == 4 and all(x.startswith(("F31 recovery raw/" + expected_prefix + "/", "F31 recovery composed/" + expected_prefix + "/")) for x in failures)
              else:
                  assert not failures, failures
              print("F31_FINAL_FOCUSED_VERIFIED", label, json.dumps({"source": SOURCE, "failures": failures, "pass": sum(r["pass"] for r in records), "actualCommittedBlock": True}), flush=True)


          if MUTANT == "recovery_previous":
              with sync_playwright() as pw:
                  browser = pw.chromium.launch(executable_path=shutil.which("google-chrome") or shutil.which("chromium"), headless=True, args=["--no-sandbox"])
                  page = browser.new_page(viewport={"width": 800, "height": 600})
                  focused_recovery(page, "baseline")
                  for name, before, after, prefix in [
                      ("paren_floor_removed", "parens = Math.max(0, parens - 1)", "parens--", "stray_paren"),
                      ("bracket_floor_removed", "brackets = Math.max(0, brackets - 1)", "brackets--", "stray_bracket"),
                      ("bad_string_recovery_removed", r"ch === quote || /[\n\r\f]/.test(ch)", "ch === quote", "bad_string_newline"),
                  ]:
                      try:
                          SCRIPT.write_text(replace_once(ORIGINAL.decode(), before, after))
                          focused_recovery(page, name, prefix)
                      finally:
                          SCRIPT.write_bytes(ORIGINAL)
                          assert hashes() == INITIAL
                          print("F31_FINAL_FOCUSED_IDENTICAL_RESTORE", name, json.dumps(hashes()), flush=True)
                  focused_recovery(page, "focused_restored")
                  browser.close()

          text = ORIGINAL.decode()
          if MUTANT == "cssom_exact":
              changed = replace_once(text, "return _cssFilterCandidate(_cssFilterSelector(rule), sel);", "return _cssNormSel(rule.selectorText) === _cssNormSel(sel);")
          elif MUTANT == "raw_previous":
              changed = replace_raw(text, "71d2cbc9d4638fd58c27e46303e13addabad5f31")
          elif MUTANT == "nested_context_removed":
              changed = replace_once(text, "function _cssResolveFilterSelector(selector, parent) {\n    if (!parent) return selector;", "function _cssResolveFilterSelector(selector, parent) {\n    return selector;")
          elif MUTANT == "recovery_previous":
              changed = replace_raw(text, "b7c3d8156986d482a3a229884f8afb45f484c3a3")
          else:
              raise AssertionError(MUTANT)
          ast.parse(changed)
          try:
              SCRIPT.write_text(changed)
              run_case(MUTANT)
          finally:
              SCRIPT.write_bytes(ORIGINAL)
              assert hashes() == INITIAL
              print("F31_FINAL_IDENTICAL_RESTORATION_BEFORE_FULL", MUTANT, json.dumps(hashes()), flush=True)
          run_case("restored_" + MUTANT, True)
          assert hashes() == INITIAL
          print("F31_FINAL_IDENTICAL_RESTORATION_AFTER_FULL", MUTANT, json.dumps(hashes()), flush=True)
          print("F31_FINAL_CURRENT_MUTANT_RESTORED_FULL_SIBLINGS_VERIFIED", MUTANT, flush=True)
          PY
