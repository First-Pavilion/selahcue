name: wave3 AYETE exact source phase attribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Original checker comparison and exact candidate phase trace
        run: |
          python3 -u - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          source = '53932a47dd2cc5ae42300b3d86d30f5960432965'
          original = '656dac3b8a567925db510027f068ac3c44d667dd'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines() == ['.github/workflows/ci.yml']
          script = Path('scripts/operator_headless.py')
          dist = Path('implementation/desktop/crates/selahcue-operator/dist')
          def hashes():
              return {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(dist.iterdir()) if p.is_file()} | {str(script):hashlib.sha256(script.read_bytes()).hexdigest()}
          initial = hashes()
          print('AYETE_TRACE_SOURCE_PROOF',source,json.dumps(initial),flush=True)
          names = {'FILTER_GUARD_SITES','FILTER_GUARD_CALL_RE','_JS_ASSIGN_RE','_extract_driver_js','_strip_js_comments','filter_guard_selector_problems','_filter_guard_negative_controls','check_filter_guard_call_sites_share_one_selector'}
          for label,text in [('original',subprocess.check_output(['git','show',original+':scripts/operator_headless.py'],text=True)),('candidate',script.read_text())]:
              nodes = [n for n in ast.parse(text).body if (isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name) and n.targets[0].id in names) or (isinstance(n,ast.FunctionDef) and n.name in names)]
              ns = {'re':re,'os':os,'__file__':str(script)}
              exec(compile(ast.Module(body=nodes,type_ignores=[]),str(script),'exec'),ns)
              started = time.monotonic()
              print('AYETE_CHECKER_START',label,started,flush=True)
              assert ns['check_filter_guard_call_sites_share_one_selector'](text)
              print('AYETE_CHECKER_END',label,time.monotonic()-started,flush=True)

          wrapper = '''import collections, json, os, runpy, sys, time
          sys.path.insert(0, os.path.abspath('scripts'))
          totals = collections.defaultdict(lambda: [0,0.0])
          started = {}
          phases = {'check_filter_guard_call_sites_share_one_selector','check_headless_launch_contract','self_test','_environment_self_test','_environment_timeout_self_test','run_headless_chrome'}
          counted = phases | {'_filter_guard_negative_controls','filter_guard_selector_problems','_strip_js_comments','binding','sub'}
          def profile(frame,event,arg):
              name = frame.f_code.co_name
              if name not in counted or not frame.f_code.co_filename.endswith(('operator_headless.py','headless_chrome.py')):
                  return
              if event == 'call':
                  started[id(frame)] = time.monotonic()
                  if name in phases:
                      print('AYETE_PHASE_START',name,time.monotonic(),flush=True)
              elif event == 'return' and id(frame) in started:
                  elapsed = time.monotonic()-started.pop(id(frame))
                  totals[name][0] += 1
                  totals[name][1] += elapsed
                  if name in phases:
                      print('AYETE_PHASE_END',name,elapsed,flush=True)
          sys.setprofile(profile)
          try:
              runpy.run_path('scripts/operator_headless.py',run_name='__main__')
          finally:
              sys.setprofile(None)
              print('AYETE_PHASE_AGGREGATES',json.dumps(totals),flush=True)
          '''
          wrapper = '\n'.join(line[10:] if line.startswith('          ') else line for line in wrapper.splitlines())
          started = time.monotonic()
          try:
              run = subprocess.run([sys.executable,'-u','-c',wrapper],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1','PYTHONUNBUFFERED':'1'},text=True,capture_output=True,timeout=690)
              print(run.stdout,flush=True)
              print(run.stderr,file=sys.stderr,flush=True)
              print('AYETE_TRACE_GATE_EXIT',run.returncode,'SECONDS',time.monotonic()-started,flush=True)
              assert run.returncode == 0 and '=== 2612 checks, 0 FAIL ===' in run.stdout
              assert not re.search(r'^FAIL:',run.stdout,re.M)
          except subprocess.TimeoutExpired as error:
              print('AYETE_TRACE_OUTER_TIMEOUT',time.monotonic()-started,flush=True)
              print(error.stdout,flush=True)
              print(error.stderr,flush=True)
              raise
          finally:
              assert hashes() == initial
              print('AYETE_TRACE_UNCHANGED_17_COMPONENTS',json.dumps(hashes()),flush=True)
          PY
