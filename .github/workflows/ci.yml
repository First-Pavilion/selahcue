          def run(label,command,expected_total):
              remaining=deadline-time.monotonic()
              if remaining<=0:
                  return {'label':label,'state':'UNEXECUTED matrix hard300s exhausted','exit':None,'timeout':True,'summaries':[]},''
              child=subprocess.Popen(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,start_new_session=True)
              timed_out=False
              try:
                  output,_=child.communicate(timeout=remaining)
              except subprocess.TimeoutExpired:
                  timed_out=True
                  try:os.killpg(child.pid,signal.SIGKILL)
                  except ProcessLookupError:pass
                  output,_=child.communicate()
              print(output,flush=True)
              clean=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',output)
              summaries=[tuple(map(int,x)) for x in re.findall(r'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;',clean)]
              count_ok=len(summaries)==1 and sum(summaries[0])==expected_total
              natural_errors=re.findall(r'F31_NATIVE_SPAWN_ERR tag=(natural_\S+) kind=(\S+) raw=([^\n]+)',clean)
              result={'label':label,'exit':child.returncode,'timeout':timed_out,'summaries':summaries,'original_test_count_verified':count_ok,'natural_errors':natural_errors,'output_sha256':hashlib.sha256(output.encode()).hexdigest()}
              print('F31_NATIVE_TRIAL='+json.dumps(result,sort_keys=True),flush=True)
              return result,clean
          
          control_result=None
