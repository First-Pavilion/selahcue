name: wave3 F31 S2 body preservation GREEN and actual count
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preservation:
    name: F31 actual previous bodies and77current controls retained
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Existing pinned browser automation
        run: python3 -m pip install --quiet playwright==1.60.0
      - name: Actual committed block and actual previous raw helper body-set preservation
        run: |
          python3 -u - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          from playwright.sync_api import sync_playwright


          SOURCE = "37f9d0f7fe6f219dd171ca98e6fe14f7447092a9"
          SCRIPT = Path("scripts/operator_headless.py")
          ORIGINAL = SCRIPT.read_bytes()
          assert subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip() == SOURCE
          assert subprocess.check_output(["git", "diff", "--name-only", SOURCE, "HEAD"], text=True).splitlines() == [".github/workflows/ci.yml"]
          module = ast.parse(ORIGINAL)
          assignments = {n.targets[0].id: n.value for n in module.body if isinstance(n, ast.Assign) and isinstance(n.targets[0], ast.Name)}
          driver = ast.literal_eval(assignments["DRIVER"])
          block = driver.split("// F31-RECOVERY-BEGIN", 1)[1].split("// F31-RECOVERY-END", 1)[0]
          current = eval(compile(ast.Expression(assignments["CSS_SRC"]), str(SCRIPT), "eval"), {"json": json, "os": os, "DIST": "implementation/desktop/crates/selahcue-operator/dist"})
          previous = subprocess.check_output(["git", "show", "71d2cbc9d4638fd58c27e46303e13addabad5f31:scripts/operator_headless.py"], text=True)
          start = "  window.__cssRawBlocks = function(sel, src) {"
          end = "  window.__cssRawHasFilter = function(sel, src) {"
          old_raw = previous[previous.index(start):previous.index(end, previous.index(start))]
          a = current.index(start)
          b = current.index(end, a)
          old_control = current[:a] + old_raw + current[b:]
          print("F31_S2_GREEN_SOURCE_PROOF", json.dumps({"source": SOURCE, "harnessSHA256": hashlib.sha256(ORIGINAL).hexdigest(), "actualCommittedBlockSHA256": hashlib.sha256(block.encode()).hexdigest(), "actualPreviousRawSHA256": hashlib.sha256(old_raw.encode()).hexdigest()}), flush=True)
          results = {}

          with sync_playwright() as pw:
              browser = pw.chromium.launch(executable_path=shutil.which("google-chrome") or shutil.which("chromium"), headless=True, args=["--no-sandbox"])
              page = browser.new_page(viewport={"width": 800, "height": 600})
              for label, helpers in [("current", current), ("actual_previous_raw", old_control)]:
                  page.set_content("<html><head></head><body>" + helpers + "</body></html>")
                  value = page.evaluate("""(block) => {
                    window.f31records = []; window.f31calls = [];
                    window.ok = (pass, name) => f31records.push({pass: !!pass, name});
                    var actual = window.__cssRawBlocks;
                    window.__cssRawBlocks = function(sel, src) {
                      var bodies = actual(sel, src);
                      f31calls.push({sel:sel, text:src.text, bodies:bodies.slice()});
                      return bodies;
                    };
                    eval(block);
                    var target = ".__cssom_f31_preservation__:hover";
                    var extras = [
                      ["nested_direct", target+"{color:red;& .__f31_child__{filter:none;}filter:none;}"],
                      ["quoted_brace_clean", target+'{content:"}";filter:none !important;backdrop-filter:brightness(1.06);}'],
                      ["quoted_brace_dropped", target+'{content:"}";filter:brightness(1.06) not-a-real-css-function();}']
                    ].map(function(c) {
                      var fx = __cssFixture(c[1]);
                      try { return {name:c[0], bodies:__cssRawBlocks(target,fx), raw:__cssRawHasFilter(target,fx), guard:__cssFilterGuardOk(target,fx)}; }
                      finally { fx.dispose(); }
                    });
                    return {records:f31records, calls:f31calls, extras:extras};
                  }""", block)
                  records = value["records"]
                  for record in records:
                      print("F31_S2_GREEN_RECORD", label, "PASS" if record["pass"] else "FAIL", record["name"], flush=True)
                  assert len(records) == 77 and all(r["pass"] for r in records), (label, records)
                  results[label] = value
              browser.close()

          new_calls = {(c["sel"], c["text"]): c["bodies"] for c in results["current"]["calls"]}
          old_calls = {(c["sel"], c["text"]): c["bodies"] for c in results["actual_previous_raw"]["calls"]}
          for key, bodies in old_calls.items():
              assert key in new_calls and all(body in new_calls[key] for body in bodies), (key, bodies, new_calls.get(key))
          new_extras = {c["name"]: c for c in results["current"]["extras"]}
          old_extras = {c["name"]: c for c in results["actual_previous_raw"]["extras"]}
          for name, old in old_extras.items():
              assert all(body in new_extras[name]["bodies"] for body in old["bodies"]), (name, old, new_extras[name])
              assert not old["raw"] or new_extras[name]["raw"], (name, old, new_extras[name])
              assert old["guard"] or not new_extras[name]["guard"], (name, old, new_extras[name])
          assert "color:red;filter:none;" in new_extras["nested_direct"]["bodies"]
          assert len(new_extras["nested_direct"]["bodies"]) > len(old_extras["nested_direct"]["bodies"])
          assert new_extras["nested_direct"]["guard"] and new_extras["quoted_brace_clean"]["guard"]
          assert not new_extras["quoted_brace_dropped"]["guard"]
          assert SCRIPT.read_bytes() == ORIGINAL
          print("F31_S2_ACTUAL_PREVIOUS_BODY_SUPERSET_VERIFIED", json.dumps({"source": SOURCE, "current77": True, "previous77": True, "actualInputPairsCompared": len(old_calls), "sameOpeningDifferentBodiesPreserved": {"current": new_extras["nested_direct"]["bodies"], "actualPrevious": old_extras["nested_direct"]["bodies"]}, "extraPredicateValues": {"current": new_extras, "actualPrevious": old_extras}, "harnessUnchanged": True}), flush=True)
          PY
  driver:
    name: F31 recovery complete behavior and actual strict-count measurement
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Actual full driver current candidate
        env:
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: |
          test "$(git rev-parse HEAD^)" = 37f9d0f7fe6f219dd171ca98e6fe14f7447092a9
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci.yml
          set +e
          python3 -u scripts/operator_headless.py > f31-driver.log 2>&1
          gate_status=$?
          set -e
          cat f31-driver.log
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          text = Path('f31-driver.log').read_text()
          summary = re.findall(r'^=== (\d+) checks, (\d+) FAIL ===$',text,re.M)
          named = re.findall(r'^FAIL: (.*)$',text,re.M)
          assert len(summary) == 1 and summary[0][1] == '0',(summary,named)
          assert len(named) == 1 and re.match(r'\d+ checks ran; expected exactly 2761 ',named[0]),named
          assert len(re.findall(r'^PASS: F31 recovery ',text,re.M)) == 77
          assert all(name.startswith('F31 ') or re.match(r'\d+ checks ran; expected exactly ',name) for name in named),named
          premises = re.findall(r'^PASS: F31 (?:CSSOM premise|escaped premise|dropped premise|condition premise)/.*$',text,re.M)
          clean = re.findall(r'^PASS: F31 clean/.*$',text,re.M)
          assert len(premises) == 32 and len(clean) == 16,(premises,clean)
          assert 'PASS: F31 clean boundary:' in text
          print('F31_S2_FULL_BEHAVIOR_ACTUAL_COUNT',json.dumps({'summary':summary,'namedFailures':named,'positivePremises':len(premises),'cleanControls':len(clean),'source':'37f9d0f7fe6f219dd171ca98e6fe14f7447092a9'}))
          PY
          exit "$gate_status"
