name: wave2 raw filter legitimate CSS browser RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: WKG unchanged primitive and five actual-site false REDs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full browser suite with harmless real-site CSS witness
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root/'implementation/desktop/crates/selahcue-operator/dist'
          sites = ['TD-012: the hover rule carries no `filter`',
                   'PSC-005: the hover rule carries no `filter`',
                   'GO-LIVE-HOVER: the hover rule carries no `filter`',
                   'TIMER-START-HOVER: the hover rule carries no `filter`',
                   'PP-GEN: .pp-generate:hover does NOT use filter:brightness()']

          def run(label,dist=source):
              result = subprocess.run([sys.executable,str(root/'scripts/operator_headless.py')],
                                      env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1','SELAHCUE_OPERATOR_DIST':str(dist)},
                                      text=True,capture_output=True,timeout=180)
              print(label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              return result

          baseline = run('UNCHANGED_RAW_PRIMITIVE_RED')
          for shape in ['none','priority','vendor_none','backdrop','vendor_backdrop','custom','earlier_none','media_none','supports_none']:
              assert 'PASS: WKG premise clean/'+shape in baseline.stdout
              assert 'FAIL: WKG clean composed/'+shape in baseline.stdout
          assert 'PASS: WKG premise backdrop: the browser applies the distinct backdrop property' in baseline.stdout
          assert 'PASS: WKG danger composed/media_danger' in baseline.stdout
          assert 'PASS: WKG danger composed/supports_danger' in baseline.stdout
          assert 'PASS: WKG danger composed/adjacent_after_none' in baseline.stdout
          assert 'PASS: WKG danger composed/middle_dropped' in baseline.stdout
          assert 'PASS: F30: the real PP-GEN predicate rejects brightness delivered through var()' in baseline.stdout
          for site in sites:
              assert 'PASS: '+site in baseline.stdout
          with tempfile.TemporaryDirectory(prefix='selahcue-wkg-actual-sites-') as temp:
              copied = Path(temp)/'dist'
              shutil.copytree(source,copied)
              css = copied/'app.css'
              harmless = '\n'.join(selector+'{filter:none;backdrop-filter:brightness(1.06);}'
                                   for selector in ['.td-save-cta:hover','.ps-start:hover','.tb-golive:hover','.timer-start:hover','.pp-generate:hover'])
              css.write_bytes(css.read_bytes()+b'\n'+harmless.encode()+b'\n')
              witness = run('FIVE_ACTUAL_SITES_HARMLESS_CSS_FALSE_RED',copied)
              for site in sites:
                  assert 'FAIL: '+site in witness.stdout
              assert 'PASS: WKG premise backdrop: the browser applies the distinct backdrop property' in witness.stdout
              assert 'PASS: WKG danger composed/media_danger' in witness.stdout
              print('FALSE_RED_WITNESS: all five actual registered guards reject harmless none/backdrop CSS',flush=True)
          assert baseline.returncode != 0
          sys.exit(baseline.returncode)
          PY
