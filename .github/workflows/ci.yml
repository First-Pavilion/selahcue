# PROPOSAL ONLY. Not dispatched. Workflow-only diagnostic at immutable failed main31c2.
name: diagnostic main31c sidecar spawn error
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-main31c-autolaunch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.context.outputs.desktop }}
      os: ${{ steps.context.outputs.os }}
      rust: ${{ steps.context.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - id: context
        shell: bash
        run: |
          echo 'desktop=true' >> "$GITHUB_OUTPUT"
          echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          channel="$(sh scripts/check_toolchain.sh --print-channel)"
          echo "rust=${channel}" >> "$GITHUB_OUTPUT"
  operator-native:
    name: operator shell — release & native-toolchain features (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # Sized from real per-step timings, not a guess. Run 33984097274 (windows-latest, this
    # job's slowest OS, COLD cache -- the first run the RELEASE steps ever executed) recorded
    # these to completion before the old job's 25-minute cap killed it further down the same
    # steps: setup (checkout+toolchain+pin-check+cache-restore+staging) 66s, Clippy (RELEASE)
    # 373s, Test (RELEASE) 653s. Clippy(stt,cloud-stt)/Test(stt,cloud-stt) were themselves cut
    # off mid-step by that cap, so their duration here is the last time they ran to completion,
    # pre-merge, on PR #22's own final run (33951200403, also windows-latest): 326s + 285s, plus
    # that run's own post-job cache-save of 238s (this job now caches more artefacts than that
    # run did, so treat 238s as a floor, not a ceiling). Sum: 66 + 373 + 653 + 326 + 285 + 238 +
    # ~5 (post-checkout/complete) = 1946s ≈ 32.4 minutes. That sizing predates 86akgrz3b and no
    # longer holds:
    #
    # RAISED 45 -> 60 (86akgrz3b, Vera's performance review of PR #125). `encryption`/
    # `read-encrypted-transcripts` default-on means the vendored-OpenSSL build now compiles
    # TWICE in this job (once for the RELEASE steps, once for stt,cloud-stt) on top of the
    # `openssl-src`/`nmake` cost already described on the `operator` job above. Vera measured
    # directly on a real PR #125 run: `Clippy (RELEASE)` 181s -> 545s, `Clippy (stt,cloud-stt)`
    # 206s -> 526s. A partly-warm run was already at ~24 minutes when a subsequent push's
    # concurrency cancel landed; Vera projects ~28-30 minutes partly warm and ~39-41 of the old
    # 45-minute cap on a fully cold run -- ~10% headroom, not the ~40% this comment used to
    # claim (the arithmetic above is left in place as the pre-86akgrz3b baseline, not updated in
    # place, so the delta this bump represents stays visible). 60 minutes restores real headroom
    # over the cold-run projection.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Linux always; Windows only when the tier step says so (17tnw2b2nxk). No macOS.
        os: ${{ fromJSON(needs.changes.outputs.os || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: implementation/desktop/crates/selahcue-operator
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.changes.outputs.rust }}
          components: clippy, rustfmt
      # Refuse to gate on a compiler nobody pinned. Same script `make ci` runs, so a
      # divergence between this pipeline and the local gate fails loudly here instead
      # of silently producing a green that means nothing (86ak5rc9c).
      - name: Verify the pinned toolchain is what is running
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sh scripts/check_toolchain.sh
      # `encryption` (86akgrz3b) is now default-on for selahcue-operator too, so the RELEASE and
      # stt,cloud-stt steps below compile the vendored-OpenSSL build here as well — see the
      # `rust` job's identical pair of steps for the full reasoning; not repeated per-job.
      - name: NASM for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Verify Perl is on PATH for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $p) {
            throw "perl not found on PATH -- see the 'rust' job's identical step for the full " + `
              "reasoning."
          }
          perl -v
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop/crates/selahcue-operator
          # Main saves, pull requests only restore -- see the `rust` job (17tnw2b1f24).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same packages as `operator`'s "Linux system deps" step above, needed here for the
      # identical reason: this job compiles the same crate (Tauri webview deps) and, from the
      # stt,cloud-stt pair below, `cpal`'s ALSA backend (`libasound2-dev`).
      - name: Linux system deps (Tauri v2 webview + ALSA for cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev libxkbcommon-dev \
            libasound2-dev
      - name: Stage Tauri sidecar/resource placeholders (compile-check only)
        # tauri-build validates that the externalBin sidecar (`selahcue-output`) and the NDI
        # resource dll exist at build time. This job COMPILE-checks the operator (it does not
        # bundle the app), so empty placeholders satisfy the existence check — the real sidecar is
        # built in the packaging/release flow. Without this the build script fails on CI
        # ("resource path `binaries/selahcue-output-<triple>` doesn't exist").
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          # CREATE-ONLY. `: > file` truncates, and these names include the
          # owner-supplied NDI dll. That is harmless on an ephemeral runner, but this
          # is the snippet people copy to reproduce CI locally, where truncating a real
          # dll is silent and git-unrecoverable (binaries/ is gitignored). Never make
          # this unconditional. 86ak5rjh7.
          stage() { [ -e "$1" ] || : > "$1"; }
          if [[ "$triple" == *windows* ]]; then
            stage "binaries/selahcue-output-${triple}.exe"
          else
            stage "binaries/selahcue-output-${triple}"
          fi
          stage "binaries/Processing.NDI.Lib.x64.dll"
          echo "staged Tauri placeholders for ${triple}"
      - name: DIAGNOSTIC ONLY preserve sidecar spawn errors
        shell: bash
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          import hashlib
          p = Path("src/autolaunch.rs")
          s = p.read_text()
          print("DIAG_AUTO original_sha256=" + hashlib.sha256(p.read_bytes()).hexdigest())
          old_missing = "    if !sidecar.exists() {\n        // Dev run:"
          new_missing = '    if !sidecar.exists() {\n        eprintln!(\n            "DIAG_AUTO sidecar_absent path={:?} metadata={:?}",\n            sidecar,\n            std::fs::symlink_metadata(&sidecar)\n        );\n        // Dev run:'
          old_spawn = "    let child = Command::new(&sidecar).spawn().ok()?;"
          new_spawn = '    let child = Command::new(&sidecar)\n        .spawn()\n        .map_err(|error| {\n            eprintln!(\n                "DIAG_AUTO spawn_error path={:?} kind={:?} raw_os_error={:?} error={} metadata={:?}",\n                sidecar,\n                error.kind(),\n                error.raw_os_error(),\n                error,\n                std::fs::symlink_metadata(&sidecar)\n            );\n            error\n        })\n        .ok()?;'
          assert s.count(old_missing) == 1 and s.count(old_spawn) == 1
          p.write_text(s.replace(old_missing, new_missing).replace(old_spawn, new_spawn))
          print("DIAG_AUTO instrumented_sha256=" + hashlib.sha256(p.read_bytes()).hexdigest())
          PYDIAG
          git diff -- src/autolaunch.rs
      # From the first GATE step onward, `!cancelled()`, and NO setup step after it -- same
      # rationale as `operator` above: one broken gate should cost one gate's worth of
      # information, not silently skip the rest of this job too.
      # THE release-profile gate on this crate (Sana's Medium-Low finding on PR #24, 86akcmzyq):
      # every operator test in the `operator` job above runs in DEBUG only, so `dev_env.rs`'s
      # `loads_the_env_file_iff_this_is_a_debug_build` and main.rs's
      # `the_environment_reaches_the_view_not_only_the_request` never exercised their RELEASE arm
      # in any gate -- a hardcoded argument, an inverted `!`, or a deleted early return in either
      # guard's call site would have passed every check in `operator` green. Same shape as the
      # licensing crate's RELEASE test in the `rust` job; `selahcue-operator` is excluded from
      # the workspace, so it needs its own explicit lines, on every OS this job's own matrix runs
      # (Linux; Windows when the tier includes it).
      - name: Clippy (dev-keys,openai-notes, RELEASE)
        if: ${{ !cancelled() }}
        run: cargo clippy --features dev-keys,openai-notes --release --all-targets -- -D warnings
      - name: Test (dev-keys,openai-notes, RELEASE — the release refusals only hold here)
        if: ${{ !cancelled() }}
        run: cargo test --features dev-keys,openai-notes --release --no-fail-fast
      # Cloud (Deepgram) live transcription (86akby7th): `cloud-stt` wires the already-tested
      # `selahcue-stt-cloud` streaming session into `listening.rs`'s capture path. It implies
      # `stt` (mic capture lives in `selahcue-stt` regardless of which recognizer consumes it),
      # so THIS is the first step in this job that compiles `stt` -- and therefore all of
      # `listening.rs`, where the routing decision this ticket fixes actually lives -- at all.
      # Without it, `listening.rs` would be exactly as "linted and tested by nothing" as
      # `selahcue-stt` itself (the standing example every feature-gate comment in this job
      # cites). whisper-rs-sys's native build needs only a C/C++ toolchain + cmake, which all
      # three GitHub-hosted runner images carry by default -- so the `stt`-only step at the end of
      # this job (86ak4y8yr) needs no setup of its own. It is NOT true, though, that this step
      # needs no extra system packages at all: `stt` also pulls in `selahcue-stt`'s `capture`
      # feature (`CpalSource`, real microphone capture via `cpal`), and on Linux `cpal` builds
      # against ALSA -- `alsa-sys` fails to compile without the ALSA development headers.
      #
      # That gap shipped TWICE in this ticket's own remediation, which is worth recording
      # exactly rather than smoothing over. First revision: this step and the Test step below
      # were red on ubuntu only, `libasound2-dev` was missing everywhere, and a step comment
      # claiming "no extra deps" was itself the confident-but-wrong signal this job's other
      # comments warn about. Second revision (still this ticket): the fix was made -- but in
      # the WRONG job. `libasound2-dev` was added to the `rust` job's "Linux system deps"
      # step, a job that never compiles `selahcue-operator` at all (it is excluded from the
      # workspace -- see this repo's CLAUDE.md) and has no `cpal` dependency to satisfy. This
      # step and the Test step below stayed red, because each CI job runs on its OWN fresh
      # runner -- a package installed in one job's runner does not exist in another's. The
      # comment that "fixed" it even said so in the same breath it got the job wrong.
      #
      # `libasound2-dev` is installed in THIS job's ("operator-native", `ci.yml`'s
      # `operator-native:` block) OWN "Linux system deps (Tauri v2 webview + ALSA for cpal)"
      # step, a few lines above -- not a step in a different job reached by the word "above"
      # alone. Check the claim against `ci.yml`'s `operator-native:` job, not against this
      # comment. A macOS `make ci` run cannot catch this class of gap by construction (Core
      # Audio needs no such package) -- see CLAUDE.md's "One OS, not three" note; nor would a
      # mismatched-job fix ever be caught by re-reading the diff instead of the actual GitHub
      # Actions run.
      - name: Clippy (stt,cloud-stt)
        if: ${{ !cancelled() }}
        run: cargo clippy --features stt,cloud-stt --all-targets -- -D warnings
      - name: Test (stt,cloud-stt)
        if: ${{ !cancelled() }}
        run: cargo test --features stt,cloud-stt --no-fail-fast
      # `stt` ALONE -- the configuration users actually install (86ak4y8yr). `windows-installer.yml`
      # builds `cargo tauri build --features stt`, with no `cloud-stt` (that feature is
      # `RELEASE: UNSAFE`, so the Makefile strips it from release builds). The `stt,cloud-stt` pair
      # above is a DIFFERENT compilation: `cloud-stt` implies `stt`, so it lints most of
      # `listening.rs`, but `start_listening` has a `#[cfg(not(feature = "cloud-stt"))]` arm that is
      # compiled ONLY when `stt` is on and `cloud-stt` is off, i.e. only in the shipped build. Until
      # this step, no push or PR compiled that arm; the first sign of a break there would have been a
      # manual `windows-installer` run.
      #
      # Clippy, not a separate `cargo check`: clippy type-checks every cfg arm, so a compile error
      # fails here too. No `Test (stt)` step: measured on macOS, `cargo test --features stt` runs 198
      # tests and every one of them also runs in the `stt,cloud-stt` pair above (206; the 8 extras
      # are `cloud-stt`-gated), and the only non-test code that differs is that one arm. Revisit if a
      # test is ever gated `not(feature = "cloud-stt")`.
      #
      # Cost: this job already builds `whisper-rs-sys` (cmake/whisper.cpp) and the vendored OpenSSL
      # for the steps above, with an identical `selahcue-stt` feature set, so cargo reuses those
      # artefacts and this step re-checks only six packages -- `tungstenite`, `tokio-tungstenite`,
      # `selahcue-stt-cloud` (its non-`deepgram` build), `selahcue-lan`, `selahcue-app` and the
      # operator crate itself -- the same six on every OS. That is why it lives here, on every
      # OS this job runs on, rather than in a new job (a new job would pay checkout/toolchain/cache setup
      # AND a second cold whisper.cpp + OpenSSL build per OS) and rather than Linux-only (Windows
      # is the one OS the installer ships on, and this job's own history rejects dropping it).
      # Measured on PR #137's run 36819129002: 5s on ubuntu (a full cache miss, so `whisper-rs-sys`
      # had just been built cold by the step before and was still reused), 10s on windows, 16s on
      # macOS; 7s locally on macOS arm64. If a later run shows a matrix arm near `timeout-minutes`,
      # the fallback is a Linux-only `if:` here -- the cfg arm is platform-independent -- not
      # removing the step.
      - name: Clippy (stt -- the shipped configuration, no cloud-stt)
        if: ${{ !cancelled() }}
        run: cargo clippy --features stt --all-targets -- -D warnings

      - name: DIAGNOSTIC ONLY bounded repeated real spawn fixtures
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: bash
        run: |
          failed=0
          for trial in 1 2; do
            echo "DIAG_AUTO full_native_repeat=${trial}"
            if cargo test --features stt,cloud-stt --no-fail-fast; then
              :
            else
              failed=1
            fi
          done
          for trial in {1..16}; do
            echo "DIAG_AUTO focused_spawn_repeat=${trial}"
            if cargo test --features stt,cloud-stt --no-fail-fast autolaunch::tests::spawn_ -- --nocapture; then
              :
            else
              failed=1
            fi
          done
          exit "${failed}"
