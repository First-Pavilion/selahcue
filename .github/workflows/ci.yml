name: wave3 Y0 actual host fixture modal measurement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver:
    name: Y0 complete current modal fixture replay measurement
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Actual complete driver without changing count or assertions
        env:
          SELAHCUE_HEADLESS_REQUIRE: "1"
        run: |
          test "$(git rev-parse HEAD^)" = ffd24b3d41dfb2a549b081c072b5c07723faaa81
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci.yml
          timeout 300s python3 -u scripts/operator_headless.py
