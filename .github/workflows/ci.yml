name: wave3 DNU HTTPS admission GREEN and sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementation/desktop
    steps:
      - uses: actions/checkout@v7
      # Disk headroom on the hosted Linux runner (17tnw2b2k23). From about 21:00 UTC on
      # 2026-10-04 this job failed on every run, in the "LAN server + app server features"
      # step, with the same code, the same runner image and the same Rust cache that had
      # passed an hour earlier: the runner has one 72 GB disk with 13.3 GB free, and this job
      # writes about 16.4 GB to it. A full disk crashes the runner agent, which loses the step
      # logs of the whole job (BlobNotFound), so those failures could not be read back.
      #
      # `free` deletes preinstalled software this job never uses (Android SDK, .NET, GHC,
      # CodeQL; about 21.7 GB, takes about 40 to 90 s) BEFORE anything is built, only on a
      # GitHub-hosted runner, and only when the runner is small: it SKIPS (and prints "skipped")
      # when 40 GB or more is free at job start. On the runners seen on 2026-10-05 (86 GB free)
      # the deletion therefore does not run at all; it was proven on the 13.3 GB runners of
      # 2026-10-04 and matters again only if the pool shrinks. Either way the step prints the
      # start figure. The `check` steps below are headroom alarms with a floor per
      # checkpoint, set on the step: each fails its own step, by name, while there is still
      # room to write. The last step warns below 10 GB free and adds one line to the job
      # summary. Linux only: macOS and Windows runners did not fail and are left alone. The
      # free step and the first check sit in the setup zone and the rest carry a status
      # function, as check_workflows.py requires. All the numbers, and why each floor is what
      # it is, are in scripts/ci_disk.sh.
      - name: Free disk space and report it at job start (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sh scripts/ci_disk.sh free
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      # Refuse to gate on a compiler nobody pinned. Same script `make ci` runs, so a
      # divergence between this pipeline and the local gate fails loudly here instead
      # of silently producing a green that means nothing (86ak5rc9c).
      - name: Verify the pinned toolchain is what is running
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sh scripts/check_toolchain.sh
      # `encryption` (86akgrz3b) is now a Cargo DEFAULT feature of both selahcue-desktop and
      # selahcue-data, so EVERY step below that builds this workspace with no --no-default-
      # features override — Format doesn't touch code, but Clippy (default features) and
      # Test (workspace) both do — now compiles rusqlite's `bundled-sqlcipher-vendored-openssl`,
      # which builds OpenSSL from source via openssl-src. That needs a Perl interpreter
      # (Configure) and NASM (assembly-optimized crypto routines) on Windows only — Linux and
      # macOS need just the C/C++ toolchain the runner already has (see selahcue-data/Cargo.toml's
      # `encryption` comment). Before 86akgrz3b this was moot because the feature was off by
      # default everywhere; now it is the actual, load-bearing reason the "Test (at-rest
      # encryption)" step further down no longer excludes Windows.
      #
      # ilammy/setup-nasm is the action the rust-openssl ecosystem commonly uses for exactly this
      # gap (pinned major version, matching this workflow's existing convention for narrowly-
      # scoped third-party actions like ilammy/msvc-dev-cmd and Swatinem/rust-cache).
      - name: NASM for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      # windows-latest is DOCUMENTED to ship Strawberry Perl, but "documented to" is not
      # "verified here" — asserting it explicitly turns a wrong assumption into a clear, named
      # failure at this step instead of a confusing OpenSSL Configure error buried inside a
      # `cargo build` several steps later.
      - name: Verify Perl is on PATH for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $p) {
            throw "perl not found on PATH -- the encryption feature's vendored-OpenSSL build " + `
              "(now default-on, 86akgrz3b) cannot run its Configure step without it. " + `
              "windows-latest is documented to ship Strawberry Perl; if this throws, the " + `
              "runner image changed and perl must be installed explicitly (e.g. " + `
              "'choco install strawberryperl')."
          }
          perl -v
      # Quinn's process finding on PR #24 (86akcmzyq): the PR template's feature-flag-
      # reachability section is three checkboxes a human ticks, unenforced by CI — exactly the
      # human step that let 86akby7d8 ship, merge, and stay invisible from `make launch` in the
      # first place. This makes it a build failure instead: asserts `make -n launch`/`make -n
      # operator`'s resolved feature list is a superset of the features the product has decided
      # must be default-reachable (dev-keys/openai-notes today, 86akcmzrd).
      #
      # Linux only now (this was Linux + macOS until the macOS leg left CI on 2026-10-05,
      # 17tnw2b2nxk; a Mac's own `make ci` still runs this script); Windows excluded. The history
      # below is why macOS had been included. Originally Linux-only, citing this pipeline's `nfr` job
      # as precedent for "make is not cross-OS-reliable" — Cody and Quinn (PR #24 remediation)
      # independently tested that precedent and it does not hold: `nfr`'s macOS skip is about a
      # one-time recorded timing baseline, and its Windows skip is about a POSIX shell script
      # doing memory measurement, neither of which is about Make itself being unreliable
      # cross-OS. Cody read the feature computation this script inspects and found zero
      # $(UNAME)-conditional branching in it — the Makefile's only OS-conditional code selects
      # NDI library paths and which shell wrapper launches the operator, not which Cargo features
      # get requested. Quinn confirmed empirically by running every one of this script's
      # self-test mutations successfully on macOS. Leaving macOS unguarded left uncovered exactly
      # the platform most likely to run `make launch` interactively — the signed `.app` path
      # exists for its microphone permissions — for the regression class this check exists to
      # catch. Windows stays excluded: GNU Make dry-run parsing there is unproven, unlike Linux
      # and macOS which both ship `make` by default.
      - name: Feature-flag reachability (make launch / make operator resolve the required set)
        # Setup-zone `if:` (implicit success()), NOT !cancelled(): this step sits before Format,
        # the first gate below, and check_workflows.py's ordinal rule forbids a success()-default
        # step running after a !cancelled() one — verified by running that checker against this
        # exact placement.
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/check_launch_reachability.py --self-test
          python3 scripts/check_launch_reachability.py
      # 17tnw2b2jfy: the translation-mirror converter's self-test (synthetic USFM, no network, about
      # a second) and the licence rules it enforces on the committed allowlist. Same setup-zone
      # placement and `if:` as the reachability step above, for the same ordinal-rule reason.
      - name: Translation mirror converter self-test
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/build_translation_catalog.py --self-test
      # 17tnw2b2jqd: the publish half of the same mirror (scripts/publish_translations.py, run by the manual
      # publish-translations workflow). Its self-test needs no network, no `aws` and no credentials: a fake `aws`
      # (a POSIX script, hence the same non-Windows `if:`) and a fake network stand in. Same setup-zone placement as
      # the converter step above, for the same ordinal-rule reason.
      - name: Translation publish script self-test
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/publish_translations.py --self-test
      # 17tnw2b9aga: the logic of the check `make nfr` (below, under xvfb) runs on the real release host's
      # stdout/stderr log: the live Operator token must not be in it. Offline and display-free; same
      # setup-zone placement and `if:` as the steps above, for the same ordinal-rule reason.
      - name: NFR token-leak check self-test
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_nfr_token_leak.py --self-test
      # 17tnw2b9ax3: the logic of `make audit` (scripts/cargo_audit_all.sh), run against a stub `cargo` in
      # throwaway git repos: offline, no cargo-audit, no advisory database. It proves the local audit cannot
      # print PASS for a root it did not check. (The audit itself needs the network and is not run here: the
      # `audit` job below is its hosted counterpart.) The script is POSIX sh, hence the same non-Windows
      # `if:`; same setup-zone placement as the steps above, for the same ordinal-rule reason.
      - name: Audit script (make audit) self-test
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_cargo_audit_all.py --self-test
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop
          # Save from `main` only (17tnw2b1f24). The cache key has no ref in it, so a pull
          # request restores main's entry exactly; what it must not do is SAVE its own copy.
          # Every PR run used to write a private 0.3-1.6 GB entry per job and OS, which put
          # the repo over its Actions cache limit and got main's own entries evicted, so
          # main's jobs then started cold.
          #
          # THE COST, so nobody removes this in a hurry. A PR can only restore what main
          # holds. While main has no entry for a job -- the job is red on main (a red job
          # saves nothing; macOS operator-native today, via flaky test 17tnw2b1vyy), the
          # entry was evicted, or a lockfile/toolchain change moved the key -- EVERY push of
          # EVERY PR runs that job cold. Before, a PR's first push seeded an entry its later
          # pushes reused. A cold Windows operator-native job is about 35 min against about
          # 4 warm. The remedy is to keep main's entries whole (17tnw2b1waw), not to let PRs
          # save again. Same line on every rust-cache step below; check_workflows.py fails
          # the build if one is missing.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system deps (winit/wgpu + software Vulkan for GPU parity)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libvulkan1 mesa-vulkan-drivers libdbus-1-dev
      # A real serif face, so the typography tests can do real work (86ak643rc).
      #
      # `themes_differing_only_in_typography_never_share_a_measurement` (selahcue-present)
      # needs one INSTALLED face that shapes differently from the BUNDLED Noto Sans, or its
      # serif comparisons cannot tell a font-blind cache key from a correct one. On Linux an
      # unresolved family name falls back to that same bundled face — see
      # `a_missing_font_falls_back_readably_and_deterministically` in selahcue-engine — so
      # with no real serif installed the test cannot pass. That is why it went red on this
      # runner and only this runner.
      #
      # WHAT THIS BUYS, PRECISELY -- it matters if anyone weighs dropping the pinned package.
      # It RESTORES a layer of checking; it is NOT what holds the font/weight cache-key
      # contract up. That contract is carried by `every_shaping_attribute_is_part_of_the_cache_key`,
      # which compares KEYS rather than frames and deliberately uses an uninstalled family, so
      # it needs no font at all. Measured on a bare ubuntu:24.04 with zero fonts installed:
      # that test PASSES unmutated, and still goes RED when `font` is dropped from
      # `measure::Key` (7 passed/1 failed unmutated; 6 passed/2 failed mutated). So a runner
      # without a serif still guards the contract -- what it loses is the LAYOUT-level check,
      # and it loses it LOUDLY: the typography test fails naming every face it looked for.
      #
      # WHY THE PACKAGE IS DECLARED HERE AT ALL. fonts-liberation is already on the
      # ubuntu-latest image, but only as an undocumented transitive dependency (of Chrome) --
      # the published ubuntu-24.04 software manifest lists just fonts-noto-color-emoji under
      # fonts. Resting a gate on a package nobody declared is the fragile inheritance this
      # step removes. Declaring it is the point.
      #
      # WHY THE VERSION IS *NOT* PINNED -- this was pinned to =1:2.1.5-3 and the pin was wrong.
      # Measured in containers:
      #   ubuntu:24.04  candidate 1:2.1.5-3       LiberationSerif-Regular.ttf sha256 705903ae...
      #   ubuntu:26.04  candidate 1:2.1.5-3build1 LiberationSerif-Regular.ttf sha256 350f4ffd...
      # `ubuntu-26.04` is already a preview runner label and GitHub migrates `-latest` gradually
      # over 1-2 months, so during that window the SAME commit can land on either image and the
      # 26.04 half dies with "E: Version '1:2.1.5-3' for 'fonts-liberation' was not found".
      # That reads as a flake on `main` and blocks everyone, not just this branch -- a bigger
      # failure than the drift the pin was meant to prevent. Note also the two packages ship
      # DIFFERENT BYTES, so the version string was never pinning the face the test measures; it
      # pinned a packaging label that merely correlates with one.
      #
      # WHAT IS PINNED INSTEAD: the property, asserted at the point of use. The `test -f` below
      # is the real contract -- a serif face present at a path fontdb scans -- and the test
      # itself independently proves that face RESOLVES and DIFFERS from the bundled Noto Sans,
      # failing with a diagnostic that names every candidate if it does not. An assertion about
      # the thing we need beats a version string that stands in for it.
      #
      # Rejected alternatives: pinning the .ttf's sha256 (tighter than the version pin and
      # dated the same way -- it would fail on a face that works perfectly); vendoring the .ttf
      # (the path under test is specifically "a font the OS provides", and it would still need
      # a copy-into-/usr/share/fonts step here, plus a binary asset and a licence file).
      # Pinning the runner image to `ubuntu-24.04` in the matrix would ALSO fix this and is
      # arguably better -- but it is a matrix-wide reproducibility decision affecting every job
      # and OS, with its own EOL/security-update cost, so it belongs in its own change and not
      # smuggled in under a font fix.
      - name: Linux fonts (a real serif face for the typography tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-liberation
          # Assert the file LANDED -- fail here, not 20 minutes later inside a test. This is
          # one layer of the contract, not all of it: it proves a serif face exists at a path
          # fontdb scans, NOT that fontdb resolves it or that it measures differently from the
          # bundled face. Those two are asserted at runtime by `verdict()` in installed_serif.
          test -f /usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf
      # Floor 10 GB here and after clippy (healthy runs show about 30 GB at both): the workspace
      # test step that follows writes 7.1 GB, so 5 GB would let a runner that had 9.6 to 11.7 GB
      # free AT JOB START (before the 4.6 GB written up to this point) crash with no red step
      # ahead of it. The two checks after the tests use 5 GB.
      - name: Disk space before the gates, cache restored (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        env:
          CI_DISK_MIN_FREE_GB: "10"
        run: sh scripts/ci_disk.sh check before-gates-cache-restored
      # From the first GATE step onward, `!cancelled()`. Setup steps above deliberately
      # keep the default `success()`: if checkout, the toolchain install or the pin
      # assertion fails, every downstream result is meaningless or measured on the wrong
      # compiler, so running them would produce noise rather than information.
      - name: Actual focused GREEN, three sensitive mutants and exact restored GREEN
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: |
          python3 - <<'PYDNU'
          import hashlib, json, re, subprocess
          from pathlib import Path
          variants = {'licensing-constructor': {'path': 'implementation/desktop/crates/selahcue-licensing/src/client.rs', 'tests': ['cargo', 'test', '-p', 'selahcue-licensing', '--test', 'test_https_admission', '--', '--nocapture'], 'failures': ['dnu_http_password_is_refused_before_send', 'dnu_http_enrollment_is_refused_before_send', 'dnu_http_session_is_refused_before_send', 'dnu_http_revoke_is_refused_before_send', 'dnu_insecure_scheme_refusal_does_not_echo_configuration'], 'positive': 2, 'sha256': '73988abfc1182763971d19a5e7595780cafd68a97574c10f03ae6d801c396038', 'replacements': [('        require_https_base_url(&base_url)?;', '        let _ = &base_url;')]}, 'transport-admission': {'path': 'implementation/desktop/crates/selahcue-cloud/src/transport.rs', 'tests': ['cargo', 'test', '-p', 'selahcue-cloud', '--features', 'http', '--test', 'test_https_admission', '--', '--nocapture'], 'failures': ['dnu_production_transport_refuses_http_before_body_or_bearer_send', 'dnu_production_get_refusal_does_not_echo_url_secrets'], 'positive': 1, 'sha256': 'c3ba3aba0eff85d8819b1fefbb9a50d65ce3b5817aab56584a5de1d9f827bd43', 'replacements': [('            require_https_base_url(url)', '            Ok(())'), ('.https_only(true)', '.https_only(false)')]}, 'builder-defense': {'path': 'implementation/desktop/crates/selahcue-cloud/src/transport.rs', 'tests': ['cargo', 'test', '-p', 'selahcue-cloud', '--features', 'http', '--lib', 'transport::tls_tests', '--', '--nocapture'], 'failures': ['transport::tls_tests::dnu_shipped_https_only_builder_blocks_http_without_wrapper_guard'], 'positive': 10, 'sha256': '51c5ea056380dfc1994a3a4d8226b7a35c176c33676fa4c657afc3ee6a04ef7c', 'replacements': [('.https_only(true)', '.https_only(false)')]}}
          baseline = [['cargo', 'test', '-p', 'selahcue-licensing', '--test', 'test_https_admission', '--test', 'test_client', '--test', 'test_custody', '--test', 'test_never_blank', '--', '--nocapture'], ['cargo', 'test', '-p', 'selahcue-cloud', '--features', 'http', '--no-fail-fast', '--', '--nocapture']]
          mode = 'rust'
          
          root = Path.cwd()
          while not (root / ".git").exists(): root = root.parent
          original = {v["path"]: (root / v["path"]).read_bytes() for v in variants.values()}
          expected = {'implementation/desktop/crates/selahcue-licensing/src/client.rs': '89ed502cdb6bbdccfea2ce0efab1d03c0e79f68c021b6ffaba406d241bb0b0a3', 'implementation/desktop/crates/selahcue-cloud/src/transport.rs': 'aab2a7b4c84d5185e255eabb97efe2cdd60b9e867ad7128e90c46a4ad5fccf21'}
          assert all(hashlib.sha256(content).hexdigest() == expected[path] for path, content in original.items())
          # Hash every test/helper/fixture involved. Mutation phases may only write declared source.
          test_paths = sorted(set(list((root / "implementation/desktop/crates/selahcue-cloud/tests").rglob("*.rs")) + list((root / "implementation/desktop/crates/selahcue-licensing/tests").rglob("*.rs")) + [root / "implementation/desktop/crates/selahcue-operator/src/cloud_url_tests.rs"]))
          test_hashes = {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest() for path in test_paths}
          def unchanged_tests():
              assert all(hashlib.sha256((root / path).read_bytes()).hexdigest() == digest for path, digest in test_hashes.items())
          def execute(label, command, expected_failures=None, positive=None):
              print("DNU_PHASE " + label, flush=True)
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, end="", flush=True)
              print(result.stderr, end="", flush=True)
              print("DNU_EXIT " + label + "=" + str(result.returncode), flush=True)
              failed = set(re.findall(r"^test (\S+) \.\.\. FAILED$", result.stdout, flags=re.M))
              summaries = re.findall(r"test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored", result.stdout)
              assert summaries, "No executed test summary: setup/compile failure is not behavioral proof"
              if expected_failures is None:
                  assert result.returncode == 0 and not failed and all(int(item[1]) == 0 for item in summaries), label
              else:
                  assert result.returncode == 101 and failed == set(expected_failures), (label, failed, expected_failures)
                  assert len(summaries) == 1 and tuple(map(int, summaries[0])) == (positive, len(expected_failures), 0), (label, summaries)
              unchanged_tests()
              return {"phase": label, "exit": result.returncode, "summaries": summaries, "failed": sorted(failed)}
          receipt = {"mode": mode, "baseline": [], "mutants": [], "restored": []}
          for index, command in enumerate(baseline): receipt["baseline"].append(execute("baseline-" + str(index), command))
          for name, variant in variants.items():
              path = root / variant["path"]
              assert path.read_bytes() == original[variant["path"]]
              try:
                  mutant = original[variant["path"]].decode()
                  for before, after in variant["replacements"]:
                      assert mutant.count(before) == 1, "Mutant requires exactly one source anchor"
                      mutant = mutant.replace(before, after)
                  content = mutant.encode()
                  assert hashlib.sha256(content).hexdigest() == variant["sha256"]
                  path.write_bytes(content)
                  outcome = execute(name, variant["tests"], variant["failures"], variant["positive"])
                  receipt["mutants"].append({**outcome, "sourceSha256": expected[variant["path"]], "mutantSha256": variant["sha256"]})
              finally:
                  path.write_bytes(original[variant["path"]])
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[variant["path"]]
                  unchanged_tests()
                  print("DNU_EXACT_RESTORATION " + name + " " + expected[variant["path"]], flush=True)
          for index, command in enumerate(baseline): receipt["restored"].append(execute("restored-" + str(index), command))
          assert all((root / path).read_bytes() == content for path, content in original.items())
          subprocess.run(["git", "diff", "--exit-code", "--", *original.keys(), *test_hashes.keys()], cwd=root, check=True)
          print("DNU_MUTATION_RECEIPT " + json.dumps(receipt, sort_keys=True), flush=True)
          PYDNU
  operator:
    name: operator shell (ubuntu-latest)
    # Cap the job (like launch-smoke) so a wedged Playwright/apt install step fails in minutes,
    # not GitHub's 6h default (audit #11 review).
    #
    # Lowered from 25 to 15 (86akcmzyq CI-timeout remediation, 2026-09-05) when the RELEASE and
    # stt,cloud-stt feature-gate pairs moved out to `operator-native` below -- see that job's
    # own timeout comment for why it moved, not just where. What is LEFT in this job is
    # Format/Check/Clippy/Test plus three cheap feature-flag pairs and the two Linux webview
    # smokes, none of them native-toolchain- or release-codegen-heavy -- true when this was
    # written, no longer true on Windows.
    #
    # RAISED 15 -> 30 (86akgrz3b, Vera's performance review of PR #125). `encryption`/
    # `read-encrypted-transcripts` becoming Cargo default features means `Check`/`Clippy`/`Test`
    # in THIS job now also compile the vendored-OpenSSL build every run, on every OS -- and on
    # Windows that build is `nmake`, one file at a time, genuinely slow. This job ACTUALLY TIMED
    # OUT at 15 minutes on a real run of PR #125 (run 36727646787, attempt 2, job 109935685146:
    # "The job has exceeded the maximum execution time of 15m0s"), with `Check` alone taking
    # 11m3s against a pre-encryption 2m19s baseline on the same job. Vera measured the
    # OpenSSL-build portion of that gap directly (`nmake build_libs`) and projected ~19-20
    # minutes for a fully cold run (no warm `Swatinem/rust-cache` hit) -- which is routine here:
    # this repo's total Actions cache was already at 10.12 GB against GitHub's 10 GB limit during
    # that same PR's run, evicting this very job's Windows caches. 30 minutes keeps real headroom
    # over the cold-run projection without resurrecting the original 25-minute failure mode this
    # job was split to fix -- see `operator-native` below, whose own timeout got the same
    # treatment for the same reason.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/desktop/crates/selahcue-operator
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      # Refuse to gate on a compiler nobody pinned. Same script `make ci` runs, so a
      # divergence between this pipeline and the local gate fails loudly here instead
      # of silently producing a green that means nothing (86ak5rc9c).
      - name: Verify the pinned toolchain is what is running
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sh scripts/check_toolchain.sh
      # `encryption` (86akgrz3b) is now default-on for selahcue-operator too, so Check/Clippy/
      # Test below compile the vendored-OpenSSL build here as well — see the `rust` job's
      # identical pair of steps for the full reasoning; not repeated per-job.
      - name: NASM for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Verify Perl is on PATH for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $p) {
            throw "perl not found on PATH -- see the 'rust' job's identical step for the full " + `
              "reasoning."
          }
          perl -v
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop/crates/selahcue-operator
          # Main saves, pull requests only restore -- see the `rust` job (17tnw2b1f24).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system deps (Tauri v2 webview + ALSA for cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev libxkbcommon-dev \
            libasound2-dev
      - name: Stage Tauri sidecar/resource placeholders (compile-check only)
        # tauri-build validates that the externalBin sidecar (`selahcue-output`) and the NDI
        # resource dll exist at build time. This job COMPILE-checks the operator (it does not
        # bundle the app), so empty placeholders satisfy the existence check — the real sidecar is
        # built in the packaging/release flow. Without this the build script fails on CI
        # ("resource path `binaries/selahcue-output-<triple>` doesn't exist").
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          # CREATE-ONLY. `: > file` truncates, and these names include the
          # owner-supplied NDI dll. That is harmless on an ephemeral runner, but this
          # is the snippet people copy to reproduce CI locally, where truncating a real
          # dll is silent and git-unrecoverable (binaries/ is gitignored). Never make
          # this unconditional. 86ak5rjh7.
          stage() { [ -e "$1" ] || : > "$1"; }
          if [[ "$triple" == *windows* ]]; then
            stage "binaries/selahcue-output-${triple}.exe"
          else
            stage "binaries/selahcue-output-${triple}"
          fi
          stage "binaries/Processing.NDI.Lib.x64.dll"
          echo "staged Tauri placeholders for ${triple}"
      # Three steps, not one `run:` block. As a single block under `bash -e`, a clippy
      # failure aborted before `cargo test` ever ran -- so this job still had exactly
      # the masking the rest of this change removes, while appearing to be covered.
      # From the first GATE step onward, `!cancelled()`, and NO setup step after it.
      # Staging used to sit between Format and Check as a `success()` step, so a
      # formatting failure skipped it and Check/Clippy/Test then ran WITHOUT the
      # placeholders — turning one formatting error into four red steps, three failing
      # for a reason unrelated to the code. In a change about signals that lie, that was
      # one. Setup steps above keep `success()`: if checkout, the toolchain install or
      # the pin assertion fails, every downstream result is meaningless.
      - name: Check opt-in cloud-live wiring
        run: cargo check --features cloud-live
      - name: Clippy opt-in cloud-live wiring
        if: ${{ !cancelled() }}
        run: cargo clippy --features cloud-live --all-targets -- -D warnings
      - name: Actual cloud-live suite GREEN, env mutant and exact restored GREEN
        if: ${{ !cancelled() }}
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: |
          python3 - <<'PYDNU'
          import hashlib, json, re, subprocess
          from pathlib import Path
          variants = {'operator-env': {'path': 'implementation/desktop/crates/selahcue-operator/src/main.rs', 'tests': ['cargo', 'test', '--features', 'cloud-live', 'cloud_url_tests::', '--', '--nocapture'], 'failures': ['cloud_url_tests::dnu_operator_http_env_refuses_before_transcript_or_bearer_send', 'cloud_url_tests::dnu_operator_configuration_refusals_are_data_free'], 'positive': 2, 'sha256': 'f1eb9d242506b424df13304718b2799fce950cfb246703fc21f14328c9c98a6a', 'replacements': [('if selahcue_cloud::transport::require_https_base_url(&base).is_err() {', 'if false {')]}}
          baseline = [['cargo', 'test', '--features', 'cloud-live', '--no-fail-fast', '--', '--nocapture']]
          mode = 'operator'
          
          root = Path.cwd()
          while not (root / ".git").exists(): root = root.parent
          original = {v["path"]: (root / v["path"]).read_bytes() for v in variants.values()}
          expected = {'implementation/desktop/crates/selahcue-operator/src/main.rs': '4adc7964b6f66a4e795f56ae3092bd726a26e38aa1940544ab9f642e19c63353'}
          assert all(hashlib.sha256(content).hexdigest() == expected[path] for path, content in original.items())
          # Hash every test/helper/fixture involved. Mutation phases may only write declared source.
          test_paths = sorted(set(list((root / "implementation/desktop/crates/selahcue-cloud/tests").rglob("*.rs")) + list((root / "implementation/desktop/crates/selahcue-licensing/tests").rglob("*.rs")) + [root / "implementation/desktop/crates/selahcue-operator/src/cloud_url_tests.rs"]))
          test_hashes = {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest() for path in test_paths}
          def unchanged_tests():
              assert all(hashlib.sha256((root / path).read_bytes()).hexdigest() == digest for path, digest in test_hashes.items())
          def execute(label, command, expected_failures=None, positive=None):
              print("DNU_PHASE " + label, flush=True)
              result = subprocess.run(command, capture_output=True, text=True)
              print(result.stdout, end="", flush=True)
              print(result.stderr, end="", flush=True)
              print("DNU_EXIT " + label + "=" + str(result.returncode), flush=True)
              failed = set(re.findall(r"^test (\S+) \.\.\. FAILED$", result.stdout, flags=re.M))
              summaries = re.findall(r"test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored", result.stdout)
              assert summaries, "No executed test summary: setup/compile failure is not behavioral proof"
              if expected_failures is None:
                  assert result.returncode == 0 and not failed and all(int(item[1]) == 0 for item in summaries), label
              else:
                  assert result.returncode == 101 and failed == set(expected_failures), (label, failed, expected_failures)
                  assert len(summaries) == 1 and tuple(map(int, summaries[0])) == (positive, len(expected_failures), 0), (label, summaries)
              unchanged_tests()
              return {"phase": label, "exit": result.returncode, "summaries": summaries, "failed": sorted(failed)}
          receipt = {"mode": mode, "baseline": [], "mutants": [], "restored": []}
          for index, command in enumerate(baseline): receipt["baseline"].append(execute("baseline-" + str(index), command))
          for name, variant in variants.items():
              path = root / variant["path"]
              assert path.read_bytes() == original[variant["path"]]
              try:
                  mutant = original[variant["path"]].decode()
                  for before, after in variant["replacements"]:
                      assert mutant.count(before) == 1, "Mutant requires exactly one source anchor"
                      mutant = mutant.replace(before, after)
                  content = mutant.encode()
                  assert hashlib.sha256(content).hexdigest() == variant["sha256"]
                  path.write_bytes(content)
                  outcome = execute(name, variant["tests"], variant["failures"], variant["positive"])
                  receipt["mutants"].append({**outcome, "sourceSha256": expected[variant["path"]], "mutantSha256": variant["sha256"]})
              finally:
                  path.write_bytes(original[variant["path"]])
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == expected[variant["path"]]
                  unchanged_tests()
                  print("DNU_EXACT_RESTORATION " + name + " " + expected[variant["path"]], flush=True)
          for index, command in enumerate(baseline): receipt["restored"].append(execute("restored-" + str(index), command))
          assert all((root / path).read_bytes() == content for path, content in original.items())
          subprocess.run(["git", "diff", "--exit-code", "--", *original.keys(), *test_hashes.keys()], cwd=root, check=True)
          print("DNU_MUTATION_RECEIPT " + json.dumps(receipt, sort_keys=True), flush=True)
          PYDNU
