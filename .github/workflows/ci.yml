name: wave3 filter benign constructor RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    name: AYETE actual benign self-test construction RED
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Real prebrowser gate must preserve benign syntax
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          result = subprocess.run([sys.executable,'scripts/operator_headless.py'],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1'},text=True,capture_output=True,timeout=90)
          print('AYETE_ACTUAL_BENIGN_CONSTRUCTOR_RED','EXIT',result.returncode,flush=True)
          print(result.stdout,flush=True)
          print(result.stderr,flush=True)
          assert result.returncode == 1
          assert 'FAIL: filter-guard-selector benign control construction' in result.stdout
          assert 'AYETE single quotes: wTdHoverSel' in result.stdout
          assert 'negative control cannot apply' in result.stdout
          assert 'headless-launch contract' not in result.stdout
          sys.exit(1)
          PY
