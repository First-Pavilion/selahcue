name: wave3 Restore last confirmed permission RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: AYZVG actual Remote failed-open permission RED
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full unchanged-production sibling suite and real permission controls
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          result = subprocess.run([sys.executable,str(root/'scripts/operator_headless.py')],
                                  env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1'},
                                  text=True,capture_output=True,timeout=240)
          print('UNCHANGED_PRODUCTION_AYZVG_RED','EXIT',result.returncode,flush=True)
          print(result.stdout,flush=True)
          print(result.stderr,file=sys.stderr,flush=True)
          assert 'FAIL: AYZVG false: the last confirmed false verdict suppresses Restore' in result.stdout
          assert 'PASS: AYZVG unknown control: a never-confirmed Remote viewer' in result.stdout
          assert 'PASS: AYZVG unknown action control: the real Restore command works' in result.stdout
          assert 'PASS: AYZVG true control: a confirmed promotion restores the offer' in result.stdout
          assert 'PASS: AYZVG malformed after true control: a false-looking string' in result.stdout
          assert 'PASS: AYZVG held lookup premise: the actual slot request is unresolved' in result.stdout
          assert 'PASS: AYZVG live-output control: permission/failure/recovery-offer checks' in result.stdout
          assert 'PASS: PL AC-54 (Quinn): a failed open clears the View only badge' in result.stdout
          assert 'PASS: F30: the real PP-GEN predicate rejects brightness delivered through var()' in result.stdout
          assert 'PASS: WKG danger composed/media_danger' in result.stdout
          assert result.returncode != 0, 'actual assertion RED is required'
          sys.exit(result.returncode)
          PY
