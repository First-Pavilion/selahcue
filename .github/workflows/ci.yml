name: wave2 plan-deck library mutation proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: NAX baseline mutation restored full DOM gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full siblings baseline, isolated publication mutant, restored source
        run: |
          python3 - <<'PY'
          """Hosted-only proof: mutate an isolated copy, retain the full sibling suite."""
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root / 'implementation/desktop/crates/selahcue-operator/dist'
          env = {**os.environ, 'SELAHCUE_HEADLESS_REQUIRE': '1'}
          command = [sys.executable, str(root / 'scripts/operator_headless.py')]

          def run(label, dist=None):
              invocation_env = dict(env)
              if dist is not None:
                  invocation_env['SELAHCUE_OPERATOR_DIST'] = str(dist)
              result = subprocess.run(command, env=invocation_env, text=True, capture_output=True, timeout=180)
              print(label, 'EXIT', result.returncode, flush=True)
              print(result.stdout, flush=True)
              print(result.stderr, file=sys.stderr, flush=True)
              return result

          baseline = run('BASELINE')
          assert baseline.returncode == 0 and '2376 checks, 0 FAIL' in baseline.stdout
          with tempfile.TemporaryDirectory(prefix='selahcue-nax-publication-mutant-') as temp:
              copied = Path(temp) / 'dist'
              shutil.copytree(source, copied)
              script = copied / 'app.js'
              original = script.read_text()
              anchor = '''        planDecksGen += 1;
                  planDecks = view && Array.isArray(view.decks) ? view.decks : null;
                  planDecksLatest = Promise.resolve(planDecks || []);
                  lastRendered = ""; // The next view poll must repaint links even if host items did not change.
          '''
              assert original.count(anchor) == 1, 'publication anchor must identify exactly one real production hook'
              script.write_text(original.replace(anchor, '', 1))
              mutant = run('PUBLICATION_MUTANT', copied)
              assert mutant.returncode == 1, 'only an actual behavioral assertion RED satisfies the mutation'
              assert re.search(r'2376 checks, [1-9][0-9]* FAIL', mutant.stdout)
              assert 'FAIL: NAX: a fresh library snapshot clears a false missing chip/count' in mutant.stdout
              assert 'FAIL: NAX: a superseded plan caller receives' in mutant.stdout
              assert 'PASS: NAX control: applying a library payload adds no hidden deck_list round trip' in mutant.stdout
              assert 'PASS: planLoadDecks catch-path guard: a stale, late-arriving FAILURE' in mutant.stdout
              script.write_text(original)
              source_files = {p.relative_to(source): p.read_bytes() for p in source.rglob('*') if p.is_file()}
              restored_files = {p.relative_to(copied): p.read_bytes() for p in copied.rglob('*') if p.is_file()}
              assert restored_files == source_files, 'restored dist must byte-match the complete unchanged source'
              print('RESTORED_DIST_IDENTICAL', len(source_files), 'files', flush=True)
              restored = run('RESTORED', copied)
              assert restored.returncode == 0 and '2376 checks, 0 FAIL' in restored.stdout
              assert script.read_text() == original
          print('MUTATION_VERIFIED: baseline GREEN, real publication mutant assertion RED, restored GREEN', flush=True)
          PY
