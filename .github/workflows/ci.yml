name: wave2 OutputHealth publication and dedup mutation proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: OutputHealth baseline mutations restored full DOM gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full sibling suite with isolated real publisher and duplicate-write mutants
        run: |
          python3 - <<'PY'
          import ast
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = root / 'implementation/desktop/crates/selahcue-operator/dist'
          driver = root / 'scripts/operator_headless.py'
          assignments = [n.value.value for n in ast.parse(driver.read_text()).body
                         if isinstance(n, ast.Assign) and isinstance(n.value, ast.Constant)
                         and any(isinstance(t, ast.Name) and t.id == 'EXPECTED_MIN_CHECKS' for t in n.targets)]
          expected = assignments[-1]
          assert isinstance(expected, int) and expected > 0
          env = {**os.environ, 'SELAHCUE_HEADLESS_REQUIRE':'1'}

          def run(label, dist=None):
              invocation_env = dict(env)
              if dist is not None:
                  invocation_env['SELAHCUE_OPERATOR_DIST'] = str(dist)
              result = subprocess.run([sys.executable, str(driver)], env=invocation_env,
                                      text=True, capture_output=True, timeout=180)
              print(label, 'EXIT', result.returncode, flush=True)
              print(result.stdout, flush=True)
              print(result.stderr, file=sys.stderr, flush=True)
              return result

          baseline = run('BASELINE')
          assert baseline.returncode == 0 and f'{expected} checks, 0 FAIL' in baseline.stdout
          with tempfile.TemporaryDirectory(prefix='selahcue-jh-status-mutants-') as temp:
              copied = Path(temp) / 'dist'
              shutil.copytree(source, copied)
              script = copied / 'app.js'
              original = script.read_text()
              anchor = '        if (healthLive && healthLive.textContent !== healthMessage) healthLive.textContent = healthMessage;'
              assert original.count(anchor) == 1, 'unique actual health publisher required'
              script.write_text(original.replace(anchor, '        // diagnostic: omit actual health publication', 1))
              missing = run('HEALTH_PUBLICATION_MUTANT', copied)
              assert missing.returncode == 1
              assert re.search(rf'{expected} checks, [1-9][0-9]* FAIL', missing.stdout)
              assert 'FAIL: JH: a real degraded health change mutates the already-connected status text once' in missing.stdout
              assert 'FAIL: JH: the health announcement identifies the selected output' in missing.stdout
              assert 'PASS: JH: OutputHealth has a pre-existing polite atomic status channel' in missing.stdout
              assert 'PASS: JH control: existing NDI validation retains its own established status semantics' in missing.stdout
              script.write_text(original.replace(anchor, '        if (healthLive) healthLive.textContent = healthMessage;', 1))
              duplicate = run('DUPLICATE_HEALTH_WRITE_MUTANT', copied)
              assert duplicate.returncode == 1
              assert re.search(rf'{expected} checks, [1-9][0-9]* FAIL', duplicate.stdout)
              assert 'FAIL: JH: an unrelated real inspector rebuild does not repeat unchanged health text' in duplicate.stdout
              assert 'PASS: JH: a real degraded health change mutates the already-connected status text once' in duplicate.stdout
              assert 'PASS: JH control: focused-picker deferral preserves the picker' in duplicate.stdout
              script.write_text(original)
              source_files = {p.relative_to(source):p.read_bytes() for p in source.rglob('*') if p.is_file()}
              restored_files = {p.relative_to(copied):p.read_bytes() for p in copied.rglob('*') if p.is_file()}
              assert source_files == restored_files
              print('RESTORED_DIST_IDENTICAL', len(source_files), 'files', flush=True)
              restored = run('RESTORED', copied)
              assert restored.returncode == 0 and f'{expected} checks, 0 FAIL' in restored.stdout
          print('MUTATION_VERIFIED: full baseline GREEN, real publication and duplicate-write mutants assertion RED, identical restoration GREEN', flush=True)
          PY
