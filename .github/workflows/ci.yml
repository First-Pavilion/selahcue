name: wave3 13Y0 actual host chapter fixture recording
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator:
    name: operator shell (ubuntu-latest)
    # Cap the job (like launch-smoke) so a wedged Playwright/apt install step fails in minutes,
    # not GitHub's 6h default (audit #11 review).
    #
    # Lowered from 25 to 15 (86akcmzyq CI-timeout remediation, 2026-09-05) when the RELEASE and
    # stt,cloud-stt feature-gate pairs moved out to `operator-native` below -- see that job's
    # own timeout comment for why it moved, not just where. What is LEFT in this job is
    # Format/Check/Clippy/Test plus three cheap feature-flag pairs and the two Linux webview
    # smokes, none of them native-toolchain- or release-codegen-heavy -- true when this was
    # written, no longer true on Windows.
    #
    # RAISED 15 -> 30 (86akgrz3b, Vera's performance review of PR #125). `encryption`/
    # `read-encrypted-transcripts` becoming Cargo default features means `Check`/`Clippy`/`Test`
    # in THIS job now also compile the vendored-OpenSSL build every run, on every OS -- and on
    # Windows that build is `nmake`, one file at a time, genuinely slow. This job ACTUALLY TIMED
    # OUT at 15 minutes on a real run of PR #125 (run 36727646787, attempt 2, job 109935685146:
    # "The job has exceeded the maximum execution time of 15m0s"), with `Check` alone taking
    # 11m3s against a pre-encryption 2m19s baseline on the same job. Vera measured the
    # OpenSSL-build portion of that gap directly (`nmake build_libs`) and projected ~19-20
    # minutes for a fully cold run (no warm `Swatinem/rust-cache` hit) -- which is routine here:
    # this repo's total Actions cache was already at 10.12 GB against GitHub's 10 GB limit during
    # that same PR's run, evicting this very job's Windows caches. 30 minutes keeps real headroom
    # over the cold-run projection without resurrecting the original 25-minute failure mode this
    # job was split to fix -- see `operator-native` below, whose own timeout got the same
    # treatment for the same reason.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/desktop/crates/selahcue-operator
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      # Refuse to gate on a compiler nobody pinned. Same script `make ci` runs, so a
      # divergence between this pipeline and the local gate fails loudly here instead
      # of silently producing a green that means nothing (86ak5rc9c).
      - name: Verify the pinned toolchain is what is running
        working-directory: ${{ github.workspace }}
        shell: bash
        run: sh scripts/check_toolchain.sh
      # `encryption` (86akgrz3b) is now default-on for selahcue-operator too, so Check/Clippy/
      # Test below compile the vendored-OpenSSL build here as well — see the `rust` job's
      # identical pair of steps for the full reasoning; not repeated per-job.
      - name: NASM for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Verify Perl is on PATH for the vendored-OpenSSL build (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $p) {
            throw "perl not found on PATH -- see the 'rust' job's identical step for the full " + `
              "reasoning."
          }
          perl -v
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop/crates/selahcue-operator
          # Main saves, pull requests only restore -- see the `rust` job (17tnw2b1f24).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system deps (Tauri v2 webview + ALSA for cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev libxkbcommon-dev \
            libasound2-dev
      - name: Stage Tauri sidecar/resource placeholders (compile-check only)
        # tauri-build validates that the externalBin sidecar (`selahcue-output`) and the NDI
        # resource dll exist at build time. This job COMPILE-checks the operator (it does not
        # bundle the app), so empty placeholders satisfy the existence check — the real sidecar is
        # built in the packaging/release flow. Without this the build script fails on CI
        # ("resource path `binaries/selahcue-output-<triple>` doesn't exist").
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          # CREATE-ONLY. `: > file` truncates, and these names include the
          # owner-supplied NDI dll. That is harmless on an ephemeral runner, but this
          # is the snippet people copy to reproduce CI locally, where truncating a real
          # dll is silent and git-unrecoverable (binaries/ is gitignored). Never make
          # this unconditional. 86ak5rjh7.
          stage() { [ -e "$1" ] || : > "$1"; }
          if [[ "$triple" == *windows* ]]; then
            stage "binaries/selahcue-output-${triple}.exe"
          else
            stage "binaries/selahcue-output-${triple}"
          fi
          stage "binaries/Processing.NDI.Lib.x64.dll"
          echo "staged Tauri placeholders for ${triple}"
      # Three steps, not one `run:` block. As a single block under `bash -e`, a clippy
      # failure aborted before `cargo test` ever ran -- so this job still had exactly
      # the masking the rest of this change removes, while appearing to be covered.
      # From the first GATE step onward, `!cancelled()`, and NO setup step after it.
      # Staging used to sit between Format and Check as a `success()` step, so a
      # formatting failure skipped it and Check/Clippy/Test then ran WITHOUT the
      # placeholders — turning one formatting error into four red steps, three failing
      # for a reason unrelated to the code. In a change about signals that lie, that was
      # one. Setup steps above keep `success()`: if checkout, the toolchain install or
      # the pin assertion fails, every downstream result is meaningless.
      - name: Record actual get_chapter serialization and existing contract controls
        run: |
          cargo test --locked chapter_reply_contract_tests:: -- --nocapture
          cargo test --locked get_chapter_link_modal_contract_tests:: -- --nocapture
