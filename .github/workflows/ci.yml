name: wave3 actual background cascade RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: WKH real CSS cascade and eleven guard-site false RED
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Unchanged helper baseline and real earlier-only backgrounds
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          dist = root/'implementation/desktop/crates/selahcue-operator/dist'
          script = root/'scripts/operator_headless.py'
          original_script = hashlib.sha256(script.read_bytes()).hexdigest()
          original = {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dist.iterdir() if p.is_file()}
          selectors = ['.pm-btn-primary:hover','.td-save-cta:hover','.ps-start:hover','.ps-start:disabled, .ps-start[aria-disabled="true"]','.ps-start','.dl-btn:hover','.tb-golive:hover','.timer-start:hover','.pp-generate:hover','.pp-generate[disabled], .pp-generate[aria-busy="true"]','.pp-generate']

          def run(label, chosen):
              result = subprocess.run([sys.executable,str(script)],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1','SELAHCUE_OPERATOR_DIST':str(chosen)},text=True,capture_output=True,timeout=240)
              print('WKH_ACTUAL_RED',label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              failures = re.findall(r'^FAIL: (.*)$',result.stdout,re.M)
              behavior = [x for x in failures if not re.match(r'\d+ checks ran;',x)]
              assert result.returncode != 0
              for control in ['WKH browser premise/earlier-shorthand:','WKH browser premise/earlier-longhand:','WKH browser premise/later-longhand-unsafe:','WKH browser premise/important-longhand:','WKH browser premise/local-var-shorthand:','WKH browser premise/gradient-later-color:','WKH absent control:','WKH missing control:','AYZVG cached UI replay:','AYETD viewport control:','F30: the real PP-GEN predicate rejects brightness delivered through var()','WKG danger composed/media_danger']:
                  assert 'PASS: '+control in result.stdout,(label,control)
              assert 'FAIL: WKH background cascade/earlier-longhand:' in result.stdout
              if label == 'baseline':
                  assert all(x.startswith('WKH ') for x in behavior),behavior
                  assert 'PASS: GO-LIVE-HOVER (premise): the hover rule declares a background' in result.stdout
              else:
                  assert 'FAIL: GO-LIVE-HOVER (premise): the hover rule declares a background' in result.stdout
                  assert all(x.startswith(('WKH ','PME-005','TD-012','PSC-005','DLM-008','GO-LIVE-HOVER','TIMER-START-HOVER','PP-GEN')) for x in behavior),behavior
                  print('WKH_ELEVEN_SITE_FALSE_RED_WITNESS',json.dumps(selectors),flush=True)
              print('WKH_ACTUAL_NAMED_FAILURES',label,json.dumps(behavior),flush=True)
              assert hashlib.sha256(script.read_bytes()).hexdigest() == original_script

          run('baseline',dist)
          with tempfile.TemporaryDirectory(prefix='wkh-actual-css-') as temp:
              copied = Path(temp)/'dist'
              shutil.copytree(dist,copied)
              css = copied/'app.css'
              css.write_text(css.read_text()+'\n'+ '\n'.join(sel+'{--__wkh_unrelated:1;}' for sel in selectors))
              assert all(hashlib.sha256((copied/name).read_bytes()).hexdigest()==digest for name,digest in original.items() if name!='app.css')
              print('WKH_WITNESS_ONLY_UNRELATED_RULES',json.dumps({'unchangedFiles':len(original)-1,'harnessSha256':original_script}),flush=True)
              run('actual-eleven-sites',copied)
          assert {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dist.iterdir() if p.is_file()} == original
          print('WKH_SOURCE_DIST_AND_HARNESS_UNCHANGED',flush=True)
          sys.exit(1)
          PY
