name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dq0-red:
    name: DQ0 public JSON helper real redaction RED and wire positives
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: implementation/desktop
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check out exact tests-only source
        working-directory: ${{ github.workspace }}
        run: |
          test "$(git rev-parse HEAD^)" = "fe522f8c3180edac152b2e153e52dd3955ea02c7"
          git checkout --detach fe522f8c3180edac152b2e153e52dd3955ea02c7
          test "$(git rev-parse HEAD)" = "fe522f8c3180edac152b2e153e52dd3955ea02c7"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - name: Verify pinned toolchain
        working-directory: ${{ github.workspace }}
        run: sh scripts/check_toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Actual ungated and server RED with positive controls
        run: |
          python3 - <<'PYRUN'
          import hashlib,json,pathlib,re,subprocess
          root=pathlib.Path.cwd()
          expected=['public_parse_display_never_quotes_sensitive_values', 'public_parse_debug_never_quotes_sensitive_values', 'public_parse_alternate_debug_never_quotes_sensitive_values', 'public_serialize_display_never_quotes_sensitive_values', 'public_serialize_debug_never_quotes_sensitive_values', 'public_serialize_alternate_debug_never_quotes_sensitive_values']
          tracked=['crates/selahcue-lan/src/protocol.rs','crates/selahcue-lan/src/tls.rs','crates/selahcue-lan/src/lib.rs','crates/selahcue-lan/tests/test_public_json_failure.rs','Cargo.lock']
          hashes={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in tracked}
          print('DQ0_RED_COMPONENTS',json.dumps(hashes,sort_keys=True),flush=True)
          for mode,args in [('ungated',['--no-default-features']),('server',['--features','server'])]:
           cmd=['cargo','test','--locked','-p','selahcue-lan',*args,'--test','test_public_json_failure','--','--nocapture']
           result=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=600)
           print('DQ0_RED_BEGIN',mode,flush=True);print(result.stdout,flush=True)
           names=re.findall(r'^test (\w+) \.\.\. FAILED$',result.stdout,re.M)
           assert sorted(names)==sorted(expected),(mode,names)
           assert result.returncode==101 and '6 passed; 6 failed; 0 ignored' in result.stdout,(mode,result.returncode)
           assert 'public JSON error leaked' in result.stdout and 'error[E' not in result.stdout,mode
           print('DQ0_RED_VERIFIED',mode,json.dumps({'failed':names,'passed':6,'exit':result.returncode}),flush=True)
          result=subprocess.run(['cargo','test','--locked','-p','selahcue-lan','--no-default-features','--test','test_protocol'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=600)
          print(result.stdout,flush=True);assert result.returncode==0 and 'test result: ok.' in result.stdout
          print('DQ0_WIRE_POSITIVE_VERIFIED',flush=True)
          assert hashes=={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in tracked}
          print('DQ0_RED_COMPONENTS_UNCHANGED',json.dumps(hashes,sort_keys=True),flush=True)
          PYRUN
