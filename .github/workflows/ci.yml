name: wave3 atomic Redis docs correction and three invariant mutants r2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: api (django)
    runs-on: ubuntu-latest
    # Run 41038300286 attempts 1/2 passed 2147 tests in 14:14/14:17, but service,
    # install/check and post-job work exhausted the 15-minute job cap. Keep a bounded
    # 20-minute cap so the unchanged full suite and cleanup can report their result.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation/api
    # Real Postgres + Redis so the suite runs against the engines production uses.
    # tests/test_concurrency_postgres.py SKIPS on SQLite by design (select_for_update
    # is a no-op there), so without these containers the DEC-004 instance-limit race
    # would never actually be exercised anywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selahcue_test
          POSTGRES_USER: selahcue
          POSTGRES_PASSWORD: selahcue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selahcue"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the local dev interpreter. Django 6.1 supports 3.12-3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: implementation/api/pyproject.toml
      # The dev extra includes the same PostgreSQL driver for mandatory local deployed-mode
      # startup controls. Retain the existing explicit bound and hosted service setup here.
      - name: Install
        run: pip install -e ".[dev]" "psycopg[binary]>=3.2,<4"
      - name: Django system checks
        run: python manage.py check
      # Migrations here are hand-committed, so a model shipped without one is an easy
      # miss. `--check` has implied `--dry-run` since Django 4.2, so that flag is noise;
      # `--noinput` is load-bearing — without it a field RENAME selects the interactive
      # questioner, which calls input() and dies on a TTY-less runner with an EOFError
      # traceback instead of a readable "migration missing" failure.
      - name: Migrations are committed
        run: python manage.py makemigrations --check --noinput
      - name: Tests
        env:
          SQL_ENGINE: django.db.backends.postgresql
          SQL_DATABASE: selahcue_test
          SQL_USER: selahcue
          SQL_PASSWORD: selahcue
          SQL_HOST: localhost
          SQL_PORT: "5432"
          CACHE_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/2
        run: |
          python - <<'PYMUTANTS'
          import ast, hashlib, json, re, subprocess
          from pathlib import Path
          p = Path("selahcue_api/apps/throttling/services.py")
          original = p.read_bytes()
          assert hashlib.sha256(original).hexdigest() == 'bdd8ec954421c5f318d051eaad35964879105164b481bd412a5ffde596f11edf'
          anchors = {'dispatch': 'if isinstance(self._cache, RedisCache):', 'create': '    redis.call("SET", KEYS[1], 1, "EX", ARGV[1])', 'repair': '    redis.call("EXPIRE", KEYS[1], ARGV[1])', 'increment': 'return redis.call("INCR", KEYS[1])'}
          text = original.decode()
          assert all(text.count(value) == 1 for value in anchors.values())
          variants = {
              "generic-roundtrips": text.replace(anchors["dispatch"], 'if False and isinstance(self._cache, RedisCache):'),
              "missing-expiry": text.replace(anchors["create"], '    redis.call("SET", KEYS[1], 1)').replace(anchors["repair"], '    redis.call("EXISTS", KEYS[1])'),
              "refresh-window": text.replace(anchors["increment"], 'local count = redis.call("INCR", KEYS[1])\nredis.call("EXPIRE", KEYS[1], ARGV[1])\nreturn count'),
          }
          expected_hashes = {'generic-roundtrips': 'cf7f2c10c14396c125b180b491a328ea9f14c416eefbb7331afd0711626212ac', 'missing-expiry': 'dd615725d76b66c762aeb01c6f98cd165f9331c362d14da239fed4a6d5d2035d', 'refresh-window': 'f0abe4960266069f1bf449e59ae5f9750f4edc18476831de1c196405925ce9d5'}
          expected_failures = {
              "generic-roundtrips": {"test_an_accepted_three_budget_request_uses_at_most_three_actual_redis_roundtrips", "test_real_redis_counter_does_not_leave_an_existing_persistent_key", "test_real_redis_recreation_with_a_lost_reply_cannot_leave_a_persistent_key"},
              "missing-expiry": {"test_real_redis_fixed_window_starts_at_first_hit_and_is_not_extended", "test_real_redis_expired_counter_restarts_at_one_with_an_expiry", "test_real_redis_counter_does_not_leave_an_existing_persistent_key", "test_real_redis_concurrent_first_hits_have_exact_counts_and_an_expiry", "test_real_redis_recreation_with_a_lost_reply_cannot_leave_a_persistent_key"},
              "refresh-window": {"test_real_redis_fixed_window_starts_at_first_hit_and_is_not_extended"},
          }
          full = ["tests/test_redis_budget_roundtrips.py", "tests/test_throttling.py", "tests/test_throttling_guards.py", "tests/test_throttle_response_headers.py", "tests/test_deployment_env_docs.py"]
          new_tests = Path("tests/test_redis_budget_roundtrips.py")
          test_hash = hashlib.sha256(new_tests.read_bytes()).hexdigest()
          def run(phase, selectors):
              print("WVF_MUTATION_PHASE " + phase, flush=True)
              result = subprocess.run(["python", "-m", "pytest", *selectors, "-q", "-s"], capture_output=True, text=True)
              print(result.stdout, end="", flush=True)
              print(result.stderr, end="", flush=True)
              print("WVF_MUTATION_EXIT " + phase + "=" + str(result.returncode), flush=True)
              return result
          baseline = run("candidate-green", full)
          assert baseline.returncode == 0, "candidate target/siblings/docs must pass before interpreting mutants"
          markers = re.findall(r"WVF_REAL_REDIS_WIRE (\{[^\n]+\})", baseline.stdout)
          assert len(markers) == 1
          wire = json.loads(markers[0])
          assert all(x["budgetPackets"] == 3 and x["budgetOperations"] == ["EVAL"] * 3 for x in wire.values())
          receipts = {}
          for name, variant in variants.items():
              ast.parse(variant)
              assert hashlib.sha256(variant.encode()).hexdigest() == expected_hashes[name]
              try:
                  p.write_text(variant)
                  result = run(name, [str(new_tests)])
                  assert result.returncode == 1
                  failure_lines = re.findall(r"^FAILED (.+)$", result.stdout, re.M)
                  actual = {line.split(" - ", 1)[0].split("::")[-1] for line in failure_lines}
                  assert actual == expected_failures[name], (name, actual)
                  count = len(actual)
                  assert re.search(fr"{count} failed, {7-count} passed", result.stdout)
                  receipts[name] = {"failed": count, "positive": 7-count, "sha256": expected_hashes[name], "failures": sorted(actual)}
              finally:
                  p.write_bytes(original)
                  assert hashlib.sha256(p.read_bytes()).hexdigest() == 'bdd8ec954421c5f318d051eaad35964879105164b481bd412a5ffde596f11edf'
                  assert hashlib.sha256(new_tests.read_bytes()).hexdigest() == test_hash
                  print("WVF_RESTORED_SHA256 " + hashlib.sha256(p.read_bytes()).hexdigest(), flush=True)
          restored = run("restored-green", full)
          assert restored.returncode == 0
          subprocess.run(["git", "diff", "--exit-code", "--", "tests"], check=True)
          print("WVF_MUTATION_RECEIPT " + json.dumps({"source": "98d782bbdcc2327c73d60b0877910185eed1e5a0", "candidateGreen": baseline.returncode == 0, "wire": wire, "mutants": receipts, "restoredGreen": restored.returncode == 0, "originalAndRestoredSha256": 'bdd8ec954421c5f318d051eaad35964879105164b481bd412a5ffde596f11edf', "unchangedTestSha256": test_hash}), flush=True)
          PYMUTANTS
