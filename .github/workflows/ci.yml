name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wave3-cpm-red-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pairing-profiles:
    name: CPM actual debug and release host pairing captures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 827076e83d2f24d84340c2faa6f4ae1d047352b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: clippy,rustfmt
      - name: Verify pinned toolchain
        run: sh scripts/check_toolchain.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: implementation/desktop
          save-if: false
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers libdbus-1-dev
      - name: Actual profile captures and existing host controls
        shell: bash
        run: |
          python3 - <<'PYRUN'
          import hashlib
          import json
          import pathlib
          import subprocess
          root = pathlib.Path.cwd()
          source = '827076e83d2f24d84340c2faa6f4ae1d047352b1'
          paths = ['implementation/desktop/crates/selahcue-desktop/src/main.rs', 'implementation/desktop/crates/selahcue-desktop/src/pairing_output_tests.rs', 'implementation/desktop/crates/selahcue-desktop/Cargo.toml', 'implementation/desktop/Cargo.toml', 'implementation/desktop/Cargo.lock', 'rust-toolchain.toml']
          expected = {'implementation/desktop/crates/selahcue-desktop/src/main.rs': 'a68b9ff26cdd057e90f576fc5699232ba6c9bc9ee17f109284c9465d8dc35f91', 'implementation/desktop/crates/selahcue-desktop/src/pairing_output_tests.rs': '5a0398a190b1bcec6b71550d67bdfea758592b50d40b3f1c453dfa04ccaae7e8', 'implementation/desktop/crates/selahcue-desktop/Cargo.toml': 'ab36fbb0603fb5b1aac3ef0fc8b48277cdee65cd5f67b775a99cb9833c6663e8', 'implementation/desktop/Cargo.toml': '08d549e5c3604fc410eb47b885ce7432f0b7b2c54f8e58b4f992c6e3f7fbdbe3', 'implementation/desktop/Cargo.lock': '316431e3b829a384d7cd725b9c8f1c0d4c78110c2f9906ee81c9d2f16d6f3194', 'rust-toolchain.toml': 'e77adf550cc0c3d981779b72639180f105506ebbe5aba0db0d928be731d45f4c'}
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == source
          def hashes():
              return {p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths}
          assert hashes() == expected
          print('CPM_827076e83d2f24d84340c2faa6f4ae1d047352b1_START',source,json.dumps(hashes(),sort_keys=True),flush=True)
          results=[]
          try:
              for label, extra in [('debug-full-host',[]),('release-pairing',['--release','pairing_output_tests']),('release-banner-positive',['--release','connect_banner_token_tests'])]:
                  command=['cargo','test','--locked','-p','selahcue-desktop','--bin','selahcue-output',*extra,'--','--nocapture']
                  result=subprocess.run(command,cwd=root/'implementation/desktop',stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1050)
                  print('CPM_PHASE_START',label,flush=True)
                  print(result.stdout,flush=True)
                  print('CPM_PHASE_RESULT',json.dumps({'label':label,'exit':result.returncode}),flush=True)
                  results.append({'label':label,'exit':result.returncode})
          finally:
              actual=hashes()
              print('CPM_827076e83d2f24d84340c2faa6f4ae1d047352b1_RESTORED',json.dumps(actual,sort_keys=True),flush=True)
              assert actual == expected
          print('CPM_ALL_ACTUAL_RESULTS',json.dumps(results),flush=True)
          raise SystemExit(0 if all(r['exit']==0 for r in results) else 1)
          PYRUN
