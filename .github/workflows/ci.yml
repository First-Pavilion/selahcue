name: wave3 IP bucket privacy real-consumer RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: api (django)
    runs-on: ubuntu-latest
    # Run 41038300286 attempts 1/2 passed 2147 tests in 14:14/14:17, but service,
    # install/check and post-job work exhausted the 15-minute job cap. Keep a bounded
    # 20-minute cap so the unchanged full suite and cleanup can report their result.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation/api
    # Real Postgres + Redis so the suite runs against the engines production uses.
    # tests/test_concurrency_postgres.py SKIPS on SQLite by design (select_for_update
    # is a no-op there), so without these containers the DEC-004 instance-limit race
    # would never actually be exercised anywhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selahcue_test
          POSTGRES_USER: selahcue
          POSTGRES_PASSWORD: selahcue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selahcue"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the local dev interpreter. Django 6.1 supports 3.12-3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: implementation/api/pyproject.toml
      # The dev extra includes the same PostgreSQL driver for mandatory local deployed-mode
      # startup controls. Retain the existing explicit bound and hosted service setup here.
      - name: Install
        run: pip install -e ".[dev]" "psycopg[binary]>=3.2,<4"
      - name: Django system checks
        run: python manage.py check
      # Migrations here are hand-committed, so a model shipped without one is an easy
      # miss. `--check` has implied `--dry-run` since Django 4.2, so that flag is noise;
      # `--noinput` is load-bearing — without it a field RENAME selects the interactive
      # questioner, which calls input() and dies on a TTY-less runner with an EOFError
      # traceback instead of a readable "migration missing" failure.
      - name: Migrations are committed
        run: python manage.py makemigrations --check --noinput
      - name: Tests
        env:
          SQL_ENGINE: django.db.backends.postgresql
          SQL_DATABASE: selahcue_test
          SQL_USER: selahcue
          SQL_PASSWORD: selahcue
          SQL_HOST: localhost
          SQL_PORT: "5432"
          CACHE_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/2
        run: python -m pytest tests/test_throttling.py tests/test_throttling_guards.py tests/test_throttle_response_headers.py -q

