name: wave3 filter literal identity RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: AYETE actual checker RED and original PSC false-green witness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Real checker controls and genuine hazardous site redirect
        run: |
          python3 - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          script = root/'scripts/operator_headless.py'
          text = script.read_text()
          source_hash = hashlib.sha256(script.read_bytes()).hexdigest()
          names = {'FILTER_GUARD_SITES','FILTER_GUARD_CALL_RE','_JS_ASSIGN_RE','_extract_driver_js','_strip_js_comments','filter_guard_selector_problems','_filter_guard_negative_controls'}
          nodes = [n for n in ast.parse(text).body if (isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name) and n.targets[0].id in names) or (isinstance(n,ast.FunctionDef) and n.name in names)]
          ns = {'re':re,'os':os,'__file__':str(script)}
          exec(compile(ast.Module(body=nodes,type_ignores=[]),str(script),'exec'),ns)
          driver = ns['_extract_driver_js'](text)
          checker = ns['filter_guard_selector_problems']
          assert checker(driver) == []
          negative,benign = ns['_filter_guard_negative_controls'](driver)
          refused = [name for name,case in negative if checker(case)]
          survivors = [name for name,case in negative if not checker(case)]
          assert len(negative) == 27 and len(benign) == 16
          assert len(survivors) == 10 and all(name.startswith(('AYETE existing clean selector:','AYETE stale selector:')) for name in survivors),survivors
          assert all(checker(case) for name,case in negative[:12])
          assert all(checker(case) for name,case in negative if name.startswith('AYETE alias binding:'))
          assert all(not checker(case) for name,case in benign)
          print('AYETE_ACTUAL_CHECKER_RED',json.dumps({'cleanAccepted':True,'old12Refused':True,'alias5Refused':True,'benign16Accepted':True,'survivingInvalidLiterals':survivors}),flush=True)
          gate = subprocess.run([sys.executable,str(script)],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1'},text=True,capture_output=True,timeout=60)
          print('AYETE_ACTUAL_PREBROWSER_RED','EXIT',gate.returncode,gate.stdout,gate.stderr,flush=True)
          assert gate.returncode == 1 and 'ACCEPTED 10 deliberately broken source(s)' in gate.stdout

          base = '656dac3b8a567925db510027f068ac3c44d667dd'
          old = subprocess.check_output(['git','show',base+':scripts/operator_headless.py'],text=True)
          prefix = '_REPO = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))'
          assert old.count(prefix) == 1
          adapted = old.replace(prefix,'_REPO = '+repr(str(root)),1)
          dist = root/'implementation/desktop/crates/selahcue-operator/dist'
          originals = {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dist.iterdir() if p.is_file()}
          with tempfile.TemporaryDirectory(prefix='ayete-original-psc-') as tmp:
              work = Path(tmp)
              # The shared launcher's own CLI self-tests resolve operator_headless.py beside
              # its __file__. Keep an identical original helper and the selected original gate
              # together, so those tests do not accidentally execute the newer RED checkout.
              helper = subprocess.check_output(['git','show',base+':scripts/headless_chrome.py'])
              (work/'headless_chrome.py').write_bytes(helper)
              print('AYETE_ORIGINAL_HELPER_IDENTITY',hashlib.sha256(helper).hexdigest(),flush=True)
              copied = work/'dist'
              shutil.copytree(dist,copied)
              css = copied/'app.css'
              css.write_text(css.read_text()+'\n.ps-start:hover{filter:brightness(1.06) not-a-real-css-function();}\n')
              assert all(hashlib.sha256((copied/name).read_bytes()).hexdigest()==digest for name,digest in originals.items() if name!='app.css')
              binding = 'var wPsHoverSel = ".ps-start:hover";'
              assert adapted.count(binding) == 1
              redirected = adapted.replace(binding,'var wPsHoverSel = ".ps-start";',1)
              for label,code in [('intended-selector',adapted),('redirected-existing-clean-selector',redirected)]:
                  path = work/'operator_headless.py'
                  path.write_text(code)
                  result = subprocess.run([sys.executable,str(path)],env={**os.environ,'PYTHONPATH':str(root/'scripts'),'SELAHCUE_HEADLESS_REQUIRE':'1','SELAHCUE_OPERATOR_DIST':str(copied)},text=True,capture_output=True,timeout=240)
                  print('AYETE_ORIGINAL_REAL_SITE',label,'EXIT',result.returncode,flush=True)
                  print(result.stdout,flush=True)
                  print(result.stderr,file=sys.stderr,flush=True)
                  failures = re.findall(r'^FAIL: (.*)$',result.stdout,re.M)
                  if label == 'intended-selector':
                      assert result.returncode == 1 and len(failures) == 1 and failures[0].startswith('PSC-005: the hover rule carries no `filter` (found none)'),failures
                      assert '=== 2612 checks, 1 FAIL ===' in result.stdout
                  else:
                      assert result.returncode == 0 and not failures and '=== 2612 checks, 0 FAIL ===' in result.stdout,failures
                      print('AYETE_VALID_CLEAN_SELECTOR_FALSE_GREEN_WITNESS',json.dumps({'base':base,'onlyBindingChanged':binding,'to':'.ps-start','sameHazardousCss':True,'harnessSha256':hashlib.sha256(code.encode()).hexdigest()}),flush=True)
          assert hashlib.sha256(script.read_bytes()).hexdigest() == source_hash
          assert {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dist.iterdir() if p.is_file()} == originals
          print('AYETE_SOURCE_DIST_UNCHANGED',source_hash,flush=True)
          sys.exit(1)
          PY
