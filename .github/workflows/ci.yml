name: wave3 actual background cascade GREEN
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: WKH full source and eleven actual guard sites
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Full baseline and earlier-only background witness
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          source = '638420cf23c1af9e710ebbdb52439863ab94f9a1'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == source
          assert subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines() == ['.github/workflows/ci.yml']
          dist = root/'implementation/desktop/crates/selahcue-operator/dist'
          script = root/'scripts/operator_headless.py'
          original_script = hashlib.sha256(script.read_bytes()).hexdigest()
          original = {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dist.iterdir() if p.is_file()}
          selectors = ['.pm-btn-primary:hover','.td-save-cta:hover','.ps-start:hover','.ps-start:disabled, .ps-start[aria-disabled="true"]','.ps-start','.dl-btn-primary:hover','.tb-golive:hover','.timer-start:hover','.pp-generate:hover','.pp-generate[disabled], .pp-generate[aria-busy="true"]','.pp-generate']
          def run(label, chosen):
              result = subprocess.run([sys.executable,str(script)],env={**os.environ,'SELAHCUE_HEADLESS_REQUIRE':'1','SELAHCUE_OPERATOR_DIST':str(chosen)},text=True,capture_output=True,timeout=240)
              print('WKH_CURRENT_GREEN',label,'EXIT',result.returncode,flush=True)
              print(result.stdout,flush=True)
              print(result.stderr,file=sys.stderr,flush=True)
              failures = re.findall(r'^FAIL: (.*)$',result.stdout,re.M)
              assert result.returncode == 0 and not failures and '=== 2612 checks, 0 FAIL ===' in result.stdout,(label,failures,result.returncode)
              for control in ['WKH background cascade/earlier-longhand:','WKH background cascade/important-longhand:','WKH background cascade/equal-priority-longhand:','WKH background cascade/local-var-shorthand:','WKH background cascade/gradient-later-color:','WKH background cascade/later-image-reset:','GO-LIVE-HOVER (premise): the hover rule declares a background','AYZVG cached UI replay:','AYETD viewport control:','F30: the real PP-GEN predicate rejects brightness delivered through var()','WKG danger composed/media_danger']:
                  assert 'PASS: '+control in result.stdout,(label,control)
              assert hashlib.sha256(script.read_bytes()).hexdigest() == original_script
              print('WKH_FULL2612_VERIFIED',label,flush=True)
          run('baseline',dist)
          with tempfile.TemporaryDirectory(prefix='wkh-current-css-') as temp:
              copied = Path(temp)/'dist'
              shutil.copytree(dist,copied)
              css = copied/'app.css'
              css.write_text(css.read_text()+'\n'+'\n'.join(sel+'{--__wkh_unrelated:1;}' for sel in selectors))
              assert all(hashlib.sha256((copied/name).read_bytes()).hexdigest()==digest for name,digest in original.items() if name!='app.css')
              print('WKH_ACTUAL_ELEVEN_SITE_COMPONENT_PROOF',json.dumps({'selectors':selectors,'unchangedFiles':len(original)-1,'harnessSha256':original_script}),flush=True)
              run('actual-eleven-sites',copied)
          assert {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in dist.iterdir() if p.is_file()} == original
          print('WKH_SOURCE_DIST_AND_HARNESS_UNCHANGED',source,flush=True)
          PY
