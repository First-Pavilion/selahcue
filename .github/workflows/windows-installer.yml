# Manual, on-demand build of the downloadable Windows installer bundling the operator console +
# native output window, with NDI broadcast (--features ndi) and on-device STT (--features stt).
# Kept OUT of the push/PR matrix (workflow_dispatch only) so it never slows normal CI and only runs
# when someone clicks "Run workflow".
#
# NDI is self-provisioned from PUBLIC sources — no licence-gated developer SDK download needed:
#   * headers  -> committed under implementation/desktop/vendor/ndi/windows/include
#   * runtime DLL -> fetched from the public NDI runtime redistributable (ndi.link/NDIRedistV6)
#   * import .lib -> generated on the runner from the DLL's exports (dumpbin -> .def -> lib)
# ---------------------------------------------------------------------------------------
# RELEASE PROFILE ONLY — NEVER SHIP A DEBUG BUILD.
#
# Debug builds of `selahcue-licensing` deliberately trust a DEVELOPMENT entitlement signing
# key whose private seed is COMMITTED to this repository
# (implementation/desktop/crates/selahcue-licensing/dev-signing-key.NOT-A-SECRET). That is
# by design: `make launch` must not demand activation, and the mechanism is to MINT a
# dev-signed manifest and run real verification rather than to add a bypass branch.
#
# The consequence is that ANYONE can mint an unlimited entitlement against a debug build.
# So a debug binary must never be distributed. Today every artefact this workflow produces
# is `--release`, which is what makes that safe -- it is a property to preserve, not a
# coincidence to rely on. If you are here to add or change a build step, keep `--release`.
#
# THE CHECK THAT ENFORCES THIS is `scripts/dev_key_not_in_release.sh` (run by ci.yml and
# `make ci`): it builds the crate in both profiles and fails if the dev key bytes appear in
# the release rlib, with the debug rlib as a live positive control.
#
# It is not wired into THIS workflow, because nothing here links selahcue-licensing yet. The
# moment a bundled binary does -- which is the whole direction of travel for 86ak5mn1d /
# 86ak5mn1t -- add that script as a step here and scan the BUNDLED artefact, not just the
# rlib. Source-level controls (`#[cfg(debug_assertions)]`, the source guard, the profile
# scan) are kept for better error messages but every one of them has been defeated in review
# by a spelling nobody enumerated; do not rely on them here.
#
# A SECOND, SIBLING SCAN *IS* WIRED IN, at the bottom of this job: `scripts/installer_secret_scan.py`
# guards a DIFFERENT secret -- the `dev-keys` developer AI-provider loader in
# selahcue-operator/src/dev_env.rs -- and it scans the BUILT artefacts this workflow ships,
# which is the move the paragraph above asks for. Two scans, one implemented: when 86ak5mn1d /
# 86ak5mn1t make a bundled binary link selahcue-licensing, the entitlement-key scan slots in as
# another signature source over the SAME artefact list, not another walk of the tree. Both
# scans run before the upload step, so a failing artefact is never published.
# ---------------------------------------------------------------------------------------
name: windows-installer

on:
  workflow_dispatch: {}

jobs:
  build:
    name: build Windows installer (NDI + STT)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: implementation/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            implementation/desktop
            implementation/desktop/crates/selahcue-operator
      # MSVC dev shell so dumpbin + lib (used to generate the NDI import library) are on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
      # Interpreter for the shipped-artefact secret scan at the bottom of this job. Pinned, and
      # installed even though windows-latest ships a Python: the runner image's version floats,
      # and the `python3` spelling is not reliably on PATH on Windows at all.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # whisper-rs (STT) compiles whisper.cpp: needs cmake + libclang (bindgen). windows-latest
      # ships both; assert them and export LIBCLANG_PATH so a future image change fails fast here
      # rather than deep inside the build.
      - name: Verify STT build deps (cmake + libclang)
        shell: pwsh
        run: |
          cmake --version
          $llvm = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path $llvm)) { throw "LLVM/libclang not found at $llvm" }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Self-provision NDI from public sources into a scratch NDI_SDK_DIR (headers + generated
      # import lib + runtime DLL). grafton-ndi's build.rs reads NDI_SDK_DIR at compile time.
      - name: Provision NDI (public runtime + generated import lib)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdk = Join-Path $env:RUNNER_TEMP "ndi-sdk"
          $inc = Join-Path $sdk "include"
          $lib = Join-Path $sdk "lib\x64"
          New-Item -ItemType Directory -Force -Path $inc, $lib | Out-Null

          # 1) Headers (committed, identical across platforms).
          Copy-Item vendor/ndi/windows/include/*.h $inc -Force

          # 2) Runtime DLL from the PUBLIC NDI runtime redistributable.
          $rt = Join-Path $env:RUNNER_TEMP "ndi_runtime.exe"
          Invoke-WebRequest -Uri "https://ndi.link/NDIRedistV6" -OutFile $rt
          $dll = $null
          $extract = Join-Path $env:RUNNER_TEMP "ndi_extract"
          $sevenzip = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $sevenzip) {
            & $sevenzip x $rt "-o$extract" -y | Out-Null
            $dll = Get-ChildItem $extract -Recurse -Filter "Processing.NDI.Lib.x64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $dll) {
            # Fallback: silent-install the runtime (Inno Setup) and copy the DLL from Program Files.
            Start-Process -FilePath $rt -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
            $dll = Get-ChildItem "C:\Program Files\NDI" -Recurse -Filter "Processing.NDI.Lib.x64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $dll) { throw "Could not obtain Processing.NDI.Lib.x64.dll from the NDI runtime redistributable." }
          Copy-Item $dll.FullName (Join-Path $lib "Processing.NDI.Lib.x64.dll") -Force

          # 3) Generate the import library from the DLL's exports (dumpbin -> .def -> lib).
          Push-Location $lib
          $exports = dumpbin /nologo /exports "Processing.NDI.Lib.x64.dll"
          $names = $exports | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') { $matches[1] }
          } | Where-Object { $_ }
          if (-not $names) { throw "No exports parsed from the NDI DLL." }
          (@("EXPORTS") + $names) | Set-Content -Encoding ASCII "Processing.NDI.Lib.x64.def"
          lib /nologo /def:"Processing.NDI.Lib.x64.def" /machine:x64 /out:"Processing.NDI.Lib.x64.lib"
          Pop-Location
          if (-not (Test-Path (Join-Path $lib "Processing.NDI.Lib.x64.lib"))) { throw "Import lib generation failed." }

          "NDI_SDK_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "NDI provisioned at $sdk ($($names.Count) exports)"

      - name: Build output window (--features ndi)
        shell: pwsh
        run: cargo build --release -p selahcue-desktop --features ndi

      - name: Stage the output window as the operator sidecar + NDI DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/selahcue-operator/binaries | Out-Null
          Copy-Item target/release/selahcue-output.exe `
            crates/selahcue-operator/binaries/selahcue-output-x86_64-pc-windows-msvc.exe -Force
          Copy-Item (Join-Path $env:NDI_SDK_DIR "lib\x64\Processing.NDI.Lib.x64.dll") `
            crates/selahcue-operator/binaries/Processing.NDI.Lib.x64.dll -Force

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build the installer (--features stt)
        working-directory: implementation/desktop/crates/selahcue-operator
        run: cargo tauri build --features stt

      # ---------------------------------------------------------------------------------
      # EFFECT-LEVEL GATE: developer AI-provider keys must not be in what we ship.
      #
      # TWO STEPS, NOT ONE, and the order matters. The self-test proves this gate's own
      # failure modes still bite -- a glob that matches nothing, a zero-byte placeholder, an
      # unreadable file, a neutered positive control -- BEFORE its verdict is allowed to mean
      # anything. A scan that silently examines nothing passes forever, and that is the exact
      # failure mode this guard family keeps hitting. Same shape as the `--self-test` then run
      # pairs for check_workflows.py and ci_alarm.py in ci.yml.
      #
      # Both run before the upload below, so an artefact that fails is never published.
      # ---------------------------------------------------------------------------------
      # `$LASTEXITCODE` is checked explicitly rather than left to the runner's pwsh epilogue.
      # It would in fact propagate, but a gate whose failure depends on a wrapper detail the
      # reader has to look up is a gate someone will later "simplify" into a no-op -- and this
      # repo has already lost a gate to a swallowed exit code once.
      - name: Self-test the shipped-artefact scanner (its own failure modes must bite)
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          python scripts/installer_secret_scan.py --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "The shipped-artefact scanner failed its OWN self-test. Its verdict on the real artefacts cannot be trusted, so this build stops here."
          }

      - name: Developer-key signatures absent from the shipped artefacts (effect-level gate)
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          python scripts/installer_secret_scan.py
          if ($LASTEXITCODE -ne 0) {
            throw "A developer-key signature is present in an artefact this workflow ships, or the scan could not prove it read one. See the step log for the artefact path and the matched string."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: selahcue-windows-installer
          path: implementation/desktop/crates/selahcue-operator/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
