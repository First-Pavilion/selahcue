<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SelahCue Operator — Shared chrome (review copy)</title>
    <link rel="stylesheet" href="../../../implementation/desktop/crates/selahcue-operator/dist/app.css" />
    <!-- REVIEW COPY — shared header nav + emergency footer that wrap every screen. -->
  </head>
  <body>
    <header>
      <button id="app-menu-btn" aria-haspopup="menu" aria-expanded="false"
        aria-controls="app-menu" aria-label="Open the app menu (F10)">☰ SelahCue ▾</button>
      <div id="app-menu" role="menu" aria-label="Go to">
        <button class="nav-item" role="menuitem" tabindex="-1" data-surface="console" accesskey="1" aria-current="page">◉ Live Console<span class="nav-key">1</span></button>
        <button class="nav-item" role="menuitem" tabindex="-1" data-surface="theme-designer" accesskey="2">✎ Theme Designer<span class="nav-key">2</span></button>
        <button class="nav-item" role="menuitem" tabindex="-1" data-surface="screens" accesskey="3">▤ Screens<span class="nav-key">3</span></button>
        <button class="nav-item" role="menuitem" tabindex="-1" data-surface="plan" accesskey="4">☰ Plan / Library<span class="nav-key">4</span></button>
        <button class="nav-item" role="menuitem" tabindex="-1" data-surface="settings" accesskey="5">⚙ Settings<span class="nav-key">5</span></button>
      </div>
      <span id="route-status" class="sr-only" aria-live="polite"></span>
      <h1 id="plan-name">SelahCue Operator</h1>
      <span class="sub" id="plan-sub"></span>
      <span id="live-chip">● LIVE</span>
      <span id="clock"></span>
    </header>
    <main>
      <section class="surface-page active surface-pad">
        <h1>Shared chrome</h1>
        <p class="coming-soon">The header (app menu / route status / live chip / clock)
        and the always-reachable emergency footer wrap all five screens. Each screen's
        review copy includes this chrome for context.</p>
      </section>
    </main>
    <footer id="emergency" role="toolbar" aria-label="Emergency controls">
      <button id="blackout" aria-pressed="false" aria-label="Blackout the audience output">■ BLACKOUT<span id="blackout-state"></span><span class="key">B</span></button>
      <button id="clear-all" aria-label="Clear all live layers">✕ CLEAR ALL<span class="key">Esc Esc</span></button>
      <span class="note">Always reachable · pierces any dialog</span>
      <span class="hints">Space Next · ⏎ Go Live · ← Prev</span>
    </footer>
  </body>
</html>
